y... (homesick).", "Her mother advised her to... (embrace) the culture instead of hiding.", "Maria joined a local cooking class and met a... (friendly) woman named Yumi.", "They practiced languages together and became friends.", "Maria started to enjoy the... (local cuisine) and traditions.", "She learned that she could... (adapt) by stepping out of her comfort zone."], "vocab": [{"w": "culture shock", "tr": "[ˈkʌltʃə ʃɒk]", "ru": "культурный шок"}, {"w": "homesick", "tr": "[ˈhəʊmsɪk]", "ru": "тоскующий по дому"}, {"w": "custom", "tr": "[ˈkʌstəm]", "ru": "обычай, традиция"}, {"w": "to adapt", "tr": "[əˈdæpt]", "ru": "адаптироваться, приспосабливаться"}, {"w": "language barrier", "tr": "[ˈlæŋɡwɪdʒ ˈbæriə]", "ru": "языковой барьер"}, {"w": "to feel isolated", "tr": "[fiːl ˈaɪsəleɪtɪd]", "ru": "чувствовать себя изолированным"}, {"w": "local cuisine", "tr": "[ˈləʊkl kwɪˈziːn]", "ru": "местная кухня"}, {"w": "to embrace", "tr": "[ɪmˈbreɪs]", "ru": "принимать, охотно соглашаться"}]}, {"num": 204, "ru": "Ведение семейного архива и цифровых воспоминаний", "en": "Maintaining a family archive and digital memories", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["David was cleaning the attic when he found an old, dusty box. Inside were hundreds of printed photographs from his childhood. At the same time, his phone notified him: \"Storage almost full\" with 5,000 unorganized digital photos.", "\"We are going to lose all these memories,\" David said to his wife, Emma. \"We need to organize them before they are gone forever.\"", "That weekend, David bought a large external hard drive and set up a cloud storage account. \"The rule is simple,\" he explained to his teenage kids, Lily and Max. \"We back up everything. Digital memories are fragile if they only exist in one place.\"", "They sat around the dining table. David sorted the old printed photos into a new physical photo album, writing dates and names on the back. Meanwhile, Lily and Max helped him sort the digital files on the computer. They created folders by year and event: \"Summer 2018\", \"Max’s Graduation\", \"Christmas\".", "\"Look at this one!\" Max laughed, pointing at the screen. It was a picture of David with a terrible haircut in the 90s.", "\"Hey, that was fashionable!\" David joked.", "They spent the whole day working. It was tedious, but also fun. They laughed at old mistakes and shared stories they had forgotten.", "That evening, David connected the hard drive to the TV and showed the new digital photo album to the family.", "\"This is amazing, Dad,\" Lily said. \"I’m glad we did this. These pictures have so much sentimental value.\"", "David smiled, feeling a deep sense of accomplishment. He realized that taking the time to preserve family history wasn't just a chore. It was a beautiful way to connect with the past and protect their most precious moments for the future."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What two problems with photos did David discover?", "What rule did David establish for their digital memories?", "How did the family react to looking at the old photos together?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, David found old printed photos and realized his phone... (storage) was full.", "hints": ["He decided to... (organize) everything to... (preserve) their memories.", "He bought an external... (hard drive) and used... (cloud storage).", "He made sure to... (back up) all the files safely.", "The family sorted the digital photos into folders by year and... (event).", "They put the old printed pictures into a new... (photo album).", "They laughed and shared stories, realizing the pictures had great... (sentimental value).", "David felt proud to protect their family... (history) for the future."], "vocab": [{"w": "digital memories", "tr": "[ˈdɪdʒɪtl ˈmeməriz]", "ru": "цифровые воспоминания"}, {"w": "to back up", "tr": "[bæk ʌp]", "ru": "создавать резервную копию"}, {"w": "photo album", "tr": "[ˈfəʊtəʊ ˈælbəm]", "ru": "фотоальбом"}, {"w": "cloud storage", "tr": "[klaʊd ˈstɔːrɪdʒ]", "ru": "облачное хранилище"}, {"w": "to organize", "tr": "[ˈɔːɡənaɪz]", "ru": "организовывать, приводить в порядок"}, {"w": "sentimental value", "tr": "[ˌsentɪˈmentl ˈvæljuː]", "ru": "сентиментальная ценность"}, {"w": "hard drive", "tr": "[hɑːd draɪv]", "ru": "жесткий диск"}, {"w": "to preserve", "tr": "[prɪˈzɜːv]", "ru": "сохранять, сберегать"}]}, {"num": 205, "ru": "Покупка и настройка умных часов или фитнес-трекера", "en": "Buying and setting up a smartwatch or fitness tracker", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["Mark unboxed his new smartwatch with excitement. \"Finally! Now I can track my health properly,\" he announced to his teenage daughter, Lily.", "\"Let me help you set it up,\" Lily said, taking the small device. \"First, we need to sync it with your phone via Bluetooth.\"", "Mark watched as she tapped the screen. \"Does it really measure my heart rate?\"", "\"Yes, and it has a step counter, sleep tracker, and it’s completely waterproof,\" Lily explained. \"But Dad, you need to customize your notifications. Otherwise, your wrist will buzz every two seconds.\"", "Mark ignored her advice. \"I want to see everything! Emails, messages, news.\"", "The next day at work, Mark’s wrist buzzed constantly. During a quiet meeting, his watch lit up with a news alert, then a message from a friend, then a reminder to drink water. He felt embarrassed and distracted.", "At home, he took the watch off and sighed. \"Lily, you were right. This is too much.\"", "Lily smiled and took the watch. \"Let’s fix it. We will turn off all notifications except calls and text messages from family. And we will set a goal of 8,000 steps a day.\"", "She adjusted the settings in two minutes. \"Also, remember to charge it every night. The battery life is about 18 hours.\"", "\"Got it,\" Mark said, putting the watch back on. It felt much lighter now, both physically and mentally.", "The next morning, Mark went for a walk. His watch gently buzzed to tell him he reached his step goal. He smiled. He realized that technology is only useful when you control it, not when it controls you."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Mark buy a smartwatch?", "What problem did Mark face at work on the first day?", "How did Lily help him fix the problem?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Mark bought a new... (smartwatch) to track his health.", "hints": ["His daughter Lily helped him to... (sync) it with his phone.", "At first, Mark turned on all... (notification), which distracted him at work.", "He realized it was too much and asked Lily for help.", "She turned off unnecessary alerts and set a daily... (step counter) goal.", "She also reminded him to charge it because of the limited... (battery life).", "Mark learned that the device is useful only when you... (track) what really matters."], "vocab": [{"w": "smartwatch", "tr": "[ˈsmɑːtwɒtʃ]", "ru": "умные часы"}, {"w": "step counter", "tr": "[step ˈkaʊntə]", "ru": "шагомер"}, {"w": "heart rate", "tr": "[hɑːt reɪt]", "ru": "частота сердечных сокращений"}, {"w": "battery life", "tr": "[ˈbætəri laɪf]", "ru": "время работы батареи"}, {"w": "to sync", "tr": "[sɪŋk]", "ru": "синхронизировать"}, {"w": "notification", "tr": "[ˌnəʊtɪfɪˈkeɪʃn]", "ru": "уведомление"}, {"w": "waterproof", "tr": "[ˈwɔːtəpruːf]", "ru": "водонепроницаемый"}, {"w": "to track", "tr": "[træk]", "ru": "отслеживать"}]}, {"num": 206, "ru": "Общение с соседями по поводу совместного пространства", "en": "Discussing shared space usage with neighbors", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["Anna stood in the basement laundry room, shaking her head. Wet clothes were left in the washing machine, and detergent was spilled on the floor. It was the third time this week.", "She decided not to leave an angry note. Instead, she knocked on the door of apartment 4B.", "Her neighbor, David, opened the door. \"Hi, Anna. Is everything okay?\"", "\"Hi, David,\" Anna said, trying to sound calm. \"I wanted to talk about the shared laundry room. Lately, it’s been quite messy, and sometimes my clothes are stuck in the machine because someone forgot to take theirs out.\"", "David’s face showed genuine surprise. \"Oh, I am so sorry. That was probably me. I’ve been working late and I completely forget to check the schedule.\"", "\"I understand,\" Anna replied. \"But it’s frustrating when I need to do my laundry and can’t. Could we try to be more considerate?\"", "\"Absolutely,\" David said. \"How about we create a simple agreement? We can write our names on the whiteboard in the laundry room to reserve a time slot. And we promise to clean up any mess immediately.\"", "\"That sounds like a great idea,\" Anna smiled, feeling relieved. \"And if we see something messy, we can just text each other instead of getting angry.\"", "\"Deal,\" David agreed. \"I’ll go downstairs and move my clothes right now. Thanks for talking to me directly, Anna.\"", "The next day, Anna saw a clean whiteboard in the laundry room with time slots. David had even wiped the floor.", "She realized that addressing problems in a shared space doesn't have to lead to a fight. A polite conversation and a simple agreement can make living together much more comfortable for everyone."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What problem did Anna find in the laundry room?", "How did David react when Anna complained?", "What agreement did they make to solve the problem?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Anna found the shared... (laundry room) messy and unusable.", "hints": ["Instead of leaving an angry note, she decided to talk to her... (neighbor), David.", "David apologized and admitted he was the one who left his clothes.", "They agreed to be more... (considerate) to each other.", "They decided to use a whiteboard to... (reserve) time slots.", "They also promised to clean up any... (messy) spots immediately.", "Anna learned that a polite conversation can lead to a good... (agreement)."], "vocab": [{"w": "shared space", "tr": "[ʃeəd speɪs]", "ru": "совместное пространство"}, {"w": "laundry room", "tr": "[ˈlɔːndri ruːm]", "ru": "прачечная"}, {"w": "schedule", "tr": "[ˈʃedjuːl]", "ru": "расписание, график"}, {"w": "to reserve", "tr": "[rɪˈzɜːv]", "ru": "бронировать, занимать"}, {"w": "considerate", "tr": "[kənˈsɪdərət]", "ru": "внимательный к другим, тактичный"}, {"w": "messy", "tr": "[ˈmesi]", "ru": "неаккуратный, грязный"}, {"w": "to complain", "tr": "[kəmˈpleɪn]", "ru": "жаловаться"}, {"w": "agreement", "tr": "[əˈɡriːmənt]", "ru": "соглашение, договоренность"}]}, {"num": 207, "ru": "Подготовка к первому визиту к психологу или терапевту", "en": "Preparing for the first visit to a psychologist or therapist", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["David sat in his car outside the clinic, gripping the steering wheel. He had an appointment with a therapist in ten minutes, and his anxiety was through the roof.", "\"I can't do this,\" he muttered. \"What if I don't know what to say? What if it’s a waste of time?\"", "He called his friend, Sarah. \"I’m outside the building. I think I should just drive home.\"", "\"David, don't hesitate now,\" Sarah said gently. \"You’ve been struggling with stress for months. This is a safe space. You don’t have to have all the answers today. Just go in and talk.\"", "\"Okay,\" David took a deep breath. \"I’ll try.\"", "He walked into the waiting room. The therapist, Dr. Evans, greeted him with a warm, supportive smile. \"Hello, David. Please, come in and make yourself comfortable.\"", "They sat in cozy chairs. Dr. Evans didn't push him. \"There is no right or wrong way to start,\" she said. \"We can just talk about what brought you here today.\"", "David hesitated for a moment, then started talking about his work stress and sleepless nights. To his surprise, Dr. Evans listened carefully without judging him. She didn't try to fix everything in one hour. Instead, she helped him identify one simple coping strategy: a five-minute breathing exercise before bed.", "When the session ended, David felt a massive weight lift off his shoulders.", "\"How was it?\" Sarah texted him.", "\"Actually, really good,\" David replied. \"I thought I would have to perform, but it was just a conversation. I think I’ll go back next week.\"", "He realized that asking for mental health support isn't a sign of weakness. It’s a brave first step toward feeling better."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did David want to drive home before his appointment?", "What advice did Sarah give him?", "What coping strategy did Dr. Evans suggest?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, David felt a lot of... (anxiety) before his first therapy appointment.", "hints": ["He called his friend Sarah because he wanted to... (hesitate) and go home.", "Sarah reminded him that the clinic is a... (safe space).", "The... (therapist), Dr. Evans, was very... (supportive) and didn't push him.", "David started to... (open up) about his work stress.", "Dr. Evans suggested a simple breathing... (coping strategy) for his sleepless nights.", "David left the... (session) feeling much lighter and planned to return."], "vocab": [{"w": "therapist", "tr": "[ˈθerəpɪst]", "ru": "психолог, терапевт"}, {"w": "anxiety", "tr": "[æŋˈzaɪəti]", "ru": "тревога, беспокойство"}, {"w": "to open up", "tr": "[ˈəʊpən ʌp]", "ru": "открываться, делиться чувствами"}, {"w": "safe space", "tr": "[seɪf speɪs]", "ru": "безопасное пространство"}, {"w": "session", "tr": "[ˈseʃn]", "ru": "сеанс, прием"}, {"w": "to hesitate", "tr": "[ˈhezɪteɪt]", "ru": "колебаться, сомневаться"}, {"w": "coping strategy", "tr": "[ˈkəʊpɪŋ ˈstrætədʒi]", "ru": "стратегия преодоления (трудностей)"}, {"w": "supportive", "tr": "[səˈpɔːtɪv]", "ru": "поддерживающий"}]}, {"num": 208, "ru": "Продажа ненужных вещей онлайн", "en": "Selling unused items online", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["Emma looked at the old digital camera sitting on her shelf. She hadn't used it in three years. \"I should sell it,\" she thought. \"It’s a waste to let it collect dust.\"", "She decided to list it on a popular second-hand platform. She took clear photos in good lighting and wrote an honest description: \"Great condition, minor scratch on the back, includes battery and charger.\"", "Within a day, she received a message from a buyer named Tom.", "\"Hi, is the camera still available? Would you accept $80?\"", "Emma checked the original price. It was $150. She was willing to negotiate, but $80 was too low.", "\"Hi Tom,\" she replied politely. \"The camera is in great working condition. The lowest I can go is $110, and I can include a free camera bag.\"", "Ten minutes later, Tom replied: \"Deal! How do we handle the shipping?\"", "\"I will pack it securely and send it via tracked shipping tomorrow,\" Emma wrote. \"I’ll send you the tracking number as soon as it’s on its way.\"", "The next morning, Emma wrapped the camera in bubble wrap, placed it in a sturdy box, and took it to the post office.", "Three days later, Tom left a five-star review: \"Exactly as described. Fast shipping and great communication. Highly recommend!\"", "Emma smiled, looking at the profit in her account. It wasn't a huge amount of money, but it felt great to declutter her home and give the camera a second life.", "She realized that selling things online is easy if you are honest about the condition, communicate clearly, and pack items carefully."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Emma decide to sell her camera?", "How did Emma respond to the buyer’s first offer of $80?", "What did the buyer say in his review?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Emma decided to... (list) her old camera on a second-hand... (platform).", "hints": ["She took good photos and described its... (condition) honestly.", "A... (buyer) named Tom offered $80, but Emma decided to... (negotiate).", "They agreed on $110, and Emma promised to include a free bag.", "She packed the camera carefully and arranged the... (shipping).", "Tom left a positive review, praising her communication and the item's quality.", "Emma was happy with the... (profit) and the extra space in her home."], "vocab": [{"w": "second-hand", "tr": "[ˌsekənd ˈhænd]", "ru": "подержанный, б/у"}, {"w": "to list", "tr": "[lɪst]", "ru": "размещать объявление"}, {"w": "shipping", "tr": "[ˈʃɪpɪŋ]", "ru": "доставка, пересылка"}, {"w": "buyer", "tr": "[ˈbaɪə]", "ru": "покупатель"}, {"w": "to negotiate", "tr": "[nɪˈɡəʊʃieɪt]", "ru": "вести переговоры, торговаться"}, {"w": "condition", "tr": "[kənˈdɪʃn]", "ru": "состояние (вещи)"}, {"w": "profit", "tr": "[ˈprɒfɪt]", "ru": "прибыль, выручка"}, {"w": "platform", "tr": "[ˈplætfɔːm]", "ru": "платформа, сайт"}]}, {"num": 209, "ru": "Обучение пожилого родственника использованию смартфона", "en": "Teaching an elderly relative to use a smartphone", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["\"Leo, this thing is too complicated,\" Grandma Rose said, pushing the new smartphone away. \"I can’t read the tiny letters, and I keep pressing the wrong buttons.\"", "Leo smiled patiently. \"Don't worry, Grandma. We will figure it out together, step-by-step.\"", "First, Leo went into the settings and increased the font size. \"Is this better?\" he asked.", "Rose put on her glasses and smiled. \"Oh, yes! That’s much easier to read.\"", "\"Great. Now, let’s set up a video call application so you can see the grandchildren,\" Leo said. He wrote down her new password on a piece of paper and taped it to the back of the phone case. \"Never share this with anyone, okay?\"", "\"Okay,\" Rose nodded seriously.", "\"Now, to answer a call, you just swipe the green button up. To end it, you swipe the red button down. Let’s practice.\"", "Leo called her from his own phone. Rose’s face lit up with joy when she saw Leo’s face on the screen. \"Oh my goodness! It’s like you are right here in the room!\"", "\"You’re doing great, Grandma,\" Leo praised her. \"Just remember, if you get lost, just press this round button in the middle to go back to the main screen.\"", "Over the next week, Leo visited every evening to practice. Rose slowly learned how to open the camera, look at photos, and send voice messages.", "One Sunday, Rose initiated a video call all by herself. \"Look, Leo! I did it!\" she cheered.", "Leo felt incredibly proud. He realized that teaching technology to an older generation isn't about speed. It’s about patience, clear instructions, and the joy of connecting across distances."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why was Grandma Rose frustrated with her new smartphone?", "What two things did Leo do to make the phone easier to use?", "How did Rose feel when she made her first video call alone?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Grandma Rose found the... (smartphone) too complicated.", "hints": ["Leo was very... (patient) and helped her step-by-step.", "He increased the... (font size) and wrote down the... (password) for her.", "He taught her how to... (swipe) to answer and end calls.", "They practiced using a video call... (application) together.", "A week later, Rose made a call all by herself and felt proud.", "Leo learned that teaching requires patience and clear... (instructions)."], "vocab": [{"w": "smartphone", "tr": "[ˈsmɑːtfəʊn]", "ru": "смартфон"}, {"w": "video call", "tr": "[ˈvɪdiəʊ kɔːl]", "ru": "видеозвонок"}, {"w": "font size", "tr": "[fɒnt saɪz]", "ru": "размер шрифта"}, {"w": "password", "tr": "[ˈpɑːswɜːd]", "ru": "пароль"}, {"w": "patient", "tr": "[ˈpeɪʃnt]", "ru": "терпеливый"}, {"w": "step-by-step", "tr": "[step baɪ step]", "ru": "пошаговый"}, {"w": "to swipe", "tr": "[swaɪp]", "ru": "проводить пальцем (по экрану)"}, {"w": "application", "tr": "[ˌæplɪˈkeɪʃn]", "ru": "приложение"}]}, {"num": 210, "ru": "Планирование и проведение косметического ремонта комнаты", "en": "Planning and doing a room renovation / DIY makeover", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["\"Our living room looks so dull,\" Sarah said, looking at the beige walls. \"I think it’s time for a small renovation.\"", "Her husband, Tom, nodded. \"I agree. But we have a strict budget. We can’t hire professionals. It will have to be a DIY project.\"", "\"Challenge accepted,\" Sarah smiled.", "On Saturday morning, they started. First, they had to measure the walls to calculate how much paint they needed. Then, they moved all the heavy furniture to the center of the room and covered it with plastic sheets.", "\"This is already exhausting,\" Tom groaned, wiping sweat from his forehead.", "\"Come on, we haven’t even opened the paint cans yet!\" Sarah laughed, handing him a roller. \"Let’s put on some music and work together.\"", "They spent the entire day painting. Tom handled the high corners with a brush, while Sarah used the roller for the large walls. They chose a warm, light grey color that instantly made the room feel bigger and brighter.", "By 8 PM, they were covered in paint spots, their backs ached, and they were starving. But when they turned on the lights and moved the furniture back, they gasped.", "\"Wow,\" Tom said, looking around. \"We actually transformed this room. It looks like a completely different space.\"", "\"It does!\" Sarah agreed, pouring two glasses of wine. \"And we did it ourselves, under budget.\"", "They sat on the sofa, enjoying the fresh smell of paint and the cozy new atmosphere. Sarah realized that a DIY renovation is hard work, but the feeling of accomplishment and the beautiful result make every drop of sweat worth it."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Sarah and Tom decide to do the renovation themselves?", "What was the first step they took before painting?", "How did they feel at the end of the day?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Sarah and Tom decided to do a... (DIY) renovation because of their strict... (budget).", "hints": ["They started by measuring the walls and covering the... (furniture).", "The work was... (exhausting), but they worked together and listened to music.", "They used a roller and a brush to apply the new... (paint).", "By the evening, the room was completely... (transformed) and looked brighter.", "They were tired but very proud of their work.", "Sarah realized that the result makes the hard work completely... (worth it)."], "vocab": [{"w": "renovation", "tr": "[ˌrenəˈveɪʃn]", "ru": "ремонт, обновление"}, {"w": "paint", "tr": "[peɪnt]", "ru": "краска"}, {"w": "budget", "tr": "[ˈbʌdʒɪt]", "ru": "бюджет"}, {"w": "to measure", "tr": "[ˈmeʒə]", "ru": "измерять"}, {"w": "DIY", "tr": "[ˌdiː aɪ ˈwaɪ]", "ru": "сделай сам (ремонт своими руками)"}, {"w": "furniture", "tr": "[ˈfɜːnɪtʃə]", "ru": "мебель"}, {"w": "to transform", "tr": "[trænsˈfɔːm]", "ru": "преобразовывать, менять до неузнаваемости"}, {"w": "exhausting", "tr": "[ɪɡˈzɔːstɪŋ]", "ru": "изматывающий, очень утомительный"}]}]</script>
<script>
(function(){
var T=JSON.parse(document.getElementById('data').textContent);
var cur=0,done={};
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
try{done=JSON.parse(store('done')||'{}')||{}}catch(e){done={}}
var h=parseInt((location.hash||'').replace('#t',''),10);
var saved=parseInt(store('cur'),10);
cur=(h>=1&&h<=T.length)?h-1:(saved>=0&&saved<T.length?saved:0);
var th=store('theme');if(th==='light'||th==='dark')document.documentElement.setAttribute('data-theme',th);
var root=document.documentElement,tb=document.getElementById('theme');
function curTheme(){return root.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}
function paintTheme(){var d=curTheme()==='dark';tb.textContent=d?'🌒':'☀️';tb.title=tb.ariaLabel=d?'Тёмная тема — нажмите для светлой':'Светлая тема — нажмите для тёмной'}
tb.onclick=function(){var n=curTheme()==='dark'?'light':'dark';root.setAttribute('data-theme',n);store('theme',n);paintTheme()};
paintTheme();
var k=parseFloat(store('k'))||1;
function setK(v){k=Math.max(.8,Math.min(1.8,Math.round(v*100)/100));root.style.setProperty('--k',k);store('k',String(k))}
document.getElementById('fm').onclick=function(){setK(k-.1)};
document.getElementById('fp').onclick=function(){setK(k+.1)};
setK(k);
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function mkNav(box){
  box.textContent='';
  var b=el('button',null,'← Назад'),m=el('button',null,'Выбор темы'),n=el('button',null,'Далее →');
  b.type=m.type=n.type='button';b.dataset.a='prev';m.dataset.a='pick';n.dataset.a='next';
  box.append(b,m,n);
}
function nav(a){
  if(a==='prev'&&cur>0)go(cur-1);
  else if(a==='next'&&cur<T.length-1)go(cur+1);
  else if(a==='pick')openSheet();
}
['navTop','navBot'].forEach(function(id){var b=document.getElementById(id);mkNav(b);
  b.addEventListener('click',function(e){var a=e.target.dataset&&e.target.dataset.a;if(a)nav(a)})});
function withAns(li,s){
  var i=s.lastIndexOf('('),j=s.lastIndexOf(')');
  if(i<0||j<i){li.textContent=s;return}
  var a=el('span','ans',s.slice(i+1,j));a.tabIndex=0;a.setAttribute('role','button');a.title='Нажмите, чтобы показать ответ';
  a.onclick=function(){a.classList.toggle('on')};
  a.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();a.classList.toggle('on')}};
  li.append(s.slice(0,i),'(',a,')',s.slice(j+1));
}

var LONG=1500,synth=window.speechSynthesis,voice=null,speakBtn=null;
function pickVoice(){if(!synth)return;var v=synth.getVoices().filter(function(x){return /^en/i.test(x.lang)});voice=v.find(function(x){return /en-US/i.test(x.lang)})||v[0]||null}
if(synth){pickVoice();synth.onvoiceschanged=pickVoice}
function stopSpeak(){if(synth)synth.cancel();if(speakBtn){speakBtn.classList.remove('on');if(speakBtn.dataset.l)speakBtn.textContent=speakBtn.dataset.l;speakBtn=null}}
function speak(list,btn){
  if(!synth)return;var was=speakBtn===btn;stopSpeak();if(was)return;
  if(typeof list==='string')list=[list];
  if(btn){speakBtn=btn;btn.classList.add('on');btn.dataset.l=btn.textContent;btn.textContent='⏹'}
  list.forEach(function(s,i){var u=new SpeechSynthesisUtterance(s);u.lang='en-US';u.rate=.9;if(voice)u.voice=voice;
    if(i===list.length-1)u.onend=function(){if(speakBtn===btn)stopSpeak()};synth.speak(u)});
}
function spk(list){var b=el('button','spk','🔊');b.type='button';b.setAttribute('aria-label','Озвучить по-английски');
  if(!synth){b.hidden=true;return b}b.onclick=function(){speak(list,b)};return b}
var fav={};try{fav=JSON.parse(store('fav')||'{}')||{}}catch(e){fav={}}
var favSheet=document.getElementById('favSheet'),favList=document.getElementById('favList'),popState={t:'',ctx:null,ru:''},storyPs=[];
function saveFav(){store('fav',JSON.stringify(fav))}
function fkey(s){return s.toLowerCase().replace(/\s+/g,' ').trim()}
function toggleFav(w,ru,ctx){var k=fkey(w);if(!k)return;if(fav[k])delete fav[k];else fav[k]={w:w.trim(),ru:ru||'',ctx:ctx||'',n:T[cur].num,t:Date.now()};saveFav();refreshFav()}
function paintStar(b){var on=!!fav[b.dataset.k];b.textContent=on?'★':'☆';b.classList.toggle('on',on)}
function starBtn(w,ru,ctx){var b=el('button','spk','');b.type='button';b.dataset.k=fkey(w);b.setAttribute('aria-label','Сохранить в мои слова');paintStar(b);b.onclick=function(){toggleFav(w,ru,ctx)};return b}
function paintPopStar(){var b=document.getElementById('popStar'),on=!!fav[fkey(popState.t)];b.textContent=on?'★':'☆';b.classList.toggle('on',on)}
document.getElementById('popStar').onclick=function(){toggleFav(popState.t,popState.ru,popState.ctx)};
function esc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function hlInto(p,text){
  var keys=Object.keys(fav),alts=[];
  keys.forEach(function(k){alts.push(k);if(/^to /.test(k))alts.push(k.slice(3))});
  alts=alts.filter(function(a){return a.length>1}).sort(function(a,b){return b.length-a.length}).map(function(a){var w=a.split(' ');return esc(w[0])+'(?:s|es|ed|d|ing)?'+(w.length>1?'\\s+'+w.slice(1).map(esc).join('\\s+'):'')});
  if(!alts.length){p.textContent=text;return}
  var re=new RegExp("(^|[^A-Za-z'’])((?:"+alts.join('|')+"))(?![A-Za-z])",'gi');
  p.textContent='';var last=0,m;
  while((m=re.exec(text))){var s=m.index+m[1].length;if(s>last)p.append(text.slice(last,s));p.append(el('span','hl',m[2]));last=s+m[2].length}
  p.append(text.slice(last));
}
function paintFav(){
  var ks=Object.keys(fav).sort(function(a,b){return fav[b].t-fav[a].t});
  document.getElementById('favCount').textContent=ks.length?'Всего: '+ks.length:'';
  favList.textContent='';
  if(!ks.length){favList.append(el('p','empty','Пока пусто. Зажмите слово в истории и нажмите ☆ в карточке перевода или нажмите ☆ рядом со словом в словаре темы.'));return}
  ks.forEach(function(k){var f=fav[k],r=el('div','fi'),b=el('div','b');
    b.append(el('div','fw',f.w),el('div','fr',f.ru||'—'));if(f.ctx)b.append(el('div','fc',f.ctx));
    var a=el('div');a.style.cssText='display:flex;gap:6px';
    var d=el('button','spk','✕');d.type='button';d.setAttribute('aria-label','Удалить');d.onclick=function(){delete fav[k];saveFav();refreshFav()};
    a.append(spk(f.w),d);r.append(b,a);favList.append(r)});
}
function refreshFav(){
  storyPs.forEach(function(o){hlInto(o.p,o.text)});
  document.querySelectorAll('[data-k]').forEach(paintStar);
  paintPopStar();if(favSheet.classList.contains('open'))paintFav();
}
function openFav(){paintFav();favSheet.classList.add('open');document.getElementById('favClose').focus()}
function closeFav(){favSheet.classList.remove('open')}
document.getElementById('fav').onclick=openFav;
document.getElementById('favClose').onclick=closeFav;
favSheet.addEventListener('click',function(e){if(e.target===favSheet)closeFav()});
var cache={};
async function translate(text,ctx){
  var key=text+'|'+(ctx||'');if(cache[key])return cache[key];var out=null;
  try{var sm=(window.claude&&claude.use)?await claude.use('sample'):null;
    if(sm){var one=text.split(/\s+/).length===1;
      var p='Переведи с английского на русский. Ответь только переводом, без пояснений.'+(one?' Это одно слово из предложения: дай его значение в этом контексте и, если уместно, ещё 1–2 коротких значения через запятую.':'')+(one&&ctx?'\nПредложение: '+ctx:'')+'\nТекст: '+text;
      var r=await sm(p,{modelTier:'quick'});out=(r.text||'').trim()}}catch(e){out=null}
  if(!out){try{var res=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair=en|ru');var j=await res.json();out=j.responseData&&j.responseData.translatedText}catch(e){}}
  if(out)cache[key]=out;return out;
}
var pop=document.getElementById('pop'),popSrc=document.getElementById('popSrc'),popRu=document.getElementById('popRu'),popMore=document.getElementById('popMore'),seq=0;
function showPop(text,ctx){
  var id=++seq;pop.style.transition='';pop.style.transform='';pop.style.opacity='';pop.hidden=false;popSrc.textContent=text;popRu.textContent='Перевожу…';popState={t:text,ctx:ctx,ru:''};paintPopStar();
  popMore.hidden=!ctx||ctx===text;popMore.onclick=function(){showPop(ctx,null)};
  document.getElementById('popSpk').onclick=function(){speak(text)};
  translate(text,ctx).then(function(r){if(id===seq){popState.ru=r||'';popRu.textContent=r||'Не удалось получить перевод. Проверьте интернет и разрешение на запрос.';var k=fkey(text);if(r&&fav[k]&&!fav[k].ru){fav[k].ru=r;saveFav()}}});
}
document.getElementById('popX').onclick=function(){pop.hidden=true;seq++};
(function(){var y0=null,dy=0,id=null;
  function reset(anim){pop.style.transition=anim?'transform .18s ease':'';pop.style.transform=''}
  pop.addEventListener('pointerdown',function(e){if(e.target.closest('button'))return;y0=e.clientY;dy=0;id=e.pointerId;pop.style.transition='';try{pop.setPointerCapture(id)}catch(x){}});
  pop.addEventListener('pointermove',function(e){if(y0===null||e.pointerId!==id)return;dy=Math.max(0,e.clientY-y0);pop.style.transform='translateY('+dy+'px)'});
  function end(e){if(y0===null||(e&&e.pointerId!==id))return;var d=dy;y0=null;dy=0;
    if(d>60){pop.style.transition='transform .15s ease,opacity .15s';pop.style.transform='translateY(140%)';pop.style.opacity='0';
      setTimeout(function(){pop.hidden=true;seq++;pop.style.opacity='';reset(false)},150)}
    else reset(true)}
  pop.addEventListener('pointerup',end);pop.addEventListener('pointercancel',end)})();
function caretAt(x,y){
  if(document.caretPositionFromPoint){var p=document.caretPositionFromPoint(x,y);return p&&{n:p.offsetNode,o:p.offset}}
  if(document.caretRangeFromPoint){var r=document.caretRangeFromPoint(x,y);return r&&{n:r.startContainer,o:r.startOffset}}
  return null}
function wordAt(x,y,blk){
  var c=caretAt(x,y);if(!c||c.n.nodeType!==3||!blk.contains(c.n))return null;
  var s=c.n.nodeValue,i=c.o,re=/[A-Za-z'’-]/;
  if(i>=s.length||!re.test(s[i])){if(i>0&&re.test(s[i-1]))i--;else return null}
  var a=i,b=i;while(a>0&&re.test(s[a-1]))a--;while(b<s.length&&re.test(s[b]))b++;
  var word=s.slice(a,b).replace(/^['’-]+|['’-]+$/g,'');if(!word)return null;
  var pre=document.createRange();pre.selectNodeContents(blk);pre.setEnd(c.n,a);
  var full=blk.textContent,pos=pre.toString().length,st=0,en=full.length,m,rx=/[.!?…]+["”’']?\s+/g;
  while((m=rx.exec(full))){var e=m.index+m[0].length;if(e<=pos)st=e;else{en=m.index+m[0].trimEnd().length;break}}
  return {word:word,sent:full.slice(st,en).trim()};
}
var lp=null,sx=0,sy=0,mainEl=document.getElementById('main');
function cancelLP(){if(lp){clearTimeout(lp);lp=null}}
mainEl.addEventListener('pointerdown',function(e){
  var b=e.target.closest&&e.target.closest('.story p,.qs li,.hints li');if(!b||e.target.closest('.ans'))return;
  sx=e.clientX;sy=e.clientY;cancelLP();
  lp=setTimeout(function(){lp=null;var w=wordAt(sx,sy,b);if(w)showPop(w.word,w.sent)},LONG)});
mainEl.addEventListener('pointermove',function(e){if(lp&&Math.hypot(e.clientX-sx,e.clientY-sy)>12)cancelLP()});
['pointerup','pointercancel','pointerleave'].forEach(function(ev){mainEl.addEventListener(ev,cancelLP)});
var selBtn=document.getElementById('selBtn');
document.addEventListener('selectionchange',function(){
  var s=getSelection(),t=s?s.toString().trim():'',n=s&&s.anchorNode&&(s.anchorNode.nodeType===3?s.anchorNode.parentElement:s.anchorNode);
  var ok=t.length>1&&n&&n.closest&&n.closest('.story,.qs,.hints');selBtn.hidden=!ok;selBtn.dataset.t=ok?t:'';if(ok)placeSel(s)});
function placeSel(s){
  if(selBtn.hidden||!s||!s.rangeCount)return;
  var rs=s.getRangeAt(0).getClientRects();if(!rs.length)return;
  var r=rs[rs.length-1],w=selBtn.offsetWidth,h=selBtn.offsetHeight,vw=innerWidth,vh=innerHeight;
  var x=Math.max(8,Math.min(vw-w-8,r.left+r.width/2-w/2)),y=r.bottom+46;
  if(y+h>vh-100)y=Math.max(8,rs[0].top-h-96);
  selBtn.style.transform='translate('+x+'px,'+y+'px)'}
addEventListener('scroll',function(){placeSel(getSelection())},{passive:true});
addEventListener('resize',function(){placeSel(getSelection())});
selBtn.addEventListener('pointerdown',function(e){e.preventDefault()});
selBtn.onclick=function(){var t=selBtn.dataset.t;if(t){showPop(t,null);getSelection().removeAllRanges()}};
function render(){
  stopSpeak();pop.hidden=true;var t=T[cur],m=document.getElementById('main');m.textContent='';
  var c=el('section','card');
  c.append(el('p','kicker','Тема № '+t.num),el('h1',null,t.ru),el('p','en',t.en),el('span','lvl',t.level));
  m.append(c);
  var v=el('section','card');v.append(el('h2',null,t.vh));if(t.vnote)v.append(el('p','note',t.vnote));
  var ul=el('ul','vocab');
  t.vocab.forEach(function(x){var li=el('li');li.append(el('span','w',x.w));if(x.tr)li.append(el('span','tr',x.tr));li.append(spk(x.w),starBtn(x.w,x.ru,null),el('span','ru','— '+x.ru));ul.append(li)});
  v.append(ul);m.append(v);
  var s=el('section','card story');var sh=el('div','shead');sh.append(el('h2',null,t.sh),spk(t.story));s.append(sh);if(t.snote)s.append(el('p','note',t.snote));
  storyPs=[];t.story.forEach(function(p){var e=el('p');hlInto(e,p);storyPs.push({p:e,text:p});s.append(e)});m.append(s);
  var r=el('section','card');r.append(el('h2',null,t.rh));if(t.rnote)r.append(el('p','note',t.rnote));
  r.append(el('p','step',t.s1));var ol=el('ol','qs');t.qs.forEach(function(q){ol.append(el('li',null,q))});r.append(ol);
  r.append(el('p','step',t.s2));if(t.s2note)r.append(el('p','note',t.s2note));
  var hl=el('ul','hints');t.hints.forEach(function(x){var li=el('li');withAns(li,x);hl.append(li)});r.append(hl);
  var d=el('div','done'),db=el('button',done[t.num]?'on':'',done[t.num]?'✓ Тема пройдена':'Отметить как пройденную');db.type='button';
  db.onclick=function(){if(done[t.num])delete done[t.num];else done[t.num]=1;store('done',JSON.stringify(done));render();paintList()};
  d.append(db);r.append(d);m.append(r);
  document.getElementById('prog').textContent='Тема '+t.num+' из '+T.length+' · пройдено: '+Object.keys(done).length;
  document.title=t.ru+' — Английский через чтение';
  document.querySelectorAll('.nav [data-a="prev"]').forEach(function(b){b.disabled=cur===0});
  document.querySelectorAll('.nav [data-a="next"]').forEach(function(b){b.disabled=cur===T.length-1});
}
function go(i){cur=i;store('cur',String(i));try{history.replaceState(null,'','#t'+T[i].num)}catch(e){}render();window.scrollTo(0,0)}
var sheet=document.getElementById('sheet'),list=document.getElementById('list');
function paintList(){
  list.textContent='';
  T.forEach(function(t,i){
    var b=el('button','item'+(i===cur?' cur':''));b.type='button';
    b.append(el('span','n',String(t.num)),el('span','t',t.ru));
    if(done[t.num])b.append(el('span','ck','✓'));
    b.onclick=function(){closeSheet();go(i)};list.append(b)});
  document.getElementById('doneCount').textContent='Пройдено: '+Object.keys(done).length+' из '+T.length;
}
function openSheet(){paintList();sheet.classList.add('open');
  var c=list.querySelector('.cur');if(c)list.scrollTop=c.offsetTop-list.clientHeight/3;document.getElementById('closeBtn').focus()}
function closeSheet(){sheet.classList.remove('open')}
document.getElementById('closeBtn').onclick=closeSheet;
sheet.addEventListener('click',function(e){if(e.target===sheet)closeSheet()});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){closeSheet();closeFav();pop.hidden=true}
  if(sheet.classList.contains('open')||favSheet.classList.contains('open')||/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
  if(e.key==='ArrowLeft'&&cur>0)go(cur-1);
  if(e.key==='ArrowRight'&&cur<T.length-1)go(cur+1)});
window.addEventListener('hashchange',function(){var n=parseInt(location.hash.replace('#t',''),10);if(n>=1&&n<=T.length&&n-1!==cur){cur=n-1;render()}});
render();
})();
</script>
