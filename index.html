ment. \"How did you calm him down so fast? I would have yelled back.\"", "\"Emotional intelligence,\" Sarah said. \"I regulated my own emotions, validated his frustration, and focused on solving the problem. It’s always more effective than arguing.\""], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why was Mr. Brown angry when he called Sarah?", "What was Sarah’s first instinct, and what did she do instead?", "How did Sarah use empathy to change the tone of the conversation?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Mr. Brown called, angry about a three-day... (delivery) delay.", "hints": ["Sarah felt defensive but used... (self-regulation) to calm down.", "She decided to... (respond) thoughtfully instead of reacting with anger.", "She used... (empathy) to... (validate) his frustration, which surprised him.", "Practicing... (active listening), she checked the system and found a solution.", "She arranged an express shipment and promised to monitor it... (personally).", "Mr. Brown calmed down and apologized, and Sarah proved that... (emotional intelligence) is more effective than arguing."], "vocab": [{"w": "empathy", "tr": "[ˈempəθi]", "ru": "эмпатия, сопереживание"}, {"w": "active listening", "tr": "[ˈæktɪv ˈlɪsnɪŋ]", "ru": "активное слушание"}, {"w": "self-regulation", "tr": "[ˌself ˌreɡjuˈleɪʃn]", "ru": "саморегуляция, контроль эмоций"}, {"w": "to validate", "tr": "[ˈvælɪdeɪt]", "ru": "признавать (чувства), подтверждать"}, {"w": "non-verbal cues", "tr": "[nɒn ˈvɜːbl kjuːz]", "ru": "невербальные сигналы"}, {"w": "to respond", "tr": "[rɪˈspɒnd]", "ru": "реагировать (осознанно), отвечать"}]}, {"num": 91, "ru": "Конфликтные ситуации в личной жизни", "en": "Conflict Situations in Personal Life", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~420 слов.", "story": ["It was Friday evening, and the atmosphere in the kitchen was tense. Anna and Mark had been arguing for twenty minutes about their weekend plans.", "\"I thought we agreed to visit my parents this Saturday!\" Anna said, her voice rising. \"You promised!\"", "Mark sighed, running a hand through his hair. \"I didn't promise anything. I said we might go if I finish my project. But I’m exhausted, Anna. I just want to stay home and rest.\"", "\"Well, I already told them we’re coming,\" Anna replied, crossing her arms. \"Now I look like a liar because of you.\"", "\"This is a classic misunderstanding,\" Mark said, trying to stay calm. \"You heard what you wanted to hear. I clearly said 'maybe'.\"", "Anna felt tears welling up in her eyes. She turned away, feeling hurt and angry. The argument was going in circles, and neither of them was listening.", "Suddenly, Mark took a deep breath. He realized that winning the argument was less important than their relationship. He walked over and gently touched her shoulder.", "\"Anna, I’m sorry,\" he said softly. \"I shouldn't have raised my voice. Let’s stop arguing and talk properly. I will listen actively this time.\"", "Anna turned around, surprised by his tone. She took a deep breath too. \"Okay. I’m sorry I snapped at you. I know you’ve had a hard week. I just felt disappointed because I was looking forward to seeing them.\"", "\"I understand,\" Mark said. \"And I appreciate that. But I am completely burned out. If I go, I’ll be in a terrible mood, and that won’t be fair to your parents or to you.\"", "Anna thought for a moment. \"What if we go for just two hours on Sunday morning? You can rest all day Saturday, and we’ll bring lunch so your mom doesn’t have to cook.\"", "Mark smiled, feeling a huge wave of relief. \"That sounds like a perfect compromise. Thank you for understanding.\"", "\"Thank you for apologizing,\" Anna smiled back. \"Let's make up and order some pizza.\"", "\"Deal,\" Mark said, pulling out his phone.", "They sat on the couch, eating pizza and watching a movie. The tension was completely gone. They realized that conflicts are a normal part of any relationship. The key is not to avoid them, but to handle them with respect, active listening, and a willingness to apologize and forgive."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why were Anna and Mark arguing on Friday evening?", "How did Mark stop the argument from going in circles?", "What compromise did they reach about the weekend plans?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Anna and Mark were arguing about their... (weekend plans).", "hints": ["Anna thought Mark promised to visit her parents, but it was a... (misunderstanding).", "Mark realized they needed to stop arguing and started to... (listen actively).", "He decided to... (apologize) for raising his voice, and Anna apologized too.", "They found a compromise: resting on Saturday and visiting for two hours on... (Sunday).", "They decided to... (make up) and order pizza.", "They learned that handling conflicts requires respect and a willingness to... (forgive).", "_____________"], "vocab": [{"w": "to argue", "tr": "[ˈɑːɡjuː]", "ru": "спорить, ссориться"}, {"w": "misunderstanding", "tr": "[ˌmɪsʌndəˈstændɪŋ]", "ru": "недоразумение"}, {"w": "to apologize", "tr": "[əˈpɒlədʒaɪz]", "ru": "извиняться"}, {"w": "to forgive", "tr": "[fəˈɡɪv]", "ru": "прощать"}, {"w": "to make up", "tr": "[meɪk ʌp]", "ru": "мириться"}, {"w": "to listen actively", "tr": "[ˈlɪsn ˈæktɪvli]", "ru": "слушать внимательно, активно слушать"}]}, {"num": 92, "ru": "Построение здоровых отношений", "en": "Building Healthy Relationships", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~430 слов.", "story": ["\"David, we need to talk about us,\" Emma said, sitting down on the sofa. She looked serious but calm.", "David put his phone away immediately. \"Is everything okay? You sound worried.\"", "\"We are good,\" Emma smiled gently. \"But I’ve been reading about healthy relationships, and I want to make sure we are building a strong foundation. Do you feel like we have enough trust and honest communication?\"", "David thought for a moment. \"I think we do. We tell each other everything. But sometimes I feel like I don’t give you enough quality time. I’ve been working late a lot.\"", "\"I appreciate your hard work,\" Emma said, taking his hand. \"But I also need to set some boundaries. When you work at the dinner table, I feel ignored. Can we agree that from 7 PM to 9 PM, we have no screens? Just us, talking or watching a movie.\"", "\"That is a fantastic idea,\" David agreed. \"I can definitely support that. It will help me disconnect from work, too. What else?\"", "\"I think we need to appreciate each other more,\" Emma continued. \"We get so busy that we forget to say 'thank you' for small things, like making coffee or doing the laundry.\"", "\"You’re right,\" David admitted. \"I take you for granted sometimes. How about we start a new habit? Every evening at dinner, we share one thing we appreciated about each other that day.\"", "Emma’s face lit up. \"I love that! It’s so simple, but it will make a huge difference.\"", "They tried the new rules for a month. The \"no screens\" rule was hard at first, but soon they found themselves talking about their dreams, fears, and funny stories from work. The daily appreciation habit made them feel seen and valued.", "One evening, David said, \"You know, Emma, I feel closer to you now than I have in years. Setting boundaries didn’t push us apart; it actually brought us closer.\"", "Emma smiled. \"That’s because healthy relationships aren’t about being together 24/7. They are about respecting each other’s space, being honest about your needs, and actively choosing to support each other every single day.\"", "David nodded, feeling grateful. They realized that love is not just a feeling; it’s a series of daily actions that build trust and connection."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What boundary did Emma want to set regarding their evenings?", "What new daily habit did David suggest to show appreciation?", "How did David feel about their relationship after a month of trying the new rules?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Emma wanted to talk about building a healthy relationship based on... (trust).", "hints": ["She suggested setting... (boundaries), like having no screens from 7 to 9 PM.", "David agreed and said he would... (support) this idea.", "They also decided to... (appreciate) each other by sharing one good thing every evening.", "This habit helped them spend more... (quality time) together.", "After a month, David felt much... (closer) to Emma.", "They learned that healthy relationships require respect, honesty, and daily... (actions).", "_____________"], "vocab": [{"w": "trust", "tr": "[trʌst]", "ru": "доверие"}, {"w": "boundaries", "tr": "[ˈbaʊndəriz]", "ru": "личные границы"}, {"w": "to support", "tr": "[səˈpɔːt]", "ru": "поддерживать"}, {"w": "quality time", "tr": "[ˈkwɒləti taɪm]", "ru": "качественное время (вместе)"}, {"w": "honest", "tr": "[ˈɒnɪst]", "ru": "честный, искренний"}, {"w": "to appreciate", "tr": "[əˈpriːʃieɪt]", "ru": "ценить, быть благодарным"}]}, {"num": 93, "ru": "Самомотивация и преодоление прокрастинации", "en": "Self-Motivation and Overcoming Procrastination", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~440 слов.", "story": ["Tom stared at the blank document on his screen. He had to write a 20-page report by Friday, but he had spent the last two hours watching funny videos on his phone.", "\"I have zero motivation,\" he groaned, putting his head on the desk.", "His roommate, Alex, walked into the room holding two cups of coffee. \"Still procrastinating on that report?\"", "\"Yes,\" Tom admitted. \"It’s too big. I don’t even know where to start, so I just distract myself with social media.\"", "Alex handed him a coffee. \"That’s normal. When a goal is too big, your brain panics and avoids it. You need to break it down into tiny, manageable steps.\"", "\"Like what?\" Tom asked, sitting up.", "\"Instead of 'write a 20-page report', your first goal is 'write the title and three bullet points for the introduction'. That takes five minutes. Can you do that?\"", "Tom sighed. \"Yeah, I guess I can do that.\"", "\"Great. Do it now. And when you finish those five minutes, give yourself a small reward. Maybe a piece of chocolate or a 10-minute walk.\"", "Tom opened the document. He wrote the title and three bullet points. It took him exactly four minutes. He felt a tiny spark of achievement. He ate a piece of chocolate and felt slightly better.", "\"See?\" Alex said. \"Now, your next step is to write one paragraph for the first bullet point. Just one. Set a timer for 25 minutes and don’t look at your phone.\"", "Tom set the timer. He focused only on that one paragraph. Without the pressure of the whole 20 pages, he found it easy to start. When the timer rang, he had written half a page.", "Over the next two days, Tom used this method. He broke the report into small sections, worked in 25-minute blocks, and rewarded himself after each one. He kept his phone in another room to avoid distractions.", "By Thursday afternoon, the report was finished. Tom leaned back in his chair, feeling incredibly proud.", "\"Alex, it worked!\" Tom called out. \"I actually overcame my procrastination.\"", "Alex smiled from the kitchen. \"I told you. Motivation doesn’t come before action. Action creates motivation. You just had to trick your brain into starting.\"", "Tom realized that overcoming procrastination wasn’t about having superhuman willpower. It was about breaking big tasks into small steps, eliminating distractions, and celebrating small wins along the way."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why was Tom procrastinating on his report?", "What advice did Alex give Tom to start working?", "How did Tom reward himself for completing small steps?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Tom had no... (motivation) to write a 20-page report.", "hints": ["He kept trying to... (distract) himself with his phone.", "Alex advised him to... (break down) the big task into tiny steps.", "Tom’s first... (goal) was to write just the title and three bullet points.", "After finishing a small step, he gave himself a... (reward), like chocolate.", "He used a timer to focus and avoid... (distractions).", "By Thursday, Tom finished the report and learned how to... (overcome) procrastination.", "He realized that action creates... (motivation).", "_____________"], "vocab": [{"w": "motivation", "tr": "[ˌməʊtɪˈveɪʃn]", "ru": "мотивация"}, {"w": "to overcome", "tr": "[ˌəʊvəˈkʌm]", "ru": "преодолевать"}, {"w": "goal", "tr": "[ɡəʊl]", "ru": "цель"}, {"w": "reward", "tr": "[rɪˈwɔːd]", "ru": "награда, вознаграждение"}, {"w": "to distract", "tr": "[dɪˈstrækt]", "ru": "отвлекать"}, {"w": "to break down", "tr": "[breɪk daʊn]", "ru": "разбивать на части"}]}, {"num": 94, "ru": "Минимализм и осознанное потребление", "en": "Minimalism and Conscious Consumption", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~430 слов.", "story": ["Sarah stood in the middle of her bedroom, surrounded by piles of clothes, old books, and gadgets she hadn’t used in years. She felt overwhelmed.", "\"I can’t find anything in this mess,\" she muttered to herself.", "Her friend, Lisa, came over to help. \"Wow, Sarah. You have a lot of stuff. Have you ever thought about trying minimalism?\"", "\"Minimalism?\" Sarah asked, holding up a sweater with the tags still on. \"You mean living with almost nothing? I could never do that.\"", "\"It’s not about having nothing,\" Lisa explained. \"It’s about keeping only the things that bring you joy or are truly useful. It’s about being mindful of what you buy and own. Let’s declutter this room together.\"", "Sarah hesitated, but then nodded. \"Okay. Where do we start?\"", "\"Let’s make three boxes,\" Lisa said. \"Keep, Donate, and Throw away. Be honest. When was the last time you wore this sweater?\"", "\"Never,\" Sarah admitted. \"I bought it on sale, but it doesn’t fit my style.\"", "\"Then it’s unnecessary,\" Lisa said. \"Put it in the Donate box. Someone else will value it.\"", "For the next three hours, they sorted through everything. Sarah was surprised by how many unnecessary items she had accumulated. Old magazines, broken chargers, clothes that didn’t fit.", "By the end of the day, they had filled four large bags for donation and two bags for recycling. The room looked completely different. It was spacious, clean, and calm.", "Sarah sat on her bed and took a deep breath. \"I feel so much lighter. I didn’t realize how much my stuff was stressing me out.\"", "\"That’s the magic of decluttering,\" Lisa smiled. \"When you remove the unnecessary, you make space for what truly matters. And next time you want to buy something, ask yourself: 'Do I really need this, or will it just become more clutter?'\"", "\"I will definitely think twice before shopping now,\" Sarah said. \"I want to be a mindful consumer.\"", "A week later, Sarah went to the charity shop to drop off the bags. She felt a warm sense of satisfaction knowing her old things would help others.", "She returned to her clean, peaceful apartment and realized that minimalism wasn’t about deprivation. It was about freedom. By choosing to value experiences and relationships over material things, she had created a life that felt truly rich."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Sarah feel overwhelmed in her bedroom?", "What three boxes did Lisa suggest using for decluttering?", "How did Sarah feel after cleaning her room?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Sarah was surrounded by mess and couldn't find anything.", "hints": ["Lisa suggested she try... (minimalism) to feel better.", "They decided to... (declutter) the room using three boxes: Keep, Donate, and Throw away.", "Sarah realized she had many... (unnecessary) items, like clothes with tags.", "They filled several bags to... (donate) to charity.", "After cleaning, Sarah felt much... (lighter) and less stressed.", "She decided to become a... (mindful) consumer and think twice before buying new things.", "She learned that minimalism is about freedom and choosing to... (value) experiences over things.", "_____________"], "vocab": [{"w": "minimalism", "tr": "[ˈmɪnɪməlɪzəm]", "ru": "минимализм"}, {"w": "to declutter", "tr": "[diːˈklʌtə]", "ru": "избавляться от хлама, наводить порядок"}, {"w": "unnecessary", "tr": "[ʌnˈnesəsəri]", "ru": "ненужный"}, {"w": "to donate", "tr": "[dəʊˈneɪt]", "ru": "жертвовать, отдавать на благотворительность"}, {"w": "mindful", "tr": "[ˈmaɪndfʊl]", "ru": "осознанный, внимательный"}, {"w": "to value", "tr": "[ˈvæljuː]", "ru": "ценить"}]}, {"num": 95, "ru": "Планирование года и постановка долгосрочных целей", "en": "Yearly Planning and Setting Long-Term Goals", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~440 слов.", "story": ["It was December 30th, and John and his wife, Maria, were sitting at the kitchen table with cups of hot tea.", "\"Next year is going to be different,\" John said, opening a fresh notebook. \"Last year, we just let time pass. This year, I want to set some real goals.\"", "Maria smiled. \"I love that idea. But how do we make sure we actually achieve them? We always make resolutions and forget them by February.\"", "\"We need a system,\" John replied. \"First, let’s define our main long-term goal. Where do we want to be in three years?\"", "Maria thought for a moment. \"I think we want to buy a small house in the countryside and have enough savings for a big trip.\"", "\"Perfect,\" John said, writing it down. \"Now, we need to make this goal measurable. Instead of 'save money', let’s say 'save $10,000 by December next year'. That’s about $850 a month.\"", "\"That sounds doable,\" Maria agreed. \"But how do we remember to do it?\"", "\"We create a vision board,\" John suggested. \"We can print pictures of the house we want, the places we want to visit, and put them on the fridge. Every time we see it, we remember why we are saving.\"", "\"Great idea,\" Maria said. \"And we should track our progress. Maybe we can have a monthly 'money date' to review our budget and celebrate when we hit a milestone.\"", "\"Exactly,\" John smiled. \"And it’s not just about money. What is one personal goal for you?\"", "\"I want to run a 10K race,\" Maria said. \"So my measurable goal is to run three times a week and finish the race in October.\"", "\"Awesome. I will support you,\" John said. \"And my goal is to read 24 books this year. That’s two books a month.\"", "They spent the next hour cutting out pictures, writing down their measurable goals, and sticking them onto a large poster board. It looked colorful and inspiring.", "\"Look at this,\" Maria said, stepping back to admire their work. \"It makes the future feel so real and exciting.\"", "\"It does,\" John agreed. \"We aren’t just wishing for things anymore. We have a plan, we know how to track our progress, and we will celebrate every milestone together.\"", "They clinked their tea mugs. They realized that successful planning wasn’t about making a strict, boring list. It was about creating a shared vision, breaking it down into measurable steps, and supporting each other every day."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What was John and Maria’s main long-term goal for the next three years?", "How did they make their financial goal measurable?", "What personal goals did Maria and John set for themselves?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, John and Maria decided to set real goals for the new year.", "hints": ["They defined their main... (long-term goal): buying a house and saving for a trip.", "They made it... (measurable) by deciding to save $850 a month.", "To stay motivated, they created a... (vision board) with pictures.", "They agreed to... (track) their progress with a monthly \"money date\".", "They also set personal goals, like running a 10K race and reading... (24 books).", "They realized that planning is about creating a shared vision and celebrating every... (milestone).", "_____________"], "vocab": [{"w": "long-term goal", "tr": "[lɒŋ tɜːm ɡəʊl]", "ru": "долгосрочная цель"}, {"w": "to achieve", "tr": "[əˈtʃiːv]", "ru": "достигать"}, {"w": "vision board", "tr": "[ˈvɪʒn bɔːd]", "ru": "доска визуализации"}, {"w": "measurable", "tr": "[ˈmeʒərəbl]", "ru": "измеримый"}, {"w": "to track", "tr": "[træk]", "ru": "отслеживать"}, {"w": "milestone", "tr": "[ˈmaɪlstəʊn]", "ru": "важный этап, веха"}]}, {"num": 96, "ru": "Рефлексия и подведение итогов", "en": "Reflection and Reviewing Results", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~430 слов.", "story": ["It was the last Sunday of the year. Emma sat at her desk with a cup of coffee and a thick journal. It was time for her annual reflection.", "\"Okay, 2023, let’s see what we’ve got,\" she said to herself, opening the notebook.", "She decided to review the year in three parts: successes, failures, and lessons learned.", "First, she wrote down her successes. \"I got promoted at work. I ran my first half-marathon. I saved enough money for a new laptop.\" She smiled as she wrote. It felt good to acknowledge her achievements.", "Next came the hard part: evaluating the failures. \"I didn’t learn Spanish like I planned. I argued with my sister in the summer. I spent too much time on social media.\"", "She felt a pang of guilt, but she reminded herself that reflection is not about self-criticism. It’s about understanding what happened.", "\"Why didn’t I learn Spanish?\" she asked herself. \"Because I tried to study for an hour every day, and I always got too tired after work. That was unrealistic.\"", "She wrote down the lesson learned: \"Next year, I will study for just 15 minutes a day. Small, consistent steps are better than big, impossible plans.\"", "She did the same for the other failures. The argument with her sister taught her to communicate better. The social media habit taught her to set strict time limits.", "Her brother, Tom, walked into the room. \"Doing your yearly review?\" he asked, sitting on the edge of the bed.", "\"Yes,\" Emma said. \"It’s actually really helpful. I used to just feel bad about what I didn’t do. But now I see how much I’ve grown, and I know exactly what to improve next year.\"", "\"That’s the point of reflection,\" Tom said. \"You can’t improve if you don’t evaluate where you are. What’s your main focus for next year?\"", "\"Health and learning,\" Emma replied. \"But this time, my goals will be realistic and kind to myself.\"", "Tom smiled. \"That sounds like a perfect plan.\"", "Emma closed her journal, feeling a deep sense of peace. She realized that reviewing the past wasn’t about living in it. It was about gathering wisdom, celebrating success, and using every lesson learned to build a better, more intentional future."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What three parts did Emma use to review her year?", "Why did Emma fail to learn Spanish, according to her reflection?", "What lesson did Emma learn from her social media habit?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Emma sat down with her journal for her annual... (reflection).", "hints": ["She decided to... (review) the year by looking at successes, failures, and lessons learned.", "She wrote down her... (success), like getting a promotion.", "When evaluating failures, she realized her Spanish goal was... (unrealistic).", "The... (lesson learned) was to study for just 15 minutes a day.", "Her brother Tom agreed that you must... (evaluate) your current state to... (improve).", "Emma realized that ref var LONG=1500,synth=window.speechSynthesis,voice=null,speakBtn=null;

var fav={};try{fav=JSON.parse(store('fav')||'{}')||{}}catch(e){fav={}}

function esc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}

  if(!alts.length){p.textContent=text;return}

  while((m=re.exec(text))){var s=m.index+m[1].length;if(s>last)p.append(text.slice(last,s));p.append(el('span','hl',m[2]));last=s+m[2].length}

}

var cache={};
async function translate(text,ctx){
  var key=text+'|'+(ctx||'');if(cache[key])return cache[key];var out=null;
  try{var sm=(window.claude&&claude.use)?await claude.use('sample'):null;
    if(sm){var one=text.split(/\s+/).length===1;
      var p='Переведи с английского на русский. Ответь только переводом, без пояснений.'+(one?' Это одно слово из предложения: дай его значение в этом контексте и, если уместно, ещё 1–2 коротких значения через запятую.':'')+(one&&ctx?'\nПредложение: '+ctx:'')+'\nТекст: '+text;

var pop=document.getElementById('pop'),popSrc=document.getElementById('popSrc'),popRu=document.getElementById('popRu'),popMore=document.getElementById('popMore'),seq=0;

function caretAt(x,y){
  if(document.caretPositionFromPoint){var p=document.caretPositionFromPoint(x,y);return p&&{n:p.offsetNode,o:p.offset}}
  if(document.caretRangeFromPoint){var r=document.caretRangeFromPoint(x,y);return r&&{n:r.startContainer,o:r.startOffset}}
  return null}
function wordAt(x,y,blk){
  var c=caretAt(x,y);if(!c||c.n.nodeType!==3||!blk.contains(c.n))return null;
  var s=c.n.nodeValue,i=c.o,re=/[A-Za-z'’-]/;
  if(i>=s.length||!re.test(s[i])){if(i>0&&re.test(s[i-1]))i--;else return null}
  var a=i,b=i;while(a>0&&re.test(s[a-1]))a--;while(b<s.length&&re.test(s[b]))b++;
  var word=s.slice(a,b).replace(/^['’-]+|['’-]+$/g,'');if(!word)return null;
  var pre=document.createRange();pre.selectNodeContents(blk);pre.setEnd(c.n,a);
  var full=blk.textContent,pos=pre.toString().length,st=0,en=full.length,m,rx=/[.!?…]+["”’']?\s+/g;
  while((m=rx.exec(full))){var e=m.index+m[0].length;if(e<=pos)st=e;else{en=m.index+m[0].trimEnd().length;break}}
  return {word:word,sent:full.slice(st,en).trim()};
}
var lp=null,sx=0,sy=0,mainEl=document.getElementById('main');
function cancelLP(){if(lp){clearTimeout(lp);lp=null}}

  var b=e.target.closest&&e.target.closest('.story p,.qs li,.hints li');if(!b||e.target.closest('.ans'))return;

var selBtn=document.getElementById('selBtn');

  var s=getSelection(),t=s?s.toString().trim():'',n=s&&s.anchorNode&&(s.anchorNode.nodeType===3?s.anchorNode.parentElement:s.anchorNode);

function placeSel(s){
  if(selBtn.hidden||!s||!s.rangeCount)return;
  var rs=s.getRangeAt(0).getClientRects();if(!rs.length)return;
  var r=rs[rs.length-1],w=selBtn.offsetWidth,h=selBtn.offsetHeight,vw=innerWidth,vh=innerHeight;
  var x=Math.max(8,Math.min(vw-w-8,r.left+r.width/2-w/2)),y=r.bottom+46;

  selBtn.style.transform='translate('+x+'px,'+y+'px)'}

  m.append(c);
  var v=el('section','card');v.append(el('h2',null,t.vh));if(t.vnote)v.append(el('p','note',t.vnote));
  var ul=el('ul','vocab');
  t.vocab.forEach(function(x){var li=el('li');li.append(el('span','w',x.w));if(x.tr)li.append(el('span','tr',x.tr));li.append(spk(x.w),starBtn(x.w,x.ru,null),el('span','ru','— '+x.ru));ul.append(li)});
  v.append(ul);m.append(v);
  var s=el('section','card story');var sh=el('div','shead');sh.append(el('h2',null,t.sh),spk(t.story));s.append(sh);if(t.snote)s.append(el('p','note',t.snote));
  storyPs=[];t.story.forEach(function(p){var e=el('p');hlInto(e,p);storyPs.push({p:e,text:p});s.append(e)});m.append(s);
  var r=el('section','card');r.append(el('h2',null,t.rh));if(t.rnote)r.append(el('p','note',t.rnote));
  r.append(el('p','step',t.s1));var ol=el('ol','qs');t.qs.forEach(function(q){ol.append(el('li',null,q))});r.append(ol);
  r.append(el('p','step',t.s2));if(t.s2note)r.append(el('p','note',t.s2note));
  var hl=el('ul','hints');t.hints.forEach(function(x){var li=el('li');withAns(li,x);hl.append(li)});r.append(hl);
  var d=el('div','done'),db=el('button',done[t.num]?'on':'',done[t.num]?'✓ Тема пройдена':'Отметить как пройденную');db.type='button';
  db.onclick=function(){if(done[t.num])delete done[t.num];else done[t.num]=1;store('done',JSON.stringify(done));render();paintList()};
  d.append(db);r.append(d);m.append(r);
  document.getElementById('prog').textContent='Тема '+t.num+' из '+T.length+' · пройдено: '+Object.keys(done).length;
  document.title=t.ru+' — Английский через чтение';
  document.querySelectorAll('.nav [data-a="prev"]').forEach(function(b){b.disabled=cur===0});
  document.querySelectorAll('.nav [data-a="next"]').forEach(function(b){b.disabled=cur===T.length-1});
}
function go(i){cur=i;store('cur',String(i));try{history.replaceState(null,'','#t'+T[i].num)}catch(e){}render();window.scrollTo(0,0)}
var sheet=document.getElementById('sheet'),list=document.getElementById('list');
function paintList(){
  list.textContent='';
  T.forEach(function(t,i){
    var b=el('button','item'+(i===cur?' cur':''));b.type='button';
    b.append(el('span','n',String(t.num)),el('span','t',t.ru));
    if(done[t.num])b.append(el('span','ck','✓'));
    b.onclick=function(){closeSheet();go(i)};list.append(b)});
  document.getElementById('doneCount').textContent='Пройдено: '+Object.keys(done).length+' из '+T.length;
}
function openSheet(){paintList();sheet.classList.add('open');
  var c=list.querySelector('.cur');if(c)list.scrollTop=c.offsetTop-list.clientHeight/3;document.getElementById('closeBtn').focus()}
function closeSheet(){sheet.classList.remove('open')}
document.getElementById('closeBtn').onclick=closeSheet;
sheet.addEventListener('click',function(e){if(e.target===sheet)closeSheet()});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){closeSheet();closeFav();pop.hidden=true}
  if(sheet.classList.contains('open')||favSheet.classList.contains('open')||/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
  if(e.key==='ArrowLeft'&&cur>0)go(cur-1);
  if(e.key==='ArrowRight'&&cur<T.length-1)go(cur+1)});
window.addEventListener('hashchange',function(){var n=parseInt(location.hash.replace('#t',''),10);if(n>=1&&n<=T.length&&n-1!==cur){cur=n-1;render()}});
render();
})();
</script>
</body>
</html>
