d form.", "Elena had to... (fill out) a new form on the spot.", "She was glad she had her rental contract in her... (bag).", "The clerk checked the new form and managed to... (issue) the document.", "Elena found the situation... (frustrating) but was grateful for the clerk's help.", "She learned to always double-check... (requirements) before visiting such places."], "vocab": [{"w": "government office", "tr": "[ˈɡʌvənmənt ˈɒfɪs]", "ru": "государственное учреждение"}, {"w": "appointment", "tr": "[əˈpɔɪntmənt]", "ru": "запись, прием"}, {"w": "queue", "tr": "[kjuː]", "ru": "очередь"}, {"w": "to fill out", "tr": "[fɪl aʊt]", "ru": "заполнять (форму, документ)"}, {"w": "requirement", "tr": "[rɪˈkwaɪəmənt]", "ru": "требование"}, {"w": "to issue", "tr": "[ˈɪʃuː]", "ru": "выдавать (документ)"}, {"w": "frustrating", "tr": "[ˈfrʌstreɪtɪŋ]", "ru": "раздражающий, выводящий из себя"}, {"w": "document", "tr": "[ˈdɒkjumənt]", "ru": "документ"}]}, {"num": 159, "ru": "Чтение и понимание договора аренды или страховки", "en": "Reading and understanding a rental or insurance contract", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["David was sitting at his kitchen table with a thick stack of papers. He was about to sign a new rental contract for a nice apartment, but something caught his eye in the fine print.", "\"Wait a minute,\" he muttered, adjusting his glasses. \"Clause 14b: 'The tenant is responsible for repainting the entire apartment in white before moving out.'\"", "David frowned. The apartment was currently painted in a nice, warm beige. Repainting it white would cost him a lot of money and time. He decided not to sign just yet. He picked up his phone and called the landlord, Mr. Harris.", "\"Hello, Mr. Harris? It’s David. I’m looking at the contract, and I need to clarify something.\"", "\"Sure, David. What is it?\"", "\"I’m looking at clause 14b about repainting the walls white. The apartment is beige now. Am I really expected to repaint it?\"", "There was a pause on the other end. \"Ah, yes. That’s a standard clause in our template contract. Honestly, we don’t expect you to repaint it if you keep it clean and undamaged. It’s just there for liability purposes in case someone paints the walls neon green.\"", "David felt relieved but wanted to be sure. \"Would you mind if we cross out that specific clause and initial it, just so it’s clear?\"", "\"Not at all,\" Mr. Harris laughed. \"I appreciate that you actually read the fine print. Most tenants just sign without looking. Bring the contract to the office tomorrow, and we’ll adjust it.\"", "\"Thank you, Mr. Harris. See you tomorrow.\"", "David hung up the phone, feeling proud of himself. He realized that reading a contract carefully isn't about being difficult; it’s about protecting your rights and avoiding unexpected problems in the future."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What strange rule did David find in the rental contract?", "Why did the landlord say that clause was in the contract?", "What did David and the landlord agree to do about the clause?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, David was reading a rental... (contract) before signing it.", "hints": ["He noticed a strange rule in the... (fine print) about repainting the walls.", "He decided to call the... (landlord) to... (clarify) the situation.", "The landlord explained it was just a standard... (clause) for... (liability).", "He didn't actually expect the... (tenant) to repaint the apartment.", "They agreed to cross out that specific part of the... (document).", "David felt proud that he read the... (contract) carefully.", "He learned that checking the details helps to avoid future... (problems)."], "vocab": [{"w": "contract", "tr": "[ˈkɒntrækt]", "ru": "договор, контракт"}, {"w": "clause", "tr": "[klɔːz]", "ru": "пункт, статья (в договоре)"}, {"w": "fine print", "tr": "[faɪn prɪnt]", "ru": "мелкий шрифт (скрытые условия)"}, {"w": "to sign", "tr": "[saɪn]", "ru": "подписывать"}, {"w": "liability", "tr": "[ˌlaɪəˈbɪləti]", "ru": "ответственность, обязанность"}, {"w": "to clarify", "tr": "[ˈklærɪfaɪ]", "ru": "уточнять, прояснять"}, {"w": "tenant", "tr": "[ˈtenənt]", "ru": "арендатор, жилец"}, {"w": "landlord", "tr": "[ˈlændlɔːd]", "ru": "арендодатель, хозяин квартиры"}]}, {"num": 160, "ru": "Базовое обслуживание автомобиля своими силами", "en": "проверка масла, замена колеса) (Basic car maintenance: checking oil, changing a tire", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["Lisa was driving home from work when she felt a sudden bump and heard a loud hissing sound. She pulled over to the side of the road.", "\"Oh no,\" she sighed, looking out the window. \"A flat tire.\"", "She had never changed a tire before. She felt a moment of panic, but then she remembered her father’s advice: \"Stay calm, and read the manual.\"", "Lisa opened the trunk and found the car manual. She flipped to the section on changing a tire. \"Okay, step one: find the spare tire and the jack,\" she read aloud.", "She located the tools under the floor of the trunk. She placed the jack under the car, exactly where the manual showed, and started turning the handle to lift the car.", "Just then, an older man in a pickup truck stopped behind her and rolled down his window. \"Need a hand, miss?\"", "\"I think I can manage, but thank you,\" Lisa said politely. \"I’m just following the manual.\"", "The man smiled. \"Good for you. Just make sure you tighten the bolts in a star pattern, not in a circle. It keeps the wheel balanced.\"", "\"Star pattern. Got it,\" Lisa said.", "She removed the flat tire, put on the spare, and tightened the bolts exactly as the man suggested. Ten minutes later, the car was safely on the ground, and the spare tire was secure.", "\"Perfect job,\" the man said, giving her a thumbs-up before driving away.", "Lisa got back into the driver’s seat, feeling a huge sense of accomplishment. She realized that basic car maintenance isn't magic. With a little patience, the right tools, and a clear manual, anyone can handle a small emergency on the road."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What happened to Lisa’s car while she was driving?", "What did Lisa use to figure out how to change the tire?", "What helpful advice did the passing driver give her?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Lisa heard a hissing sound and realized she had a... (flat tire).", "hints": ["Instead of panicking, she decided to read the car... (manual).", "She opened the... (trunk) to find the tools.", "She used a... (jack) to lift the car safely.", "A passing driver stopped to offer help and gave her a tip.", "He told her to... (tighten) the bolts in a star pattern.", "Lisa successfully put on the... (spare tire) by herself.", "She felt proud and realized that basic... (maintenance) is manageable with the right instructions."], "vocab": [{"w": "flat tire", "tr": "[flæt ˈtaɪə]", "ru": "проколотая шина"}, {"w": "jack", "tr": "[dʒæk]", "ru": "домкрат"}, {"w": "spare tire", "tr": "[speə ˈtaɪə]", "ru": "запасное колесо"}, {"w": "to check the oil", "tr": "[tʃek ði ɔɪl]", "ru": "проверять уровень масла"}, {"w": "dipstick", "tr": "[ˈdɪpstɪk]", "ru": "щуп (для проверки масла)"}, {"w": "trunk", "tr": "[trʌŋk]", "ru": "багажник"}, {"w": "manual", "tr": "[ˈmænjuəl]", "ru": "руководство, инструкция"}, {"w": "to tighten", "tr": "[ˈtaɪtn]", "ru": "затягивать (гайки, болты)"}]}, {"num": 161, "ru": "Подготовка аварийного набора на случай отключения света или стихии", "en": "Preparing an emergency kit for power outages or storms", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["The weather forecast warned of a severe storm approaching the city. Mark looked out the window at the dark clouds and turned to his wife, Emma.", "\"We should prepare an emergency kit, just in case we have a power outage tonight,\" he said.", "Emma nodded. \"Good idea. The last time the power went out, we were running around in the dark looking for candles.\"", "They went to the hallway closet. Mark pulled out a large plastic box. \"Okay, let's start with the basics. Flashlights?\"", "\"Check,\" Emma said, handing him two. \"But we need to check the batteries. I think the old ones are dead.\"", "Mark tested them. \"You're right. Let's add a fresh pack of batteries to the list.\"", "They continued packing. Emma added a well-stocked first-aid kit, a portable phone charger, and some warm blankets.", "\"What about food?\" Mark asked. \"The fridge will get warm if the electricity is off for a long time.\"", "\"Let's add some non-perishable items,\" Emma suggested. \"Canned beans, crackers, and bottled water. And maybe some chocolate for morale.\"", "\"Chocolate is definitely essential,\" Mark laughed, tossing a few bars into the box.", "They also gathered important documents, like their passports and insurance papers, and put them in a waterproof folder.", "By 6 PM, the storm hit. The wind howled, and suddenly, the house went completely dark.", "\"Well, that was fast,\" Emma said in the dark.", "\"No problem,\" Mark replied, clicking on a flashlight. \"We are fully prepared. I'll get the blankets and the chocolate.\"", "Sitting on the sofa with flashlights and snacks, they realized that preparing an emergency kit wasn't about being paranoid. It was about being smart, safe, and ready for anything."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Mark and Emma decide to prepare an emergency kit?", "What did they discover about the flashlights?", "What non-perishable food items did they add to the box?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, a severe storm was approaching, so they decided to... (prepare) for a possible... (power outage).", "hints": ["They found a plastic box and started gathering... (essential) items.", "They realized the old... (batteries) were dead and bought new ones.", "Emma added a... (first-aid kit), blankets, and a phone charger.", "For food, they chose... (non-perishable) items like canned beans and crackers.", "They also put important documents in a waterproof... (folder).", "When the storm hit and the lights went out, they were calm and... (ready).", "They learned that having an... (emergency kit) brings peace of mind."], "vocab": [{"w": "emergency kit", "tr": "[ɪˈmɜːdʒənsi kɪt]", "ru": "аварийный набор, тревожный чемоданчик"}, {"w": "power outage", "tr": "[ˈpaʊə ˈaʊtɪdʒ]", "ru": "отключение электричества"}, {"w": "flashlight", "tr": "[ˈflæʃlaɪt]", "ru": "фонарик"}, {"w": "batteries", "tr": "[ˈbætəriz]", "ru": "батарейки"}, {"w": "non-perishable", "tr": "[ˌnɒnˈpɜːrɪʃəbl]", "ru": "непортящийся (о продуктах)"}, {"w": "first-aid kit", "tr": "[ˌfɜːst ˈeɪd kɪt]", "ru": "аптечка первой помощи"}, {"w": "to prepare", "tr": "[prɪˈpeə]", "ru": "готовить(ся)"}, {"w": "essential", "tr": "[ɪˈsenʃl]", "ru": "необходимый, самый важный"}]}, {"num": 162, "ru": "Базовый учет финансов и подготовка к налогам", "en": "Basic financial tracking and tax preparation", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["Leo stared at the shoebox on his desk. It was overflowing with crumpled pieces of paper.", "\"Tax season is here,\" he groaned, rubbing his temples. \"And I have no idea how to fill out my tax return.\"", "His friend Sarah, an accountant, walked into his home office with two cups of coffee. \"Let me guess. The shoebox of chaos?\"", "\"Yes,\" Leo sighed. \"I’m a freelance graphic designer. I have income coming in from five different clients, and I have no idea what my expenses are.\"", "\"Don't panic,\" Sarah said, sitting down. \"We just need to track everything. First, let’s separate the papers. This pile is your income. This pile is your business expenses.\"", "Leo started sorting the crumpled receipts. \"What counts as an expense?\"", "\"Anything you bought for work,\" Sarah explained. \"New software, a new mouse, or even a part of your internet bill. These are deductible, which means they lower the amount of tax you have to pay.\"", "\"Wow, I didn't know that,\" Leo said, smoothing out a receipt for a new graphics tablet.", "\"Okay, now open a blank spreadsheet on your computer,\" Sarah instructed. \"We will make two columns: Date and Amount. We’ll type everything in.\"", "For the next two hours, they worked together. Leo typed, and Sarah checked his math. It was tedious, but seeing the numbers organized on the screen made Leo feel much more in control.", "\"Look at that,\" Sarah said, pointing to the bottom of the screen. \"Your deductible expenses are higher than you thought. You’ll save a lot of money.\"", "Leo smiled, feeling a huge wave of relief. \"Thank you, Sarah. I promise, next year I will track my finances every month, not just before the deadline.\""], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why was Leo stressed about the shoebox on his desk?", "What is a \"deductible\" expense according to Sarah?", "What tool did they use to organize the financial data?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Leo was stressed because the... (deadline) for his... (tax return) was approaching.", "hints": ["He had a shoebox full of crumpled... (receipts).", "His friend Sarah helped him separate his... (income) from his business... (expenses).", "She explained that work-related purchases are... (deductible) and can lower his taxes.", "They opened a... (spreadsheet) to... (track) all the numbers.", "After organizing the data, Leo realized he would save money.", "He promised to manage his... (finances) monthly in the future."], "vocab": [{"w": "tax return", "tr": "[tæks rɪˈtɜːn]", "ru": "налоговая декларация"}, {"w": "income", "tr": "[ˈɪnkʌm]", "ru": "доход"}, {"w": "expense", "tr": "[ɪkˈspens]", "ru": "расход, трата"}, {"w": "receipt", "tr": "[rɪˈsiːt]", "ru": "чек, квитанция"}, {"w": "deductible", "tr": "[dɪˈdʌktəbl]", "ru": "сумма, не облагаемая налогом (расход)"}, {"w": "to track", "tr": "[træk]", "ru": "отслеживать"}, {"w": "spreadsheet", "tr": "[ˈspredʃiːt]", "ru": "электронная таблица"}, {"w": "deadline", "tr": "[ˈdedlaɪn]", "ru": "крайний срок"}]}, {"num": 163, "ru": "Сортировка мусора и компостирование в домашних условиях", "en": "Recycling and composting at home", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["\"Mom, which bin does this go in?\" ten-year-old Max asked, holding a dirty pizza box and an apple core.", "His mother, Julia, smiled. \"Great question! Let’s sort it out. The cardboard pizza box goes into the recycling bin, but only if it’s not too greasy. The apple core goes into the compost bin.\"", "Max frowned. \"Compost? You mean the smelly dirt bucket on the balcony?\"", "\"It’s not just dirt, Max,\" Julia explained patiently. \"It’s organic waste. Fruit peels, vegetable scraps, and coffee grounds. Over time, it breaks down and becomes rich soil for our garden plants. It’s a very eco-friendly habit.\"", "\"But why do we have to do it?\" Max asked, dropping the apple core into the green bin.", "\"Because it helps to reduce the amount of trash we send to the landfill,\" Julia said. \"Landfills are huge, smelly, and bad for the environment. By recycling paper and composting food, we give those materials a second life.\"", "Max looked at the three different bins in their kitchen: blue for recycling, green for compost, and black for regular trash. \"It’s like a sorting game,\" he said.", "\"Exactly!\" Julia laughed. \"And you’re getting very good at it.\"", "A few weeks later, Julia was watering the tomato plants on their balcony. The soil looked dark and rich.", "\"Look, Max,\" she called him over. \"Remember those apple cores you threw in the compost bin last month? This soil is made from them. Your apples are helping new plants grow!\"", "Max’s eyes widened. \"That’s actually kind of cool. Can I compost my banana peel tomorrow?\"", "\"Absolutely,\" Julia smiled. She realized that teaching children about sustainability is easiest when they can see the real, magical results of their actions."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Where did Max’s mother tell him to put the apple core?", "Why is composting considered an eco-friendly habit?", "How did Max react when he saw the results of the compost?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Max asked his mom how to... (sort) his trash.", "hints": ["She explained that cardboard goes to... (recycling), and food scraps go to... (compost).", "Compost is made of... (organic waste) like fruit peels and coffee grounds.", "Julia explained that this helps to... (reduce) the trash sent to the... (landfill).", "Max thought of it as a sorting... (game).", "Weeks later, Julia showed him how the compost became rich... (soil) for their plants.", "Max was amazed and wanted to... (compost) more.", "He learned that small... (eco-friendly) habits can create real results."], "vocab": [{"w": "recycling", "tr": "[ˌriːˈsaɪklɪŋ]", "ru": "переработка, вторичное использование"}, {"w": "compost", "tr": "[ˈkɒmpɒst]", "ru": "компост"}, {"w": "organic waste", "tr": "[ɔːˈɡænɪk weɪst]", "ru": "органические отходы"}, {"w": "bin", "tr": "[bɪn]", "ru": "мусорное ведро, контейнер"}, {"w": "to sort", "tr": "[sɔːt]", "ru": "сортировать"}, {"w": "landfill", "tr": "[ˈlændfɪl]", "ru": "мусорная свалка"}, {"w": "eco-friendly", "tr": "[ˌiːkəʊ ˈfrendli]", "ru": "экологичный, безвредный для природы"}, {"w": "to reduce", "tr": "[rɪˈdjuːs]", "ru": "сокращать, уменьшать"}]}, {"num": 164, "ru": "Покупки в секонд-хенде и апсайклинг одежды", "en": "Thrifting and upcycling clothes", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["\"Look at this!\" Chloe said, holding up a bright yellow denim jacket. \"It’s only five dollars!\"", "Her friend Mia examined the jacket in the thrift store. \"It’s a really cool vintage style. But it’s huge. You’ll drown in it.\"", "\"I know,\" Chloe sighed, looking disappointed. \"But the fabric is amazing, and it’s such a bargain. I wish it fit.\"", "Mia smiled. \"Who says it has to fit? We can upcycle it.\"", "\"Upcycle? I don’t know how to sew,\" Chloe said.", "\"It’s easier than you think,\" Mia replied. \"My mom has a sewing machine. We can cut it into a cropped jacket and add some cool patches. It will be completely unique.\"", "Chloe’s eyes lit up. \"Really? That sounds like a fun project. And it’s more sustainable than buying new fast fashion.\"", "They bought the jacket and went to Mia’s house. They laid it on the floor and pinned the sleeves and the bottom to make it shorter.", "\"Okay, I’ll guide the fabric, you pedal the machine,\" Mia instructed.", "It took them two hours. There were a few crooked stitches, but they laughed it off. Finally, Chloe put on the jacket. It fit perfectly, and the added patches made it look like a designer piece.", "\"Wow,\" Chloe said, looking in the mirror. \"I can’t believe we made this. It’s my favorite jacket now.\"", "\"See?\" Mia said. \"Thrifting is great, but upcycling makes it personal. You didn’t just buy clothes; you created art.\"", "Chloe nodded, feeling proud. She realized that with a little creativity and a basic sewing machine, old clothes could get a second, much better life."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Chloe hesitate to buy the yellow jacket at first?", "What solution did Mia suggest to fix the size problem?", "Why did Chloe think upcycling was better than buying new clothes?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Chloe found a... (vintage) yellow jacket in a... (thr touching anything gross.\"", "When they arrived at the park, about thirty people were already there, wearing bright vests and holding trash bags. The organizer handed Leo a pair of thick gloves and a grabber tool.", "\"Thanks,\" Leo muttered.", "He started walking along the path. To his surprise, it wasn’t as bad as he thought. He found plastic bottles, old wrappers, and even a lost tennis ball. A girl about his age, named Maya, was picking up trash nearby.", "\"Hi,\" she said. \"First time volunteering?\"", "\"Yeah,\" Leo admitted. \"I thought it would be boring, but it’s actually kind of satisfying to see the path getting cleaner.\"", "\"Right?\" Maya smiled. \"After this, we’re going to plant some new flower beds near the entrance. Want to help?\"", "\"Sure,\" Leo said.", "For the next hour, they worked together, planting small bushes and cleaning the area. Leo’s back ached a little, but he felt a strange sense of pride.", "At noon, the organizer handed out slices of pizza. Leo sat on the grass with Maya and his dad, eating and laughing.", "\"You see?\" his dad said. \"Not so boring.\"", "\"No, it wasn't,\" Leo agreed. \"It was actually really rewarding. I think I’ll come back next month.\""], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why didn't Leo want to go to the park at the beginning?", "What tools did the organizer give to Leo?", "How did Leo’s attitude change by the end of the event?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Leo’s dad invited him to a... (community cleanup) in their... (neighborhood).", "hints": ["Leo only agreed because he was promised free... (pizza).", "At the park, he received... (gloves) and a grabber tool to pick up... (litter).", "He met a girl named Maya and they started to... (volunteer) together.", "They also helped to... (plant) new flowers near the entrance.", "Leo realized that this eco-friendly... (initiative) was actually very... (rewarding).", "He enjoyed eating pizza with the other volunteers.", "He decided to... (return) and help again next month."], "vocab": [{"w": "community cleanup", "tr": "[kəˈmjuːnəti ˈkliːnʌp]", "ru": "общественная уборка территории"}, {"w": "to volunteer", "tr": "[ˌvɒlənˈtɪə]", "ru": "работать волонтером"}, {"w": "litter", "tr": "[ˈlɪtə]", "ru": "мусор (разбросанный)"}, {"w": "gloves", "tr": "[ɡlʌvz]", "ru": "перчатки"}, {"w": "neighborhood", "tr": "[ˈneɪbəhʊd]", "ru": "район, окрестности"}, {"w": "to plant", "tr": "[plɑːnt]", "ru": "сажать (растения)"}, {"w": "initiative", "tr": "[ɪˈnɪʃətɪv]", "ru": "инициатива, начинание"}, {"w": "rewarding", "tr": "[rɪˈwɔːdɪŋ]", "ru": "приносящий удовлетворение"}]}, {"num": 166, "ru": "Осознанные путешествия: как быть этичным туристом", "en": "Conscious travel: how to be an ethical tourist", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["Anna and Mark were planning their dream trip to Thailand. They were looking at tour packages online when Anna pointed at the screen.", "\"Look at this! Elephant riding for only twenty dollars. Let’s book it!\"", "Mark frowned and shook his head. \"Actually, Anna, we should avoid that. Riding elephants is harmful to them. They are often kept in bad conditions and trained with cruelty. It’s not ethical tourism.\"", "Anna looked disappointed. \"But it’s a famous tradition! What else can we do?\"", "\"We can visit an ethical elephant sanctuary,\" Mark suggested. \"There, we can observe the animals in their natural habitat, feed them, and learn about wildlife conservation. The money goes directly to protecting them.\"", "\"That sounds much better,\" Anna smiled. \"I want our trip to be sustainable, not harmful.\"", "During their trip, they also thought about their impact on the local community. Instead of buying cheap, mass-produced plastic souvenirs at the airport, they visited a small village market.", "\"Look at these handmade baskets,\" Anna said, admiring the craftsmanship. \"Let’s buy our gifts here. It supports the local artisans directly.\"", "\"Exactly,\" Mark agreed. \"And let’s try to reduce our carbon footprint by walking or using public transport instead of taking taxis everywhere.\"", "They spent a week exploring temples, eating authentic street food, and respecting the local culture. They learned a few basic phrases in Thai and always asked for permission before taking photos of people.", "On their last evening, sitting by the beach, Anna sighed happily. \"This was the best trip ever. I feel good knowing we traveled responsibly.\"", "Mark nodded. \"Me too. Being an ethical tourist doesn't mean you can't have fun. It just means you make choices that respect the places and people you visit.\""], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Mark suggest avoiding the elephant riding tour?", "Where did Anna and Mark decide to buy their souvenirs instead of the airport?", "How did they try to reduce their carbon footprint during the trip?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Anna wanted to book an elephant riding tour, but Mark said it wasn't... (ethical tourism).", "hints": ["They decided to visit a... (sanctuary) to observe the... (wildlife) safely.", "They wanted their trip to be... (sustainable) and helpful.", "Instead of plastic gifts, they bought handmade... (souvenirs) from local artisans.", "They tried to... (respect) the local culture and learn basic phrases.", "They also chose to walk to reduce their... (carbon footprint).", "Anna realized that traveling responsibly makes the experience much... (better).", "They learned to... (avoid) activities that harm animals or the environment."], "vocab": [{"w": "ethical tourism", "tr": "[ˈeθɪkl ˈtʊərɪzəm]", "ru": "этичный туризм"}, {"w": "carbon footprint", "tr": "[ˈkɑːbən ˈfʊtprɪnt]", "ru": "углеродный след"}, {"w": "local community", "tr": "[ˈləʊkl kəˈmjuːnəti]", "ru": "местное сообщество"}, {"w": "sustainable", "tr": "[səˈsteɪnəbl]", "ru": "устойчивый, экологичный"}, {"w": "souvenir", "tr": "[ˌsuːvəˈnɪə]", "ru": "сувенир"}, {"w": "to respect", "tr": "[rɪˈspekt]", "ru": "уважать"}, {"w": "wildlife", "tr": "[ˈwaɪldlaɪf]", "ru": "дикая природа"}, {"w": "to avoid", "tr": "[əˈvɔɪd]", "ru": "избегать"}]}, {"num": 167, "ru": "Поход в театр или на концерт: этикет и покупка билетов", "en": "Going to a theater or concert: etiquette and buying tickets", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["Tom had bought two expensive tickets for a classical piano concert. He wanted to impress his girlfriend, Lisa. However, they got stuck in traffic and arrived at the venue ten minutes after the show started.", "An usher stopped them at the door. \"I’m sorry, but we cannot seat latecomers until the first intermission. It distracts the performers and the audience.\"", "Tom sighed. \"Okay, we’ll wait in the lobby.\"", "Forty minutes later, during the intermission, they finally found their seats. They had chosen aisle seats, which made it easier to get in without climbing over people.", "The second half of the concert was beautiful. Lisa was completely absorbed in the music. Suddenly, a loud buzzing sound broke the silence. It was Tom’s phone.", "He quickly pulled it out of his pocket and silenced it, but the damage was done. Several people in the row turned and gave him annoyed looks.", "\"I’m so sorry,\" Tom whispered, feeling his face turn red. \"I thought it was on silent.\"", "Lisa gently touched his arm. \"It’s okay, just keep it in your bag from now on.\"", "At the end of the performance, the pianist stood up and bowed. The audience began to applaud enthusiastically. Tom clapped loudly, but Lisa noticed he was about to clap between movements of the sonata.", "\"Wait,\" she whispered. \"In classical music, you only applaud at the very end of the whole piece, not between the movements.\"", "Tom lowered his hands, grateful for the tip. \"Good to know. I don't want to look like I don't understand the dress code of this place.\"", "After the concert, they went for coffee. \"It was magical,\" Lisa said. \"Even with the late arrival and the phone incident.\"", "Tom smiled. \"Next time, I’ll check the traffic, silence my phone, and we’ll be perfectly on time.\""], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why couldn't Tom and Lisa enter the concert hall immediately?", "What mistake did Tom make with his phone during the performance?", "What did Lisa teach Tom about applauding at a classical concert?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Tom and Lisa arrived late and were treated as... (latecomers).", "hints": ["They had to wait in the lobby until the... (intermission).", "They were glad they had booked an... (aisle seat) for easy access.", "During the concert, Tom’s phone started to ring, and he forgot to... (silence) it.", "He felt embarrassed and had to... (whisper) an apology.", "Lisa reminded him that in classical music, you only... (applaud) at the very end.", "Tom realized that knowing the concert... (etiquette) is very important.", "Despite the small mistakes, they enjoyed the... (venue) and the music."], "vocab": [{"w": "venue", "tr": "[ˈvenjuː]", "ru": "место проведения (театр, концертный зал)"}, {"w": "aisle seat", "tr": "[aɪl siːt]", "ru": "место у прохода"}, {"w": "intermission", "tr": "[ˌɪntəˈmɪʃn]", "ru": "антракт, перерыв"}, {"w": "to whisper", "tr": "[ˈwɪspə]", "ru": "шептать"}, {"w": "dress code", "tr": "[dres kəʊd]", "ru": "дресс-код"}, {"w": "to applaud", "tr": "[əˈplɔːd]", "ru": "аплодировать"}, {"w": "latecomer", "tr": "[ˈleɪtkʌmə]", "ru": "опоздавший"}, {"w": "to silence", "tr": "[ˈsaɪləns]", "ru": "отключать звук (телефона)"}]}, {"num": 168, "ru": "Запуск своего первого подкаста или YouTube-канала", "en": "базовые шаги) (Starting your first podcast or YouTube channel", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["David sat in his bedroom, staring at a brand-new microphone. \"Okay, this is it. Episode one of 'Local History Mysteries'.\"", "He pressed record and started talking. \"Hello everyone. Welcome to my podcast. Today we will talk about... um... the old bridge. Um, it was built in... uh...\"", "He stopped and sighed. The recording was full of background noise from the street, and he sounded nervous and unprepared.", "His roommate, Sarah, knocked and walked in. \"How’s the first episode going?\"", "\"Terrible,\" David admitted. \"I sound like a robot, and there’s a dog barking in the background. Maybe I should just give up.\"", "Sarah sat on the bed and listened to the clip. \"It’s not terrible, it’s just a first draft. Every creator starts here. You just need to find your niche and be consistent.\"", "\"What do you mean?\"", "\"Well, 'Local History' is a bit broad,\" Sarah explained. \"Why not focus on 'Haunted Places in Our City'? It’s more specific and interesting. And for the audio, you can use free editing software to remove the background noise.\"", "\"Really? Is editing that hard?\" David asked.", "\"Not at all. I can show you the basics tonight,\" Sarah offered. \"Just write a short script before you record. It will help you avoid saying 'um' too much.\"", "David felt a new wave of motivation. He spent the evening writing a clear script about an old, supposedly haunted library. The next day, he recorded it again, this time with the window closed and a clear plan.", "Sarah helped him with the editing, cutting out the long pauses. Finally, they uploaded the episode to a podcast platform.", "\"It’s not perfect,\" David said, listening to the final version, \"but it’s a real start.\"", "\"Exactly,\" Sarah smiled. \"Your audience will grow if you keep improving. Just keep going.\""], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why was David unhappy with his first recording?", "What specific topic did Sarah suggest for his podcast?", "How did Sarah help David improve his first episode?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, David tried to... (record) the first... (episode) of his history podcast.", "hints": ["The recording was bad because of background noise and too many \"ums\".", "Sarah advised him to find a specific... (niche), like haunted places.", "She also suggested writing a... (script) to sound more confident.", "Sarah showed him the basics of audio... (editing) to remove noise.", "They worked together and managed to... (upload) the episode online.", "David learned that being... (consistent) and improving is key to building an... (audience).", "He realized that the first try doesn't have to be... (perfect)."], "vocab": [{"w": "podcast", "tr": "[ˈpɒdkɑːst]", "ru": "подкаст"}, {"w": "episode", "tr": "[ˈepɪsəʊd]", "ru": "эпизод, выпуск"}, {"w": "to record", "tr": "[rɪˈkɔːd]", "ru": "записывать"}, {"w": "microphone", "tr": "[ˈmaɪkrəfəʊn]", "ru": "микрофон"}, {"w": "editing", "tr": "[ˈedɪtɪŋ]", "ru": "монтаж, редактирование"}, {"w": "audience", "tr": "[ˈɔːdiəns]", "ru": "аудитория, слушатели"}, {"w": "niche", "tr": "[niːʃ]", "ru": "ниша, узкая тематика"}, {"w": "consistent", "tr": "[kənˈsɪstənt]", "ru": "последовательный, постоянный"}]}, {"num": 169, "ru": "Организация книжного клуба с друзьями", "en": "Starting a book club with friends", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["Emma wanted to spend more time with her friends in a meaningful way, so she decided to start a book club. She invited four friends and set a deadline: they had to read one thriller novel by the end of the month.", "On Friday evening, Emma prepared her living room. She arranged comfortable chairs, lit some candles, and put out a plate of cheese, crackers, and wine as refreshments.", "\"Welcome, everyone!\" she said as her friends arrived. \"I’m so excited to be the host for our first meeting.\"", "They poured their wine and started the discussion. The book was about a mysterious disappearance on a train.", "\"I loved the ending!\" said Chloe. \"It was so unexpected.\"", "\"Are you kidding?\" Mark replied, shaking his head. \"I completely disagree. The ending was lazy and made no sense. The author just made it up.\"", "The room went quiet. Emma felt a moment of panic. She didn't want the club to turn into an argument.", "\"Okay, let’s explore that,\" Emma said calmly, stepping into her role as a moderator. \"Mark, what part didn't make sense to you? And Chloe, what did you like about it?\"", "By asking open questions, Emma helped them share their opinions respectfully. Soon, they were all laughing and debating the characters' choices, not fighting.", "\"This is actually really fun,\" Mark admitted, eating a cracker. \"I haven't read a book for pleasure in years.\"", "\"I know, right?\" Chloe agreed. \"So, who is hosting next month, and what genre are we reading?\"", "Emma smiled, feeling proud. \"I think we can rotate hosts. And next month, let’s try a historical fiction.\"", "She realized that a successful book club isn't about everyone having the same opinion. It’s about sharing different perspectives, enjoying good refreshments, and staying connected."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Emma decide to start a book club?", "What conflict happened during the discussion of the thriller novel?", "How did Emma solve the problem and keep the discussion friendly?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Emma invited friends to her house to start a... (book club).", "hints": ["She set a... (deadline) for them to read a thriller novel.", "As the... (host), she prepared comfortable chairs and... (refreshments).", "During the discussion, Mark and Chloe started to... (disagree) about the ending.", "Emma stayed calm and asked them to explain their... (opinion).", "This helped them... (discuss) the book respectfully without arguing.", "They decided to rotate the... (host) role and try a new... (genre) next month.", "Emma learned that different opinions make a book club... (fun) and interesting."], "vocab": [{"w": "book club", "tr": "[bʊk klʌb]", "ru": "книжный клуб"}, {"w": "to discuss", "tr": "[dɪˈskʌs]", "ru": "обсуждать"}, {"w": "genre", "tr": "[ˈʒɒnrə]", "ru": "жанр"}, {"w": "deadline", "tr": "[ˈdedlaɪn]", "ru": "крайний срок"}, {"w": "host", "tr": "[həʊst]", "ru": "хозяин (мероприятия)"}, {"w": "opinion", "tr": "[əˈpɪnjən]", "ru": "мнение"}, {"w": "to disagree", "tr": "[ˌdɪsəˈɡriː]", "ru": "не соглашаться"}, {"w": "refreshments", "tr": "[rɪˈfreʃmənts]", "ru": "закуски, угощения"}]}, {"num": 170, "ru": "Празднование местных традиций и праздников", "en": "Celebrating local traditions and holidays", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["Alex, an expat from Spain, had just moved to a small town in the United States. He was nervous about his first Thanksgiving. He didn't know the traditions and was worried he would do something wrong.", "His neighbor, Mrs. Higgins, knocked on his door on Wednesday evening. \"Hello, Alex! We’re having a neighborhood potluck for Thanksgiving tomorrow. We’d love for you to join us.\"", "\"A potluck?\" Alex asked. \"What should I bring?\"", "\"Just a dish from your home country!\" she smiled warmly. \"It’s a great way to share your culture.\"", "The next day, Alex arrived at the community hall. The room was festive, decorated with autumn leaves and pumpkins. Some children were running around in funny turkey costumes.", "Alex placed his dish on the long table: a large pan of traditional Spanish paella.", "\"Wow, this smells amazing!\" said Tom, another neighbor. \"We have turkey, mashed potatoes, and now, authentic paella. This is the best potluck ever.\"", "During dinner, the host asked everyone to share one thing they were grateful for. Alex had never heard of this tradition before.", "\"I am grateful for my new neighbors,\" Alex said sincerely. \"You made me feel welcome in a new country. And I am grateful for this delicious food.\"", "Everyone smiled and clapped. Later, Mrs. Higgins showed Alex how to carve a small decorative pumpkin.", "\"Thanksgiving is all about gratitude and community,\" she explained. \"It doesn't matter where you are from. We are all neighbors here.\"", "Alex ate a slice of pumpkin pie and looked around the room. He was far from home, but he didn't feel lonely. He realized that celebrating local traditions was the fastest way to build a new family and find a true sense of belonging."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why was Alex nervous about his first Thanksgiving?", "What dish did Alex bring to the neighborhood potluck?", "What did Alex say he was grateful for during the dinner?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Alex was nervous because he didn't know the local... (tradition).", "hints": ["His neighbor invited him to a community... (potluck).", "She asked him to bring a dish from his home... (country).", "Alex brought a traditional Spanish... (paella), which everyone loved.", "The room was... (festive), and some kids wore funny... (costumes).", "During dinner, everyone shared what they felt... (gratitude) for.", "Alex thanked his... (neighborhood) for making him feel welcome.", "He learned that sharing food and... (carving) pumpkins helps you feel at home."], "vocab": [{"w": "tradition", "tr": "[trəˈdɪʃn]", "ru": "традиция"}, {"w": "to decorate", "tr": "[ˈdekəreɪt]", "ru": "украшать"}, {"w": "costume", "tr": "[ˈkɒstjuːm]", "ru": "костюм"}, {"w": "potluck", "tr": "[ˈpɒtlʌk]", "ru": "вечеринка, где каждый приносит своё блюдо"}, {"w": "gratitude", "tr": "[ˈɡrætɪtjuːd]", "ru": "благодарность"}, {"w": "to carve", "tr": "[kɑːv]", "ru": "вырезать (например, тыкву)"}, {"w": "neighborhood", "tr": "[ˈneɪbəhʊd]", "ru": "район, соседи"}, {"w": "festive", "tr": "[ˈfestɪv]", "ru": "праздничный"}]}, {"num": 171, "ru": "Соло-путешествие: плюсы, минусы и безопасность", "en": "Solo travel: pros, cons, and safety", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["Sarah stood at the airport, holding her passport and a single backpack. She was traveling to Lisbon alone for the first time.", "\"Are you sure you don't want me to come with you?\" her brother had asked the night before.", "\"I need to do this on my own,\" she replied. \"I need some independence.\"", "Now, standing in the arrivals hall, she felt a mix of excitement and fear. She had booked a bed in a highly-rated hostel and wrote down her itinerary, but the city felt huge and unfamiliar.", "She took a taxi to the hostel. The receptionist, a friendly guy named Pedro, checked her in. \"First time in Lisbon?\" he asked.", "\"Yes, and I'm traveling solo,\" Sarah admitted.", "\"Welcome! You'll love it here,\" Pedro smiled. \"Just remember your safety rules: keep your valuables locked, don't walk alone in dark alleys at night, and always have your emergency contact number saved.\"", "\"Got it,\" Sarah said, feeling a bit more reassured.", "That evening, she went to the hostel's common room. A group of travelers was playing a board game.", "\"Hey, we need one more player!\" a girl from Australia called out. \"I'm Chloe. Are you joining?\"", "Sarah hesitated for a second, then smiled. \"Sure, I'm Sarah.\"", "They played games, shared stories, and decided to explore the city together the next day. Sarah realized that solo travel wasn't about being lonely. It was about the freedom to change her plans at any moment and the amazing opportunity to meet new people from all over the world. She felt brave, capable, and completely alive."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Sarah decide to travel to Lisbon alone?", "What safety advice did the receptionist give her?", "How did Sarah spend her first evening at the hostel?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Sarah arrived in Lisbon for her first... (solo travel) experience.", "hints": ["She felt a mix of excitement and fear but had a clear... (itinerary).", "The receptionist gave her important... (safety) tips, like keeping valuables locked.", "He also reminded her to save an... (emergency contact) number.", "In the evening, Sarah went to the common room of the... (hostel).", "She joined a group of travelers and started to... (meet new people).", "She realized that traveling alone gives you great... (independence).", "Even if you... (get lost) sometimes, it is a great adventure."], "vocab": [{"w": "solo travel", "tr": "[ˈsəʊləʊ ˈtrævl]", "ru": "соло-путешествие, путешествие в одиночку"}, {"w": "itinerary", "tr": "[aɪˈtɪnərəri]", "ru": "маршрут, план поездки"}, {"w": "hostel", "tr": "[ˈhɒstl]", "ru": "хостел, общежитие"}, {"w": "independence", "tr": "[ˌɪndɪˈpendəns]", "ru": "независимость"}, {"w": "to get lost", "tr": "[ɡet lɒst]", "ru": "заблудиться"}, {"w": "safety", "tr": "[ˈseɪfti]", "ru": "безопасность"}, {"w": "emergency contact", "tr": "[ɪˈmɜːdʒənsi ˈkɒntækt]", "ru": "контакт для экстренных случаев"}, {"w": "to meet new people", "tr": "[miːt njuː ˈpiːpl]", "ru": "знакомиться с новыми людьми"}]}, {"num": 172, "ru": "Борьба с бессонницей и практики медитации", "en": "Dealing with insomnia and meditation practices", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["Mark stared at the ceiling. It was 3:00 AM, and he had been tossing and turning for hours. His insomnia was getting worse.", "\"Stop thinking about work,\" he told himself, but his racing thoughts wouldn't stop. He checked his phone. 3:15 AM.", "The next morning, he looked like a zombie at the office. His colleague, Anna, noticed his dark circles.", "\"Rough night again?\" she asked sympathetically.", "\"Every night this week,\" Mark sighed. \"I just can't switch my brain off.\"", "\"Have you tried meditation?\" Anna suggested. \"It really helps with mindfulness and calming racing thoughts.\"", "\"Meditation? You mean sitting cross-legged and chanting?\" Mark laughed skeptically.", "\"Not at all,\" Anna smiled. \"It’s just about focusing on your breath. There are great apps that guide you. Try it tonight instead of scrolling through social media. It’s part of good sleep hygiene.\"", "That night, Mark decided to give it a try. He put his phone in another room, lay in bed, and opened a meditation app.", "\"Close your eyes,\" a calm voice said. \"Take a deep breath in... and slowly breathe out. Focus only on the air moving in and out of your body.\"", "At first, Mark’s mind wandered to his emails and deadlines. But the voice gently brought him back: \"Notice the thought, and let it go. Breathe deeply.\"", "Slowly, his shoulders relaxed. His breathing became steady. The anxiety faded, replaced by a warm, heavy feeling of calm.", "He didn't even hear the end of the ten-minute session. He just drifted off to sleep.", "The next morning, Mark woke up feeling refreshed for the first time in weeks. He realized that taking ten minutes to unwind and practice mindfulness was the key to finally defeating his insomnia."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why couldn't Mark sleep at 3:00 AM?", "What did Anna suggest to help him with his insomnia?", "How did Mark feel the morning after trying the meditation app?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Mark suffered from... (insomnia) and kept... (tossing and turning) in bed.", "hints": ["He had... (racing thoughts) about work and couldn't sleep.", "His colleague Anna suggested he try... (meditation) and... (mindfulness).", "She explained it is a good part of... (sleep hygiene).", "That night, Mark used an app that told him to... (breathe deeply).", "At first, he was distracted, but soon he managed to... (unwind).", "He fell asleep quickly and woke up feeling... (refreshed).", "He learned that calming the mind is the best way to fight... (insomnia)."], "vocab": [{"w": "insomnia", "tr": "[ɪnˈsɒmniə]", "ru": "бессонница"}, {"w": "to toss and turn", "tr": "[tɒs ənd tɜːn]", "ru": "ворочаться (в постели)"}, {"w": "racing thoughts", "tr": "[ˈreɪsɪŋ θɔːts]", "ru": "навязчивые, скачущие мысли"}, {"w": "meditation", "tr": "[ˌmedɪˈteɪʃn]", "ru": "медитация"}, {"w": "mindfulness", "tr": "[ˈmaɪndfəlnəs]", "ru": "осознанность"}, {"w": "to unwind", "tr": "[ʌnˈwaɪnd]", "ru": "расслабляться, отдыхать"}, {"w": "sleep hygiene", "tr": "[sliːp ˈhaɪdʒiːn]", "ru": "гигиена сна"}, {"w": "to breathe deeply", "tr": "[briːð ˈdiːpli]", "ru": "дышать глубоко"}]}, {"num": 173, "ru": "Питание с ограничениями: как заказывать еду с аллергией или вегану", "en": "Eating with restrictions: ordering food with allergies or as a vegan", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["\"Excuse me,\" Lisa said, raising her hand to catch the waiter's attention. \"I have a severe nut allergy, and I'm also vegan. Could you tell me which dishes are safe for me?\"", "The waiter, a young man named David, nodded seriously. \"Of course. Let me check with the chef to be absolutely sure. We take allergies very seriously here.\"", "Lisa felt a wave of relief. In the past, she had been to restaurants where waiters just guessed the ingredients, which was terrifying.", "A few minutes later, David returned with a small notebook. \"I spoke to the chef. Our mushroom risotto is completely vegan, and we prepare it in a separate pan to avoid any cross-contamination with dairy or nuts.\"", "\"That sounds perfect,\" Lisa smiled. \"And no butter or cheese at the end?\"", "\"None at all,\" David confirmed. \"We use olive oil. I will also put a special note on your order so the kitchen is extra careful.\"", "\"Thank you so much. It’s not always easy to find a place that can accommodate these restrictions.\"", "\"It’s our pleasure,\" David replied. \"Your safety is our priority.\"", "When the food arrived, it was delicious. Lisa enjoyed her meal without any anxiety.", "Later, her friend Mark, who had no dietary restrictions, tried a bite. \"Wow, this is amazing. I didn't know vegan food could taste this rich.\"", "Lisa laughed. \"It’s all about good ingredients and a kitchen that cares.\"", "She realized that having a dietary restriction doesn't mean you can't enjoy dining out. The key is to choose restaurants that respect your needs, ask clear questions, and never feel shy about informing the staff about your health."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What two dietary restrictions does Lisa have?", "How did the waiter ensure the food was safe for Lisa?", "Why was Lisa happy with the restaurant's service?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Lisa had a... (severe) nut allergy and was... (vegan).", "hints": ["She decided to... (inform) the waiter about her... (dietary restriction).", "The waiter checked with the chef to avoid any... (cross-contamination).", "He confirmed that the mushroom risotto had no animal... (ingredient).", "The kitchen was happy to... (accommodate) her request.", "Lisa enjoyed her meal without anxiety, and her friend Mark loved it too.", "She learned that asking clear questions helps you eat... (safely) in restaurants."], "vocab": [{"w": "dietary restriction", "tr": "[ˈdaɪətəri rɪˈstrɪkʃn]", "ru": "диетическое ограничение"}, {"w": "allergy", "tr": "[ˈælədʒi]", "ru": "аллергия"}, {"w": "vegan", "tr": "[ˈviːɡən]", "ru": "веган"}, {"w": "to inform", "tr": "[ɪnˈfɔːm]", "ru": "сообщать, информировать"}, {"w": "cross-contamination", "tr": "[ˌkrɒs kənˌtæmɪˈneɪʃn]", "ru": "перекрестное загрязнение"}, {"w": "ingredient", "tr": "[ɪnˈɡriːdiənt]", "ru": "ингредиент"}, {"w": "to accommodate", "tr": "[əˈkɒmədeɪt]", "ru": "пойти навстречу, удовлетворить просьбу"}, {"w": "severe", "tr": "[sɪˈvɪə]", "ru": "сильный, тяжелый"}]}, {"num": 174, "ru": "Поиск второго мнения у врача", "en": "Getting a second medical opinion", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["Tom looked at the medical report on his kitchen table. His doctor had suggested a minor surgery for his persistent knee pain.", "\"I don't know,\" Tom said to his wife, Emma. \"It feels a bit extreme for just a sore knee. I have my doubts.\"", "Emma put a hand on his shoulder. \"If you are not sure, there is nothing wrong with getting a second opinion. It’s your body, and you have the right to consult another specialist.\"", "\"But will the first doctor be offended?\" Tom asked, worried.", "\"Not at all,\" Emma reassured him. \"Good doctors understand that patients need to feel completely confident about their treatment. It’s a normal practice.\"", "The next day, Tom called a different orthopedic clinic and booked an appointment. He brought all his X-rays and the first doctor’s notes.", "The new specialist, Dr. Evans, examined his knee carefully. \"Your knee is indeed inflamed,\" she said, \"but I don’t think surgery is necessary yet. Have you tried a specific physical therapy program?\"", "\"No, my first doctor went straight to surgery,\" Tom replied.", "\"Let’s try six weeks of targeted physical therapy first,\" Dr. Evans suggested. \"If the pain doesn’t improve, we can reconsider surgery. But in my experience, most patients recover with therapy alone.\"", "Tom left the clinic feeling a massive wave of relief. He didn't need an operation.", "A month later, after doing his exercises daily, his knee pain was almost gone.", "\"You were right,\" Tom told Emma. \"Getting a second opinion saved me from unnecessary surgery.\"", "\"See?\" Emma smiled. \"It’s always better to be sure. Now you have real peace of mind.\""], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Tom doubt his first doctor’s recommendation?", "What did Emma advise Tom to do?", "What was the new specialist’s suggestion for Tom’s knee?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Tom’s doctor suggested surgery, but Tom began to... (doubt) this... (diagnosis).", "hints": ["His wife Emma told him it is normal to get a... (second opinion).", "Tom decided to... (consult) another... (specialist), Dr. Evans.", "She examined his knee and suggested physical therapy instead of... (treatment) with surgery.", "Tom followed her advice and his pain improved.", "Emma was happy that she could... (reassure) him.", "Tom realized that asking for a second opinion gives you... (peace of mind)."], "vocab": [{"w": "second opinion", "tr": "[ˈsekənd əˈpɪnjən]", "ru": "второе мнение (врача)"}, {"w": "diagnosis", "tr": "[ˌdaɪəɡˈnəʊsɪs]", "ru": "диагноз"}, {"w": "to doubt", "tr": "[daʊt]", "ru": "сомневаться"}, {"w": "specialist", "tr": "[ˈspeʃəlɪst]", "ru": "специалист"}, {"w": "to consult", "tr": "[kənˈsʌlt]", "ru": "консультироваться"}, {"w": "treatment", "tr": "[ˈtriːtmənt]", "ru": "лечение"}, {"w": "to reassure", "tr": "[ˌriːəˈʃʊə]", "ru": "успокаивать, вселять уверенность"}, {"w": "peace of mind", "tr": "[piːs əv maɪnd]", "ru": "душевное спокойствие"}]}, {"num": 175, "ru": "Восстановление после выгорания: план действий", "en": "Recovering from burnout: an action plan", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["Emma stared at her computer screen, but the words were blurry. She hadn't slept well in weeks, and her workload was overwhelming. She felt completely empty.", "\"I think I'm experiencing burnout,\" she confessed to her friend, Lisa, over a cup of tea.", "Lisa looked at her with concern. \"You’ve been working 60-hour weeks for months. You are exhausted. You need a plan to recover.\"", "\"But I can't just quit my job,\" Emma said, panicking slightly.", "\"You don't have to quit,\" Lisa explained. \"But you must set boundaries. First, talk to your boss about your workload. Second, take at least one week off to completely disconnect. No emails, no calls.\"", "Emma took a deep breath. \"Okay. And then what?\"", "\"Then, you need to remember who you are outside of work,\" Lisa said gently. \"What hobby did you love before you got so busy?\"", "Emma thought for a moment. \"I used to paint. I haven't touched a brush in two years.\"", "\"Perfect,\" Lisa smiled. \"Make that your priority. Recharging isn't lazy; it’s necessary.\"", "The next day, Emma had a honest conversation with her boss. He was surprised but agreed to redistribute some tasks and approved her vacation.", "For seven days, Emma turned off her work phone. She slept, went for long walks, and bought a new set of watercolors. On the fourth day, she painted a beautiful landscape. She felt a spark of joy she hadn't felt in a long time.", "When she returned to work, she felt like a different person. She was calm, focused, and ready to prioritize her health. She realized that burnout is a warning sign, and listening to your body is the only way to build a sustainable, happy life."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Emma feel empty and exhausted?", "What two main steps did Lisa suggest to recover from burnout?", "What hobby did Emma return to during her vacation?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Emma realized she was suffering from... (burnout) due to a heavy... (workload).", "hints": ["Her friend Lisa advised her to set clear... (boundaries).", "Emma talked to her boss and took a week off to... (disconnect).", "She decided to... (prioritize) her health and return to her old... (hobby).", "She started painting again and began to... (recharge).", "When she returned to work, she felt calm and focused.", "She learned that listening to your body is essential to avoid... (exhaustion)."], "vocab": [{"w": "burnout", "tr": "[ˈbɜːnaʊt]", "ru": "эмоциональное выгорание"}, {"w": "exhausted", "tr": "[ɪɡˈzɔːstɪd]", "ru": "истощенный, очень уставший"}, {"w": "to disconnect", "tr": "[ˌdɪskəˈnekt]", "ru": "отключаться (от работы, интернета)"}, {"w": "boundary", "tr": "[ˈbaʊndri]", "ru": "граница, личные границы"}, {"w": "to recharge", "tr": "[ˌriːˈtʃɑːdʒ]", "ru": "перезаряжаться, восстанавливать силы"}, {"w": "hobby", "tr": "[ˈhɒbi]", "ru": "хобби, увлечение"}, {"w": "workload", "tr": "[ˈwɜːkləʊd]", "ru": "объем работы"}, {"w": "to prioritize", "tr": "[praɪˈɒrɪtaɪz]", "ru": "расставлять приоритеты"}]}, {"num": 176, "ru": "Фриланс: как вежливо требовать оплату за просроченный счет", "en": "Freelancing: how to politely chase a late invoice", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["Alex checked his bank account and sighed. The invoice he had sent three weeks ago was still marked as \"unpaid\". The deadline had passed ten days ago.", "\"I hate chasing clients for money,\" he muttered to his colleague, Sarah, during a video call. \"It feels so awkward and aggressive.\"", "\"It doesn't have to be,\" Sarah said calmly. \"You provided a great service, and you deserve to be paid on time. The key is to be polite but firm. Have you sent a follow-up email yet?\"", "\"Not yet. I was waiting, hoping they would just remember.\"", "\"Waiting won't help,\" Sarah advised. \"Write a short, professional email. Assume it’s an honest mistake. Say something like: 'Hi, just following up on invoice #123, which was due last week. Please let me know if you need me to resend it.'\"", "Alex took a deep breath and opened his email client. He typed exactly what Sarah suggested, keeping the tone friendly and professional. He attached the invoice again just in case.", "*Subject: Friendly reminder: Invoice #123 for Web Design Services*", "He hit send and tried to forget about it.", "Two hours later, his phone buzzed. It was an email from the client’s accounting department.", "\"Dear Alex, we sincerely apologize for the oversight. The invoice was accidentally routed to the wrong folder. The payment has been processed today and should arrive in your account within 24 hours. Thank you for your patience.\"", "Alex let out a long breath of relief. \"They paid it,\" he told Sarah. \"And they apologized.\"", "\"See?\" Sarah smiled. \"Being a freelancer means you are a business owner. Chasing payment isn't rude; it’s a normal part of the job. Just keep it professional.\""], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why was Alex frustrated when he checked his bank account?", "What advice did Sarah give him about chasing payment?", "Why was the client's payment late, according to their email?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Alex noticed that his... (invoice) was... (overdue) by ten days.", "hints": ["He felt awkward about trying to... (chase) the client for money.", "Sarah advised him to send a... (politely) written follow-up email.", "Alex assumed it was an honest mistake and attached the... (invoice) again.", "The client replied quickly, apologizing for the... (oversight).", "They confirmed that the... (payment) had been processed.", "Alex learned that as a... (freelancer), following up on money is a normal part of the job."], "vocab": [{"w": "freelancer", "tr": "[ˈfriːlɑːnsə]", "ru": "фрилансер, внештатный сотрудник"}, {"w": "invoice", "tr": "[ˈɪnvɔɪs]", "ru": "счет на оплату"}, {"w": "overdue", "tr": "[ˌəʊvəˈdjuː]", "ru": "просроченный"}, {"w": "to chase", "tr": "[tʃeɪs]", "ru": "преследовать, настойчиво требовать (оплату)"}, {"w": "politely", "tr": "[pəˈlaɪtli]", "ru": "вежливо"}, {"w": "payment", "tr": "[ˈpeɪmənt]", "ru": "платеж, оплата"}, {"w": "to follow up", "tr": "[ˈfɒləʊ ʌp]", "ru": "напоминать о себе, уточнять статус"}, {"w": "deadline", "tr": "[ˈdedlaɪn]", "ru": "крайний срок"}]}, {"num": 177, "ru": "Наставничество: как обучать младшего коллегу", "en": "Mentoring: how to train a junior colleague", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["David, a senior developer, was assigned to be a mentor for a new trainee named Leo. On Leo’s third day, he accidentally deleted an important piece of code, causing a minor error in the system.", "Leo looked terrified. \"I’m so sorry, David. I’ll pack my things. I’m clearly not cut out for this.\"", "David smiled calmly and pulled up a chair. \"Take a breath, Leo. Everyone makes mistakes. The important thing is how we fix them.\"", "\"I just don't understand the system yet,\" Leo admitted, looking down.", "\"That’s exactly why I’m here,\" David said. \"My job is to guide you, not to judge you. Let’s look at the code together.\"", "For the next hour, David didn't just fix the problem himself. He asked Leo questions, helping him find the error step by step. When Leo finally fixed it, David gave him constructive feedback. \"Next time, always create a backup before making big changes. It’s a simple habit that saves a lot of stress.\"", "\"Thank you,\" Leo said, visibly relieved. \"I was afraid you would be angry.\"", "\"I’ve been in your shoes,\" David replied. \"My first week, I crashed the entire testing server. Patience is key. I will delegate small, manageable tasks to you, and we will celebrate every milestone.\"", "Over the next few months, David continued to encourage Leo. He answered questions, shared useful resources, and slowly increased Leo's responsibilities.", "By the end of the probation period, Leo was working independently and confidently.", "\"David, I just wanted to say thank you,\" Leo said on his last day as a trainee. \"Your patience made all the difference.\"", "David smiled. \"You did all the hard work, Leo. I just showed you the way. I’m proud to call you a colleague.\""], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1.
