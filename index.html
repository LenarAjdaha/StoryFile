 "ru": "сертификат"}, {"w": "to complete", "tr": "[kəmˈpliːt]", "ru": "завершать, проходить до конца"}]}, {"num": 137, "ru": "Синдром самозванца на новой должности", "en": "Dealing with imposter syndrome at a new job", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["Mark sat at his new desk, staring at the complex project brief. It was his second week as a senior manager, and he felt a familiar knot in his stomach.", "\"I have no idea what I'm doing,\" he whispered to himself. \"They made a mistake hiring me. I'm not qualified for this.\"", "His colleague, Sarah, walked by with a cup of coffee. \"You look like you're solving a murder mystery, Mark. Everything okay?\"", "Mark sighed. \"Honestly? I feel like a fraud. Everyone here is so smart, and I’m just waiting for someone to realize I don't belong here.\"", "Sarah pulled up a chair. \"Ah, imposter syndrome. I had it for six months when I started. Let me tell you a secret: they didn't hire you by mistake. They saw your achievements at your old company.\"", "\"But what if I can't handle this project?\" Mark asked, still doubting himself.", "\"Then you ask for help,\" Sarah said firmly. \"No one expects you to know everything on day fourteen. Have you checked the feedback from your last presentation?\"", "Mark nodded slowly. \"The director said it was excellent.\"", "\"Exactly! You are letting a negative mindset trick you. You earned this role. Just take it one task at a time.\"", "Mark took a deep breath. He realized Sarah was right. He opened his email, wrote down three small goals for the day, and asked Sarah a specific question about the project.", "By the end of the week, he had finished the first draft. It wasn't perfect, but it was solid. He learned that feeling like an imposter is normal, but letting it stop you is a choice. He was qualified, and he was finally starting to believe it."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Mark feel like a fraud at his new job?", "What secret did Sarah share about imposter syndrome?", "What small steps did Mark take to overcome his doubts?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Mark felt he wasn't... (qualified) for his new senior manager role.", "hints": ["He suffered from... (imposter syndrome) and thought he didn't belong.", "Sarah reminded him of his past... (achievements) and positive... (feedback).", "She told him that asking for help is a normal part of the job.", "Mark decided to change his... (mindset) and take things one task at a time.", "He finished the first draft of the project by the end of the... (week).", "He realized that feeling like a fraud is normal, but he truly... (earned) his role."], "vocab": [{"w": "imposter syndrome", "tr": "[ˈɪmpəstə ˈsɪndrəʊm]", "ru": "синдром самозванца"}, {"w": "to doubt", "tr": "[daʊt]", "ru": "сомневаться"}, {"w": "qualified", "tr": "[ˈkwɒlɪfaɪd]", "ru": "квалифицированный"}, {"w": "achievement", "tr": "[əˈtʃiːvmənt]", "ru": "достижение"}, {"w": "feedback", "tr": "[ˈfiːdbæk]", "ru": "обратная связь"}, {"w": "to belong", "tr": "[bɪˈlɒŋ]", "ru": "принадлежать, быть на своем месте"}, {"w": "praise", "tr": "[preɪz]", "ru": "похвала"}, {"w": "mindset", "tr": "[ˈmaɪndset]", "ru": "образ мыслей, настрой"}]}, {"num": 138, "ru": "Прощание с коллегой, который уезжает в другую страну", "en": "Saying goodbye to a colleague who is relocating", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~275 слов.", "story": ["The break room was decorated with balloons and a large banner that read: \"Good luck in London, Emma!\"", "Emma stood by the cake, smiling, though her eyes were a bit watery. After five years at the company, she was relocating to the UK for a new opportunity.", "\"We’re going to miss you terribly,\" said David, her team leader, handing her a wrapped gift. \"You’ve been the heart of this department.\"", "\"Thank you, David,\" Emma said, genuinely touched. \"I’ve appreciated every single day here. You all made my work feel like a second family.\"", "Her coworker, Lisa, stepped forward with a glass of juice. \"I can’t believe you’re actually leaving. Who am I going to complain about the coffee with?\"", "Emma laughed. \"You’ll manage. And we have WhatsApp. I expect weekly updates on office drama.\"", "\"Deal,\" Lisa smiled.", "David tapped his spoon against his glass. \"Alright everyone, a quick speech. Emma, your dedication and creativity have made a huge impact on this team. We are sad to see you go, but incredibly proud of your new adventure. Cheers to Emma!\"", "\"Cheers!\" the room echoed.", "Emma felt a bittersweet lump in her throat. She was excited about London, but leaving these people was harder than she expected.", "Later, as people were leaving, Lisa hugged her tightly. \"Don't be a stranger. We must keep in touch.\"", "\"I promise,\" Emma said. She looked around the familiar office one last time. It was a memorable day, filled with laughter, good wishes, and the promise of new beginnings. She was ready for London, but she would always cherish the time she spent here."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why was the team having a farewell party?", "How did Emma feel about leaving her colleagues?", "What did David say in his short speech?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, the team decorated the break room for Emma's... (farewell party).", "hints": ["Emma was... (relocating) to London after five years at the company.", "She told her colleagues how much she... (appreciated) working with them.", "Lisa joked about who she would complain to now, and they agreed to... (keep in touch).", "David gave a short... (speech), praising Emma's dedication.", "Emma felt... (bittersweet) about leaving but excited for her new adventure.", "She promised to stay connected and cherished the... (memorable) day."], "vocab": [{"w": "to relocate", "tr": "[ˌriːləʊˈkeɪt]", "ru": "переезжать (в другую страну/город)"}, {"w": "farewell party", "tr": "[ˈfeəwel ˈpɑːti]", "ru": "прощальная вечеринка"}, {"w": "to appreciate", "tr": "[əˈpriːʃieɪt]", "ru": "ценить"}, {"w": "to keep in touch", "tr": "[kiːp ɪn tʌtʃ]", "ru": "поддерживать связь"}, {"w": "memorable", "tr": "[ˈmemərəbl]", "ru": "незабываемый"}, {"w": "speech", "tr": "[spiːtʃ]", "ru": "речь"}, {"w": "bittersweet", "tr": "[ˈbɪtəswiːt]", "ru": "горько-сладкий (о чувствах)"}, {"w": "colleague", "tr": "[ˈkɒliːɡ]", "ru": "коллега"}]}, {"num": 139, "ru": "Организация корпоратива или тимбилдинга на природе", "en": "Organizing a company retreat or team-building event", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["\"Okay, everyone, listen up!\" shouted Chloe, the HR manager, clapping her hands. \"Welcome to our annual company retreat!\"", "The marketing team stood in a forest clearing, looking slightly awkward in their hiking boots and casual clothes.", "\"Today is all about team-building,\" Chloe continued. \"No laptops, no emails. Just us, nature, and a little friendly competition.\"", "Mark, a senior developer, whispered to his colleague, \"Please don't say we have to do trust falls.\"", "\"Worse,\" Chloe smiled, hearing him. \"You have to build a raft using only these ropes, wooden planks, and barrels. And then you have to sail it across the lake.\"", "A collective groan went through the group. \"We don't even know how to tie a proper knot,\" someone complained.", "\"That’s the point!\" Chloe said. \"You have to figure it out together. You have one hour.\"", "At first, it was chaotic. Everyone was giving different instructions, and the raft looked like a pile of junk. But then, Sarah, the quiet accountant, stepped up.", "\"Okay, let's stop arguing,\" she said calmly. \"Mark, you’re good with structure, hold the planks. David, tie the ropes here. I’ll check the balance.\"", "Slowly, the awkwardness faded. They started listening to each other. They laughed when a barrel rolled away, and they cheered when the final knot held strong.", "An hour later, their raft was floating. It wasn't pretty, but it stayed afloat. As they paddled across the lake, cheering and splashing water, they weren't just coworkers anymore. They were a team.", "That evening, around the campfire, Mark turned to Sarah. \"You were a natural leader today.\"", "Sarah smiled. \"We just needed to bond outside the office to see it.\" It was, without a doubt, a highly successful retreat."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What was the main goal of the company retreat?", "What specific activity did the team have to do?", "How did the team's dynamic change during the activity?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Chloe welcomed the team to the annual company... (retreat).", "hints": ["The goal was... (team-building) without laptops or emails.", "The team had to build a raft... (outdoors) using ropes and planks.", "At first, the situation was chaotic and... (awkward).", "Then, Sarah stepped up and helped them... (organize) the work.", "They started to listen to each other and managed to... (bond).", "They successfully sailed the raft across the lake.", "The event was highly... (successful) because they learned to work as a real team."], "vocab": [{"w": "retreat", "tr": "[rɪˈtriːt]", "ru": "выездное мероприятие, ретрит"}, {"w": "team-building", "tr": "[ˈtiːm ˌbɪldɪŋ]", "ru": "тимбилдинг, сплочение команды"}, {"w": "outdoors", "tr": "[ˈaʊtdɔːz]", "ru": "на свежем воздухе, на природе"}, {"w": "to organize", "tr": "[ˈɔːɡənaɪz]", "ru": "организовывать"}, {"w": "activity", "tr": "[ækˈtɪvəti]", "ru": "занятие, активность"}, {"w": "to bond", "tr": "[bɒnd]", "ru": "сближаться, налаживать связь"}, {"w": "awkward", "tr": "[ˈɔːkwəd]", "ru": "неловкий"}, {"w": "successful", "tr": "[səkˈsesfl]", "ru": "успешный"}]}, {"num": 140, "ru": "Запрос на повышение зарплаты", "en": "разговор с боссом) (Negotiating a salary raise with your boss", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["Tom sat outside his boss’s office, reviewing his notes one last time. He had been with the company for two years, and he was ready to negotiate a salary raise.", "\"Come in, Tom,\" Mr. Davis said, looking up from his computer. \"What’s on your mind?\"", "Tom took a deep breath and sat down. \"Thank you for your time, Mr. Davis. I’d like to discuss my compensation. Over the past year, my performance has been strong. I led the Q3 project to completion two weeks early, and our team’s sales increased by 15%.\"", "Mr. Davis nodded, looking at Tom’s file. \"That’s true. Your achievements have been impressive.\"", "\"Because of this increased responsibility and the current market rate for my role, I believe a 10% salary raise is fair and reflects the value I bring to the company,\" Tom said, keeping his voice steady and confident.", "Mr. Davis leaned back. \"Ten percent is a bit higher than our budget allows for this quarter, Tom. However, I agree that you deserve recognition.\"", "Tom was prepared for this. \"I understand budget constraints. Would you be open to a 7% raise now, with a performance review in six months to discuss the remaining 3%?\"", "Mr. Davis smiled. \"That’s a very reasonable compromise. Let’s do 7% effective next month, and we will definitely revisit this in six months.\"", "\"Thank you, Mr. Davis. I appreciate it,\" Tom said, shaking his hand.", "Walking back to his desk, Tom felt a massive wave of relief. He realized that asking for a raise isn’t about demanding money; it’s about calmly presenting your achievements, knowing your worth, and being willing to find a fair compromise."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What achievements did Tom mention to his boss?", "Why couldn't the boss agree to the full 10% raise immediately?", "What compromise did Tom suggest?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Tom prepared to... (negotiate) a salary raise with his boss.", "hints": ["He listed his recent... (achievements), like finishing a project early.", "He asked for a 10% raise based on his... (performance) and the... (market rate).", "The boss said 10% was over the current budget.", "Tom stayed... (confident) and suggested a... (compromise).", "They agreed on a 7% raise now and a review in six months.", "Tom felt relieved and realized it's important to know what you... (deserve)."], "vocab": [{"w": "salary raise", "tr": "[ˈsæləri reɪz]", "ru": "повышение зарплаты"}, {"w": "to negotiate", "tr": "[nɪˈɡəʊʃieɪt]", "ru": "вести переговоры"}, {"w": "performance", "tr": "[pəˈfɔːməns]", "ru": "эффективность, результаты работы"}, {"w": "achievement", "tr": "[əˈtʃiːvmənt]", "ru": "достижение"}, {"w": "market rate", "tr": "[ˈmɑːkɪt reɪt]", "ru": "рыночная ставка"}, {"w": "confident", "tr": "[ˈkɒnfɪdənt]", "ru": "уверенный"}, {"w": "to deserve", "tr": "[dɪˈzɜːv]", "ru": "заслуживать"}, {"w": "compromise", "tr": "[ˈkɒmprəmaɪz]", "ru": "компромисс"}]}, {"num": 141, "ru": "Баланс между основной работой и подработкой", "en": "фрилансом) (Balancing a full-time job with a side hustle", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["It was 11:30 PM on a Tuesday. Julia was staring at her laptop, her eyes burning. She had just finished an eight-hour shift at her marketing job, and now she was trying to complete a freelance graphic design order.", "\"I can't do this anymore,\" she groaned, rubbing her temples. She was completely exhausted.", "Her roommate, Alex, walked into the kitchen. \"You’re still working? Julia, you’re going to get burnout.\"", "\"I have to finish this side hustle project,\" Julia replied. \"The extra money is great, but I have no life. I’m missing dinners with friends, I’m not sleeping, and I’m making mistakes at my full-time job.\"", "Alex sat down opposite her. \"The money is rewarding, but it’s not worth your health. You need to balance this better. You can't just work whenever you feel guilty about not working.\"", "\"So, what do I do? Quit?\"", "\"No, just set boundaries,\" Alex advised. \"Create a strict schedule. For example, no freelance work on weekends, and stop working by 9 PM on weekdays. You need to prioritize your rest.\"", "Julia thought about it. It made sense. She was treating her free time like a second job, which was unsustainable.", "The next day, she spoke to her freelance client. \"I can deliver this project by Friday, but I will only be working on it during specific evening hours. I hope that works for you.\"", "The client agreed. Julia stuck to her new schedule. She worked from 7 PM to 9 PM, and then she closed her laptop.", "For the first time in months, she went to a Friday night dinner with friends. She felt rested, happy, and surprisingly, her freelance work improved because she was actually focused. She finally found her balance."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why was Julia feeling exhausted at 11:30 PM?", "What advice did Alex give her to avoid burnout?", "How did Julia's work and life improve after she set boundaries?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Julia was working late on her... (side hustle) after her... (full-time job).", "hints": ["She felt completely... (exhausted) and was making mistakes.", "Alex warned her about... (burnout) and told her to set boundaries.", "He advised her to create a strict... (schedule) and... (prioritize) her rest.", "Julia told her client she would only work during specific... (hours).", "She stopped working by 9 PM and finally went out with... (friends).", "She realized that resting made her freelance work more... (rewarding) and focused."], "vocab": [{"w": "side hustle", "tr": "[saɪd ˈhʌsl]", "ru": "подработка, побочный заработок"}, {"w": "full-time job", "tr": "[fʊl taɪm dʒɒb]", "ru": "работа на полную ставку"}, {"w": "to balance", "tr": "[ˈbæləns]", "ru": "балансировать, совмещать"}, {"w": "exhausted", "tr": "[ɪɡˈzɔːstɪd]", "ru": "истощенный, очень уставший"}, {"w": "schedule", "tr": "[ˈʃedjuːl]", "ru": "расписание, график"}, {"w": "to prioritize", "tr": "[praɪˈɒrɪtaɪz]", "ru": "расставлять приоритеты"}, {"w": "burnout", "tr": "[ˈbɜːnaʊt]", "ru": "выгорание"}, {"w": "rewarding", "tr": "[rɪˈwɔːdɪŋ]", "ru": "приносящий удовлетворение"}]}, {"num": 142, "ru": "Опыт изучения нового языка во взрослом возрасте", "en": "The experience of learning a new language as an adult", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~275 слов.", "story": ["David sat in the Spanish class, feeling his face turn red. The teacher had just asked him a simple question, and he had completely frozen.", "\"I... uh... me gusta... the... bread?\" he stammered.", "The class giggled, and David wanted to disappear. \"This is so embarrassing,\" he thought. \"I’m 40 years old. My brain isn't built for this. Kids learn languages so easily, but I sound ridiculous.\"", "After class, the teacher, Señora Garcia, asked him to stay for a moment.", "\"David, you look frustrated,\" she said kindly.", "\"I am,\" he admitted. \"I’ve been studying for six months, and I still can't form a basic sentence. My accent is terrible, and I’ll never be fluent.\"", "Señora Garcia smiled warmly. \"David, being an adult language learner is different, but it’s not worse. Adults have life experience and discipline. Yes, you will make mistakes. That is how you practice and improve.\"", "\"But it feels so slow,\" David sighed.", "\"Progress is not a straight line,\" she explained. \"It’s about consistency. Fifteen minutes every day is better than three hours once a week. And your accent? It shows you have lived a life. It’s charming, not terrible.\"", "David took a deep breath. Her words helped to encourage him.", "That evening, instead of giving up, he put on a Spanish podcast while cooking dinner. He repeated the words out loud, not caring if he sounded funny.", "A few months later, he ordered his coffee in Spanish at a local cafe. The barista smiled and replied in Spanish. It was a small victory, but David felt incredibly proud. He realized that fluency takes time, but consistency and a positive attitude make it possible."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did David feel embarrassed in Spanish class?", "What advantage do adult learners have, according to the teacher?", "What small victory did David experience a few months later?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, David struggled to answer a question in his... (language) class.", "hints": ["He felt... (embarrassing) and thought he was too old to learn.", "The teacher told him that adults have discipline and should focus on... (consistency).", "She explained that making mistakes is how you... (practice).", "David decided not to give up and listened to a... (podcast) at home.", "He stopped worrying about his... (accent).", "Months later, he successfully ordered coffee in Spanish, which showed his... (progress).", "He learned that the teacher's support helped to... (encourage) him."], "vocab": [{"w": "language learner", "tr": "[ˈlæŋɡwɪdʒ ˈlɜːnə]", "ru": "изучающий язык"}, {"w": "accent", "tr": "[ˈæksent]", "ru": "акцент"}, {"w": "to practice", "tr": "[ˈpræktɪs]", "ru": "практиковаться"}, {"w": "embarrassing", "tr": "[ɪmˈbærəsɪŋ]", "ru": "смущающий, неловкий"}, {"w": "fluent", "tr": "[ˈfluːənt]", "ru": "беглый (о языке)"}, {"w": "progress", "tr": "[ˈprəʊɡres]", "ru": "прогресс"}, {"w": "consistency", "tr": "[kənˈsɪstənsi]", "ru": "постоянство, последовательность"}, {"w": "to encourage", "tr": "[ɪnˈkʌrɪdʒ]", "ru": "ободрять, поощрять"}]}, {"num": 143, "ru": "Преодоление страха публичных выступлений на местном мероприятии", "en": "Overcoming the fear of speaking at a local community event", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["Lisa stood backstage at the local library, her hands shaking. She had agreed to give a short talk about her experience starting a community garden, but now she was terrified.", "\"I can't do this,\" she whispered to her friend, Mark. \"My mind is blank. I’m going to stumble over every word.\"", "Mark handed her a bottle of water. \"You’ve prepared for this for two weeks. You know this topic better than anyone in that room. Just breathe.\"", "\"But what if the audience thinks I’m boring?\"", "\"Then they’ll be bored for five minutes, and then you’ll be done,\" Mark joked gently. \"But they won’t be. They are here because they care about the garden, just like you.\"", "The organizer called her name. Lisa walked onto the small stage. The lights were bright, and about thirty people were looking at her.", "\"Hello,\" she began, her voice a little shaky. \"My name is Lisa, and I want to share how our small garden grew.\"", "She looked down at her notes, then looked up and made eye contact with a friendly woman in the front row. She started talking about the first seeds they planted.", "Halfway through, she lost her train of thought. She paused, took a deep breath, and smiled. \"Sorry, I got a bit nervous. Let me start that sentence again.\"", "To her surprise, the audience smiled back warmly. No one judged her. She finished her talk, and when she said \"Thank you,\" the room erupted in loud applause.", "Walking off the stage, Mark gave her a high-five. \"See? You were great.\"", "Lisa let out a long breath. She was still nervous, but she felt incredibly proud. She had faced her fear of public speaking and survived."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why was Lisa terrified before her talk at the library?", "How did Mark help calm her down?", "How did the audience react when Lisa stumbled over her words?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Lisa was backstage at a... (community event), feeling very... (nervous).", "hints": ["She was afraid she would... (stumble) during her public speaking.", "Mark reminded her that she had... (prepared) well and knew her topic.", "Lisa went on stage and made eye contact with the... (audience).", "When she lost her train of thought, she paused and... (smiled).", "The audience was supportive, and she finished her talk.", "At the end, she received loud... (applause).", "She left the stage feeling... (confident) and proud of herself."], "vocab": [{"w": "public speaking", "tr": "[ˈpʌblɪk ˈspiːkɪŋ]", "ru": "публичные выступления"}, {"w": "community event", "tr": "[kəˈmjuːnəti ɪˈvent]", "ru": "местное мероприятие"}, {"w": "nervous", "tr": "[ˈnɜːvəs]", "ru": "нервничающий"}, {"w": "to prepare", "tr": "[prɪˈpeə]", "ru": "готовиться"}, {"w": "audience", "tr": "[ˈɔːdiəns]", "ru": "аудитория, слушатели"}, {"w": "to stumble", "tr": "[ˈstʌmbl]", "ru": "запинаться, оговариваться"}, {"w": "confident", "tr": "[ˈkɒnfɪdənt]", "ru": "уверенный"}, {"w": "applause", "tr": "[əˈplɔːz]", "ru": "аплодисменты"}]}, {"num": 144, "ru": "Цифровой детокс на выходные: жизнь без телефона", "en": "A weekend digital detox: life without a phone", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["\"Okay, it’s Friday at 6 PM,\" Sam said, placing his smartphone in a drawer and locking it. \"No phone, no laptop, no TV until Monday morning.\"", "His wife, Emma, looked at him skeptically. \"A full weekend digital detox? Are you sure you can do it? You check your email every ten minutes.\"", "\"I need to unplug,\" Sam insisted. \"I feel anxious all the time. I want to see if I can survive without constant notifications.\"", "The first few hours were surprisingly hard. Sam kept reaching for his pocket out of habit. He felt a phantom vibration. Without his phone, the house felt too quiet.", "\"Let’s go for a walk,\" Emma suggested, noticing his restlessness. \"Let’s enjoy nature.\"", "They walked to the nearby park. At first, Sam kept thinking about work emails and the news he was missing. But as they walked further, he started noticing things: the sound of birds, the color of the autumn leaves, and the fresh air.", "\"Look at that dog,\" Emma pointed out.", "Sam smiled. \"It’s a golden retriever. I haven't really looked at a dog in years without taking a photo of it first.\"", "They spent the afternoon reading physical books, cooking a meal together, and just talking. There were no interruptions, no screens, and no distractions.", "By Sunday evening, Sam felt completely different. He wasn't anxious anymore. His mind felt clear, and he felt truly recharged.", "\"I can't believe how much time we waste on those screens,\" Sam admitted as he unlocked the drawer on Monday morning. \"I’m not giving up my phone completely, but I think I’ll make this a regular habit. Maybe one day a week.\"", "Emma smiled. \"I’ll hold you to that. Welcome back to the real world.\""], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Sam decide to do a digital detox for the weekend?", "What was the hardest part of the first few hours?", "How did Sam feel by Sunday evening?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Sam decided to... (unplug) from all devices for the weekend.", "hints": ["His wife Emma was skeptical because he checked his phone constantly for... (notifications).", "At first, Sam felt... (anxious) and reached for his pocket out of... (habit).", "Emma suggested they go for a walk in... (nature).", "Sam started noticing the world around him and felt more... (present).", "They spent the weekend reading, cooking, and talking without screens.", "By Sunday, Sam felt completely... (recharged) and clear-minded.", "He decided to make a screen-free day a regular... (habit)."], "vocab": [{"w": "digital detox", "tr": "[ˈdɪdʒɪtl ˈdiːtɒks]", "ru": "цифровой детокс"}, {"w": "to unplug", "tr": "[ˌʌnˈplʌɡ]", "ru": "отключаться (от гаджетов)"}, {"w": "notification", "tr": "[ˌnəʊtɪfɪˈkeɪʃn]", "ru": "уведомление"}, {"w": "anxious", "tr": "[ˈæŋkʃəs]", "ru": "тревожный"}, {"w": "nature", "tr": "[ˈneɪtʃə]", "ru": "природа"}, {"w": "to recharge", "tr": "[ˌriːˈtʃɑːdʒ]", "ru": "перезаряжаться, восстанавливать силы"}, {"w": "present", "tr": "[ˈpreznt]", "ru": "присутствующий (мысленно), внимательный"}, {"w": "habit", "tr": "[ˈhæbɪt]", "ru": "привычка"}]}, {"num": 145, "ru": "Принятие сложного решения: переезд, смена работы или расставание", "en": "Making a tough life decision: moving, changing jobs, or breaking up", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["Alex sat at the kitchen table, staring at the email on his laptop. It was a job offer from a tech company in Berlin. The salary was great, and the role was exactly what he wanted. But it meant leaving his current life, his friends, and his comfortable routine.", "\"You’ve been staring at that screen for an hour,\" his girlfriend, Mia, said, placing a cup of tea next to him. \"Still weighing up the pros and cons?\"", "\"Yes,\" Alex sighed. \"It’s a huge opportunity, but it’s also a massive risk. What if I hate it? What if I regret leaving?\"", "Mia sat down opposite him. \"It’s normal to feel uncertain. Big decisions are always scary. But let’s look at the facts. Are you happy in your current job?\"", "\"Not really. I feel stuck,\" Alex admitted.", "\"Then staying is also a risk,\" Mia pointed out gently. \"The risk of never knowing what could have been. I will support you whatever you choose. If you go, we can make long-distance work. If you stay, we’ll find a new hobby together.\"", "Her words gave him clarity. He realized he was more afraid of regret than of failure.", "\"Okay,\" Alex said, taking a deep breath. \"I’m going to do it. I’m going to take this leap of faith.\"", "Mia smiled and hugged him. \"I’m proud of you. Let’s print that email and start planning.\"", "A month later, Alex was packing his boxes. He was nervous, but also excited. He knew that making a tough life decision wasn't about having zero fear. It was about choosing the path that aligns with your goals, even when the future is uncertain."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What difficult decision was Alex facing?", "What argument did Mia use to help Alex see the situation differently?", "How did Alex feel a month later when he was packing his boxes?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Alex received a great job... (opportunity) in Berlin.", "hints": ["He spent an hour... (weighing up) the pros and cons.", "He was afraid of the... (risk) and felt... (uncertain) about the future.", "Mia told him that staying in a job he dislikes is also a risk.", "She promised to... (support) him whatever he chose.", "Alex decided to take a... (leap of faith) and accept the offer.", "A month later, he was packing, feeling nervous but excited.", "He learned that making a tough... (decision) means choosing your goals over fear."], "vocab": [{"w": "decision", "tr": "[dɪˈsɪʒn]", "ru": "решение"}, {"w": "to weigh up", "tr": "[weɪ ʌp]", "ru": "взвешивать (за и против)"}, {"w": "opportunity", "tr": "[ˌɒpəˈtjuːnəti]", "ru": "возможность, шанс"}, {"w": "risk", "tr": "[rɪsk]", "ru": "риск"}, {"w": "to support", "tr": "[səˈpɔːt]", "ru": "поддерживать"}, {"w": "uncertain", "tr": "[ʌnˈsɜːtn]", "ru": "неопределенный, неуверенный"}, {"w": "to regret", "tr": "[rɪˈɡret]", "ru": "сожалеть"}, {"w": "leap of faith", "tr": "[liːp əv feɪθ]", "ru": "прыжок веры (решительный шаг)"}]}, {"num": 146, "ru": "Ведение дневника благодарности и его влияние на настроение", "en": "Keeping a gratitude journal and its effect on mood", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~275 слов.", "story": ["Sarah felt constantly stressed. Between work deadlines and household chores, she always focused on what was going wrong.", "One evening, her friend Lisa noticed her complaining about the rain. \"Sarah, you need to change your mindset,\" Lisa said. \"Have you ever tried keeping a gratitude journal?\"", "\"A what?\" Sarah asked, skeptical.", "\"A gratitude journal,\" Lisa explained. \"Every night, before bed, you write down three small, positive things that happened during the day. It trains your brain to look for the good.\"", "Sarah thought it sounded silly, but she was desperate. She bought a small notebook and a nice pen.", "That night, she sat on her bed and tried to reflect. \"Okay, three things,\" she muttered. \"One: the coffee this morning was really good. Two: I finished the report on time. Three: my cat slept on my lap.\"", "She wrote them down. It felt a bit strange, but also calming.", "She continued this habit every night for a week. At first, it was hard to find things. But soon, she started noticing small joys during the day: a beautiful sunset, a funny text from a colleague, a delicious lunch.", "A week later, Lisa called her. \"How’s the journal?\"", "\"It’s actually working,\" Sarah admitted, smiling. \"My mood is much better. I still have stress, but I appreciate the good moments more. I don't feel so overwhelmed.\"", "\"That’s the power of gratitude,\" Lisa said. \"It doesn't change your life, but it changes how you see it.\"", "Sarah looked at her journal on the nightstand. It was a simple habit, but it had made a huge difference in her daily life."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Sarah feel constantly stressed at the beginning of the story?", "What advice did Lisa give to Sarah?", "How did Sarah’s mood change after a week of using the journal?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Sarah was always focused on negative things and felt... (stressed).", "hints": ["Lisa suggested she start keeping a... (gratitude) journal.", "Every night, Sarah had to write down three... (positive) things.", "At first, she thought it was silly, but she decided to try the... (habit).", "She wrote about small things, like good coffee and her... (cat).", "After a week, she started to... (appreciate) small joys during the day.", "Her overall... (mood) improved, and she felt less overwhelmed.", "She learned that this simple practice can change your... (mindset)."], "vocab": [{"w": "gratitude", "tr": "[ˈɡrætɪtjuːd]", "ru": "благодарность"}, {"w": "journal", "tr": "[ˈdʒɜːnl]", "ru": "дневник, журнал"}, {"w": "to reflect", "tr": "[rɪˈflekt]", "ru": "размышлять, анализировать"}, {"w": "mood", "tr": "[muːd]", "ru": "настроение"}, {"w": "positive", "tr": "[ˈpɒzətɪv]", "ru": "позитивный"}, {"w": "habit", "tr": "[ˈhæbɪt]", "ru": "привычка"}, {"w": "to appreciate", "tr": "[əˈpriːʃieɪt]", "ru": "ценить, быть благодарным"}, {"w": "mindset", "tr": "[ˈmaɪndset]", "ru": "образ мыслей, настрой"}]}, {"num": 147, "ru": "Управление цифровыми подписками и скрытыми платежами", "en": "Managing digital subscriptions and hidden fees", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["Mark sat at the kitchen table, frowning at his laptop screen. \"Emma, come look at this. There’s a charge for $14.99 on our credit card from 'StreamMax'.\"", "His wife walked over, holding a cup of tea. \"StreamMax? We don’t use that.\"", "\"We did,\" Mark sighed. \"Remember last month? I signed up for a free trial period to watch that one documentary. I completely forgot to cancel it.\"", "\"Ah, the classic trap,\" Emma said, shaking her head. \"They make it easy to sign up, but hard to opt out. Did you check the rest of the bank statement?\"", "Mark scrolled down. \"Yes, and look here. There’s another recurring payment for $9.99 for a fitness app. I haven't opened that app in three months!\"", "\"That’s twenty-five dollars a month for nothing,\" Emma noted. \"That’s three hundred dollars a year. We need to fix our budget.\"", "\"Agreed,\" Mark said. He opened a new tab. \"Okay, I’m logging into StreamMax now. Where is the cancel button? It’s always hidden.\"", "\"Check the account settings, then billing,\" Emma advised, looking over his shoulder. \"Ah, there it is. Tiny grey text at the bottom.\"", "Mark clicked it, confirmed the cancellation, and received an email confirmation. \"Done. Now for the fitness app.\"", "After cancelling both, Mark turned to Emma. \"I’m setting up a calendar reminder for the day before any future free trial ends. And maybe we should review our bank statements together once a month.\"", "\"Great idea,\" Emma smiled. \"It’s surprising how quickly those hidden fees add up. Let’s put that thirty dollars toward our weekend dinner instead.\""], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why was Mark surprised when he looked at his credit card?", "What two subscriptions did Mark find on the bank statement?", "What solution did Mark and Emma come up with to avoid this in the future?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Mark noticed an unexpected charge for a... (subscription) called StreamMax.", "hints": ["He realized he forgot to cancel it after the free... (trial period).", "Emma advised him to check the rest of the... (bank statement).", "They found another... (recurring payment) for a fitness app they didn't use.", "Mark struggled to find the button to... (cancel) the services because it was hidden.", "After opting out, they realized these... (hidden fees) cost them a lot of money a year.", "Mark decided to set a calendar reminder to protect their... (budget).", "They agreed to review their finances together once a... (month)."], "vocab": [{"w": "subscription", "tr": "[səbˈskrɪpʃn]", "ru": "подписка"}, {"w": "hidden fee", "tr": "[ˈhɪdn fiː]", "ru": "скрытая комиссия, скрытый платеж"}, {"w": "to cancel", "tr": "[ˈkænsəl]", "ru": "отменять"}, {"w": "recurring payment", "tr": "[rɪˈkɜːrɪŋ ˈpeɪmənt]", "ru": "регулярный платеж"}, {"w": "trial period", "tr": "[ˈtraɪəl ˈpɪəriəd]", "ru": "пробный период"}, {"w": "to check the bank statement", "tr": "[tʃek ðə bæŋk ˈsteɪtmənt]", "ru": "проверять выписку из банка"}, {"w": "to opt out", "tr": "[ɒpt aʊt]", "ru": "отказаться (от услуги)"}, {"w": "budget", "tr": "[ˈbʌdʒɪt]", "ru": "бюджет"}]}, {"num": 148, "ru": "Столкновение с интернет-троллями или кибербуллингом", "en": "Dealing with internet trolls or cyberbullying", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["Sarah stared at her phone, her hands shaking slightly. She had just posted a photo of her homemade vegetable garden on her hobby blog.", "\"Look at this,\" she said, her voice tight. \"Someone wrote: 'This is the ugliest garden I’ve ever seen. You should give up.'\"", "Her friend Tom, who was sitting on the sofa, put his book down. \"Let me see. Wow, that’s incredibly offensive. Don't take it personally. It’s just a troll.\"", "\"But it hurts,\" Sarah admitted, feeling a lump in her throat. \"I worked so hard on those plants. Why are people so cruel in the comment section?\"", "\"Because it’s easy to be mean when you’re anonymous,\" Tom explained gently. \"This is a mild form of cyberbullying. The worst thing you can do is argue with them. That’s exactly what they want.\"", "\"So, what should I do?\" Sarah asked.", "\"Three simple steps,\" Tom said, counting on his fingers. \"First, ignore the comment. Don't reply. Second, block the user so they can’t message you again. And third, report the comment to the platform for violating community guidelines.\"", "Sarah took a deep breath and followed his advice. She tapped 'block', then 'report'. Within seconds, the nasty comment disappeared from her screen.", "\"Better?\" Tom asked.", "\"Much better,\" Sarah smiled, feeling a weight lift off her shoulders. \"I guess my self-esteem shouldn't depend on the opinion of a stranger on the internet.\"", "\"Exactly,\" Tom agreed. \"Your garden is beautiful. Don't let one negative person ruin your hobby. Focus on the nice comments from people who actually care.\""], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why was Sarah upset when she looked at her phone?", "What three steps did Tom suggest to deal with the negative comment?", "How did Sarah feel after blocking and reporting the user?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Sarah received an... (offensive) comment on her garden blog.", "hints": ["She felt hurt, but Tom told her not to take it personally because it was just a... (troll).", "Tom explained that arguing is the worst reaction to... (cyberbullying).", "He advised her to simply... (ignore) the comment and not reply.", "Then, she used the platform tools to... (block) the user.", "She also decided to... (report) the comment for violating the rules.", "After doing this, the comment disappeared, and her... (self-esteem) improved.", "She realized she should focus on positive people, not the negative... (comment section)."], "vocab": [{"w": "troll", "tr": "[trəʊl]", "ru": "интернет-тролль"}, {"w": "cyberbullying", "tr": "[ˌsaɪbəˈbʊliɪŋ]", "ru": "кибербуллинг, травля в интернете"}, {"w": "to block", "tr": "[blɒk]", "ru": "блокировать"}, {"w": "offensive", "tr": "[əˈfensɪv]", "ru": "оскорбительный"}, {"w": "to ignore", "tr": "[ɪɡˈnɔː]", "ru": "игнорировать"}, {"w": "to report", "tr": "[rɪˈpɔːt]", "ru": "жаловаться, сообщать о нарушении"}, {"w": "comment section", "tr": "[ˈkɒment ˈsekʃn]", "ru": "раздел комментариев"}, {"w": "self-esteem", "tr": "[ˌself ɪˈstiːm]", "ru": "самооценка"}]}, {"num": 149, "ru": "Эргономика домашнего рабочего места: как не испортить спину", "en": "Home office ergonomics: how to protect your back", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["Alex rubbed his lower back and winced. \"I can barely stand up,\" he complained, walking into the kitchen.", "His roommate, Dr. Lee, a physiotherapist, looked up from his coffee. \"Let me guess. You’ve been working from the sofa again?\"", "\"It’s just for a few hours,\" Alex defended himself. \"But my back and my wrist are killing me.\"", "Dr. Lee shook his head. \"Alex, ergonomics matter. Working from a soft sofa ruins your posture. Your spine isn't supported, and you strain your neck looking down at the laptop.\"", "\"I don't have a proper office,\" Alex sighed.", "\"You don't need a fancy office, just a smart setup,\" Dr. Lee said. He followed Alex to the dining table, where the laptop was set up. \"Look at this. The screen is too low, so you’re hunching over. The top of the monitor should be at eye level.\"", "\"How do I fix that?\"", "\"Put the laptop on a stack of books,\" Dr. Lee suggested. \"And use an external keyboard and mouse. That will keep your wrist straight and prevent strain.\"", "Alex adjusted the setup. \"What about the chair?\"", "\"Make sure it’s adjustable,\" Dr. Lee advised. \"Your feet should be flat on the floor, and your lower back should be supported. If the chair is hard, use a small cushion.\"", "Alex sat down in the newly arranged space. \"Wow, this actually feels much more comfortable.\"", "\"Remember the 20-20-20 rule, too,\" Dr. Lee added. \"Every 20 minutes, look at something 20 feet away for 20 seconds. And stand up every hour. Your body is designed to move, not to sit still all day.\""], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why was Alex in pain after working from home?", "What simple trick did Dr. Lee suggest to fix the laptop screen height?", "What is the 20-20-20 rule that Dr. Lee mentioned?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Alex complained about pain in his... (lower back) and wrist.", "hints": ["Dr. Lee explained that working from the sofa ruins your... (posture).", "He pointed out that the laptop screen was too low and should be at... (eye level).", "Alex fixed this by putting the laptop on a stack of... (books).", "Dr. Lee also advised using an... (adjustable) chair with good support.", "This setup helps to prevent... (strain) on the neck and wrist.", "Dr. Lee also recommended the 20-20-20 rule to rest the... (eyes).", "Alex realized that good... (ergonomics) makes working from home much more... (comfortable)."], "vocab": [{"w": "ergonomics", "tr": "[ˌɜːɡəˈnɒmɪks]", "ru": "эргономика"}, {"w": "posture", "tr": "[ˈpɒstʃə]", "ru": "осанка"}, {"w": "lower back", "tr": "[ˈləʊə bæk]", "ru": "поясница, нижняя часть спины"}, {"w": "adjustable", "tr": "[əˈdʒʌstəbl]", "ru": "регулируемый"}, {"w": "wrist", "tr": "[rɪst]", "ru": "запястье"}, {"w": "to strain", "tr": "[streɪn]", "ru": "напрягать, перенапрягать"}, {"w": "eye level", "tr": "[aɪ ˈlevl]", "ru": "уровень глаз"}, {"w": "comfortable", "tr": "[ˈkʌmftəbl]", "ru": "удобный"}]}, {"num": 150, "ru": "Использование искусственного интеллекта в быту", "en": "простые сценарии) (Using AI tools in daily life", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["Lisa stood in front of her open fridge, feeling stressed. \"I have three guests coming for dinner in an hour, and I have no idea what to cook. I only have chicken, tomatoes, and some old cheese.\"", "Her teenage nephew, Ben, walked into the kitchen, holding his phone. \"Don’t panic, Aunt Lisa. Let’s use artificial intelligence.\"", "\"AI? For cooking?\" Lisa asked, skeptical. \"I thought it was just for writing essays or making weird pictures.\"", "\"It can assist with everyday tasks too,\" Ben smiled. He opened a chatbot app. \"Watch this. I’ll type a prompt: 'Give me a quick, easy dinner recipe using chicken, tomatoes, and cheese, ready in 30 minutes.'\"", "He hit enter. Within two seconds, the AI generated a step-by-step recipe for a cheesy chicken tomato bake.", "\"Wow, that was fast,\" Lisa admitted, reading the screen. \"But is it reliable? What if it tells me to boil the cheese?\"", "Ben laughed. \"It’s usually pretty good, but you should always double-check the cooking times and temperatures. Let’s read it together.\"", "They reviewed the recipe. It made perfect sense. Lisa had all the ingredients, including some garlic and pasta she had forgotten about.", "\"Okay, let’s try it,\" Lisa said, feeling much more confident. She started chopping the tomatoes while Ben set a timer on his phone.", "Forty minutes later, the guests arrived to the smell of delicious baked chicken. Everyone loved the meal.", "\"You have to teach me how to use that app,\" Lisa’s friend said.", "Lisa smiled at Ben. \"It’s incredibly time-saving. I guess AI isn’t just for tech geniuses after all.\""], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why was Lisa stressed in the kitchen?", "How did Ben use AI to help his aunt?", "Why did Ben say it’s important to double-check the AI’s answer?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Lisa didn't know what to cook for her... (guests) with limited ingredients.", "hints": ["Ben suggested using... (artificial intelligence) to solve the problem.", "He typed a specific... (prompt) into a chatbot app.", "The AI managed to... (generate) a quick and easy... (recipe) in seconds.", "Lisa was skeptical at first, but Ben reminded her to... (double-check) the details.", "They reviewed the steps, and the recipe turned out to be... (reliable).", "The dinner was a success, and Lisa found the tool very... (time-saving).", "She realized that AI can... (assist) with simple everyday tasks."], "vocab": [{"w": "artificial intelligence", "tr": "[ˌɑːtɪˈfɪʃl ɪnˈtelɪdʒəns]", "ru": "искусственный интеллект"}, {"w": "to assist", "tr": "[əˈsɪst]", "ru": "помогать, содействовать"}, {"w": "recipe", "tr": "[ˈresəpi]", "ru": "рецепт"}, {"w": "to generate", "tr": "[ˈdʒenəreɪt]", "ru": "генерировать, создавать"}, {"w": "prompt", "tr": "[prɒmpt]", "ru": "запрос, подсказка (для ИИ)"}, {"w": "time-saving", "tr": "[ˈtaɪm ˌseɪvɪŋ]", "ru": "экономящий время"}, {"w": "reliable", "tr": "[rɪˈlaɪəbl]", "ru": "надежный"}, {"w": "to double-check", "tr": "[ˌdʌbl ˈtʃek]", "ru": "перепроверять"}]}, {"num": 151, "ru": "Цифровое наследие: что происходит с аккаунтами после нас", "en": "Digital legacy: what happens to our accounts", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["Grandpa Arthur was sitting at his desk, surrounded by piles of paper. His granddaughter, Chloe, was helping him organize his important documents for the future.", "\"Arthur, you have a lot of bank statements here,\" Chloe said. \"But what about your online accounts? Your email, your bank app, your photo storage?\"", "Arthur frowned. \"I have passwords for all of them. They are written in this little black notebook.\"", "Chloe gently took the notebook. \"Grandpa, this isn't safe. If something happens to you, the family won't know these passwords. We need to think about your digital legacy.\"", "\"Digital what?\" Arthur asked, looking confused.", "\"Your digital legacy,\" Chloe explained. \"It’s all the sensitive information and accounts you leave behind. We should set up a password manager. It’s a secure app that stores all your passwords in one place.\"", "\"And who can open it?\"", "\"You can grant access to a trusted beneficiary, like me or your son,\" Chloe said. \"That way, if you ever can't manage your accounts, we can handle your bills and keep your photos safe.\"", "Arthur thought about it for a moment. \"I suppose that makes sense. I don't want to cause a mess for you all.\"", "\"Exactly,\" Chloe smiled. \"Let’s download a reliable password manager today. I’ll help you transfer all the passwords from the notebook. It will give everyone peace of mind.\"", "An hour later, they had set up the app. Arthur memorized the one master password, and Chloe was added as a trusted contact.", "\"Thank you, Chloe,\" Arthur said, closing the old black notebook. \"I feel much better knowing everything is organized and safe.\""], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Chloe say the black notebook with passwords wasn't safe?", "What is a \"digital legacy\" according to Chloe?", "How did they solve the problem of managing passwords for the future?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Chloe was helping her grandpa... (organize) his important documents.", "hints": ["She noticed his passwords were written in a... (notebook), which wasn't safe.", "She explained the concept of... (digital legacy) and online accounts.", "Chloe suggested using a secure... (password manager) to store all the information.", "They agreed to... (grant access) to a trusted family member as a... (beneficiary).", "This ensures that... (sensitive) information and photos remain safe.", "They set up the app together, and Arthur felt a sense of... (peace of mind).", "He realized that organizing his digital... (account) details is just as important as paper documents."], "vocab": [{"w": "digital legacy", "tr": "[ˈdɪdʒɪtl ˈleɡəsi]", "ru": "цифровое наследие"}, {"w": "password manager", "tr": "[ˈpɑːswɜːd ˈmænɪdʒə]", "ru": "менеджер паролей"}, {"w": "beneficiary", "tr": "[ˌbenɪˈfɪʃəri]", "ru": "выгодоприобретатель, наследник"}, {"w": "to grant access", "tr": "[ɡrɑːnt ˈækses]", "ru": "предоставлять доступ"}, {"w": "sensitive", "tr": "[ˈsensətɪv]", "ru": "конфиденциальный, чувствительный"}, {"w": "to organize", "tr": "[ˈɔːɡənaɪz]", "ru": "организовывать, приводить в порядок"}, {"w": "account", "tr": "[əˈkaʊnt]", "ru": "аккаунт, учетная запись"}, {"w": "peace of mind", "tr": "[piːs əv maɪnd]", "ru": "душевное спокойствие"}]}, {"num": 152, "ru": "Знакомства через приложения и первое свидание", "en": "Navigating dating apps and first dates", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["Emma stared at her phone. She had just matched with a guy named David on a dating app. His profile said he loved hiking and bad sci-fi movies.", "\"Should I message him?\" she asked her friend, Lily.", "\"Definitely,\" Lily said. \"Just keep it light. Ask him about his favorite movie.\"", "Emma typed: \"Hi David! I see you like sci-fi. What’s your absolute worst favorite movie?\"", "David replied instantly: \"Definitely 'Sharknado'. What about you?\"", "They chatted for three days. The conversation was easy and funny. Finally, David asked her out.", "\"Coffee this Saturday?\" he suggested. \"No pressure, just a casual meet-up.\"", "Emma agreed. A coffee shop was a perfect venue. It was public, cheap, and if there was no chemistry, she could leave after twenty minutes without feeling rude.", "Saturday arrived. Emma walked into the cafe and saw David. He looked exactly like his photos, maybe a bit more nervous.", "\"Hi, Emma?\" he asked, standing up.", "\"Hi, David. Nice to finally meet you in person,\" she smiled.", "The first five minutes were slightly awkward. They both talked over each other once and laughed about it. But then they started discussing their favorite books, and the conversation flowed naturally.", "Two hours later, they were still talking.", "\"I should probably get going,\" Emma said, checking her watch. \"But I had a really great time.\"", "\"Me too,\" David said. \"Can I text you later?\"", "\"Please do,\" Emma replied.", "Walking home, Emma felt happy. She was glad she didn't ghost him after the first hour, and she was excited to see where this connection would go."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What did Emma and David have in common according to his profile?", "Why did Emma choose a coffee shop as the venue for their first date?", "How did the conversation go during the first few minutes?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Emma got a... (match) with David on a... (dating app).", "hints": ["They started to... (chat) about bad sci-fi movies.", "David invited her for coffee, which is a low-pressure... (venue).", "When they met, the beginning was a bit... (awkward).", "However, they quickly found common ground and felt a real... (chemistry).", "They talked for two hours and agreed to... (text) later.", "Emma was happy she didn't decide to... (ghost) him.", "She realized that keeping the first date casual is a great... (idea)."], "vocab": [{"w": "dating app", "tr": "[ˈdeɪtɪŋ æp]", "ru": "приложение для знакомств"}, {"w": "profile", "tr": "[ˈprəʊfaɪl]", "ru": "профиль, анкета"}, {"w": "to match", "tr": "[mætʃ]", "ru": "совпасть (в приложении)"}, {"w": "awkward", "tr": "[ˈɔːkwəd]", "ru": "неловкий"}, {"w": "to ghost", "tr": "[ɡəʊst]", "ru": "резко прекращать общение, исчезать"}, {"w": "chemistry", "tr": "[ˈkemɪstri]", "ru": "химия, взаимная симпатия"}, {"w": "venue", "tr": "[ˈvenjuː]", "ru": "место встречи"}, {"w": "to chat", "tr": "[tʃæt]", "ru": "болтать, переписываться"}]}, {"num": 153, "ru": "Как извиняться искренне и заглаживать вину", "en": "How to apologize sincerely and make amends", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["Mark stared at his calendar in horror. \"Oh no. Today is Sam’s birthday dinner. And I completely forgot.\"", "He had promised to take his best friend to his favorite Italian restaurant, but Mark had been so busy with work that it slipped his mind. He called Sam immediately.", "\"Hey, Mark,\" Sam answered, sounding disappointed. \"I’m at the restaurant. Are you running late?\"", "Mark took a deep breath. He knew he shouldn't make excuses. \"Sam, I am so sorry. I completely forgot. It’s entirely my fault, and I feel terrible for letting you down.\"", "There was a silence on the other end. \"I was really looking forward to this, Mark.\"", "\"I know, and you have every right to be upset,\" Mark said sincerely. \"I take full responsibility. Can I come over right now? I’ll order your favorite pizza, and we can celebrate properly. My treat, and I promise to set a reminder for next year.\"", "Sam sighed. \"Okay. Come over. But you’re buying the extra-large pepperoni.\"", "\"Deal,\" Mark said, feeling a wave of relief.", "He rushed to the pizza place, ordered the food, and bought a small, thoughtful gift—a book Sam had mentioned wanting to read months ago.", "When Mark arrived, Sam was still a bit quiet, but he appreciated the effort. \"Thanks for the pizza, man. And the book. That was really thoughtful.\"", "\"I’m truly sorry, Sam,\" Mark said again, looking him in the eye. \"I value our friendship, and I’ll do better.\"", "Sam smiled slightly. \"I forgive you. Just don't make a habit of it.\"", "Mark nodded. He knew that a sincere apology isn't just about saying \"sorry.\" It’s about taking responsibility, making amends, and taking real steps to rebuild trust."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why was Sam disappointed when Mark called him?", "How did Mark react instead of making excuses?", "What did Mark do to make amends for forgetting the dinner?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Mark realized he had forgotten his friend Sam’s... (birthday) dinner.", "hints": ["He called Sam and decided to... (apologize) immediately.", "Instead of being... (defensive), Mark decided to... (take responsibility) for his mistake.", "He offered to come over with Sam's favorite... (pizza).", "Mark also brought a thoughtful... (gift) that Sam had wanted.", "Sam was still a bit upset but decided to... (forgive) him.", "Mark promised to do better to... (rebuild trust) in their friendship.", "He learned that a... (sincere) apology requires real action to... (make amends)."], "vocab": [{"w": "to apologize", "tr": "[əˈpɒlədʒaɪz]", "ru": "извиняться"}, {"w": "to make amends", "tr": "[meɪk əˈmendz]", "ru": "заглаживать вину"}, {"w": "sincere", "tr": "[sɪnˈsɪə]", "ru": "искренний"}, {"w": "to take responsibility", "tr": "[teɪk rɪˌspɒnsəˈbɪləti]", "ru": "брать на себя ответственность"}, {"w": "defensive", "tr": "[dɪˈfensɪv]", "ru": "занимающий оборонительную позицию"}, {"w": "to forgive", "tr": "[fəˈɡɪv]", "ru": "прощать"}, {"w": "misunderstanding", "tr": "[ˌmɪsʌndəˈstændɪŋ]", "ru": "недоразумение"}, {"w": "to rebuild trust", "tr": "[ˌriːˈbɪld trʌst]", "ru": "восстанавливать доверие"}]}, {"num": 154, "ru": "Установка границ с токсичными членами семьи", "en": "Setting boundaries with toxic family members", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["Sarah sat in her living room, dreading the weekly phone call with her mother. Every time they spoke, her mother would criticize her career choices.", "\"Hi, Mom,\" Sarah answered, bracing herself.", "\"Hello, dear. Are you still working at that little marketing agency? I just don’t understand why you don’t look for a real job with a stable salary,\" her mother said immediately.", "Sarah felt the familiar knot in her stomach. For years, she had just nodded and changed the subject, but today she decided to assert her boundaries.", "\"Mom, I love you, but I’m not going to discuss my career if you’re going to criticize it,\" Sarah said calmly but firmly. \"My job makes me happy, and I’m good at it.\"", "There was a shocked silence. Then, her mother tried a classic guilt trip. \"I’m just worried about you! After everything I’ve done for you, this is how you speak to me? I guess I’m just a terrible mother.\"", "Sarah took a deep breath. \"You are not a terrible mother, and I appreciate your concern. But I need you to respect my choices. If you continue to criticize me, I will have to limit our contact.\"", "\"Are you threatening to stop calling me?\" her mother asked, her voice rising.", "\"No, I’m protecting my well-being,\" Sarah replied, keeping her voice respectful but steady. \"I want us to have a good relationship, but that requires mutual respect.\"", "Her mother sighed heavily. \"Fine. We won’t talk about your job.\"", "\"Thank you, Mom,\" Sarah said softly.", "The rest of the call was short but peaceful. Sarah hung up the phone and let out a long breath. It wasn't easy, but she finally felt in control. Setting boundaries was hard, but it was the only way to protect her peace and maintain a healthy relationship."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Sarah dread the weekly phone call with her mother?", "How did Sarah’s mother react when Sarah set a boundary?", "What did Sarah say she would do if the criticism continued?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Sarah’s mother would constantly... (criticize) her career choices.", "hints": ["Sarah decided it was time to... (assert) her personal... (boundary).", "She told her mother she wouldn't discuss her job if there was... (criticism).", "Her mother tried to use a... (guilt trip) to make her feel bad.", "Sarah stayed calm and... (respectful), but she stood her ground.", "She warned that she might have to... (limit contact) to protect her... (well-being).", "Her mother finally agreed to stop talking about the... (job).", "Sarah realized that setting boundaries is necessary for a... (healthy) relationship."], "vocab": [{"w": "boundary", "tr": "[ˈbaʊndri]", "ru": "граница, личные границы"}, {"w": "toxic", "tr": "[ˈtɒksɪk]", "ru": "токсичный, отравляющий"}, {"w": "to criticize", "tr": "[ˈkrɪtɪsaɪz]", "ru": "критиковать"}, {"w": "to assert", "tr": "[əˈsɜːt]", "ru": "утверждать, отстаивать"}, {"w": "guilt trip", "tr": "[ɡɪlt trɪp]", "ru": "манипуляция чувством вины"}, {"w": "to limit contact", "tr": "[ˈlɪmɪt ˈkɒntækt]", "ru": "ограничивать общение"}, {"w": "respectful", "tr": "[rɪˈspektfl]", "ru": "уважительный"}, {"w": "well-being", "tr": "[ˈwel biːɪŋ]", "ru": "благополучие, самочувствие"}]}, {"num": 155, "ru": "Нетворкинг для интровертов: как общаться, когда не хочется", "en": "Networking for introverts: how to socialize when you don't want to", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["Leo stood outside the conference hall, feeling his heart race. As an introvert, large networking events were always overwhelming for him.", "\"Just go in, hand out some business cards, and come home,\" he muttered to himself.", "But he knew that wasn't how it worked. He took a deep breath and walked inside. The room was loud, and people were already forming tight circles.", "Instead of forcing himself into a big group, Leo remembered his plan. He had prepared three simple questions to ask people. He walked to the quieter corner near the coffee station and found a woman looking at her phone.", "\"Hi, I’m Leo,\" he said, offering a hand. \"I’m trying to avoid the loud crowd. Are you enjoying the event?\"", "The woman smiled, looking relieved. \"Hi, I’m Clara. Honestly, I’m an introvert too. I was just thinking about leaving.\"", "\"Me too,\" Leo laughed. \"But before we go, what brings you to this conference?\"", "They started talking. Without the pressure of a big group, the conversation quickly moved past boring small talk. They discovered they both worked in graphic design and shared a love for vintage typography. They talked for twenty minutes, exchanging ideas and contacts.", "After a while, Leo felt his social battery draining. It was time to use his exit strategy.", "\"Clara, it was really great talking to you,\" Leo said warmly. \"I’m going to grab a coffee and head out, but let’s connect on LinkedIn.\"", "\"I’d love that,\" Clara smiled. \"Have a good evening, Leo.\"", "Leo walked out of the hall, feeling surprisingly accomplished. He realized that networking for an introvert isn't about meeting everyone. It’s about preparing well, finding one meaningful connection, and knowing when it’s time to go home and recharge."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Leo feel nervous outside the conference hall?", "How did Leo start a conversation with Clara?", "What was Leo’s \"exit strategy\" at the end of the conversation?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Leo felt that large... (networking events) were overwhelming for him as an... (introvert).", "hints": ["Instead of joining a big group, he went to a quiet... (corner).", "He had... (prepared) a few simple questions to start a conversation.", "He met Clara, who was also an introvert, and they avoided boring... (small talk).", "They had a... (meaningful) conversation about their shared interests in design.", "When Leo felt tired, he used his... (exit strategy) to leave politely.", "He suggested they connect on LinkedIn before he went home to... (recharge).", "Leo learned that successful networking is about quality, not... (quantity)."], "vocab": [{"w": "introvert", "tr": "[ˈɪntrəvɜːt]", "ru": "интроверт"}, {"w": "networking event", "tr": "[ˈnetwɜːkɪŋ ɪˈvent]", "ru": "нетворкинг-мероприятие"}, {"w": "overwhelming", "tr": "[ˌəʊvəˈwelmɪŋ]", "ru": "подавляющий, ошеломляющий"}, {"w": "to recharge", "tr": "[ˌriːˈtʃɑːdʒ]", "ru": "перезаряжаться, восстанавливать силы"}, {"w": "small talk", "tr": "[smɔːl tɔːk]", "ru": "светская беседа"}, {"w": "meaningful", "tr": "[ˈmiːnɪŋfl]", "ru": "значимый, содержательный"}, {"w": "to prepare", "tr": "[prɪˈpeə]", "ru": "готовиться"}, {"w": "exit strategy", "tr": "[ˈeɡzɪt ˈstrætədʒi]", "ru": "стратегия выхода (вежливый способ уйти)"}]}, {"num": 156, "ru": "Переживание неудачи или провала проекта", "en": "Dealing with failure or a failed project", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["Anna sat at her kitchen table, staring at her laptop. Her face was pale.", "\"Zero,\" she whispered. \"Zero customers on opening day.\"", "She had spent six months preparing to launch her small bakery pop-up in the city park. She had baked fifty loaves of artisan bread and a dozen cakes. But it rained all day, and nobody showed up.", "Her business partner, Ben, walked in with two mugs of hot tea. \"Hey. I brought tea.\"", "\"Thanks,\" Anna said, her voice shaking. \"It’s a complete failure, Ben. I wasted all that time and money. Maybe I’m just not cut out for business.\"", "Ben sat down next to her. \"Anna, this isn't a failure. It’s a setback. There is a big difference.\"", "\"Doesn't feel like it,\" she muttered.", "\"Let’s reflect on what happened,\" Ben said gently. \"The bread was amazing. The prices were fair. The only variable we couldn't control was the weather. And the location was a bit hidden.\"", "Anna took a sip of tea. \"So, what do we do?\"", "\"We learn from it,\" Ben said. \"We got some feedback from the few people who did stop by. They loved the taste but wished we had a website for pre-orders.\"", "Anna looked up. \"So, instead of a physical pop-up, we could do online pre-orders and deliver locally?\"", "\"Exactly,\" Ben smiled. \"We pivot. We don't give up. Resilient entrepreneurs don't quit after one rainy day. They adapt.\"", "Anna felt a small spark of hope. She closed her laptop and opened a new document. \"Okay. Let’s build a simple website. We’ll try again next month.\"", "\"Exactly,\" Ben said, clinking his mug against hers. \"We move on, and we do it better.\""], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why was Anna upset when she looked at her laptop?", "Why did Ben say it was a \"setback\" and not a \"failure\"?", "What new idea did Anna and Ben come up with after analyzing the situation?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Anna was sad because her bakery... (launch) had zero customers due to rain.", "hints": ["She felt like it was a complete... (failure).", "Ben reminded her that it was just a... (setback), not the end.", "They decided to... (reflect) on what went wrong and what went right.", "They gathered... (feedback) and realized people loved the bread but wanted online ordering.", "They decided to pivot and create a website for... (pre-orders).", "Anna learned to be... (resilient) and adapt to new circumstances.", "Instead of giving up, they decided to... (move on) and try a new strategy."], "vocab": [{"w": "failure", "tr": "[ˈfeɪljə]", "ru": "неудача, провал"}, {"w": "to launch", "tr": "[lɔːntʃ]", "ru": "запускать"}, {"w": "setback", "tr": "[ˈsetbæk]", "ru": "неудача, препятствие"}, {"w": "to reflect", "tr": "[rɪˈflekt]", "ru": "размышлять, анализировать"}, {"w": "to learn from", "tr": "[lɜːn frɒm]", "ru": "извлекать урок из"}, {"w": "resilient", "tr": "[rɪˈzɪliənt]", "ru": "стойкий, устойчивый"}, {"w": "feedback", "tr": "[ˈfiːdbæk]", "ru": "обратная связь"}, {"w": "to move on", "tr": "[muːv ɒn]", "ru": "двигаться дальше"}]}, {"num": 157, "ru": "Как достойно уволиться и сохранить хорошие отношения", "en": "How to resign gracefully and keep good relations", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["Mark knocked on his manager’s door, holding a printed letter. His heart was beating fast. He had accepted a new job offer, and now he had to tell his current boss, Sarah.", "\"Come in, Mark. What’s up?\" Sarah asked, looking up from her screen.", "\"Hi, Sarah. Do you have a few minutes? I need to discuss something important.\"", "\"Of course, sit down.\"", "Mark took a deep breath. \"Sarah, I want to let you know that I’ve decided to resign. My last day will be in two weeks, according to my notice period.\"", "Sarah looked surprised but nodded calmly. \"I see. That’s a big decision. Are you leaving the industry?\"", "\"No, I got an offer for a senior role at another company. It’s a great opportunity for my career growth.\"", "Sarah smiled warmly. \"I’m sad to lose you, Mark, but I’m happy for you. You’ve been a fantastic part of this team.\"", "\"Thank you, Sarah. I really appreciate everything I’ve learned here,\" Mark said sincerely. \"I don’t want to burn any bridges. During my notice period, I will prepare a detailed handover document and train the junior team to ensure a smooth transition.\"", "\"That’s very professional of you,\" Sarah replied. \"I will gladly write you a strong reference letter. Just let me know what you need.\"", "\"Thank you so much. I’ll send you a draft of the handover plan by tomorrow.\"", "Mark walked out of the office feeling a huge weight lift off his shoulders. He realized that resigning doesn’t have to be awkward or negative. By being honest, grateful, and helpful during the transition, you can leave a job with your reputation intact and your professional relationships strong."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Mark go to Sarah’s office?", "What did Mark offer to do during his notice period?", "How did Sarah react to Mark’s resignation?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Mark went to his manager to tell her he wanted to... (resign).", "hints": ["He explained that his last day would be in two weeks, which is the standard... (notice period).", "He got a new job offer for career... (growth).", "Mark promised to prepare a detailed... (handover) document to help the team.", "He wanted to ensure a smooth... (transition) and not... (burn bridges).", "Sarah was sad but supportive, and she offered to write him a... (reference letter).", "Mark realized that being... (professional) and grateful makes leaving a job much easier."], "vocab": [{"w": "to resign", "tr": "[rɪˈzaɪn]", "ru": "увольняться по собственному желанию"}, {"w": "notice period", "tr": "[ˈnəʊtɪs ˈpɪəriəd]", "ru": "срок отработки (предупреждение об увольнении)"}, {"w": "handover", "tr": "[ˈhændəʊvə]", "ru": "передача дел"}, {"w": "to appreciate", "tr": "[əˈpriːʃieɪt]", "ru": "ценить, быть благодарным"}, {"w": "reference letter", "tr": "[ˈrefrəns ˈletə]", "ru": "рекомендательное письмо"}, {"w": "to burn bridges", "tr": "[bɜːn brɪdʒɪz]", "ru": "сжигать мосты (портить отношения)"}, {"w": "professional", "tr": "[prəˈfeʃənl]", "ru": "профессиональный"}, {"w": "transition", "tr": "[trænˈzɪʃn]", "ru": "переход, трансформация"}]}, {"num": 158, "ru": "Взаимодействие с государственными органами", "en": "получение визы, справки) (Dealing with government offices: visas, documents", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["Elena stood in a long queue at the local government office. She needed a specific document for her visa application, and her appointment was in ten minutes. The room was crowded and noisy.", "\"Next, please!\" a voice called from behind the glass window.", "Elena stepped forward and handed over her passport. \"Hello, I need to get a residency certificate.\"", "The clerk, a tired-looking woman named Olga, started typing. \"Do you have the application form filled out?\"", "Elena handed her a piece of paper. \"Yes, I filled it out at home.\"", "Olga looked at it and sighed. \"This is the old form. The requirements changed last month. You need to fill out the new version, and you must attach a copy of your rental contract.\"", "Elena felt a wave of panic. \"But I didn’t know! The website wasn’t clear.\"", "\"I understand, it can be frustrating,\" Olga said, her tone softening slightly. \"But I cannot issue the document without the correct form. Do you have a rental contract with you?\"", "\"Yes, it’s in my bag,\" Elena said, quickly finding the paper.", "\"Good. Here is the new form and a pen. There is a desk in the corner. Fill it out, and I will process it for you.\"", "Elena rushed to the desk, carefully filling out every box. Ten minutes later, she returned to the window. Olga checked the form, stamped it, and handed Elena the official document.", "\"Here you go. Good luck with your visa,\" Olga said with a small smile.", "\"Thank you so much for your help,\" Elena replied, feeling incredibly relieved.", "Walking out of the building, Elena made a mental note: next time, she would call the office and double-check all the requirements before leaving the house."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why was Elena at the government office?", "What was the problem with Elena’s application form?", "How did the clerk help Elena solve the problem?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Elena waited in a long... (queue) at the... (government office).", "hints": ["She needed a specific... (document) for her visa.", "The clerk told her that the... (requirement) had changed and she had the ol
