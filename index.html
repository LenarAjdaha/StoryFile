David agreed. \"I can definitely support that. It will help me disconnect from work, too. What else?\"", "\"I think we need to appreciate each other more,\" Emma continued. \"We get so busy that we forget to say 'thank you' for small things, like making coffee or doing the laundry.\"", "\"You’re right,\" David admitted. \"I take you for granted sometimes. How about we start a new habit? Every evening at dinner, we share one thing we appreciated about each other that day.\"", "Emma’s face lit up. \"I love that! It’s so simple, but it will make a huge difference.\"", "They tried the new rules for a month. The \"no screens\" rule was hard at first, but soon they found themselves talking about their dreams, fears, and funny stories from work. The daily appreciation habit made them feel seen and valued.", "One evening, David said, \"You know, Emma, I feel closer to you now than I have in years. Setting boundaries didn’t push us apart; it actually brought us closer.\"", "Emma smiled. \"That’s because healthy relationships aren’t about being together 24/7. They are about respecting each other’s space, being honest about your needs, and actively choosing to support each other every single day.\"", "David nodded, feeling grateful. They realized that love is not just a feeling; it’s a series of daily actions that build trust and connection."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What boundary did Emma want to set regarding their evenings?", "What new daily habit did David suggest to show appreciation?", "How did David feel about their relationship after a month of trying the new rules?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Emma wanted to talk about building a healthy relationship based on... (trust).", "hints": ["She suggested setting... (boundaries), like having no screens from 7 to 9 PM.", "David agreed and said he would... (support) this idea.", "They also decided to... (appreciate) each other by sharing one good thing every evening.", "This habit helped them spend more... (quality time) together.", "After a month, David felt much... (closer) to Emma.", "They learned that healthy relationships require respect, honesty, and daily... (actions)."], "vocab": [{"w": "trust", "tr": "[trʌst]", "ru": "доверие"}, {"w": "boundaries", "tr": "[ˈbaʊndəriz]", "ru": "личные границы"}, {"w": "to support", "tr": "[səˈpɔːt]", "ru": "поддерживать"}, {"w": "quality time", "tr": "[ˈkwɒləti taɪm]", "ru": "качественное время (вместе)"}, {"w": "honest", "tr": "[ˈɒnɪst]", "ru": "честный, искренний"}, {"w": "to appreciate", "tr": "[əˈpriːʃieɪt]", "ru": "ценить, быть благодарным"}]}, {"num": 93, "ru": "Самомотивация и преодоление прокрастинации", "en": "Self-Motivation and Overcoming Procrastination", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~440 слов.", "story": ["Tom stared at the blank document on his screen. He had to write a 20-page report by Friday, but he had spent the last two hours watching funny videos on his phone.", "\"I have zero motivation,\" he groaned, putting his head on the desk.", "His roommate, Alex, walked into the room holding two cups of coffee. \"Still procrastinating on that report?\"", "\"Yes,\" Tom admitted. \"It’s too big. I don’t even know where to start, so I just distract myself with social media.\"", "Alex handed him a coffee. \"That’s normal. When a goal is too big, your brain panics and avoids it. You need to break it down into tiny, manageable steps.\"", "\"Like what?\" Tom asked, sitting up.", "\"Instead of 'write a 20-page report', your first goal is 'write the title and three bullet points for the introduction'. That takes five minutes. Can you do that?\"", "Tom sighed. \"Yeah, I guess I can do that.\"", "\"Great. Do it now. And when you finish those five minutes, give yourself a small reward. Maybe a piece of chocolate or a 10-minute walk.\"", "Tom opened the document. He wrote the title and three bullet points. It took him exactly four minutes. He felt a tiny spark of achievement. He ate a piece of chocolate and felt slightly better.", "\"See?\" Alex said. \"Now, your next step is to write one paragraph for the first bullet point. Just one. Set a timer for 25 minutes and don’t look at your phone.\"", "Tom set the timer. He focused only on that one paragraph. Without the pressure of the whole 20 pages, he found it easy to start. When the timer rang, he had written half a page.", "Over the next two days, Tom used this method. He broke the report into small sections, worked in 25-minute blocks, and rewarded himself after each one. He kept his phone in another room to avoid distractions.", "By Thursday afternoon, the report was finished. Tom leaned back in his chair, feeling incredibly proud.", "\"Alex, it worked!\" Tom called out. \"I actually overcame my procrastination.\"", "Alex smiled from the kitchen. \"I told you. Motivation doesn’t come before action. Action creates motivation. You just had to trick your brain into starting.\"", "Tom realized that overcoming procrastination wasn’t about having superhuman willpower. It was about breaking big tasks into small steps, eliminating distractions, and celebrating small wins along the way."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why was Tom procrastinating on his report?", "What advice did Alex give Tom to start working?", "How did Tom reward himself for completing small steps?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Tom had no... (motivation) to write a 20-page report.", "hints": ["He kept trying to... (distract) himself with his phone.", "Alex advised him to... (break down) the big task into tiny steps.", "Tom’s first... (goal) was to write just the title and three bullet points.", "After finishing a small step, he gave himself a... (reward), like chocolate.", "He used a timer to focus and avoid... (distractions).", "By Thursday, Tom finished the report and learned how to... (overcome) procrastination.", "He realized that action creates... (motivation)."], "vocab": [{"w": "motivation", "tr": "[ˌməʊtɪˈveɪʃn]", "ru": "мотивация"}, {"w": "to overcome", "tr": "[ˌəʊvəˈkʌm]", "ru": "преодолевать"}, {"w": "goal", "tr": "[ɡəʊl]", "ru": "цель"}, {"w": "reward", "tr": "[rɪˈwɔːd]", "ru": "награда, вознаграждение"}, {"w": "to distract", "tr": "[dɪˈstrækt]", "ru": "отвлекать"}, {"w": "to break down", "tr": "[breɪk daʊn]", "ru": "разбивать на части"}]}, {"num": 94, "ru": "Минимализм и осознанное потребление", "en": "Minimalism and Conscious Consumption", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~430 слов.", "story": ["Sarah stood in the middle of her bedroom, surrounded by piles of clothes, old books, and gadgets she hadn’t used in years. She felt overwhelmed.", "\"I can’t find anything in this mess,\" she muttered to herself.", "Her friend, Lisa, came over to help. \"Wow, Sarah. You have a lot of stuff. Have you ever thought about trying minimalism?\"", "\"Minimalism?\" Sarah asked, holding up a sweater with the tags still on. \"You mean living with almost nothing? I could never do that.\"", "\"It’s not about having nothing,\" Lisa explained. \"It’s about keeping only the things that bring you joy or are truly useful. It’s about being mindful of what you buy and own. Let’s declutter this room together.\"", "Sarah hesitated, but then nodded. \"Okay. Where do we start?\"", "\"Let’s make three boxes,\" Lisa said. \"Keep, Donate, and Throw away. Be honest. When was the last time you wore this sweater?\"", "\"Never,\" Sarah admitted. \"I bought it on sale, but it doesn’t fit my style.\"", "\"Then it’s unnecessary,\" Lisa said. \"Put it in the Donate box. Someone else will value it.\"", "For the next three hours, they sorted through everything. Sarah was surprised by how many unnecessary items she had accumulated. Old magazines, broken chargers, clothes that didn’t fit.", "By the end of the day, they had filled four large bags for donation and two bags for recycling. The room looked completely different. It was spacious, clean, and calm.", "Sarah sat on her bed and took a deep breath. \"I feel so much lighter. I didn’t realize how much my stuff was stressing me out.\"", "\"That’s the magic of decluttering,\" Lisa smiled. \"When you remove the unnecessary, you make space for what truly matters. And next time you want to buy something, ask yourself: 'Do I really need this, or will it just become more clutter?'\"", "\"I will definitely think twice before shopping now,\" Sarah said. \"I want to be a mindful consumer.\"", "A week later, Sarah went to the charity shop to drop off the bags. She felt a warm sense of satisfaction knowing her old things would help others.", "She returned to her clean, peaceful apartment and realized that minimalism wasn’t about deprivation. It was about freedom. By choosing to value experiences and relationships over material things, she had created a life that felt truly rich."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Sarah feel overwhelmed in her bedroom?", "What three boxes did Lisa suggest using for decluttering?", "How did Sarah feel after cleaning her room?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Sarah was surrounded by mess and couldn't find anything.", "hints": ["Lisa suggested she try... (minimalism) to feel better.", "They decided to... (declutter) the room using three boxes: Keep, Donate, and Throw away.", "Sarah realized she had many... (unnecessary) items, like clothes with tags.", "They filled several bags to... (donate) to charity.", "After cleaning, Sarah felt much... (lighter) and less stressed.", "She decided to become a... (mindful) consumer and think twice before buying new things.", "She learned that minimalism is about freedom and choosing to... (value) experiences over things."], "vocab": [{"w": "minimalism", "tr": "[ˈmɪnɪməlɪzəm]", "ru": "минимализм"}, {"w": "to declutter", "tr": "[diːˈklʌtə]", "ru": "избавляться от хлама, наводить порядок"}, {"w": "unnecessary", "tr": "[ʌnˈnesəsəri]", "ru": "ненужный"}, {"w": "to donate", "tr": "[dəʊˈneɪt]", "ru": "жертвовать, отдавать на благотворительность"}, {"w": "mindful", "tr": "[ˈmaɪndfʊl]", "ru": "осознанный, внимательный"}, {"w": "to value", "tr": "[ˈvæljuː]", "ru": "ценить"}]}, {"num": 95, "ru": "Планирование года и постановка долгосрочных целей", "en": "Yearly Planning and Setting Long-Term Goals", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~440 слов.", "story": ["It was December 30th, and John and his wife, Maria, were sitting at the kitchen table with cups of hot tea.", "\"Next year is going to be different,\" John said, opening a fresh notebook. \"Last year, we just let time pass. This year, I want to set some real goals.\"", "Maria smiled. \"I love that idea. But how do we make sure we actually achieve them? We always make resolutions and forget them by February.\"", "\"We need a system,\" John replied. \"First, let’s define our main long-term goal. Where do we want to be in three years?\"", "Maria thought for a moment. \"I think we want to buy a small house in the countryside and have enough savings for a big trip.\"", "\"Perfect,\" John said, writing it down. \"Now, we need to make this goal measurable. Instead of 'save money', let’s say 'save $10,000 by December next year'. That’s about $850 a month.\"", "\"That sounds doable,\" Maria agreed. \"But how do we remember to do it?\"", "\"We create a vision board,\" John suggested. \"We can print pictures of the house we want, the places we want to visit, and put them on the fridge. Every time we see it, we remember why we are saving.\"", "\"Great idea,\" Maria said. \"And we should track our progress. Maybe we can have a monthly 'money date' to review our budget and celebrate when we hit a milestone.\"", "\"Exactly,\" John smiled. \"And it’s not just about money. What is one personal goal for you?\"", "\"I want to run a 10K race,\" Maria said. \"So my measurable goal is to run three times a week and finish the race in October.\"", "\"Awesome. I will support you,\" John said. \"And my goal is to read 24 books this year. That’s two books a month.\"", "They spent the next hour cutting out pictures, writing down their measurable goals, and sticking them onto a large poster board. It looked colorful and inspiring.", "\"Look at this,\" Maria said, stepping back to admire their work. \"It makes the future feel so real and exciting.\"", "\"It does,\" John agreed. \"We aren’t just wishing for things anymore. We have a plan, we know how to track our progress, and we will celebrate every milestone together.\"", "They clinked their tea mugs. They realized that successful planning wasn’t about making a strict, boring list. It was about creating a shared vision, breaking it down into measurable steps, and supporting each other every day."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What was John and Maria’s main long-term goal for the next three years?", "How did they make their financial goal measurable?", "What personal goals did Maria and John set for themselves?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, John and Maria decided to set real goals for the new year.", "hints": ["They defined their main... (long-term goal): buying a house and saving for a trip.", "They made it... (measurable) by deciding to save $850 a month.", "To stay motivated, they created a... (vision board) with pictures.", "They agreed to... (track) their progress with a monthly \"money date\".", "They also set personal goals, like running a 10K race and reading... (24 books).", "They realized that planning is about creating a shared vision and celebrating every... (milestone)."], "vocab": [{"w": "long-term goal", "tr": "[lɒŋ tɜːm ɡəʊl]", "ru": "долгосрочная цель"}, {"w": "to achieve", "tr": "[əˈtʃiːv]", "ru": "достигать"}, {"w": "vision board", "tr": "[ˈvɪʒn bɔːd]", "ru": "доска визуализации"}, {"w": "measurable", "tr": "[ˈmeʒərəbl]", "ru": "измеримый"}, {"w": "to track", "tr": "[træk]", "ru": "отслеживать"}, {"w": "milestone", "tr": "[ˈmaɪlstəʊn]", "ru": "важный этап, веха"}]}, {"num": 96, "ru": "Рефлексия и подведение итогов", "en": "Reflection and Reviewing Results", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~430 слов.", "story": ["It was the last Sunday of the year. Emma sat at her desk with a cup of coffee and a thick journal. It was time for her annual reflection.", "\"Okay, 2023, let’s see what we’ve got,\" she said to herself, opening the notebook.", "She decided to review the year in three parts: successes, failures, and lessons learned.", "First, she wrote down her successes. \"I got promoted at work. I ran my first half-marathon. I saved enough money for a new laptop.\" She smiled as she wrote. It felt good to acknowledge her achievements.", "Next came the hard part: evaluating the failures. \"I didn’t learn Spanish like I planned. I argued with my sister in the summer. I spent too much time on social media.\"", "She felt a pang of guilt, but she reminded herself that reflection is not about self-criticism. It’s about understanding what happened.", "\"Why didn’t I learn Spanish?\" she asked herself. \"Because I tried to study for an hour every day, and I always got too tired after work. That was unrealistic.\"", "She wrote down the lesson learned: \"Next year, I will study for just 15 minutes a day. Small, consistent steps are better than big, impossible plans.\"", "She did the same for the other failures. The argument with her sister taught her to communicate better. The social media habit taught her to set strict time limits.", "Her brother, Tom, walked into the room. \"Doing your yearly review?\" he asked, sitting on the edge of the bed.", "\"Yes,\" Emma said. \"It’s actually really helpful. I used to just feel bad about what I didn’t do. But now I see how much I’ve grown, and I know exactly what to improve next year.\"", "\"That’s the point of reflection,\" Tom said. \"You can’t improve if you don’t evaluate where you are. What’s your main focus for next year?\"", "\"Health and learning,\" Emma replied. \"But this time, my goals will be realistic and kind to myself.\"", "Tom smiled. \"That sounds like a perfect plan.\"", "Emma closed her journal, feeling a deep sense of peace. She realized that reviewing the past wasn’t about living in it. It was about gathering wisdom, celebrating success, and using every lesson learned to build a better, more intentional future."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What three parts did Emma use to review her year?", "Why did Emma fail to learn Spanish, according to her reflection?", "What lesson did Emma learn from her social media habit?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Emma sat down with her journal for her annual... (reflection).", "hints": ["She decided to... (review) the year by looking at successes, failures, and lessons learned.", "She wrote down her... (success), like getting a promotion.", "When evaluating failures, she realized her Spanish goal was... (unrealistic).", "The... (lesson learned) was to study for just 15 minutes a day.", "Her brother Tom agreed that you must... (evaluate) your current state to... (improve).", "Emma realized that reflection is about gathering wisdom and using every... (lesson learned) to build a better future."], "vocab": [{"w": "reflection", "tr": "[rɪˈflekʃn]", "ru": "рефлексия, размышление"}, {"w": "to review", "tr": "[rɪˈvjuː]", "ru": "пересматривать, подводить итоги"}, {"w": "lesson learned", "tr": "[ˈlesn lɜːnd]", "ru": "извлеченный урок"}, {"w": "to improve", "tr": "[ɪmˈpruːv]", "ru": "улучшать"}, {"w": "success", "tr": "[səkˈses]", "ru": "успех"}, {"w": "to evaluate", "tr": "[ɪˈvæljueɪt]", "ru": "оценивать"}]}, {"num": 97, "ru": "Аренда квартиры и общение с арендодателем", "en": "Renting an apartment and dealing with landlords", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["Anna stood in the middle of her new flat, holding her phone and a wet towel. Water was dripping from the kitchen tap onto the floor.", "\"Okay, calm down,\" she whispered. \"It's just a tap.\"", "She called her landlord, Mr. Peterson.", "\"Hello? Anna? Is everything alright?\"", "\"Hi, Mr. Peterson. Sorry to bother you on Saturday. The kitchen tap is leaking. There's water everywhere.\"", "\"Oh no,\" he sighed. \"Is it a slow drip or a real flood?\"", "\"A slow drip, but it's been going all night. I put a bowl under it.\"", "\"Good girl. That's exactly what I would do. I'll send a plumber on Monday morning. Is nine o'clock okay?\"", "\"Nine is perfect. Thank you.\" She paused. \"Actually, while I have you on the phone… can I ask about the utilities? My first bill seems very high.\"", "\"Let me check. Does your lease include heating?\"", "\"I think so. I signed a twelve-month lease, and you said the rent covers water and heating.\"", "\"That's right. Electricity and internet are yours, but water and heating are mine. Send me a photo of the bill, and I'll sort it out.\"", "Anna felt a wave of relief. \"You're a lifesaver. I was worried you'd say I have to pay it.\"", "\"Anna, you're a good tenant. You pay on time and you don't throw parties at 2 AM. I'm not going to argue about a bill.\"", "She laughed. \"Fair enough. One last thing — the sofa. Is it staying? The flat was advertised as furnished.\"", "\"Yes, the sofa stays. If you want it removed, just tell me, and I'll store it in the basement.\"", "\"Perfect. I'll keep it. My cat will love it.\"", "\"Alright. Plumber, Monday, nine. Have a good weekend, Anna.\"", "After the call, Anna put the kettle on and sat on the old sofa. The flat was small, the tap was broken, but for the first time it felt like home."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What problem did Anna have in her new flat?", "What did the lease say about utilities?", "Why did Mr. Peterson call Anna a good tenant?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Anna called her... (landlord) because the kitchen tap was... (leaking).", "hints": ["She put a... (bowl) under the tap to stop the water.", "Mr. Peterson promised to send a plumber on... (Monday morning).", "Anna also asked about the... (utilities) because her bill was too high.", "According to the... (lease), the rent covered water and... (heating).", "The landlord asked her to send a... (photo) of the bill.", "Anna also asked if the flat was... (furnished) and if the sofa would stay.", "In the end, the flat finally felt like... (home)."], "vocab": [{"w": "landlord", "tr": "[ˈlændlɔːd]", "ru": "арендодатель, хозяин квартиры"}, {"w": "tenant", "tr": "[ˈtenənt]", "ru": "арендатор, жилец"}, {"w": "deposit", "tr": "[dɪˈpɒzɪt]", "ru": "залог, депозит"}, {"w": "lease", "tr": "[liːs]", "ru": "договор аренды"}, {"w": "utilities", "tr": "[juːˈtɪlətiz]", "ru": "коммунальные услуги"}, {"w": "to leak", "tr": "[liːk]", "ru": "протекать"}, {"w": "to fix", "tr": "[fɪks]", "ru": "починить"}, {"w": "furnished", "tr": "[ˈfɜːnɪʃt]", "ru": "меблированный"}]}, {"num": 98, "ru": "Переезд в новый город и процесс обустройства", "en": "Moving to a new city and settling in", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["Tom sat on the floor surrounded by twelve cardboard boxes. He had lived in Manchester for three days, and he still couldn't find his toothbrush.", "His phone rang. It was his sister, Kate.", "\"How's the new city?\" she asked cheerfully.", "\"Honestly? I'm eating cereal with a fork because I can't find a spoon,\" Tom said. \"And I got lost buying milk. Twice.\"", "Kate laughed. \"Oh, Tom. You'll settle in. Have you talked to anyone yet?\"", "\"Talked to anyone? I said 'thanks' to a bus driver. That's my whole social life.\"", "\"Go outside,\" she said. \"Explore the neighbourhood. Say hello to someone. You can't unpack your life from inside a box.\"", "Tom sighed, put on his jacket and walked downstairs. On the corner there was a small bakery. The smell of fresh bread pulled him inside.", "\"Morning,\" said the woman behind the counter. \"You're new, aren't you?\"", "\"Is it that obvious?\"", "\"You're holding a map of the city. Nobody uses paper maps anymore.\"", "Tom laughed for the first time that week. \"I moved here on Monday. I don't even know where the supermarket is.\"", "\"Two streets left, then right. And take the number 8 bus, not the number 18 — everyone makes that mistake.\"", "\"Thank you. I'm Tom, by the way.\"", "\"Maria. Welcome to the neighbourhood.\"", "He bought two croissants and a loaf of bread. On the way home, an old man from his building held the door for him.", "\"You're in flat 4, right? If you need a screwdriver for that furniture, I've got three.\"", "That evening, Tom finally unpacked his kitchen box. He found a spoon, made proper tea, and sat by the window.", "He called Kate back. \"I met a baker and a man with three screwdrivers.\"", "\"See?\" she said. \"You're not homesick anymore?\"", "\"A little,\" he admitted. \"But I think I'm going to like it here.\""], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why was Tom eating cereal with a fork?", "What advice did his sister Kate give him?", "Who did Tom meet on his first walk around the neighbourhood?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Tom moved to a new city and sat among twelve... (cardboard boxes).", "hints": ["He couldn't find a spoon and he... (got lost) buying milk.", "His sister told him to go outside and... (explore) the neighbourhood.", "In the bakery he met a woman called... (Maria).", "She told him where the... (supermarket) was and which bus to take.", "An old man from his building offered him a... (screwdriver) for his furniture.", "That evening Tom finally... (unpacked) his kitchen box.", "He was still a bit... (homesick), but he started to like the city."], "vocab": [{"w": "to move", "tr": "[muːv]", "ru": "переезжать"}, {"w": "cardboard box", "tr": "[ˈkɑːdbɔːd bɒks]", "ru": "картонная коробка"}, {"w": "to unpack", "tr": "[ˌʌnˈpæk]", "ru": "распаковывать"}, {"w": "neighbourhood", "tr": "[ˈneɪbəhʊd]", "ru": "район, окрестности"}, {"w": "to get lost", "tr": "[ɡet lɒst]", "ru": "заблудиться"}, {"w": "homesick", "tr": "[ˈhəʊmsɪk]", "ru": "тоскующий по дому"}, {"w": "to settle in", "tr": "[ˈsetl ɪn]", "ru": "обустроиться, освоиться"}, {"w": "to explore", "tr": "[ɪkˈsplɔː]", "ru": "исследовать, изучать"}]}, {"num": 99, "ru": "Поиск соседа по квартире и установление правил", "en": "Finding a roommate and setting house rules", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~270 слов.", "story": ["\"So,\" said Lisa, pouring tea, \"you'd be sharing the flat with me. Two bedrooms, one very small kitchen.\"", "Dan looked around. It was clean, sunny, and there was a plant on every window.", "\"It's lovely. Can I ask you something honest?\"", "\"Please.\"", "\"My last roommate was… difficult. He never did the dishes. For three weeks. I counted.\"", "Lisa laughed. \"Then let's talk about house rules now, not later. It saves friendships.\"", "\"Agreed. So — bills?\"", "\"We split the bills fifty-fifty. Rent, electricity, internet. I usually pay on the first Friday of the month.\"", "\"Fine by me. Cleaning?\"", "\"I'm quite tidy,\" Lisa admitted. \"But I'm not your mother. How about we clean the flat together on Sunday morning? One hour, music on, done.\"", "\"That actually sounds nice.\"", "\"And the dishes?\" Dan asked carefully.", "\"Whoever cooks doesn't wash up. That's the golden rule.\"", "\"Deal. What about guests?\"", "\"Friends are welcome. But if someone stays overnight more than twice a week, tell me first. I like knowing who's in my kitchen at 7 AM.\"", "\"Fair. And noise? I play guitar.\"", "\"I love guitar. Just not at midnight on a Tuesday.\"", "Dan smiled. \"You know, I came here to see a room, and we're writing a constitution.\"", "\"Better a constitution than a war,\" Lisa said. \"Most people say yes to the flat and never talk about the awkward things. Then they hate each other in six months.\"", "\"True. My last roommate and I stopped speaking over a pizza box.\"", "Lisa extended her hand. \"Welcome home, Dan.\"", "He shook it. \"When do I move in?\"", "\"Saturday. Bring your guitar. And your own washing-up sponge.\""], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why was Dan worried about sharing a flat?", "What was the \"golden rule\" about the dishes?", "What did Lisa say about overnight guests?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Dan came to see a room he would... (share) with Lisa.", "hints": ["His old... (roommate) never did the dishes for three weeks.", "Lisa suggested they discuss the... (house rules) immediately.", "They agreed to... (split the bills) fifty-fifty.", "They decided to clean the flat together on... (Sunday morning).", "The golden rule was: whoever cooks doesn't... (do the dishes).", "Lisa asked Dan to tell her about any... (overnight guest).", "Dan also asked about noise because he plays the... (guitar).", "They shook hands and Dan agreed to... (move in) on Saturday."], "vocab": [{"w": "roommate", "tr": "[ˈruːmmeɪt]", "ru": "сосед по квартире"}, {"w": "to share", "tr": "[ʃeə]", "ru": "делить, пользоваться вместе"}, {"w": "house rules", "tr": "[haʊs ruːlz]", "ru": "правила проживания"}, {"w": "to split the bills", "tr": "[splɪt ðə bɪlz]", "ru": "делить счета пополам"}, {"w": "tidy", "tr": "[ˈtaɪdi]", "ru": "аккуратный, опрятный"}, {"w": "messy", "tr": "[ˈmesi]", "ru": "небрежный, неаккуратный"}, {"w": "to do the dishes", "tr": "[duː ðə ˈdɪʃɪz]", "ru": "мыть посуду"}, {"w": "overnight guest", "tr": "[ˌəʊvənaɪt ɡest]", "ru": "гость с ночёвкой"}]}, {"num": 100, "ru": "Бытовой ремонт своими руками", "en": "DIY) и вызов мастера (DIY home repairs and calling a professional", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["\"It's just a dripping pipe,\" Mike said confidently. \"How hard can it be?\"", "His wife, Emma, looked at the toolbox in his hands. \"Mike. Last month you tried to fix the toaster and we lost electricity for two hours.\"", "\"That was different. I've watched a video.\"", "\"A video.\"", "\"A very good video. Four minutes.\"", "Emma sighed and went to work. Mike turned on his phone, watched thirty seconds, then put it away. \"Right. Easy.\"", "Twenty minutes later, Emma's phone rang.", "\"Em. Don't be angry.\"", "\"What happened?\"", "\"I made it worse.\"", "\"How much worse?\"", "\"The kitchen is… wet.\"", "Emma closed her eyes. \"Did you turn off the water?\"", "Silence.", "\"Mike. Did you turn off the water?\"", "\"…There's a valve?\"", "\"There's a valve under the sink! Turn it clockwise. Now!\"", "She heard running footsteps, a bang, and then a relieved breath. \"Okay. Okay, it's stopped.\"", "\"Call a plumber. A real one.\"", "An hour later, a calm man named Steve stood in the kitchen, looking at the pipe.", "\"Did you try to fix this yourself?\" he asked politely.", "\"I watched a video,\" Mike said quietly.", "Steve smiled. \"Everyone watches the video.\" He tightened something with his hand. \"Your seal was old. Ten-minute job. But you flooded half the floor, so let's dry it properly.\"", "\"What's the damage?\" Emma asked.", "\"Sixty for the repair, plus thirty call-out fee. And a piece of advice: next time, turn off the water first.\"", "After Steve left, Emma handed Mike a towel.", "\"So,\" she said. \"Any more videos you'd like to watch?\"", "\"I think I'll retire from DIY,\" Mike said, wiping the floor. \"My talent is calling professionals.\""], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why didn't Emma believe Mike could fix the pipe?", "What important thing did Mike forget to do?", "How much did the plumber charge in total?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Mike decided to repair a dripping... (pipe) himself.", "hints": ["Emma reminded him about the... (toaster) he broke last month.", "Mike watched a short video and opened his... (toolbox).", "Twenty minutes later he called Emma and said he... (made it worse).", "He forgot to... (turn off the water) under the sink.", "Emma told him to call a real... (plumber).", "Steve fixed the old seal in ten... (minutes).", "The repair cost sixty plus a thirty... (call-out fee).", "Mike decided to retire from... (DIY)."], "vocab": [{"w": "to repair", "tr": "[rɪˈpeə]", "ru": "ремонтировать"}, {"w": "screwdriver", "tr": "[ˈskruːdraɪvə]", "ru": "отвёртка"}, {"w": "pipe", "tr": "[paɪp]", "ru": "труба"}, {"w": "to turn off the water", "tr": "[tɜːn ɒf ðə ˈwɔːtə]", "ru": "перекрыть воду"}, {"w": "toolbox", "tr": "[ˈtuːlbɒks]", "ru": "ящик с инструментами"}, {"w": "to make it worse", "tr": "[meɪk ɪt wɜːs]", "ru": "сделать хуже"}, {"w": "plumber", "tr": "[ˈplʌmə]", "ru": "сантехник"}, {"w": "to flood", "tr": "[flʌd]", "ru": "затопить"}]}, {"num": 101, "ru": "Конфликт с шумными соседями и его решение", "en": "Dealing with noisy neighbors", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~270 слов.", "story": ["It was 11:40 PM. The bass from flat 7 was shaking Julia's cup on the table. Again. Third night in a row.", "\"That's it,\" she said, standing up. \"I'm going to knock on that door and lose my temper.\"", "Her flatmate, Ben, caught her arm. \"Wait. You're angry. Angry conversations at midnight never end well.\"", "\"I have to be at work at seven!\"", "\"I know. So be smart, not loud.\"", "Julia took a breath, put on her shoes, and knocked. The music stopped. A young man opened the door, holding a game controller.", "\"Hi,\" Julia said, forcing a smile. \"I'm Julia, from flat 5. Right below you.\"", "\"Oh. Hey.\" He looked embarrassed. \"Is it too loud?\"", "\"It's almost midnight and my walls are shaking. I haven't slept properly since Tuesday.\"", "\"Ah, man. I'm so sorry. I just got a new sound system and I got carried away. I didn't realise it travelled downstairs.\"", "Julia felt her anger disappear. \"You really didn't know?\"", "\"No idea. I thought these walls were concrete.\"", "\"They're not. They're basically cardboard.\"", "He laughed. \"Okay. Look — can we find a compromise? I love playing at night, but I don't want to be that neighbour.\"", "\"Headphones?\" Julia suggested. \"Or finish by ten on weekdays?\"", "\"Both. Headphones after ten, and no speakers after nine on work nights. Weekends I'll warn you if I have friends over.\"", "\"That's… actually perfect.\"", "\"Deal. And if I forget, just text me instead of suffering for three days. I'm Ryan, by the way.\"", "The next morning, Julia found a note in her mailbox: \"Sorry again. Bought headphones. — Ryan (flat 7)\"", "She showed it to Ben. \"You were right. A conversation, not a war.\""], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why couldn't Julia sleep for three nights?", "What advice did Ben give her before she knocked on the door?", "What compromise did Julia and Ryan agree on?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, the music from flat 7 was so... (noisy) that Julia's cup was shaking.", "hints": ["She wanted to knock on the door and... (lose her temper).", "Ben told her to be... (smart), not loud.", "She introduced herself to her neighbour... (Ryan).", "He was embarrassed and said he didn't... (realise) the sound travelled downstairs.", "He offered to... (apologise) and find a compromise.", "They agreed on... (headphones) after ten o'clock.", "The next morning Julia found a... (note) in her mailbox.", "She realised a conversation works better than a... (war)."], "vocab": [{"w": "noisy", "tr": "[ˈnɔɪzi]", "ru": "шумный"}, {"w": "to bang", "tr": "[bæŋ]", "ru": "стучать, греметь"}, {"w": "to complain", "tr": "[kəmˈpleɪn]", "ru": "жаловаться"}, {"w": "to knock on the door", "tr": "[nɒk ɒn ðə dɔː]", "ru": "постучать в дверь"}, {"w": "to lose one's temper", "tr": "[luːz wʌnz ˈtempə]", "ru": "выйти из себя"}, {"w": "to apologise", "tr": "[əˈpɒlədʒaɪz]", "ru": "извиниться"}, {"w": "compromise", "tr": "[ˈkɒmprəmaɪz]", "ru": "компромисс"}, {"w": "headphones", "tr": "[ˈhedfəʊnz]", "ru": "наушники"}]}, {"num": 102, "ru": "Поход в супермаркет: составление списка и неожиданные покупки", "en": "Grocery shopping: making a list and impulse buys", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["\"Okay,\" said Nina, writing on a piece of paper. \"Milk, eggs, bread, chicken, rice, tomatoes. Forty pounds. That's the budget.\"", "Her husband, Sam, took the list. \"Six things. How long can it take?\"", "\"Twenty minutes.\"", "Fifty minutes later, Sam came home with three bags and no chicken.", "Nina looked inside. \"Sam. Where is the chicken?\"", "\"Ah. Well. There was a special offer on barbecue sauce.\"", "\"We don't have a barbecue.\"", "\"We could get one!\"", "Nina pulled out the receipt. \"Sam, this is eighty-three pounds. Eighty-three. For six things.\"", "\"Technically I bought twenty things.\"", "\"That's the problem!\" She read the list out loud. \"Pineapple. Chocolate biscuits. A giant bag of crisps. Sushi. A candle that smells like the sea.\"", "\"The candle was three for two.\"", "\"Why do we need three candles that smell like the sea?\"", "Sam sat down, looking guilty. \"I went shopping hungry. You always say never do that.\"", "\"I do say that. I say it every week.\"", "\"And I ignored the aisle order. I started at the sweets, so by the time I got to the vegetables I had no money and no willpower.\"", "Nina started laughing. \"You're hopeless.\"", "\"I know. But look — I did buy milk.\"", "She checked. \"This milk is expired. It expired yesterday.\"", "\"Right. So we're having chocolate biscuits for dinner.\"", "The next Saturday, Nina took the list back. \"New rules. We eat before we go. We stick to the list. And we go together, so I can watch your hands near the offers.\"", "\"Fair,\" Sam said. \"But can I keep the sea candle?\"", "\"You can keep one.\""], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What was on the shopping list and what was the budget?", "Why did Sam spend eighty-three pounds instead of forty?", "What new rules did Nina suggest for the next shopping trip?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Nina wrote a... (shopping list) with six things and a forty-pound budget.", "hints": ["Sam took a trolley and came home fifty... (minutes) later.", "He forgot the chicken but bought barbecue sauce on a... (special offer).", "Nina checked the... (receipt) and saw eighty-three pounds.", "Most of the extra things were... (impulse buys), like crisps and a candle.", "Sam admitted he went shopping... (hungry) and started in the sweets aisle.", "Even the milk he bought was... (expired).", "Nina made new rules: eat first and... (stick to the list).", "Sam was allowed to keep one... (candle)."], "vocab": [{"w": "shopping list", "tr": "[ˈʃɒpɪŋ lɪst]", "ru": "список покупок"}, {"w": "trolley", "tr": "[ˈtrɒli]", "ru": "тележка"}, {"w": "aisle", "tr": "[aɪl]", "ru": "проход между полками, ряд"}, {"w": "special offer", "tr": "[ˈspeʃl ˈɒfə]", "ru": "специальная акция"}, {"w": "impulse buy", "tr": "[ˈɪmpʌls baɪ]", "ru": "спонтанная покупка"}, {"w": "receipt", "tr": "[rɪˈsiːt]", "ru": "чек"}, {"w": "to stick to the list", "tr": "[stɪk tə ðə lɪst]", "ru": "придерживаться списка"}, {"w": "expired", "tr": "[ɪkˈspaɪəd]", "ru": "просроченный"}]}, {"num": 103, "ru": "Генеральная уборка и распределение домашних обязанностей", "en": "Deep cleaning and dividing household chores", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~270 слов.", "story": ["\"Look at this kitchen,\" said Mum, running a finger along the top of the fridge. \"This isn't dust. This is archaeology.\"", "Fifteen-year-old Ben looked up from his phone. \"It's not that bad.\"", "\"Your father's mug from Tuesday is growing something. We're doing a deep cleaning. Today. All of us.\"", "Dad walked in with the vacuum cleaner. \"I've been ready since 2019.\"", "\"Right,\" Mum said, opening her notebook. \"Let's divide the chores properly this time. Not like last month, when I did everything and you two 'helped' for ten minutes.\"", "\"That's unfair,\" Ben said.", "\"Is it? Who took out the rubbish last week?\"", "\"…Nobody. It's still by the door.\"", "\"Exactly. So — a rota. A real one, on the fridge.\"", "She wrote three columns. \"Ben: vacuum your room and the living room, and take out the rubbish every evening.\"", "\"Every evening?\"", "\"It takes ninety seconds. Dad: bathroom. You love scrubbing tiles, you told me.\"", "\"I said I don't mind it. That's different.\"", "\"You're getting the tiles. Kitchen is mine, plus the laundry.\"", "Ben thought about it. \"Can I do my vacuuming on Saturday? I have training tonight.\"", "\"You can,\" Mum said. \"But it's a deal, not a suggestion. If you put it off, I move it to Friday and you don't like Friday.\"", "\"Deal.\"", "Two hours later, the flat smelled of lemon. Ben stood in his room, surprised.", "\"I found my other trainer shoe.\"", "\"Under the dust?\" Dad asked.", "\"Under a whole civilisation.\"", "Mum stuck the rota on the fridge. \"Same time next week. Thirty minutes each, and it never becomes archaeology again.\""], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What made Mum decide to organise a deep cleaning?", "Which chores did Ben, Dad and Mum take?", "What did Ben find in his room after cleaning?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Mum found thick... (dust) on top of the fridge.", "hints": ["She decided the family needed a... (deep cleaning).", "Ben said it wasn't fair, but nobody had... (taken out the rubbish).", "Mum suggested dividing the... (chores) and making a rota.", "Ben had to use the... (vacuum cleaner) and take out the rubbish daily.", "Dad had to... (scrub) the bathroom tiles.", "Mum took the kitchen and the... (laundry).", "Ben asked to... (put off) his cleaning until Saturday.", "Two hours later the flat smelled of... (lemon).", "Mum stuck the... (rota) on the fridge for every week."], "vocab": [{"w": "deep cleaning", "tr": "[diːp ˈkliːnɪŋ]", "ru": "генеральная уборка"}, {"w": "chore", "tr": "[tʃɔː]", "ru": "домашняя обязанность"}, {"w": "vacuum cleaner", "tr": "[ˈvækjuːm ˈkliːnə]", "ru": "пылесос"}, {"w": "to dust", "tr": "[dʌst]", "ru": "вытирать пыль"}, {"w": "laundry", "tr": "[ˈlɔːndri]", "ru": "стирка, бельё для стирки"}, {"w": "to take out the rubbish", "tr": "[teɪk aʊt ðə ˈrʌbɪʃ]", "ru": "выносить мусор"}, {"w": "to scrub", "tr": "[skrʌb]", "ru": "оттирать, драить"}, {"w": "rota", "tr": "[ˈrəʊtə]", "ru": "график очерёдности"}]}, {"num": 104, "ru": "Решение завести питомца и первый день с ним дома", "en": "Adopting a pet and the first week at home", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["\"He's looking at us,\" whispered Kate.", "In the corner of the shelter cage, a small brown puppy was watching them with enormous eyes.", "\"Don't,\" said her husband, Dan. \"We came here to look.\"", "\"We've been 'looking' for four months.\"", "Twenty minutes later they signed the papers, bought a bowl, a lead and a bag of food, and drove home with the puppy on Kate's lap.", "\"What are we calling him?\" Dan asked at the traffic lights.", "\"Biscuit.\"", "\"Why Biscuit?\"", "\"Because he's the colour of a biscuit and he'll eat anything.\"", "The first night was a disaster. Biscuit barked at 2 AM, then at 3 AM, then at nothing at all.", "Dan sat on the kitchen floor at four in the morning, holding the puppy. \"We've made a terrible mistake.\"", "\"We haven't,\" Kate said, wrapping a blanket around him. \"He's a baby. He was in a shelter yesterday. Everything smells wrong.\"", "By day three, Biscuit had chewed one slipper, half a chair leg and the TV remote.", "\"The remote?\" Dan said. \"Why the remote?\"", "\"Teething,\" the vet explained on the phone. \"Give him something legal to chew and hide your shoes. And keep the same routine — food, walk, sleep, at the same times every day. Dogs relax when they know what's coming.\"", "They made a chart. Kate did mornings, Dan did evenings. Walk at seven, food at eight, lights off at ten.", "On Sunday, Kate came home from the shop and found Biscuit asleep by the door, his nose on Dan's slipper — the surviving one.", "\"He waited for you,\" Dan said quietly.", "Kate sat down on the floor and stroked his ears. \"Four nights of no sleep. And I'd do it again.\"", "\"Me too,\" Dan admitted. \"But we're buying a second remote.\""], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Where did Kate and Dan find their puppy?", "Why did Biscuit bark all night at the beginning?", "What advice did the vet give them?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Kate and Dan visited an animal... (shelter) just to look.", "hints": ["A brown... (puppy) was watching them from the corner of the cage.", "They signed the papers and bought a bowl and a... (lead).", "They named him... (Biscuit).", "On the first night he... (barked) at 2 and 3 AM.", "Dan thought they had made a... (mistake), but Kate said the puppy was scared.", "By day three Biscuit had... (chewed) a slipper and the TV remote.", "The... (vet) told them to give him something to chew and keep the same routine.", "They made a chart with a daily... (routine) of walks and food.", "On Sunday they found Biscuit... (asleep) by the door, waiting for Kate."], "vocab": [{"w": "to adopt", "tr": "[əˈdɒpt]", "ru": "взять (животное из приюта)"}, {"w": "shelter", "tr": "[ˈʃeltə]", "ru": "приют"}, {"w": "puppy", "tr": "[ˈpʌpi]", "ru": "щенок"}, {"w": "bowl", "tr": "[bəʊl]", "ru": "миска"}, {"w": "lead", "tr": "[liːd]", "ru": "поводок"}, {"w": "to bark", "tr": "[bɑːk]", "ru": "лаять"}, {"w": "to chew", "tr": "[tʃuː]", "ru": "жевать, грызть"}, {"w": "to be patient", "tr": "[biː ˈpeɪʃnt]", "ru": "быть терпеливым"}]}, {"num": 105, "ru": "Визит к ветеринару: прививки и неожиданные новости", "en": "Taking a pet to the vet", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["Kate put Biscuit into his carrier and drove to the local vet clinic. It was time for his annual check-up and vaccinations.", "\"He's been a good boy,\" Kate told the receptionist. \"But he's been scratching his ear a lot lately.\"", "Dr. Evans, a friendly vet with a calm voice, called them into the room. She gently took Biscuit out of the carrier and placed him on the metal table.", "\"Let's have a look,\" she said, examining his ears and listening to his heart. \"His heart is strong, and his teeth are in great condition. Good job, Kate.\"", "\"Thank you,\" Kate smiled. \"What about his ear?\"", "\"Just a mild irritation. I'll prescribe some ear drops. Use them twice a day for a week, and he should recover completely.\" Dr. Evans then gave him his vaccinations. Biscuit barely flinched.", "However, Dr. Evans paused and looked at Biscuit's weight chart. \"Now, about his weight. He's gained two kilos since last year. Is he getting many treats?\"", "Kate blushed. \"Well, he's very cute when he begs. Maybe a few extra biscuits.\"", "\"I understand,\" Dr. Evans laughed. \"But we need to put him on a strict diet. No more human food. Measure his portions carefully, and increase his daily walks. Obesity can cause serious health issues in dogs.\"", "Kate nodded, feeling a bit guilty but determined. \"Okay, no more biscuits. Just healthy dog food and longer walks.\"", "\"Perfect. He's a lovely dog, and with a little discipline, he'll be in perfect shape.\"", "On the way home, Biscuit looked at Kate with his big, hopeful eyes.", "\"I'm sorry, buddy,\" Kate said, scratching his head. \"No more treats. But we'll go to the park for an extra hour.\"", "Biscuit wagged his tail. He didn't understand the word 'diet', but he definitely understood 'park'."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Kate take Biscuit to the vet?", "What did Dr. Evans prescribe for Biscuit's ear?", "What unexpected news did Kate hear about Biscuit's health?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Kate took Biscuit to the vet for a... (check-up) and vaccinations.", "hints": ["Dr. Evans... (examined) him and said his heart and teeth were fine.", "For his itchy ear, the vet... (prescribed) some drops.", "However, the vet noticed that Biscuit had gained... (weight).", "She explained that he needed a strict... (diet) and more walks.", "Kate felt guilty about giving him too many... (treats).", "She promised to feed him healthy food and take him to the... (park).", "Biscuit wagged his tail, happy about the... (walk)."], "vocab": [{"w": "vet", "tr": "[vet]", "ru": "ветеринар"}, {"w": "vaccination", "tr": "[ˌvæksɪˈneɪʃn]", "ru": "вакцинация, прививка"}, {"w": "to examine", "tr": "[ɪɡˈzæmɪn]", "ru": "осматривать"}, {"w": "symptoms", "tr": "[ˈsɪmptəmz]", "ru": "симптомы"}, {"w": "to prescribe", "tr": "[prɪˈskraɪb]", "ru": "выписывать (рецепт, диету)"}, {"w": "diet", "tr": "[ˈdaɪət]", "ru": "диета, рацион"}, {"w": "to recover", "tr": "[rɪˈkʌvə]", "ru": "выздоравливать"}, {"w": "check-up", "tr": "[ˈtʃek ʌp]", "ru": "профилактический осмотр"}]}, {"num": 106, "ru": "Помощь ребенку с домашним заданием", "en": "Helping a child with homework", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~270 слов.", "story": ["Mark sat at the kitchen table, staring at a math workbook. His eight-year-old daughter, Lily, was chewing her pencil and looking close to tears.", "\"I don't get it, Dad,\" she whispered. \"Fractions are stupid.\"", "Mark took a deep breath. He wanted to be patient, but he had been explaining the same problem for twenty minutes. \"It's not stupid, Lily. Look, if you have one pizza and you cut it into four pieces...\"", "\"But we don't have a pizza!\" Lily argued, her voice rising. \"We have numbers! And I don't know what three-quarters means!\"", "Mark felt his frustration growing. He was an engineer; math was easy for him. Why couldn't she just see it? He almost told her to give up and ask her teacher tomorrow.", "But then he looked at her face. She wasn't being difficult; she was genuinely struggling.", "\"Okay,\" Mark said softly, closing the workbook. \"Let's take a break. Do we have any apples in the fridge?\"", "Lily nodded, confused.", "Mark took an apple and a knife. He cut it into four equal pieces. \"Here is one whole apple. Now, I eat one piece. How many pieces are left?\"", "\"Three,\" Lily said.", "\"Right. And the whole apple was cut into four pieces. So, what fraction of the apple is left?\"", "Lily's eyes widened. \"Three... quarters?\"", "\"Exactly!\" Mark smiled. \"Three-quarters. See? It's just pieces of something real.\"", "Lily grabbed the pencil again. \"Can we do the next one with a banana?\"", "Mark laughed. \"Sure. We can use anything.\"", "With a little encouragement and real-life examples, Lily finished her homework in ten minutes. Mark realized that teaching wasn't about knowing the answer; it was about finding the right way to explain it."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why was Lily close to tears at the kitchen table?", "Why did Mark almost tell her to give up?", "How did Mark finally help Lily understand fractions?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Lily was... (struggling) with her math homework about fractions.", "hints": ["Mark tried to... (explain) it, but she didn't understand.", "He felt frustrated and almost told her to... (give up).", "Instead, he decided to be... (patient) and took a break.", "He cut an... (apple) into four pieces to show her the concept.", "Lily finally... (understood) that three pieces left meant three-quarters.", "With some... (encouragement), she finished her homework quickly.", "Mark learned that teaching requires finding the right... (way) to explain things."], "vocab": [{"w": "homework", "tr": "[ˈhəʊmwɜːk]", "ru": "домашнее задание"}, {"w": "to struggle", "tr": "[ˈstrʌɡl]", "ru": "испытывать трудности"}, {"w": "patient", "tr": "[ˈpeɪʃnt]", "ru": "терпеливый"}, {"w": "to explain", "tr": "[ɪkˈspleɪn]", "ru": "объяснять"}, {"w": "fraction", "tr": "[ˈfrækʃn]", "ru": "дробь (в математике)"}, {"w": "to give up", "tr": "[ɡɪv ʌp]", "ru": "сдаваться"}, {"w": "encouragement", "tr": "[ɪnˈkʌrɪdʒmənt]", "ru": "поддержка, ободрение"}, {"w": "to understand", "tr": "[ˌʌndəˈstænd]", "ru": "понимать"}]}, {"num": 107, "ru": "Обучение подростка вождению автомобиля", "en": "Teaching a teenager to drive", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["\"Okay, Leo, foot on the clutch, slowly release it, and gently press the gas,\" David said, gripping the door handle tightly.", "His sixteen-year-old son, Leo, was sweating. \"I'm trying, Dad. But it keeps shaking.\"", "\"That means you're finding the bite point. Just a little more...\"", "Suddenly, the car jerked violently and the engine died.", "\"I stalled it again!\" Leo groaned, hitting the steering wheel. \"I'm terrible at this. Maybe I should just take the bus forever.\"", "David took a deep breath. He remembered his own first driving lesson and how his father had yelled at him. He decided to do better.", "\"You're not terrible,\" David said calmly. \"You're learning. Stalling is completely normal. Every driver does it. Just put the car in neutral, turn the key, and try again.\"", "Leo restarted the engine. \"What about the mirrors? I keep forgetting to check them.\"", "\"Good point. Before you move, check your rearview mirror and your side mirrors. And don't forget to indicate before you turn.\"", "Leo nodded, his hands white on the wheel. He checked the mirrors, signaled, and slowly released the clutch. The car moved forward smoothly.", "\"Yes! I did it!\" Leo grinned.", "\"Great job. Now, let's practice stopping. Foot on the brake, clutch down...\"", "They spent an hour in the empty parking lot. Leo stalled the car three more times, but he didn't panic. He just restarted it and tried again. David's patience made all the difference.", "At the end of the lesson, Leo turned off the engine and looked at his dad. \"Thanks for not yelling at me.\"", "David smiled. \"Driving is a big responsibility. You need to stay calm, and so do I. You did really well today.\""], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Leo want to give up driving at the beginning?", "How did David react when Leo stalled the car?", "What three things did David remind Leo to do before moving?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Leo was very... (nervous) during his driving lesson.", "hints": ["He kept... (stalling) the car and felt like he was terrible at it.", "David showed... (patience) and told him that stalling is normal.", "He reminded Leo to check his... (mirrors) before moving.", "He also told him to... (indicate) before turning.", "Leo practiced for an hour and didn't... (panic) when he made mistakes.", "At the end, Leo thanked his dad for not... (yelling).", "David said that staying... (calm) is important for both of them."], "vocab": [{"w": "driving lesson", "tr": "[ˈdraɪvɪŋ ˈlesn]", "ru": "урок вождения"}, {"w": "nervous", "tr": "[ˈnɜːvəs]", "ru": "нервничающий"}, {"w": "clutch", "tr": "[klʌtʃ]", "ru": "сцепление (в машине)"}, {"w": "to stall", "tr": "[stɔːl]", "ru": "глохнуть (о двигателе)"}, {"w": "mirror", "tr": "[ˈmɪrə]", "ru": "зеркало"}, {"w": "to indicate", "tr": "[ˈɪndɪkeɪt]", "ru": "включать поворотник"}, {"w": "patience", "tr": "[ˈpeɪʃns]", "ru": "терпение"}, {"w": "to panic", "tr": "[ˈpænɪk]", "ru": "паниковать"}]}, {"num": 108, "ru": "Забота о пожилых родителях и баланс с работой", "en": "Caring for an elderly parent", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~270 слов.", "story": ["Sarah stared at her phone. She had a meeting with her boss in ten minutes, but her mother had just called.", "\"Sarah, I forgot how to turn on the heating again,\" her mother's voice sounded weak and confused. \"And I think I missed my doctor's appointment.\"", "Sarah felt a familiar wave of guilt. \"It's okay, Mum. I'll call the clinic and reschedule. Just sit tight, I'll come over after work.\"", "She hung up and sighed. Balancing her demanding job and caring for her elderly mother was becoming impossible. She was constantly tired and worried.", "That evening, she talked to her brother, Tom. \"I can't keep doing this, Tom. I'm failing at work, and I'm failing Mum.\"", "Tom listened quietly. \"You're not failing, Sarah. You're just one person. Mum needs more support than we can give her while working full-time.\"", "\"But she wants to stay independent,\" Sarah argued. \"She hates the idea of a nursing home.\"", "\"I know,\" Tom said gently. \"But there's a middle ground. We can arrange for a part-time caregiver. Someone to come in the mornings, help with breakfast, and make sure she takes her medicine. She stays in her own home, but we get peace of mind.\"", "Sarah thought about it. \"Do you think she'd agree?\"", "\"Let's talk to her together,\" Tom suggested. \"Frame it as 'extra help', not 'replacement'.\"", "The next day, they visited their mother. To their surprise, she was relieved. \"I was so scared of bothering you with every little thing,\" she admitted. \"Having someone to help with the heating and the shopping sounds wonderful.\"", "Sarah finally felt the weight lift off her shoulders. She realized that asking for help wasn't a sign of weakness. It was the only way to truly balance her life and give her mother the care she deserved."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Sarah feel guilty at the beginning of the story?", "What solution did Tom suggest to help their mother?", "How did their mother react to the idea of a caregiver?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Sarah was struggling to... (balance) her job and caring  trying to finalize the guest list, book the venue, and figure out the catering. I can't do it all.\"", "\"Then don't,\" Mark said simply. \"Delegate.\"", "\"Delegate to who? Everyone is busy.\"", "\"Your cousins love to help. Call Sarah and ask her to handle the dietary requirements. Ask Mike to book the park venue and organize the games. You just manage the main guest list and the music.\"", "Emma hesitated. \"But what if they mess it up?\"", "\"Then it's a family reunion, not a Michelin-star restaurant. It will be fine.\"", "Emma took a deep breath and picked up her phone. She called Sarah, who was thrilled to handle the food. She texted Mike, who immediately found a great park with a barbecue area.", "Within two days, the whiteboard was much less scary. Emma only had to confirm the final numbers and make a playlist.", "On the day of the reunion, the sun was shining. Sarah had prepared beautiful salads, Mike had set up a fantastic volleyball net, and the music was playing.", "Emma stood by the barbecue, watching her family laugh and talk. Mark handed her a drink. \"See? Not chaos.\"", "\"No,\" Emma smiled, clinking her glass against his. \"It's going to be memorable.\""], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why was Emma stressed about the family reunion?", "What advice did Mark give her?", "What tasks did Sarah and Mike take on?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Emma was trying to... (organize) a family reunion for forty people.", "hints": ["She was worried about the... (guest list) and special food needs.", "Mark told her not to do it all and to... (delegate) tasks.", "Emma asked Sarah to handle the... (dietary requirements).", "She asked Mike to book the... (venue) and organize games.", "Emma realized it wouldn't be... (chaos) if she shared the work.", "On the day of the event, everything was perfect.", "Emma knew the day would be truly... (memorable)."], "vocab": [{"w": "reunion", "tr": "[ˌriːˈjuːniən]", "ru": "воссоединение, встреча"}, {"w": "to organize", "tr": "[ˈɔːɡənaɪz]", "ru": "организовывать"}, {"w": "guest list", "tr": "[ɡest lɪst]", "ru": "список гостей"}, {"w": "dietary requirements", "tr": "[ˈdaɪətəri rɪˈkwaɪəmənts]", "ru": "диетические требования"}, {"w": "to delegate", "tr": "[ˈdelɪɡeɪt]", "ru": "делегировать, поручать"}, {"w": "venue", "tr": "[ˈvenjuː]", "ru": "место проведения"}, {"w": "chaos", "tr": "[ˈkeɪɒs]", "ru": "хаос"}, {"w": "memorable", "tr": "[ˈmemərəbl]", "ru": "незабываемый"}]}, {"num": 110, "ru": "Плановый визит к стоматологу или внезапная зубная боль", "en": "Going to the dentist for a check-up or emergency", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~270 слов.", "story": ["Tom woke up at 6 AM with a sharp pain in his lower jaw. He touched his cheek. It was swollen.", "\"Oh no,\" he groaned. \"Not today.\"", "He had an important presentation at work, but the toothache was unbearable. He took a painkiller, but it only took the edge off. By 9 AM, he knew he had to call the dentist.", "\"Hello, Bright Smile Dental,\" the receptionist answered.", "\"Hi, I'm Tom Reed. I have a severe toothache and I need an emergency appointment.\"", "\"Let me check... Dr. Miller has a cancellation at 11:30. Can you make it?\"", "\"Yes, absolutely. Thank you.\"", "At the clinic, Dr. Miller examined Tom's mouth and took an X-ray.", "\"Well, Tom, you have a small cavity in your back molar,\" she explained. \"It's reached the nerve, which is why it hurts so much. We need to clean it and put in a filling.\"", "Tom gripped the chair. \"Will it hurt?\"", "\"I'll give you a local injection, so you won't feel a thing. You'll just hear the drill.\"", "The procedure took twenty minutes. Tom was right; he felt no pain, just a strange vibration. When it was over, Dr. Miller handed him a small cup. \"Rinse your mouth, please.\"", "\"All done,\" she smiled. \"The filling is set. Avoid very hot or cold food for a day, and please, floss more often!\"", "Tom left the clinic feeling incredibly relieved. The pain was gone. He made it to his office just in time for his presentation, and for the first time in his life, he bought dental floss on his way home."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Tom have to call the dentist in the morning?", "What did the X-ray show about Tom's tooth?", "What advice did Dr. Miller give Tom after the procedure?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Tom woke up with a severe... (toothache).", "hints": ["He took a... (painkiller), but it didn't help much.", "He called the clinic and got an emergency... (appointment) at 11:30.", "The dentist found a small... (cavity) that reached the nerve.", "She gave him an injection and used a... (drill) to clean the tooth.", "Then she put in a... (filling).", "Tom had to... (rinse) his mouth and avoid hot food for a day.", "He left the clinic pain-free and finally bought some... (floss)."], "vocab": [{"w": "dentist", "tr": "[ˈdentɪst]", "ru": "стоматолог"}, {"w": "toothache", "tr": "[ˈtuːθeɪk]", "ru": "зубная боль"}, {"w": "appointment", "tr": "[əˈpɔɪntmənt]", "ru": "запись, прием"}, {"w": "filling", "tr": "[ˈfɪlɪŋ]", "ru": "пломба"}, {"w": "to drill", "tr": "[drɪl]", "ru": "сверлить"}, {"w": "cavity", "tr": "[ˈkævəti]", "ru": "кариес, полость в зубе"}, {"w": "to rinse", "tr": "[rɪns]", "ru": "полоскать"}, {"w": "painkiller", "tr": "[ˈpeɪnkɪlə]", "ru": "обезболивающее"}]}, {"num": 111, "ru": "Разговор со страховой компанией о покрытии расходов", "en": "Navigating health insurance and doctor visits", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["Lisa held the phone to her ear, listening to the classical music. She had been on hold for ten minutes, trying to understand her health insurance bill.", "Finally, a voice answered. \"Thank you for calling SafeHealth Insurance. My name is David. How can I help you?\"", "\"Hi, David. I'm calling about my policy. I visited a specialist last week, and I just got a bill for $150. I thought my insurance covered specialist visits.\"", "\"Let me pull up your account,\" David said. \"Okay, Lisa, I see your policy. You have a $500 deductible. This means you have to pay the first $500 of your medical expenses out of pocket each year before our coverage kicks in.\"", "Lisa sighed. \"Oh, I didn't realize that. So this $150 counts toward the deductible?\"", "\"Exactly,\" David explained. \"Once you reach $500, the insurance will cover 80% of your specialist visits. You just need to file a claim for this visit so we can track your progress.\"", "\"How do I file a claim?\"", "\"It's very easy. You can do it on our website. Just upload a photo of the doctor's invoice and your receipt. The system will process it automatically.\"", "\"That sounds simple enough,\" Lisa said, feeling much less stressed. \"One more thing: does my premium go up if I file a claim?\"", "\"No, health insurance premiums are fixed for the year. Filing a claim for necessary medical care won't change your monthly payment.\"", "\"Thank you, David. You've been very helpful.\"", "\"You're welcome, Lisa. Have a great day.\"", "Lisa hung up and immediately opened her laptop. She uploaded the receipt, filed the claim, and made a note in her calendar: only $350 left until full coverage. It wasn't free, but at least she finally understood how it worked."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Lisa call her insurance company?", "What is a \"deductible\" according to the representative?", "How can Lisa file a claim?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Lisa called her... (insurance) company because she got an unexpected bill.", "hints": ["The... (representative) explained that she had a $500... (deductible).", "This means she has to pay the first expenses... (herself).", "The $150 bill will count toward this... (limit).", "After that, the insurance will... (cover) 80% of the costs.", "Lisa learned to file a... (claim) by uploading a photo of the receipt online.", "She also learned that her monthly... (premium) will not go up.", "Finally, she understood how her... (policy) worked."], "vocab": [{"w": "insurance", "tr": "[ɪnˈʃʊərəns]", "ru": "страхование"}, {"w": "coverage", "tr": "[ˈkʌvərɪdʒ]", "ru": "покрытие, страховое покрытие"}, {"w": "claim", "tr": "[kleɪm]", "ru": "требование выплаты, страховой случай"}, {"w": "policy", "tr": "[ˈpɒləsi]", "ru": "страховой полис"}, {"w": "premium", "tr": "[ˈpriːmiəm]", "ru": "страховой взнос"}, {"w": "to cover", "tr": "[ˈkʌvə]", "ru": "покрывать (расходы)"}, {"w": "deductible", "tr": "[dɪˈdʌktəbl]", "ru": "франшиза, сумма, оплачиваемая самостоятельно"}, {"w": "representative", "tr": "[ˌreprɪˈzentətɪv]", "ru": "представитель"}]}, {"num": 112, "ru": "Первый поход в спортзал и знакомство с тренером", "en": "Starting a new fitness routine or joining a gym", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["Alex stood outside the 'FitLife' gym, feeling completely intimidated. Through the glass windows, he could see people lifting heavy weights and running fast on treadmills.", "\"I can't do this,\" he muttered, turning to leave.", "\"First day?\" a friendly voice asked.", "Alex turned around. A tall man in a gym uniform was smiling at him. \"I'm Mike, one of the trainers here. You look like you're about to run away.\"", "\"Is it that obvious?\" Alex laughed nervously. \"I haven't exercised in five years. I don't even know how to use the equipment.\"", "\"That's exactly why we're here,\" Mike said. \"Come inside. I'll give you a free orientation. No heavy lifting today, I promise.\"", "Inside, the gym was loud, but Mike led Alex to a quiet corner. \"Let's start with the basics. First rule of the gym: always stretch before and after your workout. It prevents injuries and makes you less sore tomorrow.\"", "Mike showed Alex some simple stretches. Then, he introduced him to the machines. \"Don't worry about the free weights yet. Let's use the resistance machines. They guide your movement and are much safer for beginners.\"", "For the next thirty minutes, Mike showed Alex how to adjust the seats, set the weight, and breathe properly. He didn't push Alex to do too much.", "\"How do you feel?\" Mike asked at the end.", "\"Actually, pretty good,\" Alex admitted. \"I thought I would be laughed at, but you made it seem easy.\"", "\"Everyone starts somewhere,\" Mike smiled. \"I can write a simple beginner routine for you. Three days a week, thirty minutes. Deal?\"", "\"Deal,\" Alex said, feeling a new spark of motivation. He realized that the gym wasn't a scary place for superhumans. It was just a place to start getting healthier, one small step at a time."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Alex want to leave the gym at the beginning?", "What was the first rule of the gym that Mike taught Alex?", "Why did Mike suggest using resistance machines instead of free weights?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Alex felt intimidated outside the... (gym).", "hints": ["A friendly... (trainer) named Mike stopped him from leaving.", "Mike offered a free orientation and showed him the... (equipment).", "He taught Alex to always... (stretch) to avoid getting sore.", "They used resistance machines because they are safer for... (beginners).", "Mike didn't push him too hard and made him feel... (comfortable).", "He offered to write a simple beginner... (routine) for three days a week.", "Alex left feeling... (motivated) to start his fitness journey."], "vocab": [{"w": "gym", "tr": "[dʒɪm]", "ru": "спортзал"}, {"w": "trainer", "tr": "[ˈtreɪnə]", "ru": "тренер"}, {"w": "routine", "tr": "[ruːˈtiːn]", "ru": "режим, программа тренировок"}, {"w": "to lift weights", "tr": "[lɪft weɪts]", "ru": "поднимать тяжести"}, {"w": "equipment", "tr": "[ɪˈkwɪpmənt]", "ru": "оборудование, тренажеры"}, {"w": "to stretch", "tr": "[stretʃ]", "ru": "растягиваться"}, {"w": "sore", "tr": "[sɔː]", "ru": "болезненный, ноющий (о мышцах)"}, {"w": "to motivate", "tr": "[ˈməʊtɪveɪt]", "ru": "мотивировать"}]}, {"num": 113, "ru": "Легкая простуда или травма во время отпуска", "en": "Dealing with a minor illness or injury while traveling", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["\"Ouch!\" Sarah cried out, stumbling on the uneven cobblestone street in Rome.", "\"Are you okay?\" her husband, Mark, asked, rushing to her side.", "\"I think I twisted my ankle,\" Sarah said, wincing as she put weight on her left foot. \"It’s swelling up.\"", "They limped to a nearby bench. Sarah’s ankle was already turning red. \"We have a museum tour in an hour,\" she said, disappointed.", "\"Forget the tour,\" Mark replied firmly. \"Let’s find a pharmacy.\"", "They found a green cross sign on the corner. Inside, a friendly pharmacist examined Sarah’s ankle. \"It’s a mild sprain,\" he said in English. \"No fracture. You need to rest it, keep it elevated, and apply ice.\"", "\"Do I need a prescription for painkillers?\" Mark asked.", "\"No, I can give you an over-the-counter anti-inflammatory gel and some ibuprofen,\" the pharmacist said, handing them a small bag. \"But if the fever develops or the pain gets worse, you must see a doctor.\"", "Back at their Airbnb, Sarah sat on the sofa with her foot propped up on pillows. Mark brought her ice and the gel.", "\"Well, this wasn't in the itinerary,\" Sarah sighed.", "\"Don't worry,\" Mark smiled. \"We have travel insurance. If we need a doctor, it’s covered. For now, your only job is to rest.\"", "For the next two days, Sarah stayed in, reading books and watching Italian movies. By the third day, the swelling was gone, and she could walk normally.", "\"Ready for the Colosseum?\" Mark asked on Thursday morning.", "\"Absolutely,\" Sarah grinned, grabbing her walking shoes. \"But this time, I’m watching my step.\""], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What happened to Sarah while walking in Rome?", "What did the pharmacist recommend for her ankle?", "How did Sarah spend the next two days?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Sarah stumbled and... (twisted) her ankle on a cobblestone street.", "hints": ["Mark helped her find a nearby... (pharmacy).", "The pharmacist said it was a mild sprain and gave her... (over-the-counter) medicine.", "He advised her to... (rest) and apply ice.", "Mark reminded her that they had... (travel insurance) just in case.", "Sarah stayed at the Airbnb with her foot... (elevated) on pillows.", "After two days, the swelling was gone and she could... (walk) normally.", "She was finally ready to visit the... (Colosseum)."], "vocab": [{"w": "pharmacy", "tr": "[ˈfɑːməsi]", "ru": "аптека"}, {"w": "to twist", "tr": "[twɪst]", "ru": "подвернуть (сустав)"}, {"w": "ankle", "tr": "[ˈæŋkl]", "ru": "лодыжка, щиколотка"}, {"w": "fever", "tr": "[ˈfiːvə]", "ru": "температура, лихорадка"}, {"w": "prescription", "tr": "[prɪˈskrɪpʃn]", "ru": "рецепт"}, {"w": "over-the-counter", "tr": "[ˌəʊvə ðə ˈkaʊntə]", "ru": "безрецептурный"}, {"w": "to rest", "tr": "[rest]", "ru": "отдыхать"}, {"w": "travel insurance", "tr": "[ˈtrævl ɪnˈʃʊərəns]", "ru": "туристическая страховка"}]}, {"num": 114, "ru": "Сдача машины в автосервис и неожиданный счет", "en": "Taking a car to the mechanic for unexpected repairs", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["\"My car is making a weird squeaking noise when I brake,\" Tom told the receptionist at the auto shop. \"I think it just needs an oil change.\"", "The mechanic, a greasy-handed man named Joe, nodded. \"Leave it with us. We’ll inspect it and give you a call.\"", "Two hours later, Tom’s phone rang.", "\"Hi Tom, it’s Joe from the garage. We checked the car. The oil is fine, but we found an unexpected issue.\"", "Tom’s stomach tightened. \"Oh no. What is it?\"", "\"Your front brake pads are completely worn out, and the rotor is scratched. If you keep driving, it’s dangerous. We also noticed a small leak in the coolant
