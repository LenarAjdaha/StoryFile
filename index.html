 hose.\"", "\"How much will that cost?\" Tom asked nervously.", "\"The estimate for the brake pads and the hose is about $450, including labor,\" Joe replied. \"We won’t do any work without your approval.\"", "Tom did some quick mental math. It was more than he budgeted, but safety came first. \"Okay, I approve the repair. How long will it take?\"", "\"We can have it ready by 5 PM today.\"", "When Tom returned in the evening, Joe handed him the keys and the final invoice. \"All done. We also gave the car a quick wash.\"", "Tom looked at the invoice. It was exactly $450. \"Thanks, Joe. I’m glad you caught that before a real breakdown.\"", "\"Anytime,\" Joe smiled. \"Better to fix it now than to pay for a tow truck later.\"", "Tom drove home smoothly. The squeaking was gone, and despite the unexpected bill, he felt relieved knowing his car was safe for the upcoming road trip."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Tom take his car to the auto shop initially?", "What unexpected issues did the mechanic find?", "How much did the final repair cost?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Tom thought his car just needed an oil... (change) because of a squeaking noise.", "hints": ["The mechanic decided to... (inspect) the car thoroughly.", "He found that the... (brake pads) were worn out and there was a leak.", "Joe gave Tom an... (estimate) of $450 for the repairs.", "Tom decided to... (approve) the work because safety is important.", "The mechanic promised to finish the job by 5... (PM).", "When Tom returned, he paid the final... (invoice).", "He was relieved that the car was safe and the squeaking was... (gone)."], "vocab": [{"w": "mechanic", "tr": "[məˈkænɪk]", "ru": "механик, автослесарь"}, {"w": "breakdown", "tr": "[ˈbreɪkdaʊn]", "ru": "поломка"}, {"w": "to inspect", "tr": "[ɪnˈspekt]", "ru": "осматривать, проверять"}, {"w": "estimate", "tr": "[ˈestɪmət]", "ru": "предварительная оценка стоимости"}, {"w": "brake pads", "tr": "[breɪk pædz]", "ru": "тормозные колодки"}, {"w": "unexpected", "tr": "[ˌʌnɪkˈspektɪd]", "ru": "неожиданный"}, {"w": "to approve", "tr": "[əˈpruːv]", "ru": "одобрять, соглашаться"}, {"w": "invoice", "tr": "[ˈɪnvɔɪs]", "ru": "счет на оплату"}]}, {"num": 115, "ru": "Открытие банковского счета или разблокировка карты", "en": "Opening a bank account or dealing with a frozen card", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["Lisa stood at the grocery store checkout, swiping her card.", "\"Declined,\" the cashier said flatly.", "Lisa frowned and tried again. \"Declined.\"", "\"That’s embarrassing,\" she muttered, putting the card away and paying with cash.", "At home, she immediately called the bank’s customer service number on the back of her card. After a short wait, a representative answered.", "\"Hello, this is David from City Bank. How can I help you?\"", "\"Hi, David. My card was just declined at the supermarket. Is there a problem with my bank account?\"", "\"Let me check,\" David said. \"Ah, I see the issue. Our security system flagged an unusual transaction and automatically decided to freeze your card to protect your money.\"", "\"An unusual transaction? I haven't bought anything strange,\" Lisa said, confused.", "\"Sometimes the system is overly cautious,\" David explained. \"To verify your identity and unfreeze the card, I just need to ask you two security questions. What is your mother’s maiden name and the last four digits of your social security number?\"", "Lisa answered them correctly.", "\"Perfect. Your identity is verified. I have unfrozen your card. It will work immediately. I also recommend setting up transaction alerts on your phone so you know what’s happening.\"", "\"Thank you so much, David. That was quick and easy.\"", "\"You’re welcome, Lisa. Have a great day.\"", "Lisa hung up, feeling relieved. She went back to the store, bought her groceries without any issues, and immediately downloaded the bank’s mobile app to set up those alerts."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What happened when Lisa tried to pay at the grocery store?", "Why did the bank freeze her card?", "How did Lisa verify her identity to the representative?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Lisa’s card was... (declined) at the grocery store checkout.", "hints": ["She went home and called... (customer service).", "The representative explained that the bank decided to... (freeze) the card due to an unusual transaction.", "To fix this, David needed to... (verify) her identity.", "Lisa answered two security questions correctly.", "David then... (unfroze) the card immediately.", "He advised her to set up... (alerts) on her phone.", "Lisa went back to the store and paid without any... (problems)."], "vocab": [{"w": "bank account", "tr": "[bæŋk əˈkaʊnt]", "ru": "банковский счет"}, {"w": "to freeze", "tr": "[friːz]", "ru": "замораживать, блокировать"}, {"w": "PIN", "tr": "[pɪn]", "ru": "ПИН-код"}, {"w": "identity", "tr": "[aɪˈdentəti]", "ru": "личность, удостоверение личности"}, {"w": "branch", "tr": "[brɑːntʃ]", "ru": "отделение (банка)"}, {"w": "customer service", "tr": "[ˈkʌstəmə ˈsɜːvɪs]", "ru": "служба поддержки клиентов"}, {"w": "to verify", "tr": "[ˈverɪfaɪ]", "ru": "подтверждать, проверять"}, {"w": "transaction", "tr": "[trænˈzækʃn]", "ru": "транзакция, операция"}]}, {"num": 116, "ru": "Возврат бракованного товара в магазин", "en": "Returning a defective item to a store", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~270 слов.", "story": ["Mark put on his new wireless headphones and pressed play. The left earpiece was completely silent.", "\"Great,\" he sighed. \"A faulty product.\"", "He had bought them just three days ago. He found the box, the charging cable, and most importantly, the paper receipt. He put everything back in the bag and drove to the electronics store.", "At the customer service desk, a young woman named Chloe smiled. \"Hi there, how can I help you today?\"", "\"Hi, I bought these headphones on Tuesday, but the left side isn't working. It’s defective,\" Mark explained, placing the box and the receipt on the counter.", "Chloe inspected the headphones and scanned the receipt. \"I’m sorry to hear that. Since it’s been less than fourteen days, you have two options: a full refund or an exchange for a new pair.\"", "\"I’d prefer an exchange, please. I really like this model,\" Mark said.", "\"Sure thing,\" Chloe replied. \"Let me just process the return in the system.\" She typed on her computer for a moment. \"The warranty covers this, so there’s no restocking fee. Here is your brand new, sealed box.\"", "She handed him a fresh package. \"Would you like to open it and test it right here to be sure?\"", "Mark opened the box, plugged in the charging cable, and checked the connection on his phone. Both sides worked perfectly.", "\"Perfect. Thank you for your help, Chloe.\"", "\"No problem at all. Have a great day!\"", "Mark walked out of the store feeling satisfied. He realized that having the receipt and knowing the store’s return policy made the whole experience quick and stress-free."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What was wrong with the headphones Mark bought?", "What two options did the store offer him?", "Why was the return process quick and easy?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Mark discovered that his new headphones were... (defective).", "hints": ["He gathered the box, cable, and the... (receipt).", "He went to the... (customer service desk) at the electronics store.", "The employee offered him a full... (refund) or an exchange.", "Mark chose an... (exchange) because he liked the model.", "The employee checked the... (warranty) and processed the return.", "Mark tested the new pair in the store to make sure it wasn't... (faulty).", "He left the store feeling... (satisfied) with the service."], "vocab": [{"w": "receipt", "tr": "[rɪˈsiːt]", "ru": "чек"}, {"w": "defective", "tr": "[dɪˈfektɪv]", "ru": "бракованный, неисправный"}, {"w": "refund", "tr": "[ˈriːfʌnd]", "ru": "возврат денег"}, {"w": "exchange", "tr": "[ɪksˈtʃeɪndʒ]", "ru": "обмен"}, {"w": "warranty", "tr": "[ˈwɒrənti]", "ru": "гарантия"}, {"w": "customer service desk", "tr": "[ˈkʌstəmə ˈsɜːvɪs desk]", "ru": "стойка обслуживания клиентов"}, {"w": "to process", "tr": "[ˈprəʊses]", "ru": "оформлять (возврат)"}, {"w": "faulty", "tr": "[ˈfɔːlti]", "ru": "неисправный"}]}, {"num": 117, "ru": "Жалоба на плохое обслуживание в ресторане или отеле", "en": "Complaining about poor service at a restaurant or hotel", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["Emma and her boyfriend, Leo, had been waiting for their food for forty-five minutes. When the waiter finally brought the pasta, it was barely warm.", "Leo took one bite and put his fork down. \"This is cold. And we’ve been waiting forever.\"", "Emma nodded. \"I’m going to speak to the manager. This is unacceptable for a restaurant of this price.\"", "She waved at the waiter. \"Could you please bring the manager to our table?\"", "A few moments later, a man in a neat suit approached. \"Good evening. I’m the manager, David. I understand you have a complaint?\"", "\"Yes,\" Emma said calmly but firmly. \"We ordered our food forty-five minutes ago, and the pasta is cold. We are very disappointed.\"", "David looked at the plate and frowned. \"You are absolutely right. This is not our standard. I sincerely apologize for the long wait and the temperature of the food. It’s completely unacceptable.\"", "He turned to the waiter. \"Please take this back to the kitchen. Tell the chef to prepare two fresh portions immediately, on the house.\"", "He looked back at Emma. \"As compensation for the delay, your entire meal tonight will be free, and I’d like to offer you a complimentary dessert.\"", "Emma’s expression softened. \"Thank you, David. We appreciate you resolving this so quickly.\"", "\"Of course. We value your feedback, and I hope the rest of your evening is much better.\"", "Ten minutes later, fresh, hot pasta arrived, followed by a delicious chocolate cake.", "\"Well,\" Leo smiled, taking a bite of the cake. \"That’s how you handle a complaint.\"", "Emma agreed. The manager’s polite attitude and quick action turned a frustrating experience into a surprisingly good dinner."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Emma decide to speak to the manager?", "How did the manager react to their complaint?", "What compensation did the restaurant offer?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Emma and Leo waited forty-five minutes for their... (food).", "hints": ["When it arrived, the pasta was... (cold).", "Emma calmly asked to speak to the... (manager).", "The manager listened and decided to... (apologize) sincerely.", "He said the service was... (unacceptable) and took the plates away.", "He offered a complimentary meal and dessert as... (compensation).", "Emma appreciated that he managed to... (resolve) the issue quickly.", "The fresh food arrived, and they left positive... (feedback)."], "vocab": [{"w": "complaint", "tr": "[kəmˈpleɪnt]", "ru": "жалоба"}, {"w": "manager", "tr": "[ˈmænɪdʒə]", "ru": "менеджер, управляющий"}, {"w": "cold", "tr": "[kəʊld]", "ru": "холодный"}, {"w": "to apologize", "tr": "[əˈpɒlədʒaɪz]", "ru": "извиняться"}, {"w": "compensation", "tr": "[ˌkɒmpenˈseɪʃn]", "ru": "компенсация"}, {"w": "unacceptable", "tr": "[ˌʌnəkˈseptəbl]", "ru": "неприемлемый"}, {"w": "to resolve", "tr": "[rɪˈzɒlv]", "ru": "решать, улаживать"}, {"w": "feedback", "tr": "[ˈfiːdbæk]", "ru": "обратная связь"}]}, {"num": 118, "ru": "Покупка подержанного автомобиля и торг", "en": "Buying a used car and negotiating the price", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["Alex stood in front of a blue Honda Civic. The online ad said it was in perfect condition, but Alex noticed a long scratch on the rear door.", "\"Nice car, right?\" the seller, a guy named Greg, said, walking up.", "\"It’s okay,\" Alex replied. \"But the ad didn’t mention this scratch. And the mileage is a bit higher than I expected.\"", "Greg shrugged. \"It’s just a small scratch. The engine runs perfectly. Want to take it for a test drive?\"", "\"Sure,\" Alex said.", "The drive was smooth, but Alex could hear a faint rattling noise when he accelerated.", "Back at the parking lot, Alex crossed his arms. \"I like the car, Greg, but it needs some work. The scratch needs buffing, and there’s a rattling sound. I was thinking of offering $4,000.\"", "Greg frowned. \"The asking price is $5,500. $4,000 is too low.\"", "\"I understand,\" Alex said calmly. \"But I will need to pay for a mechanic's inspection before I buy it. If there are hidden issues, it will cost me more. How about $4,800, and I take it as is?\"", "Greg thought for a moment, rubbing his chin. \"Make it $5,000, and I’ll throw in a full tank of gas.\"", "Alex smiled and extended his hand. \"Deal.\"", "They shook hands. Alex took the car to his trusted mechanic the next day. The inspection revealed only minor issues, nothing major.", "Alex drove his new second-hand car home, feeling proud. He realized that a little bit of observation and calm negotiation can save you a lot of money."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What two problems did Alex notice about the car initially?", "What was the seller's initial asking price?", "What did Alex insist on doing before finalizing the purchase?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Alex looked at a... (second-hand) blue Honda Civic.", "hints": ["He noticed a... (scratch) on the door and high mileage.", "He took the car for a... (test drive) and heard a rattling noise.", "During the... (negotiation), Alex offered $4,000.", "The seller wanted $5,500, but they finally agreed on... ($5,000).", "Alex made a... (deal) and got a full tank of gas.", "Before driving it home, he took it for a... (mechanic's inspection).", "He learned that calm negotiation helps to... (lower the price)."], "vocab": [{"w": "second-hand", "tr": "[ˌsekənd ˈhænd]", "ru": "подержанный, б/у"}, {"w": "test drive", "tr": "[test draɪv]", "ru": "пробная поездка"}, {"w": "mileage", "tr": "[ˈmaɪlɪdʒ]", "ru": "пробег"}, {"w": "negotiation", "tr": "[nɪˌɡəʊʃɪˈeɪʃn]", "ru": "переговоры, торг"}, {"w": "scratch", "tr": "[skrætʃ]", "ru": "царапина"}, {"w": "to lower the price", "tr": "[ˈləʊə ðə praɪs]", "ru": "снизить цену"}, {"w": "deal", "tr": "[diːl]", "ru": "сделка, договоренность"}, {"w": "mechanic's inspection", "tr": "[məˈkænɪks ɪnˈspekʃn]", "ru": "осмотр механика"}]}, {"num": 119, "ru": "Столкновение с телефонным мошенником или фишингом", "en": "Dealing with a scam call or phishing email", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~270 слов.", "story": ["Sarah’s phone rang while she was making dinner. The caller ID showed \"Bank Security\".", "\"Hello?\" she answered.", "\"Good afternoon, this is John from your bank’s fraud department,\" a serious voice said. \"We have detected suspicious activity on your account. To secure your funds, I need you to confirm your PIN and your mother’s maiden name.\"", "Sarah paused. Something felt wrong. A legitimate bank would never ask for a PIN over the phone.", "\"Can you give me your employee ID number, please?\" Sarah asked calmly.", "There was a brief silence on the other end. \"Ma'am, this is an urgent security matter. We need those details now.\"", "\"I’m not giving you any personal details,\" Sarah said firmly. \"I will call the bank myself using the number on the back of my card.\"", "\"Fine,\" the voice snapped, and the line went dead. He had decided to hang up.", "Sarah immediately called her actual bank. The real representative checked her account. \"Your account is perfectly safe, Ms. Davis. No unusual activity. You just avoided a scam call.\"", "\"Thank goodness,\" Sarah sighed. \"He tried to get my PIN.\"", "\"Please never share that information,\" the representative advised. \"We also recommend blocking that number and reporting the fraud attempt through our app.\"", "Sarah did exactly that. She blocked the number, reported the incident, and made a mental note: never trust urgent calls asking for passwords.", "Later that evening, she received a phishing email with a similar message, asking her to \"click here to verify her account\". She smiled, deleted it, and moved it to the spam folder. She was ready for them."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What did the caller ask Sarah to confirm?", "Why did Sarah realize the call was a scam?", "What did Sarah do after hanging up the phone?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Sarah received a call from someone claiming to be from... (Bank Security).", "hints": ["The caller asked for her PIN and other... (personal details).", "Sarah felt it was... (suspicious) because a real bank never asks for a PIN.", "She asked for his employee ID, and the caller decided to... (hang up).", "Sarah called her real bank and confirmed her account was... (safe).", "She decided to... (block) the scammer's number.", "She also reported the... (fraud) attempt to the bank.", "Later, she deleted a similar... (phishing) email without clicking anything."], "vocab": [{"w": "scam", "tr": "[skæm]", "ru": "мошенничество, афера"}, {"w": "phishing", "tr": "[ˈfɪʃɪŋ]", "ru": "фишинг (мошенничество через интернет)"}, {"w": "suspicious", "tr": "[səˈspɪʃəs]", "ru": "подозрительный"}, {"w": "to hang up", "tr": "[hæŋ ʌp]", "ru": "повесить трубку"}, {"w": "personal details", "tr": "[ˈpɜːsənl ˈdiːteɪlz]", "ru": "личные данные"}, {"w": "to block", "tr": "[blɒk]", "ru": "блокировать"}, {"w": "fraud", "tr": "[frɔːd]", "ru": "мошенничество, обман"}, {"w": "legitimate", "tr": "[lɪˈdʒɪtɪmət]", "ru": "законный, подлинный"}]}, {"num": 120, "ru": "Онлайн-шоппинг: получение не того товара и общение с поддержкой", "en": "Online shopping: receiving the wrong item and contacting support", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["The delivery box arrived on Tuesday. Emma was excited; she had ordered a blue winter jacket, size medium, for her upcoming trip.", "She tore open the cardboard and pulled out the garment. It was bright red. And it was clearly an extra-large.", "\"Oh, come on!\" Emma groaned. \"I specifically ordered a blue medium.\"", "She checked the shipping label. It had her name and address, but the item description was wrong. She took photos of the red jacket and the label, then opened the online store’s chat window to contact customer support.", "\"Hello! How can I help you today?\" the chat agent, Alex, replied instantly.", "\"Hi, Alex. I received the wrong item in my delivery. I ordered a blue jacket, size M, but I got a red one, size XL.\"", "\"I am so sorry for this mistake,\" Alex replied quickly. \"Let me check your order number. Thank you. I see the error in our warehouse. We will send you a replacement immediately, free of charge.\"", "\"That’s great. What do I do with this red jacket?\" Emma asked.", "\"I will email you a prepaid return label. Just print it, stick it on the box, and drop it off at any post office. You don’t need to pay for the return shipping.\"", "\"Perfect. When will the new jacket arrive?\"", "\"Your replacement will be shipped today. You will receive a tracking number in your email within two hours.\"", "\"Thank you, Alex. You made this very easy.\"", "\"You’re welcome, Emma. We apologize for the inconvenience. Have a great day!\"", "Emma printed the label, packed the red jacket, and felt relieved. The mistake was annoying, but the customer support team fixed it so quickly that she didn't even lose a day of her shopping plans."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What was wrong with the item Emma received?", "How did Emma contact the online store?", "What solution did the customer support agent offer?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Emma received a... (delivery) box with a winter jacket.", "hints": ["She opened it and saw it was the wrong color and... (wrong size).", "She took photos and contacted... (customer support) via chat.", "The agent checked her... (order) and apologized for the warehouse mistake.", "They promised to send a free... (replacement) immediately.", "Emma received a prepaid... (return label) to send the red jacket back.", "The agent also provided a... (tracking number) for the new package.", "Emma was happy because the support team managed to... (resolve) the issue quickly."], "vocab": [{"w": "order", "tr": "[ˈɔːdə]", "ru": "заказ"}, {"w": "delivery", "tr": "[dɪˈlɪvəri]", "ru": "доставка"}, {"w": "wrong size", "tr": "[rɒŋ saɪz]", "ru": "неправильный размер"}, {"w": "customer support", "tr": "[ˈkʌstəmə səˈpɔːt]", "ru": "служба поддержки"}, {"w": "return label", "tr": "[rɪˈtɜːn ˈleɪbl]", "ru": "этикетка для возврата"}, {"w": "replacement", "tr": "[rɪˈpleɪsmənt]", "ru": "замена"}, {"w": "tracking number", "tr": "[ˈtrækɪŋ ˈnʌmbə]", "ru": "номер для отслеживания"}, {"w": "to apologize", "tr": "[əˈpɒlədʒaɪz]", "ru": "извиняться"}]}, {"num": 121, "ru": "Потеря багажа в аэропорту и общение со стойкой регистрации", "en": "Dealing with lost luggage at the airport", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["Anna stood in the baggage claim area in Paris, watching the carousel spin. Her flight had landed an hour ago, but her blue suitcase was nowhere to be seen.", "\"It’s not here,\" she said to her friend, Mark, feeling a knot in her stomach. \"My clothes, my laptop, everything is in that bag.\"", "\"Let’s go to the lost property desk,\" Mark suggested calmly. \"Don’t panic. Airlines lose bags all the time, and they usually find them.\"", "They walked to the airline’s service counter. The agent, a polite woman named Sophie, typed on her keyboard.", "\"I’m sorry for the inconvenience,\" Sophie said. \"Your luggage was delayed. It’s still in London. But we have a tracking number for it.\"", "\"When will it arrive?\" Anna asked, worried.", "\"Most likely tomorrow morning. We will deliver it directly to your hotel,\" Sophie explained. \"In the meantime, I will give you a claim form. You can buy essential items like toiletries and a change of clothes, and the airline will compensate you. Keep all your receipts for reimbursement.\"", "Anna filled out the form, providing her hotel address and phone number. Sophie handed her a small kit with a toothbrush and some basic toiletries.", "\"Thank you, Sophie. I hope it arrives tomorrow,\" Anna said, feeling slightly better.", "\"Me too,\" Sophie smiled. \"You can check the tracking number on our website anytime.\"", "The next day at 10 AM, the hotel receptionist called Anna’s room. \"Your suitcase has arrived.\"", "Anna rushed downstairs. Seeing her blue bag, she let out a huge sigh of relief. The delay was stressful, but the airline’s clear process made it manageable."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Where was Anna when she realized her suitcase was missing?", "What did the airline agent offer to help Anna while she waited?", "When and how did Anna finally get her luggage back?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Anna waited at the... (baggage claim), but her suitcase didn't appear.", "hints": ["She and Mark went to the... (lost property) desk.", "The agent explained that the luggage was... (delayed) in London.", "She gave Anna a... (tracking number) and a claim form.", "Anna was told to keep receipts for... (reimbursement) of essential items.", "The airline promised to deliver the bag to her... (hotel).", "The next morning, the receptionist called to say the suitcase had... (arrived).", "Anna was relieved that the process was... (manageable)."], "vocab": [{"w": "baggage claim", "tr": "[ˈbæɡɪdʒ kleɪm]", "ru": "зона выдачи багажа"}, {"w": "lost property", "tr": "[lɒst ˈprɒpəti]", "ru": "бюро находок"}, {"w": "tracking number", "tr": "[ˈtrækɪŋ ˈnʌmbə]", "ru": "номер для отслеживания"}, {"w": "essential", "tr": "[ɪˈsenʃl]", "ru": "необходимый, самый важный"}, {"w": "to compensate", "tr": "[ˈkɒmpenseɪt]", "ru": "компенсировать"}, {"w": "delayed", "tr": "[dɪˈleɪd]", "ru": "задержанный"}, {"w": "claim form", "tr": "[kleɪm fɔːm]", "ru": "бланк заявления (о потере)"}, {"w": "reimbursement", "tr": "[ˌriːɪmˈbɜːsmənt]", "ru": "возмещение расходов"}]}, {"num": 122, "ru": "Дорожное путешествие с друзьями: планирование и форс-мажоры", "en": "A road trip with friends: planning and unexpected detours", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["\"Are we there yet?\" Leo asked from the back seat, eating his third bag of chips.", "\"Leo, we’ve been driving for only two hours,\" Sarah replied, gripping the steering wheel. \"We still have three hours to the coast.\"", "Their road trip was supposed to be perfect. They had planned the route, packed plenty of snacks, and made a great playlist. But then, the GPS signal suddenly disappeared.", "\"I think we should have taken the highway,\" Leo said.", "\"I’m navigating fine,\" Sarah insisted, turning onto a narrow dirt road. \"This is a shortcut.\"", "Ten minutes later, there was a loud bang. The car pulled to the side.", "\"Great,\" Sarah sighed, looking out the window. \"We have a flat tyre.\"", "Leo groaned. \"I told you! Now we’re going to have a breakdown in the middle of nowhere.\"", "\"Stop arguing, both of you,\" said Mike, who was sitting in the front passenger seat. \"Panicking won’t fix the tyre. Let’s resolve this together.\"", "Mike grabbed the toolbox from the trunk. \"Leo, hold the flashlight. Sarah, help me loosen these bolts.\"", "Working together, they managed to change the tyre in twenty minutes. They were covered in dirt, but the car was ready to go.", "\"Okay, my bad,\" Sarah admitted, starting the engine. \"No more 'shortcuts'. Let’s stick to the main road.\"", "\"Agreed,\" Leo said, handing her a bottle of water. \"And I’ll navigate from my phone using offline maps.\"", "They arrived at the beach two hours late, but they were laughing about the adventure. They realized that a road trip isn’t about a perfect plan; it’s about how you handle the unexpected detours together."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Sarah decide to take a dirt road?", "What happened ten minutes after they left the main road?", "How did the friends resolve the problem with the car?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, the friends were on a... (road trip) to the coast.", "hints": ["The GPS signal disappeared, and Sarah decided to take a... (shortcut).", "Soon, they got a... (flat tyre) on a narrow dirt road.", "Leo started to complain, but Mike told them to stop... (arguing).", "They worked together to... (resolve) the issue and change the wheel.", "Sarah admitted her mistake and agreed to stick to the... (main road).", "Leo offered to... (navigate) using offline maps.", "They arrived late but learned that handling... (detours) together is what matters."], "vocab": [{"w": "road trip", "tr": "[rəʊd trɪp]", "ru": "автомобильное путешествие"}, {"w": "detour", "tr": "[ˈdiːtʊə]", "ru": "объезд, отклонение от маршрута"}, {"w": "flat tyre", "tr": "[flæt ˈtaɪə]", "ru": "проколотая шина"}, {"w": "to navigate", "tr": "[ˈnævɪɡeɪt]", "ru": "ориентироваться, прокладывать маршрут"}, {"w": "snacks", "tr": "[snæks]", "ru": "закуски, снеки"}, {"w": "breakdown", "tr": "[ˈbreɪkdaʊn]", "ru": "поломка"}, {"w": "to argue", "tr": "[ˈɑːɡjuː]", "ru": "спорить"}, {"w": "to resolve", "tr": "[rɪˈzɒlv]", "ru": "решать, улаживать"}]}, {"num": 123, "ru": "Проживание в Airbnb и общение с хозяином жилья", "en": "Staying in an Airbnb and communicating with the host", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~270 слов.", "story": ["Emma arrived at the Airbnb apartment in Rome at 11 PM. She was exhausted and just wanted to sleep. She walked up to the front door and looked for the lockbox.", "\"Okay, the message said the key code is 4582,\" she muttered, pressing the buttons.", "The light blinked red. Access denied.", "She tried again. Red light.", "\"Oh no,\" Emma sighed. She pulled out her phone and opened the Airbnb app to message her host, Marco.", "\"Hi Marco, I’m at the apartment, but the key code isn’t working. Could you please help?\"", "She waited nervously. It was late, and she didn’t want to be stuck on the street.", "Two minutes later, her phone buzzed.", "\"Hi Emma! I’m so sorry. I gave you the old code by mistake. The new code is 7739. Also, the Wi-Fi password is on the fridge. Let me know if you need anything else!\"", "Emma typed in 7739. The light turned green, and the door clicked open.", "\"Thank you so much, Marco!\" she replied.", "Inside, the accommodation was clean and cozy, exactly like the photos. She found the Wi-Fi password, connected her phone, and collapsed onto the comfortable bed.", "The next morning, the hot water stopped working. Emma messaged Marco again. Instead of panicking, he immediately called a plumber and offered to deduct 20% from her stay as compensation for the inconvenience.", "By the afternoon, everything was fixed. When it was time to leave, Emma happily left a 5-star review. \"Marco is a superhost! He responds instantly and truly cares about his guests.\""], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What problem did Emma face when she arrived at the apartment?", "How quickly did the host respond to her message?", "What happened the next morning, and how did the host handle it?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Emma arrived late and tried to... (check-in) using the lockbox.", "hints": ["The... (key code) she had didn't work.", "She messaged her... (host), Marco, through the app.", "He quickly replied with the correct code and the... (Wi-Fi password).", "The next morning, the hot water stopped working, but Marco helped to... (troubleshoot) it.", "He even offered a discount for the inconvenience with the... (amenities).", "Emma enjoyed her... (accommodation) and felt well taken care of.", "Before leaving, she left a positive 5-star... (review)."], "vocab": [{"w": "host", "tr": "[həʊst]", "ru": "хозяин, арендодатель"}, {"w": "check-in", "tr": "[ˈtʃek ɪn]", "ru": "заселение"}, {"w": "key code", "tr": "[kiː kəʊd]", "ru": "код от замка"}, {"w": "amenities", "tr": "[əˈmiːnətiz]", "ru": "удобства"}, {"w": "Wi-Fi password", "tr": "[ˈwaɪ faɪ ˈpɑːswɜːd]", "ru": "пароль от Wi-Fi"}, {"w": "to troubleshoot", "tr": "[ˈtrʌblʃuːt]", "ru": "устранять неполадки"}, {"w": "review", "tr": "[rɪˈvjuː]", "ru": "отзыв"}, {"w": "accommodation", "tr": "[əˌkɒməˈdeɪʃn]", "ru": "жилье, размещение"}]}, {"num": 124, "ru": "Ориентация в общественном транспорте незнакомого города", "en": "Navigating public transportation in a foreign city", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["Tom stood in the busy Tokyo subway station, staring at the colorful map on the wall. He needed to get to the Shinjuku district, but the map was entirely in Japanese.", "\"Okay, don’t panic,\" he told himself. \"Find the English letters.\"", "He walked to the ticket machine, selected the English language option, and bought a ticket for the Yamanote Line.", "He boarded the train, feeling proud of himself. But after three stops, he looked out the window and realized something was wrong. The signs were for a completely different line.", "\"I took the wrong train,\" he muttered, feeling completely confused.", "The train stopped, and Tom quickly got off. He looked around the platform. A friendly-looking elderly woman was waiting for her train.", "\"Excuse me,\" Tom said, bowing slightly. \"Do you speak English?\"", "The woman smiled warmly. \"A little bit. Can I help you?\"", "\"Yes, please. I need to go to Shinjuku, but I think I’m on the wrong route.\"", "\"Ah, Shinjuku,\" she said, pointing down the platform. \"You need to go back two stops and make a transfer to the Chuo Line. It’s the orange one.\"", "\"Two stops back, then transfer to the orange line. Thank you so much!\" Tom said, bowing again.", "He followed her instructions carefully. He bought a new ticket, made the transfer, and finally saw the sign for Shinjuku.", "When he walked out of the station into the bright city streets, he let out a long breath. Navigating public transport in a foreign city was challenging, but asking for directions and staying calm made all the difference."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why was Tom confused at the subway station?", "How did Tom realize he was on the wrong train?", "What advice did the elderly woman give him?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Tom was in a Tokyo... (subway) station and looked at the map.", "hints": ["He used the English option on the... (ticket machine) to buy a ticket.", "He boarded the train but soon realized he was on the wrong... (route).", "Feeling... (confused), he decided to get off at the next stop.", "He decided to... (ask for directions) from an elderly woman.", "She told him to go back two stops and make a... (transfer).", "Tom followed her instructions and finally arrived in... (Shinjuku).", "He learned that staying calm and asking for help is the best way to... (navigate)."], "vocab": [{"w": "subway", "tr": "[ˈsʌbweɪ]", "ru": "метро"}, {"w": "ticket machine", "tr": "[ˈtɪkɪt məˈʃiːn]", "ru": "автомат по продаже билетов"}, {"w": "route", "tr": "[ruːt]", "ru": "маршрут"}, {"w": "to get off", "tr": "[ɡet ɒf]", "ru": "выходить (из транспорта)"}, {"w": "transfer", "tr": "[ˈtrænsfɜː]", "ru": "пересадка"}, {"w": "map", "tr": "[mæp]", "ru": "карта"}, {"w": "confused", "tr": "[kənˈfjuːzd]", "ru": "растерянный, сбитый с толку"}, {"w": "to ask for directions", "tr": "[ɑːsk fə dɪˈrekʃnz]", "ru": "спрашивать дорогу"}]}, {"num": 125, "ru": "Культурные недоразумения и языковой барьер за границей", "en": "Cultural faux pas and language barriers while traveling", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~270 слов.", "story": ["Mark was enjoying his first dinner in a traditional restaurant in Bangkok. The food was amazing, and the atmosphere was lively.", "When the waiter brought his bill, Mark wanted to show his appreciation. In his home country, giving a thumbs-up meant \"great job.\" So, he smiled and gave the waiter a big thumbs-up.", "The waiter’s smile instantly disappeared. He looked confused and slightly offended, then walked away quickly without saying a word.", "Mark turned to his friend, Lisa. \"What did I do? Was the food bad?\"", "Lisa shook her head, trying not to laugh. \"Mark, in Thailand, the thumbs-up gesture can be considered rude, like giving someone the middle finger in the West. It was a cultural faux pas.\"", "Mark’s eyes widened in horror. \"Oh no! I didn’t mean to offend him. I thought I was being polite!\"", "\"Don’t worry,\" Lisa said. \"It’s a common misunderstanding for tourists. Just go and apologize.\"", "Mark stood up, walked to the waiter, and put his hands together in a traditional 'wai' gesture, bowing his head slightly.", "\"I am so sorry,\" Mark said slowly. \"I am a tourist. I did not know the custom. The food was excellent.\"", "The waiter’s face softened, and he smiled warmly. \"No problem, sir. Thank you. We appreciate tourists who try to learn our culture.\"", "Mark returned to the table, feeling much better. \"That was a close call,\" he whispered.", "\"Indeed,\" Lisa agreed. \"But that’s the best part of traveling. You make mistakes, you apologize, and you learn something new about the world.\""], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What gesture did Mark use to show his appreciation to the waiter?", "Why did the waiter get offended?", "How did Mark apologize for his mistake?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Mark was having dinner in a traditional restaurant in... (Bangkok).", "hints": ["He gave the waiter a thumbs-up... (gesture) to show the food was good.", "However, this is considered rude there, and the waiter felt... (offended).", "Lisa explained that it was a cultural... (faux pas).", "Mark felt terrible and didn't want to... (misunderstand) the local customs.", "He went to the waiter and used a traditional bow to... (apologize).", "The waiter smiled and accepted his... (apology).", "Mark learned that being... (polite) means learning about local traditions."], "vocab": [{"w": "faux pas", "tr": "[ˌfəʊ ˈpɑː]", "ru": "оплошность, бестактность"}, {"w": "gesture", "tr": "[ˈdʒestʃə]", "ru": "жест"}, {"w": "to offend", "tr": "[əˈfend]", "ru": "обижать, оскорблять"}, {"w": "misunderstanding", "tr": "[ˌmɪsʌndəˈstændɪŋ]", "ru": "недоразумение"}, {"w": "to apologize", "tr": "[əˈpɒlədʒaɪz]", "ru": "извиняться"}, {"w": "custom", "tr": "[ˈkʌstəm]", "ru": "обычай, традиция"}, {"w": "polite", "tr": "[pəˈlaɪt]", "ru": "вежливый"}, {"w": "to learn", "tr": "[lɜːn]", "ru": "учить, узнавать"}]}, {"num": 126, "ru": "Планирование бюджетного отпуска", "en": "Planning a budget-friendly vacation", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["\"We really need a vacation,\" Julia said, looking at her computer screen. \"But we only have $1,000 saved up. Is that even enough?\"", "Her husband, David, smiled. \"It’s enough if we are smart about it. We just need to plan a budget-friendly vacation.\"", "\"Where can we go for that price?\" Julia asked skeptically.", "\"Let’s look for flight deals,\" David said, opening a travel website. \"If we are flexible with the dates, we can find cheap tickets to Portugal.\"", "After an hour of searching, they found round-trip tickets for $400. \"Okay, that leaves $600 for accommodation and expenses,\" Julia noted.", "\"Instead of a hotel, let’s book an affordable Airbnb with a kitchen,\" David suggested. \"That way, we can cook breakfast and some dinners instead of eating at restaurants every day.\"", "\"Good idea,\" Julia agreed. \"I’ll make a detailed itinerary. We can focus on free activities, like hiking, visiting public beaches, and walking tours.\"", "They booked everything in advance to avoid last-minute price hikes. They packed their own snacks for the flight and used public transport instead of taxis.", "When they arrived in Lisbon, the city was beautiful. They spent their days exploring historic neighborhoods and eating delicious, cheap street food.", "On their last night, they sat by the river, watching the sunset.", "\"I can’t believe we did this for under $1,000,\" Julia said, sipping a glass of local wine.", "\"See?\" David smiled. \"You don’t need to be rich to travel. You just need to save up, plan carefully, and be creative with your expenses.\"", "Julia nodded. It was the best, most stress-free vacation they had ever had."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["How much money did Julia and David have for their vacation?", "How did they save money on accommodation and food?", "What kind of activities did they include in their itinerary?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Julia and David wanted a vacation but only had a limited... (budget).", "hints": ["David suggested looking for... (flight deals) to Portugal.", "They decided to book an... (affordable) Airbnb with a kitchen to cook meals.", "This helped them reduce their daily... (expenses) on restaurants.", "They made a detailed... (itinerary) focusing on free activities like hiking.", "They made sure to... (book in advance) to avoid high prices.", "During the trip, they used public transport and enjoyed the city.", "They realized that you can travel well if you... (save up) and plan carefully."], "vocab": [{"w": "budget", "tr": "[ˈbʌdʒɪt]", "ru": "бюджет"}, {"w": "accommodation", "tr": "[əˌkɒməˈdeɪʃn]", "ru": "жилье, размещение"}, {"w": "flight deals", "tr": "[flaɪt diːlz]", "ru": "выгодные предложения на авиабилеты"}, {"w": "to save up", "tr": "[seɪv ʌp]", "ru": "копить (деньги)"}, {"w": "itinerary", "tr": "[aɪˈtɪnərəri]", "ru": "маршрут, план поездки"}, {"w": "affordable", "tr": "[əˈfɔːdəbl]", "ru": "доступный по цене"}, {"w": "to book in advance", "tr": "[bʊk ɪn ədˈvɑːns]", "ru": "бронировать заранее"}, {"w": "expenses", "tr": "[ɪkˈspensɪz]", "ru": "расходы"}]}, {"num": 127, "ru": "Организация званого ужина для друзей", "en": "Hosting a dinner party for friends", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["Sarah was nervous. Tonight, she was hosting a dinner party for four of her closest friends. She had spent all afternoon preparing the food.", "\"Is the vegetarian pasta ready?\" she asked her roommate, Tom, who was setting the table.", "\"Yes, it’s in the oven. And I remembered that Mark is allergic to nuts, so I double-checked the dessert ingredients,\" Tom replied.", "\"Perfect. Thank you for helping with the dietary restrictions,\" Sarah said, wiping her forehead.", "At 7 PM, the doorbell rang. Her friends arrived, bringing a bottle of wine and a bouquet of flowers. The atmosphere was immediately warm and cheerful.", "They sat down to eat. The pasta was delicious, and everyone was chatting and laughing. Sarah felt proud of her cooking.", "Then, disaster struck. As Sarah reached for the salt, her elbow knocked over a full glass of red wine. It spilled all over the white tablecloth and onto the floor.", "\"Oh no!\" Sarah gasped, freezing in panic. \"I’m so sorry, everyone!\"", "For a second, there was silence. Then, Mark grabbed some napkins. \"Don’t worry, Sarah! It’s just a tablecloth. We can laugh it off.\"", "\"Here, let me help,\" Lisa said, rushing to the kitchen for a towel.", "Within two minutes, the spill was cleaned up, and Tom brought out a fresh tablecloth.", "\"See?\" Tom smiled. \"No harm done. Now, who wants dessert?\"", "The rest of the evening was perfect. Sarah realized that hosting isn’t about everything being flawless. It’s about the people, the conversation, and the ability to laugh when things go wrong."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why was Sarah nervous before her friends arrived?", "How did Tom help Sarah prepare for the dinner?", "What accident happened during the dinner, and how did the friends react?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Sarah was hosting a... (dinner party) for her friends.", "hints": ["She spent the afternoon... (preparing) the food.", "Tom helped by checking the ingredients for... (dietary restrictions).", "When the friends arrived, the... (atmosphere) was warm and cheerful.", "During dinner, Sarah accidentally managed to... (spill) red wine on the table.", "She panicked, but her friends helped clean it up and decided to... (laugh it off).", "Tom quickly brought out a fresh tablecloth and served the... (dessert).", "Sarah learned that a good party is about people, not... (perfection)."], "vocab": [{"w": "dinner party", "tr": "[ˈdɪnə ˈpɑːti]", "ru": "званый ужин"}, {"w": "to invite", "tr": "[ɪnˈvaɪt]", "ru": "приглашать"}, {"w": "dietary restrictions", "tr": "[ˈdaɪətəri rɪˈstrɪkʃnz]", "ru": "диетические ограничения"}, {"w": "to prepare", "tr": "[prɪˈpeə]", "ru": "готовить, подготавливать"}, {"w": "dessert", "tr": "[dɪˈzɜːt]", "ru": "десерт"}, {"w": "to spill", "tr": "[spɪl]", "ru": "проливать"}, {"w": "to laugh it off", "tr": "[lɑːf ɪt ɒf]", "ru": "отшутиться, легко отнестись к ошибке"}, {"w": "atmosphere", "tr": "[ˈætməsfɪə]", "ru": "атмосфера"}]}, {"num": 128, "ru": "Присутствие на свадьбе друга", "en": "и произнесение тоста) (Attending a friend's wedding and giving a toast", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["Leo adjusted his tie for the tenth time. He was the best man at his best friend David’s wedding, and it was almost time for his speech.", "\"You look like you’re going to be sick,\" David said, walking over with a smile.", "\"I am,\" Leo admitted. \"Public speaking is my biggest fear. What if I forget my lines? What if I make the bride cry?\"", "David laughed and patted him on the shoulder. \"Just speak from the heart. Everyone here loves you. You don’t need to memorize every single word.\"", "\"Easy for you to say. You’re not the one holding the microphone,\" Leo sighed.", "He pulled a small piece of paper from his pocket. He had written down a few key points and one funny story about their college days.", "An hour later, the music stopped, and the DJ announced, \"And now, a few words from the best man, Leo.\"", "Leo walked to the front of the room. His hands were shaking slightly as he took the microphone. He looked at David and his new wife, Sarah, who were smiling warmly at him.", "\"Hi everyone,\" Leo began, his voice a bit shaky at first. \"For those who don’t know me, I’m Leo. I’ve known David since we were ten.\"", "He took a deep breath and looked at his notes. He told the funny story about their first road trip. The room erupted in laughter. The tension left his body.", "\"To David and Sarah,\" Leo said, raising his glass. \"May your life together be as amazing as you both are. Cheers!\"", "\"Cheers!\" the guests shouted, clapping loudly.", "Leo returned to his seat, feeling a massive wave of relief. He hadn’t been perfect, but his heartfelt words had made the moment truly special."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why was Leo feeling nervous before the dinner?", "What advice did the groom, David, give to Leo?", "How did the guests react to Leo’s speech?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Leo was the best man at his friend's... (wedding).", "hints": ["He was very... (nervous) about giving a speech.", "David, the... (groom), told him to just speak from the heart.", "Leo had a small piece of paper with key points so he didn't have to... (memorize) everything.", "He started his... (speech) with a funny story about their college days.", "The guests laughed, and Leo felt the tension... (leave) his body.", "He raised his glass for a... (toast) to the happy couple.", "The guests clapped, and Leo felt proud of his... (heartfelt) words."], "vocab": [{"w": "wedding", "tr": "[ˈwedɪŋ]", "ru": "свадьба"}, {"w": "groom", "tr": "[ɡruːm]", "ru": "жених"}, {"w": "bride", "tr": "[braɪd]", "ru": "невеста"}, {"w": "speech", "tr": "[spiːtʃ]", "ru": "речь"}, {"w": "toast", "tr": "[təʊst]", "ru": "тост"}, {"w": "nervous", "tr": "[ˈnɜːvəs]", "ru": "нервничающий"}, {"w": "to memorize", "tr": "[ˈmeməraɪz]", "ru": "заучивать наизусть"}, {"w": "heartfelt", "tr": "[ˈhɑːtfelt]", "ru": "искренний, сердечный"}]}, {"num": 129, "ru": "Вступление в местный клуб", "en": "книжный, беговой и т.д.) (Joining a local club or community group", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~270 слов.", "story": ["Mark stood outside the community center, feeling a bit nervous. He had decided to join the local running club, but he hadn't run in five years.", "\"First time?\" a cheerful voice asked.", "Mark turned to see a woman in bright running shoes. \"Is it that obvious?\" he laughed.", "\"A little,\" she smiled. \"I'm Sarah. Don't worry, we have groups for all speeds. Are you a beginner?\"", "\"Definitely,\" Mark admitted. \"I just want to get fit and maybe make some friends. My main hobby used to be sitting on the couch.\"", "Sarah laughed. \"Well, you're in the right place. We attend meetings every Tuesday and Thursday. The best part isn't the running; it's the chance to socialize afterward.\"", "They walked inside together. The group was already gathering. A tall man named David, a regular member, came over and handed Mark a club T-shirt.", "\"Welcome, Mark! We start with a ten-minute warm-up, then a slow two-mile run. If you need to walk, just walk. No pressure,\" David explained.", "The run was harder than Mark expected, but nobody left him behind. Sarah ran beside him, chatting about their favorite local cafes. When they finished, the whole group went to a nearby coffee shop.", "Mark sat with a warm latte, feeling tired but happy. He realized that joining the club wasn't just about exercise. It was about finding a welcoming community that shared his new interest. He couldn't wait for Thursday."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why was Mark nervous outside the community center?", "What did Sarah say was the best part of the running club?", "How did the regular members treat Mark during the run?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Mark decided to... (join) the local running club.", "hints": ["He met Sarah, who told him not to worry about being a... (beginner).", "She explained that they... (attend) meetings twice a week.", "The main goal was to exercise and... (socialize) afterward.", "A regular member named David gave him a club... (T-shirt).", "During the run, Sarah stayed with him and they talked about their... (hobby).", "Afterward, the group went to a coffee shop, which felt very... (welcoming).", "Mark realized the club was a great... (community)."], "vocab": [{"w": "local club", "tr": "[ˈləʊkl klʌb]", "ru": "местный клуб"}, {"w": "to join", "tr": "[dʒɔɪn]", "ru": "вступать, присоединяться"}, {"w": "hobby", "tr": "[ˈhɒbi]", "ru": "хобби, увлечение"}, {"w": "to attend", "tr": "[əˈtend]", "ru": "посещать"}, {"w": "regular member", "tr": "[ˈreɡjələ ˈmembə]", "ru": "постоянный участник"}, {"w": "to socialize", "tr": "[ˈsəʊʃəlaɪz]", "ru": "общаться"}, {"w": "beginner", "tr": "[bɪˈɡɪnə]", "ru": "новичок"}, {"w": "welcoming", "tr": "[ˈwelkəmɪŋ]", "ru": "гостеприимный, дружелюбный"}]}, {"num": 130, "ru": "Обучение игре на музыкальном инструменте во взрослом возрасте", "en": "Learning to play a musical instrument as an adult", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~275 слов.", "story": ["Emma stared at the acoustic guitar in her living room. She had bought it a month ago, dreaming of playing her favorite songs. But her fingers hurt, and the chords sounded terrible.", "\"This is so frustrating,\" she muttered, putting the guitar back in its case.", "Her teacher, Mr. Davis, noticed her disappointment during their next lesson. \"Having trouble with the F chord?\" he asked gently.", "\"My fingers feel like they're going to break,\" Emma sighed. \"Maybe I'm too old to learn a new musical instrument. Kids learn so fast.\"", "Mr. Davis smiled. \"Emma, adults have an advantage: patience and discipline. Kids quit when it gets hard. You just need to practice a little bit every day, not for hours at a time.\"", "\"How much is 'a little bit'?\" she asked.", "\"Fifteen minutes,\" he replied. \"Just fifteen minutes of focused practice. Don't worry about playing a whole song yet. Just focus on switching between two chords smoothly.\"", "Emma decided to try his advice. That evening, she set a timer for fifteen minutes. She practiced switching from C to G. It was clumsy at first, but by the end of the timer, her fingers moved a bit faster.", "She did this every day after work. Two weeks later, during her lesson, she played a simple song from start to finish without stopping.", "\"Wow,\" Mr. Davis said, clapping. \"Look at your progress!\"", "Emma smiled, looking at her calloused fingertips. They didn't hurt anymore. She realized that learning as an adult wasn't about natural talent; it was about consistency and giving yourself permission to be a beginner."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Emma want to put her guitar away?", "What advantage did Mr. Davis say adults have over kids?", "How long did Emma practice each day according to the teacher's advice?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Emma bought a... (guitar) but found it hard to play.", "hints": ["She thought learning a... (musical instrument) as an adult was too difficult.", "Her teacher told her that adults have... (patience) and discipline.", "He advised her to... (practice) for just fifteen minutes a day.", "She focused on switching between two... (chords) smoothly.", "After two weeks, she could play a simple song without... (stopping).", "Her teacher praised her... (progress).", "Emma learned that consistency is the key to... (improve)."], "vocab": [{"w": "musical instrument", "tr": "[ˈmjuːzɪkl ˈɪnstrəmənt]", "ru": "музыкальный инструмент"}, {"w": "guitar", "tr": "[ɡɪˈtɑː]", "ru": "гитара"}, {"w": "to practice", "tr": "[ˈpræktɪs]", "ru": "практиковаться, заниматься"}, {"w": "chord", "tr": "[kɔːd]", "ru": "аккорд"}, {"w": "frustrating", "tr": "[ˈfrʌstreɪtɪŋ]", "ru": "разочаровывающий, раздражающий"}, {"w": "to improve", "tr": "[ɪmˈpruːv]", "ru": "улучшаться, совершенствоваться"}, {"w": "lesson", "tr": "[ˈlesn]", "ru": "урок"}, {"w": "progress", "tr": "[ˈprəʊɡres]", "ru": "прогресс, продвижение"}]}, {"num": 131, "ru": "Создание домашнего сада или уход за комнатными растениями", "en": "Starting a home garden or caring for houseplants", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["Tom proudly placed a large Monstera plant in the corner of his living room. \"You're going to make this place look amazing,\" he told it.", "For the first week, Tom watered it every single day. He wanted it to grow fast. But soon, the large green leaves started to turn yellow and droop.", "\"Oh no, what did I do?\" Tom panicked. He called his friend Lisa, who had a jungle of plants in her apartment.", "\"Let me see,\" Lisa said over a video call. She looked closely at the screen. \"Tom, the soil is soaking wet. Are you watering it every day?\"", "\"Yes, I want it to be happy,\" Tom admitted.", "Lisa laughed gently. \"You're loving it to death. Most houseplants prefer to dry out a bit between waterings. You are overwatering it, and the roots are rotting.\"", "\"Can I save it?\" Tom asked, worried.", "\"Yes, but you need to repot it,\" Lisa explained. \"Get some fresh, well-draining soil and a pot with holes at the bottom. And move it to a spot with bright, indirect sunlight.\"", "Tom went to the garden center immediately. He carefully took the plant out, trimmed the bad roots, and put it in new soil. He placed it near the window and made a strict rule: water only when the top inch of soil felt dry.", "It took a month, but slowly, a new, bright green leaf unfurled.", "\"Look at that!\" Tom texted Lisa with a photo.", "\"See?\" she replied. \"Plants don't need constant attention. They just need the right conditions and a little patience.\"", "Tom smiled, finally understanding that caring for a plant was about balance, not just pouring water."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Tom's Monstera leaves start to turn yellow?", "What mistake was Tom making with the plant?", "What advice did Lisa give him to save the plant?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Tom bought a large... (houseplant) for his living room.", "hints": ["He decided to... (water) it every single day.", "Soon, the leaves turned yellow because he started to... (overwater) it.", "His friend Lisa explained that the... (soil) was too wet.", "She told him to... (repot) the plant into a new pot with holes.", "He moved it to a place with good... (sunlight).", "Tom learned to wait until the soil was dry before watering again.", "With a little... (patience), the plant started to... (thrive)."], "vocab": [{"w": "houseplant", "tr": "[ˈhaʊsplɑːnt]", "ru": "комнатное растение"}, {"w": "to water", "tr": "[ˈwɔːtə]", "ru": "поливать"}, {"w": "sunlight", "tr": "[ˈsʌnlaɪt]", "ru": "солнечный свет"}, {"w": "to repot", "tr": "[ˌriːˈpɒt]", "ru": "пересаживать (в другой горшок)"}, {"w": "soil", "tr": "[sɔɪl]", "ru": "почва, грунт"}, {"w": "to thrive", "tr": "[θraɪv]", "ru": "процветать, хорошо расти"}, {"w": "overwater", "tr": "[ˌəʊvəˈwɔːtə]", "ru": "переливать (растение)"}, {"w": "patience", "tr": "[ˈpeɪʃns]", "ru": "терпение"}]}, {"num": 132, "ru": "Волонтерство в местном приюте для животных или food bank", "en": "Volunteering at a local shelter or food bank", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~275 слов.", "story": ["\"I thought volunteering would be just playing with puppies,\" Kate said, scrubbing a concrete floor at the local animal shelter.", "Her friend, Ben, laughed, handing her a mop. \"It is playing with puppies. But first, you have to clean their cages. They can't be adopted if their space isn't clean.\"", "Kate sighed but kept scrubbing. She had signed up to volunteer every Saturday morning. It was hard work, and she smelled like bleach, but she loved being part of the community effort.", "After an hour of cleaning, the shelter manager, Mrs. Davis, handed Kate a leash. \"You've earned this. This is Barnaby. He’s been here for three months and is very shy. He needs a gentle walk.\"", "Kate walked into the kennel. Barnaby, a medium-sized mixed breed, hid in the back corner. Kate sat on the floor and waited quietly. Slowly, Barnaby crept forward and sniffed her hand.", "\"Hey, buddy,\" Kate whispered. \"Let's go for a walk.\"", "They walked around the shelter's fenced yard. Barnaby didn't pull on the leash; he just stayed close to Kate's side. For twenty minutes, it was just the two of them.", "When they returned, a family was looking at the dogs. The little girl pointed at Barnaby. \"That one, Mom! The quiet one.\"", "Kate watched as the family filled out the adoption papers. Barnaby was finally going home.", "\"See?\" Ben said, bumping her shoulder. \"Tired and smelly, but worth it.\"", "Kate smiled, watching Barnaby leave. \"Absolutely. It’s the most rewarding feeling in the world.\""], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What was Kate's initial expectation about volunteering?", "Why did Kate have to clean the cages first?", "What happened to the shy dog, Barnaby, at the end of the day?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Kate decided to... (volunteer) at the local animal shelter.", "hints": ["She realized she had to... (clean) the cages before playing with the dogs.", "After cleaning, the manager gave her a leash to... (walk) a shy dog named Barnaby.", "Kate sat quietly and gained the dog's... (trust).", "Later, a family came and decided to... (adopt) Barnaby.", "Kate watched them fill out the... (papers).", "Even though the work was hard, she felt it was very... (rewarding).", "She felt proud to help her... (community)."], "vocab": [{"w": "to volunteer", "tr": "[ˌvɒlənˈtɪə]", "ru": "работать волонтером"}, {"w": "animal shelter", "tr": "[ˈænɪml ˈʃeltə]", "ru": "приют для животных"}, {"w": "to walk", "tr": "[wɔːk]", "ru": "выгуливать"}, {"w": "to clean", "tr": "[kliːn]", "ru": "убирать, чистить"}, {"w": "rewarding", "tr": "[rɪˈwɔːdɪŋ]", "ru": "приносящий удовлетворение"}, {"w": "donation", "tr": "[dəʊˈneɪʃn]", "ru": "пожертвование"}, {"w": "to adopt", "tr": "[əˈdɒpt]", "ru": "забрать (животное) домой"}, {"w": "community", "tr": "[kəˈmjuːnəti]", "ru": "сообщество"}]}, {"num": 133, "ru": "Реальность жизни цифрового кочевника или работы из кафе", "en": "The reality of being a digital nomad or working from a cafe", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["Alex sat at a small table in a trendy cafe, his laptop open. He had been working as a digital nomad for a month, and he thought it would be like the photos online: sipping a latte while typing genius code.", "The reality was different.", "\"Can I get a large oat milk cappuccino?\" the person next to him shouted over the loud indie music.", "Alex sighed and put on his noise-canceling headphones. He needed to focus on a project deadline, but the environment was chaotic.", "Then, his screen froze. The Wi-Fi symbol showed only one bar.", "\"No, no, no,\" Alex muttered, refreshing the page. \"Not now.\"", "His colleague, Sarah, called him on Slack. \"Hey, are you in the meeting? We can't hear you.\"", "\"My Wi-Fi is terrible,\" Alex typed back. \"I'm going to find a quieter corner.\"", "He packed his laptop and moved to a small, empty booth at the back of the cafe. It was darker, but the internet was stronger, and the noise was muffled. He ordered a simple black coffee and finally started working.", "Two hours later, he finished the task. He stretched and looked around. The cafe was still busy, but he had managed to get things done.", "Later, he met a friend who also worked remotely. \"Is the digital nomad life amazing?\" she asked.", "\"It is,\" Alex smiled. \"But it’s not all glamorous. You have to learn how to handle distractions, find good Wi-Fi, and create your own productive environment wherever you are.\""], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What was Alex's expectation about working from a cafe?", "What two problems did Alex face while trying to work?", "How did Alex solve the problem and finish his task?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Alex thought being a... (digital nomad) would be easy and glamorous.", "hints": ["He sat in a... (cafe) with his... (laptop) open.", "However, the place was very... (noisy) and full of distractions.", "His... (Wi-Fi) connection was terrible, and his screen froze.", "He had to move to a quiet booth at the back to... (focus).", "He managed to finish his project despite the difficult... (environment).", "He realized that remote work requires adaptability and finding a good... (connection).", "It is not always perfect, but it is still... (amazing)."], "vocab": [{"w": "digital nomad", "tr": "[ˈdɪdʒɪtl ˈnəʊmæd]", "ru": "цифровой кочевник"}, {"w": "cafe", "tr": "[ˈkæfeɪ]", "ru": "кафе"}, {"w": "Wi-Fi", "tr": "[ˈwaɪ faɪ]", "ru": "вай-фай, беспроводной интернет"}, {"w": "distraction", "tr": "[dɪˈstrækʃn]", "ru": "отвлечение"}, {"w": "noisy", "tr": "[ˈnɔɪzi]", "ru": "шумный"}, {"w": "to focus", "tr": "[ˈfəʊkəs]", "ru": "сосредотачиваться"}, {"w": "laptop", "tr": "[ˈlæptɒp]", "ru": "ноутбук"}, {"w": "environment", "tr": "[ɪnˈvaɪərənmənt]", "ru": "окружающая среда, обстановка"}]}, {"num": 134, "ru": "Контроль экранного времени у детей и гаджет-зависимость", "en": "Managing screen time and technology for children", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~275 слов.", "story": ["\"Leo, it's 8 PM. Tablet down, please,\" Anna said, walking into the living room.", "Her eight-year-old son groaned. \"But I'm in the middle of a level! Just five more minutes.\"", "\"We had an agreement,\" Anna said firmly but gently. \"No gadgets one hour before bedtime. It makes it hard for you to sleep.\"", "Leo crossed his arms. \"But there's nothing else to do!\"", "Anna thought for a moment. She knew that just taking the tablet away would lead to a fight. She needed to offer a good alternative.", "\"Okay,\" she said. \"How about we build the new Lego set together? Or we can play a board game.\"", "Leo hesitated. \"The spaceship one?\"", "\"Yes, the spaceship one,\" Anna smiled. \"And after that, we can read a chapter of your new book.\"", "Leo put the tablet on the coffee table. \"Okay. But you have to be the bad guy in the game.\"", "\"Deal,\" Anna laughed.", "They spent the next forty-five minutes building the Lego spaceship. Leo was fully engaged, laughing and talking. He didn't ask for his tablet once.", "When it was time for bed, Leo was calm and ready. \"That was fun, Mom,\" he said, yawning.", "\"I'm glad you liked it,\" Anna replied, tucking him in. \"We can do it again tomorrow.\"", "Anna closed his door and let out a quiet sigh of relief. Limiting screen time wasn't easy, but she realized that children don't just need rules; they need engaging alternatives and their parents' time."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Anna ask Leo to put his tablet away?", "What alternative did Anna offer to Leo?", "How did Leo react to the new activity?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Anna told Leo it was... (bedtime) and he had to stop using his device.", "hints": ["She reminded him of their... (agreement) about no gadgets before sleep.", "Leo complained, but Anna offered a fun... (alternative).", "They decided to build a Lego... (spaceship) together.", "Leo forgot about his... (tablet) and enjoyed the activity.", "He was calm and ready for... (sleep) afterward.", "Anna realized that kids need engaging... (outdoor activity) or games, not just rules.", "Managing... (screen time) requires patience and creativity."], "vocab": [{"w": "screen time", "tr": "[skriːn taɪm]", "ru": "время, проведенное у экрана"}, {"w": "gadget", "tr": "[ˈɡædʒɪt]", "ru": "гаджет, электронное устройство"}, {"w": "to limit", "tr": "[ˈlɪmɪt]", "ru": "ограничивать"}, {"w": "tablet", "tr": "[ˈtæblət]", "ru": "планшет"}, {"w": "bedtime", "tr": "[ˈbedtaɪm]", "ru": "время отхода ко сну"}, {"w": "alternative", "tr": "[ɔːlˈtɜːnətɪv]", "ru": "альтернатива, замена"}, {"w": "outdoor activity", "tr": "[ˈaʊtdɔː ækˈtɪvəti]", "ru": "активность на свежем воздухе"}, {"w": "agreement", "tr": "[əˈɡriːmənt]", "ru": "соглашение, договоренность"}]}, {"num": 135, "ru": "Настройка умного дома и первые технические сбои", "en": "Setting up a smart home and dealing with first tech glitches", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~280 слов.", "story": ["David stood in his living room, holding a small, round smart speaker. \"This is going to be so convenient,\" he told his wife, Emma. \"I'll be able to control the lights with my voice.\"", "\"Good luck with that,\" Emma smiled, drinking her tea. \"Technology never works the first time.\"", "David plugged in the device and opened the app on his phone. \"Okay, let's connect to the Wi-Fi.\"", "He followed the steps. The app searched for the device, but after a minute, it showed an error message: \"Connection failed.\"", "\"Come on,\" David muttered, feeling frustrated. He tried again. Same error.", "\"Did you read the manual?\" Emma asked, not looking up from her book.", "\"Who reads the manual?\" David replied. But after the third failed attempt, he sighed, picked up the small booklet, and started reading.", "\"Ah,\" he said. \"It says here I need to reset my router first if the network is 5GHz.\"", "David walked to the hallway, unplugged the router, waited ten seconds, and plugged it back in. He waited for the lights to turn green.", "He went back to the living room and tried the setup again. This time, the app connected instantly.", "\"Hello, David,\" the voice assistant said cheerfully. \"I am ready.\"", "David grinned. \"Turn off the living room lights.\"", "The lights instantly dimmed.", "\"Okay, that is pretty cool,\" Emma admitted, looking up.", "David laughed. \"It is. But you were right. The manual actually helps.\" He realized that setting up a smart home wasn't magic; it was just following instructions and staying calm when a small glitch appeared."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What did David want to do with the new smart speaker?", "Why did the first connection attempts fail?", "How did David finally fix the problem?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, David bought a... (smart home) device to control the lights.", "hints": ["He tried to... (connect) it to the Wi-Fi, but it failed.", "He felt... (frustrated) after several attempts.", "Emma suggested he read the... (manual).", "He discovered he needed to... (reset) the router first.", "After restarting the router, the... (voice assistant) connected successfully.", "He tested it by turning off the lights, which was very... (convenient).", "David learned that reading instructions helps to solve any... (glitch)."], "vocab": [{"w": "smart home", "tr": "[smɑːt həʊm]", "ru": "умный дом"}, {"w": "voice assistant", "tr": "[vɔɪs əˈsɪstənt]", "ru": "голосовой помощник"}, {"w": "to connect", "tr": "[kəˈnekt]", "ru": "подключать"}, {"w": "glitch", "tr": "[ɡlɪtʃ]", "ru": "сбой, неполадка"}, {"w": "to reset", "tr": "[ˌriːˈset]", "ru": "перезагружать, сбрасывать настройки"}, {"w": "frustrated", "tr": "[ˈfrʌstreɪtɪd]", "ru": "расстроенный, раздраженный"}, {"w": "convenient", "tr": "[kənˈviːniənt]", "ru": "удобный"}, {"w": "manual", "tr": "[ˈmænjuəl]", "ru": "руководство, инструкция"}]}, {"num": 136, "ru": "Удаленное обучение или прохождение онлайн-курса", "en": "Taking an online course or remote learning experience", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "ocabulary (Словарь перед чтением)", "vnote": "Здесь всего 8 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "he Story (История)", "snote": "Текст с живыми диалогами и бытовыми деталями. Объем: ~275 слов.", "story": ["Anna stared at her computer screen. She had decided to enroll in an online course for graphic design. The first week was exciting, but by week three, the reality of remote learning set in.", "\"I should be watching this video lecture,\" she thought, looking at the paused screen. \"But the sofa is so comfortable, and my phone is right here.\"", "She checked her phone. No new messages. She sighed and realized she was procrastinating. The final project deadline was in two weeks, and she had barely started.", "\"Remote learning requires serious self-discipline,\" she muttered to herself.", "She decided to make a change. She moved her laptop to the kitchen table, poured a cup of coffee, and put her phone in another room.", "She also logged into the course's discussion forum. She had been avoiding it, but now she typed a message: \"Hi everyone, I'm struggling with the logo design module. Is anyone free for a virtual study session this weekend?\"", "Within an hour, three classmates replied. On Saturday, they met on a video call. They shared their screens, gave each other feedback, and motivated each other to keep going.", "\"That was so helpful,\" Anna said at the end of the call. \"I thought I was the only one finding this hard.\"", "\"We all do,\" her classmate Mark replied. \"That's why we have the forum.\"", "With her new study routine and the support of her classmates, Anna finished her project two days before the deadline. A month later, a PDF arrived in her email: her completion certificate.", "She printed it and put it on her wall. It was proof that with self-discipline and a little help from others, she could achieve her goals."], "rh": "etelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why was Anna procrastinating in the third week of her course?", "What two changes did Anna make to improve her studying?", "How did the virtual study session help Anna?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Anna decided to... (enroll) in a graphic design course.", "hints": ["She struggled with... (self-discipline) and kept checking her phone.", "She moved to the kitchen table and hid her phone to... (focus).", "She also posted a message on the... (discussion forum).", "Her classmates agreed to a virtual study... (session).", "They helped each other and shared... (feedback).", "Anna managed to... (complete) her project before the... (deadline).", "She proudly displayed her... (certificate) on the wall."], "vocab": [{"w": "online course", "tr": "[ˌɒnlaɪn kɔːs]", "ru": "онлайн-курс"}, {"w": "to enroll", "tr": "[ɪnˈrəʊl]", "ru": "записываться, поступать"}, {"w": "deadline", "tr": "[ˈdedlaɪn]", "ru": "крайний срок"}, {"w": "video lecture", "tr": "[ˈvɪdiəʊ ˌlektʃə]", "ru": "видеолекция"}, {"w": "discussion forum", "tr": "[dɪˈskʌʃn ˈfɔːrəm]", "ru": "форум для обсуждений"}, {"w": "self-discipline", "tr": "[ˌself ˈdɪsəplɪn]", "ru": "самодисциплина"}, {"w": "certificate", "tr": "[səˈtɪfɪkət]",
