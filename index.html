wo more designers and one extra developer. If we hire them today, we can meet the deadline.\"", "Mike frowned. \"Hiring takes time. We don't have time to interview people.\"", "\"What if we use freelancers?\" suggested Sarah. \"I know some good specialists who can start tomorrow.\"", "David thought for a moment. \"That could work. But we need to check their portfolios first. Sarah, can you contact them today?\"", "\"Sure, I'll do it right after the meeting,\" Sarah said.", "\"Great. Now, let's talk about the client's requirements. What are their main priorities?\"", "Sarah looked at her notes. \"They want a user-friendly interface, fast loading speed, and mobile compatibility. They also emphasized security.\"", "\"Security is crucial,\" Mike said. \"We'll need to implement extra encryption. That will take more time.\"", "\"Can we explain this to the client and extend the deadline by one week?\" asked Sarah.", "\"Let's try,\" David said. \"I'll call them now. If they agree to the extension, we can deliver a high-quality product. If not, we'll have to work overtime.\"", "Ten minutes later, David came back. \"Good news! The client agreed to extend the deadline by one week. They understand that quality is more important than speed.\"", "Everyone smiled with relief. \"Perfect,\" Sarah said. \"Now we can focus on doing our best work.\"", "\"Exactly,\" David said. \"Let's start. Mike, you handle the technical side. Sarah, you manage the design and client communication. I'll coordinate everything. Let's make this project a success!\"", "The team worked hard for the next three weeks. They had daily meetings, solved problems together, and supported each other. When they finally presented the finished project, the client was thrilled.", "\"Excellent work!\" the client said. \"You exceeded our expectations. We want to work with you again on our next project.\"", "David smiled. \"Thank you. We're always ready to negotiate and find the best solutions for our clients.\""], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What was the main problem the team discussed at the meeting?", "What solution did Sarah suggest to meet the deadline?", "How did the client react to the finished project?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, David started a... (meeting) about a big presentation for a new... (client).", "hints": ["Sarah was worried about the... (deadline) — only two weeks.", "Mike suggested they should... (negotiate) with the client.", "Sarah proposed hiring... (freelancers) to help with the work.", "The client's priorities were user-friendly design, speed, and... (security).", "David called the client and they... (agreed) to extend the deadline by one week.", "The team worked hard and... (presented) the project on time.", "The client was thrilled and wanted to... (work with them again).", "David said they're always ready to find the best... (solutions) for clients."], "vocab": [{"w": "meeting", "tr": "[ˈmiːtɪŋ]", "ru": "встреча, совещание"}, {"w": "to present", "tr": "[prɪˈzent]", "ru": "представлять, презентовать"}, {"w": "deadline", "tr": "[ˈdedlaɪn]", "ru": "крайний срок"}, {"w": "to negotiate", "tr": "[nɪˈɡəʊʃieɪt]", "ru": "вести переговоры"}, {"w": "client", "tr": "[ˈklaɪənt]", "ru": "клиент"}, {"w": "to agree", "tr": "[əˈɡriː]", "ru": "соглашаться"}]}, {"num": 19, "ru": "Резюме и сопроводительное письмо", "en": "Resume and Cover Letter", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~430 слов.", "story": ["\"Hey, Anna! How's the job search going?\" asked Kate over coffee.", "Anna sighed. \"Not great. I've sent out about twenty applications, but nobody calls me back. I don't understand what's wrong.\"", "Kate leaned forward. \"Can I see your resume? Maybe I can help.\"", "Anna pulled out her laptop and showed the document. Kate read it carefully for a few minutes.", "\"Okay, I see the problem,\" Kate said. \"Your resume is too long and boring. You list everything you've ever done since high school. Employers don't have time to read three pages.\"", "\"So what should I do?\" Anna asked.", "\"First, make it one page. Only include relevant experience. Second, you need to highlight your skills, not just your duties. Instead of saying 'I worked in sales,' say 'I increased sales by 20% in six months.'\"", "\"That makes sense,\" Anna nodded. \"What about the cover letter? I just copy-paste the same text for every job.\"", "Kate shook her head. \"That's another mistake. A cover letter should be personal. You need to explain why you want to work at that specific company. Show them you did your research.\"", "\"Can you give me an example?\"", "\"Sure. Start with something like: 'I am writing to apply for the marketing manager position at XYZ Company. I have been following your recent campaigns, and I was impressed by your innovative approach to social media.'\"", "Anna wrote it down. \"Wow, that sounds much better than 'Dear Sir/Madam, I am interested in the position.'\"", "\"Exactly! And end with a strong closing. Say something like: 'I am confident that my experience in digital marketing and my passion for creative campaigns make me a strong candidate for this role.'\"", "Anna spent the whole evening rewriting her resume and cover letter. She shortened her resume to one page, added numbers and achievements, and wrote three different cover letters for three different companies.", "The next week, Anna applied for a marketing position at a tech startup. She customized her cover letter, mentioning their recent product launch.", "Three days later, her phone rang. \"Hello, Anna? This is Jessica from TechStart. We reviewed your application, and we'd like to invite you for an interview.\"", "Anna was thrilled. \"Thank you! When would you like me to come in?\"", "After the call, she texted Kate: \"You're a genius! I got an interview!\"", "Kate replied: \"Told you! Just remember: your resume gets you noticed, but your cover letter gets you the interview. Good luck!\"", "Anna smiled. She realized that job searching is not just about sending applications. It's about presenting yourself in the best possible way and showing employers why you stand out from other candidates."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why wasn't Anna getting calls from employers?", "What did Kate suggest to improve Anna's resume?", "How did Anna customize her cover letter for the tech startup?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Anna sent twenty applications but nobody called her back, so she asked Kate for... (help).", "hints": ["Kate said her resume was too... (long / boring) and needed to be one page.", "She told Anna to... (highlight) her skills and achievements, not just duties.", "Anna also changed her... (cover letter) — she stopped copy-pasting the same text.", "She wrote a personal letter explaining why she wanted to work at that specific... (company).", "She applied for a marketing position and customized her letter, mentioning their recent... (product launch).", "Three days later, she got a call and was invited for an... (interview).", "Anna realized that a good resume and cover letter help you... (stand out) from other candidates."], "vocab": [{"w": "resume", "tr": "[ˈrezjumeɪ]", "ru": "резюме"}, {"w": "cover letter", "tr": "[ˈkʌvə ˈletə]", "ru": "сопроводительное письмо"}, {"w": "to apply for", "tr": "[əˈplaɪ fɔː]", "ru": "откликаться на (вакансию)"}, {"w": "skills", "tr": "[skɪlz]", "ru": "навыки"}, {"w": "to highlight", "tr": "[ˈhaɪlaɪt]", "ru": "выделять, подчеркивать"}, {"w": "to stand out", "tr": "[stænd aʊt]", "ru": "выделяться, привлекать внимание"}]}, {"num": 20, "ru": "Прохождение собеседования", "en": "Job Interview", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~450 слов.", "story": ["\"Tomorrow is the big day,\" Tom said to his wife, Sarah. \"I have a job interview at Google.\"", "Sarah smiled. \"You've been preparing for weeks. You'll do great!\"", "\"I hope so,\" Tom said, pacing around the room. \"But I'm still nervous. What if they ask me something I don't know?\"", "\"Just be honest,\" Sarah said. \"If you don't know something, say you're eager to learn. That's better than lying.\"", "Tom nodded. \"You're right. I just need to stay calm and be myself.\"", "The next morning, Tom woke up early. He put on his best suit, checked his resume one more time, and left the house an hour early. He arrived at the Google office at 9:30 AM for a 10:00 AM interview.", "The receptionist smiled. \"You're early, Mr. Johnson. Please have a seat. The hiring manager will be with you shortly.\"", "Tom sat in the waiting area and tried to relax. He practiced deep breathing and reviewed his answers in his head.", "At 10:00 AM, a woman in her forties came out. \"Mr. Johnson? I'm Lisa Chen, the hiring manager. Please come with me.\"", "They walked to a small conference room. \"So, Tom,\" Lisa began, \"tell me about yourself.\"", "Tom took a deep breath. \"Thank you, Lisa. I'm a software engineer with five years of experience in web development. I graduated from MIT with a degree in computer science. In my current role at TechCorp, I lead a team of four developers, and we recently launched a new e-commerce platform that increased our client's sales by 35%.\"", "Lisa nodded. \"Impressive. Why do you want to work at Google?\"", "\"I've always admired Google's innovative culture and commitment to solving big problems,\" Tom answered. \"I want to work on projects that impact millions of people, and I believe Google is the best place to do that.\"", "\"Good answer,\" Lisa said. \"Now, tell me about a challenge you faced at work and how you overcame it.\"", "Tom thought for a moment. \"Last year, we had a major bug in our system two days before a product launch. The team was stressed, and we had to work overtime. I organized a meeting, divided the tasks, and we fixed the bug in 24 hours. The launch was successful, and we learned the importance of better testing.\"", "Lisa smiled. \"Excellent. Do you have any questions for me?\"", "\"Yes,\" Tom said. \"What does a typical day look like for someone in this role?\"", "Lisa explained the responsibilities and team structure. After thirty minutes, she stood up. \"Thank you for coming in, Tom. We'll be in touch by the end of the week.\"", "Tom left the office feeling good. He called Sarah. \"It went well! I think I did a good job.\"", "Two days later, Tom got an email: \"Dear Tom, We are pleased to offer you the position...\"", "Tom jumped with joy. \"I got the job!\"", "Sarah hugged him. \"I knew you could do it! All your preparation paid off.\"", "Tom smiled. He realized that interviews are not about being perfect. They're about being prepared, honest, and showing your genuine interest in the company."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why was Tom nervous before the interview?", "What advice did Sarah give him?", "What question did Lisa ask Tom about his past experience?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Tom had a job interview at... (Google) and was very... (nervous).", "hints": ["His wife Sarah told him to be... (honest) and stay calm.", "Tom arrived an hour early and tried to... (relax).", "The hiring manager, Lisa, asked him to tell her about... (himself).", "Tom talked about his experience and achievements at... (TechCorp).", "Lisa asked why he wanted to work at... (Google).", "She also asked about a... (challenge) he faced at work.", "Tom told her about fixing a bug before a product... (launch).", "At the end, Lisa asked if he had any... (questions).", "Two days later, Tom got an email and they offered him the... (job).", "He realized that interviews are about being... (prepared / honest / showing interest)."], "vocab": [{"w": "interview", "tr": "[ˈɪntəvjuː]", "ru": "собеседование"}, {"w": "nervous", "tr": "[ˈnɜːvəs]", "ru": "нервничающий, взволнованный"}, {"w": "to prepare", "tr": "[prɪˈpeə]", "ru": "готовиться"}, {"w": "to answer", "tr": "[ˈɑːnsə]", "ru": "отвечать"}, {"w": "confident", "tr": "[ˈkɒnfɪdənt]", "ru": "уверенный"}, {"w": "to offer", "tr": "[ˈɒfə]", "ru": "предлагать"}]}, {"num": 21, "ru": "Описание обязанностей и должностей", "en": "Job Duties and Responsibilities", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~440 слов.", "story": ["\"Welcome to the team, Jessica!\" said Mark, the department head. \"I'm glad you're here. Let me explain your duties and responsibilities.\"", "Jessica sat down with a notebook. \"Great, I'm ready to learn.\"", "\"First, you'll be in charge of the social media accounts,\" Mark explained. \"You'll handle content creation, scheduling posts, and responding to comments.\"", "\"Okay, so I'm responsible for all social media platforms?\" Jessica asked.", "\"Yes. You'll also coordinate with the design team to create visuals for our campaigns. You'll report to me directly, and we'll have weekly meetings to review your progress.\"", "Jessica wrote everything down. \"What about analytics? Will I track the performance of our posts?\"", "\"Absolutely,\" Mark said. \"You'll prepare monthly reports showing engagement rates, follower growth, and campaign results. You'll present these reports to the marketing director.\"", "\"That sounds like a lot of responsibility,\" Jessica said with a smile.", "\"It is,\" Mark admitted. \"But I think you're ready for it. You have great experience from your previous job. By the way, you'll also manage our intern, Alex. He'll help you with content scheduling and basic analytics.\"", "\"Perfect,\" Jessica nodded. \"I enjoy mentoring people.\"", "\"One more thing,\" Mark added. \"Sometimes we have urgent campaigns that need quick turnaround. In those cases, you'll need to handle multiple tasks at once and prioritize your work.\"", "\"No problem,\" Jessica said. \"I'm good at multitasking.\"", "Mark smiled. \"Great. Do you have any questions about your duties?\"", "\"Just one,\" Jessica said. \"What are the main goals for this position in the first three months?\"", "\"Good question,\" Mark said. \"First, I want you to increase our Instagram followers by 20%. Second, improve our engagement rate by 15%. And third, launch at least two successful campaigns.\"", "Jessica felt excited. \"I'll get started right away.\"", "For the first few weeks, Jessica was very busy. She created content calendars, met with the design team, trained Alex, and analyzed data every day. Sometimes she felt overwhelmed, but she remembered Mark's advice about prioritizing.", "After three months, Jessica prepared her first big presentation. She showed the marketing director all the results: Instagram followers increased by 25%, engagement rate went up by 18%, and both campaigns were very successful.", "The director was impressed. \"Excellent work, Jessica. You've exceeded our expectations.\"", "Jessica smiled. She realized that understanding your duties and responsibilities is the first step to success. When you know exactly what you need to do, you can focus your energy and achieve great results."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What was Jessica in charge of?", "Who did Jessica report to?", "What were the main goals for Jessica in the first three months?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Mark explained Jessica's... (duties / responsibilities).", "hints": ["She was in charge of... (social media accounts).", "She had to handle content creation, scheduling, and... (responding to comments).", "She coordinated with the... (design team) for visuals.", "She reported to... (Mark) directly and had weekly... (meetings).", "She also managed an... (intern) named Alex.", "Sometimes she had to handle... (multiple tasks) and prioritize her work.", "The main goals were to increase followers by... (20%), improve engagement by... (15%), and launch two... (campaigns).", "After three months, Jessica presented her results and exceeded... (expectations).", "She realized that understanding your duties is the first step to... (success)."], "vocab": [{"w": "duties", "tr": "[ˈdjuːtiz]", "ru": "обязанности"}, {"w": "to manage", "tr": "[ˈmænɪdʒ]", "ru": "управлять, руководить"}, {"w": "to coordinate", "tr": "[kəʊˈɔːdɪneɪt]", "ru": "координировать"}, {"w": "to be in charge of", "tr": "[biː ɪn tʃɑːdʒ ɒv]", "ru": "отвечать за, быть ответственным за"}, {"w": "to handle", "tr": "[ˈhændl]", "ru": "обрабатывать, справляться с"}, {"w": "to report to", "tr": "[rɪˈpɔːt tuː]", "ru": "подчиняться, отчитываться перед"}]}, {"num": 22, "ru": "Карьерный рост и развитие", "en": "Career Growth and Development", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~450 слов.", "story": ["\"Hey, Mike! Congratulations on your promotion!\" said his colleague, Anna. \"Senior Project Manager! That's amazing!\"", "Mike smiled. \"Thanks, Anna. I'm really excited about it.\"", "\"I bet,\" Anna said. \"You've been working here for three years now. How did you do it? What's your secret?\"", "Mike thought for a moment. \"I don't think there's a secret. I just set clear goals and worked hard to achieve them.\"", "\"Can you give me some advice?\" Anna asked. \"I want to grow in my career too.\"", "\"Sure,\" Mike said. \"First, you need to learn new skills all the time. The industry is changing fast, and you can't stay in the same place. I took online courses in project management and leadership.\"", "\"That's a good idea,\" Anna nodded. \"What else?\"", "\"Second, take initiative. Don't just wait for someone to give you tasks. If you see a problem, try to solve it. If you have an idea, share it with your manager.\"", "Anna wrote it down. \"I'm usually shy about speaking up in meetings.\"", "\"You need to get over that,\" Mike said gently. \"Your ideas are valuable. When I started, I was quiet too. But I forced myself to speak up, and people noticed.\"", "\"What about setting goals?\" Anna asked.", "\"That's crucial,\" Mike said. \"I sat down with my manager every six months and discussed my career path. I said, 'I want to become a Senior Project Manager in two years. What do I need to do to get there?' My manager gave me specific tasks and projects to work on.\"", "\"Did you always meet your goals?\" Anna asked.", "\"Not always,\" Mike admitted. \"Sometimes I failed, but I learned from my mistakes. The important thing is to keep moving forward.\"", "Anna thought about this. \"So it's about continuous learning, taking initiative, and setting clear goals?\"", "\"Exactly,\" Mike said. \"And don't forget about networking. Build relationships with people in your company and in your industry. Sometimes opportunities come from connections.\"", "\"Thanks for the advice, Mike,\" Anna said. \"I'm going to start working on my career development plan today.\"", "\"Good luck!\" Mike said. \"Remember, career growth doesn't happen overnight. It takes time, effort, and patience. But if you stay committed, you'll achieve your goals.\"", "Six months later, Anna got her own promotion. She became a Team Lead. She called Mike to thank him.", "\"I couldn't have done it without your advice,\" she said. \"I took those courses, started speaking up in meetings, and set clear goals with my manager.\"", "\"I'm proud of you,\" Mike said. \"You proved that anyone can grow in their career if they're willing to put in the work.\"", "Anna smiled. She realized that career development is not about luck or connections. It's about taking responsibility for your own growth and never stopping learning."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What did Mike do to get promoted?", "What advice did Mike give Anna about speaking up?", "How often did Mike discuss his career path with his manager?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Mike got a... (promotion) to Senior Project Manager.", "hints": ["Anna asked him for... (advice) on career growth.", "Mike said to always learn new... (skills) through courses.", "He also said to take... (initiative) and solve problems.", "Anna was shy about speaking up, but Mike told her to... (get over it).", "Mike suggested... (setting goals) with her manager every six months.", "He also emphasized the importance of... (networking).", "Six months later, Anna got promoted to... (Team Lead).", "She thanked Mike for his advice and realized that career growth is about taking... (responsibility) and continuous learning."], "vocab": [{"w": "promotion", "tr": "[prəˈməʊʃn]", "ru": "повышение"}, {"w": "to develop", "tr": "[dɪˈveləp]", "ru": "развивать"}, {"w": "to set goals", "tr": "[set ɡəʊlz]", "ru": "ставить цели"}, {"w": "to learn new skills", "tr": "[lɜːn njuː skɪlz]", "ru": "изучать новые навыки"}, {"w": "to take initiative", "tr": "[teɪk ɪˈnɪʃətɪv]", "ru": "проявлять инициативу"}, {"w": "to achieve", "tr": "[əˈtʃiːv]", "ru": "достигать"}]}, {"num": 23, "ru": "Навыки и квалификации", "en": "Skills and Qualifications", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~440 слов.", "story": ["\"So, David, I heard you're thinking about changing jobs,\" said Lisa during their lunch break.", "David nodded. \"Yeah, I want to move to a bigger company. But I'm not sure if I have the right skills and qualifications.\"", "Lisa leaned forward. \"What do you mean? You've been working in marketing for five years!\"", "\"I know, but the job descriptions always ask for specific things like digital marketing certificates, advanced Excel skills, or project management qualifications. I feel like I'm missing something.\"", "Lisa smiled. \"Let me help you. First, let's look at your current skills. What are you good at?\"", "David thought for a moment. \"Well, I'm proficient in social media marketing. I can create content, manage campaigns, and analyze data. I also have experience in team leadership.\"", "\"That's great!\" Lisa said. \"But you need to show it on your resume. Don't just write 'social media marketing.' Write specific achievements like 'increased Instagram followers by 40% in six months.'\"", "\"Good point,\" David said, taking notes. \"What about qualifications? I have a bachelor's degree in business, but is that enough?\"", "\"For most marketing positions, yes,\" Lisa explained. \"But if you want to stand out, consider getting additional certificates. There are online courses in Google Analytics, Facebook Ads, or even Agile project management. They're not expensive and you can study at your own pace.\"", "David looked interested. \"How long does it take to get these certificates?\"", "\"Usually a few weeks to a couple of months. And they look great on your resume. Employers love to see that you're continuously improving your skills.\"", "\"What about soft skills?\" David asked. \"Like communication or problem-solving?\"", "\"Those are crucial too!\" Lisa said. \"But they're harder to prove. The best way is to give examples in your interview. Like, 'I used my communication skills to resolve a conflict between two team members' or 'I improved our workflow by solving a scheduling problem.'\"", "David smiled. \"This is really helpful. I feel more confident now.\"", "\"Good!\" Lisa said. \"Start by updating your resume with your current skills. Then, choose one or two certificates to get in the next three months. And practice talking about your experience in a way that shows your value.\"", "\"Thanks, Lisa. I'll start tonight,\" David said.", "Two months later, David got a new job at a major tech company. He called Lisa to thank her.", "\"I couldn't have done it without your advice,\" he said. \"I got my Google Analytics certificate and rewrote my resume. The interviewer was really impressed with my specific achievements.\"", "\"I'm so happy for you!\" Lisa said. \"See? You had all the skills and qualifications you needed. You just had to present them properly.\"", "David realized that knowing your skills and continuously improving them is the key to career success."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why was David worried about changing jobs?", "What advice did Lisa give about writing skills on the resume?", "What certificates did Lisa suggest David get?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, David wanted to change jobs but was worried about his... (skills and qualifications).", "hints": ["Lisa asked him what he was good at, and he said he was... (proficient in social media marketing).", "Lisa told him to write specific... (achievements) on his resume, not just duties.", "She suggested getting additional... (certificates) like Google Analytics or Facebook Ads.", "David asked about... (soft skills) like communication.", "Lisa said to give... (examples) in the interview to prove soft skills.", "David updated his resume and got a... (certificate) in two months.", "He got a new job and thanked... (Lisa) for her advice.", "He realized that knowing and improving your skills is the key to... (success)."], "vocab": [{"w": "skill", "tr": "[skɪl]", "ru": "навык"}, {"w": "qualification", "tr": "[ˌkwɒlɪfɪˈkeɪʃn]", "ru": "квалификация, образование"}, {"w": "experience", "tr": "[ɪkˈspɪəriəns]", "ru": "опыт"}, {"w": "to improve", "tr": "[ɪmˈpruːv]", "ru": "улучшать"}, {"w": "certificate", "tr": "[səˈtɪfɪkət]", "ru": "сертификат"}, {"w": "to be proficient in", "tr": "[biː prəˈfɪʃnt ɪn]", "ru": "владеть в совершенстве"}]}, {"num": 24, "ru": "Офисное оборудование и техника", "en": "Office Equipment and Technology", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~450 слов.", "story": ["\"Hey, Tom! Can you help me? The printer is broken again,\" said Emma, looking frustrated.", "Tom sighed and walked over to the printer. \"What's the problem this time?\"", "\"It won't print anything. I've been trying for ten minutes,\" Emma said.", "Tom looked at the printer screen. \"It says 'Paper jam.' Did you check inside?\"", "Emma opened the printer and pulled out a crumpled piece of paper. \"Oh, I see it now. How do I get it out?\"", "\"Carefully pull it from both sides,\" Tom explained. \"Don't tear it.\"", "Emma removed the paper and closed the printer. \"Okay, let's try again.\" She pressed the print button, and the printer started working.", "\"Thanks, Tom! You're a lifesaver,\" Emma said.", "\"No problem,\" Tom smiled. \"By the way, did you know you can scan documents directly to your email from this printer? You don't need to use the computer.\"", "\"Really? How?\" Emma asked.", "\"See this button here?\" Tom pointed. \"Press it, enter your email address on the screen, and it will scan and send the document automatically. It's much faster.\"", "\"Wow, I didn't know that,\" Emma said. \"This will save me so much time.\"", "Just then, their colleague Mike walked in. \"Hey guys, my computer is running really slow today. Everything takes forever to load.\"", "Tom turned to Mike. \"Did you restart it?\"", "\"Of course I did,\" Mike said. \"I've restarted it three times already.\"", "\"Okay, let me check,\" Tom said, sitting at Mike's desk. He opened the task manager. \"You have too many programs running in the background. Look, you've got Spotify, Slack, Chrome with 20 tabs, and three other apps all using memory.\"", "Mike looked embarrassed. \"I didn't realize that was a problem.\"", "\"It is,\" Tom said. \"Close the programs you're not using. And you should also update your software. Sometimes old versions cause performance issues.\"", "Mike closed some apps and updated his software. \"It's already faster! Thanks, Tom.\"", "\"You should call IT support if it happens again,\" Tom advised. \"They can troubleshoot more serious problems and maybe upgrade your RAM if needed.\"", "\"Will do,\" Mike said. \"You really know your stuff about office technology.\"", "Tom laughed. \"I've been working here for five years. I've seen every equipment problem you can imagine.\"", "Emma smiled. \"We're lucky to have you. You save us so much time and frustration.\"", "\"Anytime,\" Tom said. \"Just remember: when technology doesn't work, first try the simple solutions — restart, check connections, read error messages. If that doesn't help, then call IT support.\"", "Mike nodded. \"Good advice. I'll remember that.\"", "From that day, Emma and Mike tried to solve small tech problems themselves before calling for help. And they both learned new tricks to use the office equipment more efficiently."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What was the problem with the printer?", "How did Tom show Emma to scan documents to email?", "Why was Mike's computer running slow?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Emma asked Tom for help because the... (printer) was broken.", "hints": ["Tom found a... (paper jam) and showed Emma how to remove it.", "He also taught her to... (scan) documents directly to email.", "Then Mike came because his... (computer) was running slow.", "Tom checked and saw too many... (programs) running in the background.", "He told Mike to close unused apps and update his... (software).", "Tom suggested calling... (IT support) for more serious problems.", "He explained that they can... (troubleshoot) and upgrade RAM if needed.", "Emma and Mike learned to solve small tech problems... (themselves).", "They also learned to use office equipment more... (efficiently)."], "vocab": [{"w": "printer", "tr": "[ˈprɪntə]", "ru": "принтер"}, {"w": "to scan", "tr": "[skæn]", "ru": "сканировать"}, {"w": "to break down", "tr": "[breɪk daʊn]", "ru": "ломаться"}, {"w": "IT support", "tr": "[ˌaɪ ˈtiː səˈpɔːt]", "ru": "техническая поддержка"}, {"w": "to troubleshoot", "tr": "[ˈtrʌblʃuːt]", "ru": "устранять неполадки"}, {"w": "software", "tr": "[ˈsɒftweə]", "ru": "программное обеспечение"}]}, {"num": 25, "ru": "Планирование дня и управление временем", "en": "Daily Planning and Time Management", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~460 слов.", "story": ["\"Sarah, you always seem so organized,\" said Jake during their coffee break. \"How do you manage to get everything done on time?\"", "Sarah smiled. \"It wasn't always like this. A year ago, I was always stressed and missing deadlines. Then I learned some time management techniques.\"", "\"Can you teach me?\" Jake asked. \"I'm always procrastinating and then rushing at the last minute.\"", "\"Sure,\" Sarah said. \"First, I plan my day the night before. I write down all the tasks I need to do and prioritize them.\"", "\"How do you prioritize?\" Jake asked.", "\"I use the Eisenhower Matrix,\" Sarah explained. \"I divide tasks into four categories: urgent and important, important but not urgent, urgent but not important, and neither urgent nor important. I focus on the urgent and important tasks first.\"", "\"That makes sense,\" Jake said. \"But what about multitasking? I try to do several things at once to save time.\"", "Sarah shook her head. \"That's actually a mistake. Multitasking makes you less productive. Your brain has to switch between tasks, and you lose focus. It's better to do one thing at a time and do it well.\"", "Jake looked surprised. \"Really? I thought multitasking was a good skill.\"", "\"Studies show it's not,\" Sarah said. \"Instead, try time blocking. You allocate specific time slots for specific tasks. For example, from 9 to 11, you work on the report. From 11 to 11:30, you check emails. This way, you stay focused.\"", "\"What about interruptions?\" Jake asked. \"People always come to my desk with questions.\"", "\"Set boundaries,\" Sarah advised. \"Use headphones when you need to focus. Or put a sign on your desk that says 'Do not disturb until 11 AM.' People will respect it.\"", "Jake wrote everything down. \"This is great. What about breaks? I feel guilty when I take them.\"", "\"Breaks are essential,\" Sarah said. \"Use the Pomodoro technique: work for 25 minutes, then take a 5-minute break. After four cycles, take a longer 15-30 minute break. This keeps your brain fresh and productive.\"", "\"I'll try this starting tomorrow,\" Jake said.", "The next day, Jake planned his schedule the night before. He prioritized his tasks, used time blocking, and took regular breaks. He didn't check his phone every five minutes, and he told his colleagues when he was in focus mode.", "At the end of the day, Jake was amazed. \"Sarah, I finished all my tasks and I'm not even tired! This is incredible.\"", "Sarah smiled. \"See? Time management is not about working harder. It's about working smarter.\"", "A month later, Jake's manager noticed the change. \"Jake, your productivity has improved a lot. What changed?\"", "Jake explained his new system. His manager was impressed and asked him to share his techniques with the team.", "Jake realized that good time management is not just about getting more done. It's about reducing stress, having energy for important things, and having time for your personal life."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What problem did Jake have with time management?", "What is the Eisenhower Matrix?", "Why did Sarah say multitasking is a mistake?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Jake asked Sarah how she stays... (organized) and meets deadlines.", "hints": ["Sarah said she plans her day the night before and... (prioritizes) tasks.", "She uses the... (Eisenhower Matrix) to divide tasks by urgency and importance.", "Jake asked about... (multitasking), but Sarah said it makes you less... (productive).", "She suggested... (time blocking) — allocating specific time for specific tasks.", "To avoid interruptions, Sarah advised setting... (boundaries) like using headphones.", "She also recommended the... (Pomodoro technique) — 25 minutes work, 5 minutes break.", "Jake tried the system and finished all his tasks without feeling... (tired).", "His manager noticed his improved... (productivity) and asked him to share with the team.", "Jake realized that time management is about working... (smarter), not harder."], "vocab": [{"w": "schedule", "tr": "[ˈʃedjuːl]", "ru": "расписание, график"}, {"w": "to prioritize", "tr": "[praɪˈɒrɪtaɪz]", "ru": "расставлять приоритеты"}, {"w": "deadline", "tr": "[ˈdedlaɪn]", "ru": "крайний срок"}, {"w": "to procrastinate", "tr": "[prəˈkræstɪneɪt]", "ru": "откладывать, медлить"}, {"w": "productive", "tr": "[prəˈdʌktɪv]", "ru": "продуктивный"}, {"w": "to multitask", "tr": "[ˌmʌltiˈtɑːsk]", "ru": "делать несколько дел одновременно"}]}, {"num": 26, "ru": "Встречи и совещания", "en": "Meetings and Conferences", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~470 слов.", "story": ["\"Good morning, everyone. Let's start the meeting,\" said Rachel, the team leader. \"I've sent you the agenda yesterday. Do you have any questions before we begin?\"", "\"I have one,\" said Mark. \"Item three says 'Budget review,' but we don't have the final numbers yet. Should we postpone this topic?\"", "Rachel checked her notes. \"Good point. Let's move it to next week's meeting. We'll focus on the project timeline today.\"", "\"Sounds good,\" said Lisa. \"By the way, can we start with a quick update from each team? I think some people are waiting for information from others.\"", "\"Agreed,\" Rachel said. \"Let's go around the table. Mark, you start.\"", "Mark spoke for two minutes about his progress. Then Lisa shared her update. When it was Tom's turn, he started talking about a problem he had with a client.", "\"Sorry to interrupt,\" Rachel said gently, \"but can we save detailed discussions for later? Let's just get the main updates first.\"", "\"Right, sorry,\" Tom said. He quickly summarized his situation.", "After everyone gave their updates, Rachel said, \"Okay, let's discuss the project timeline. We're two weeks behind schedule. What can we do to catch up?\"", "The team brainstormed for fifteen minutes. They decided to hire two freelancers and extend working hours for the next month.", "\"Great,\" Rachel said. \"Let's wrap up. I'll send the meeting minutes by the end of the day. Please check the action items and let me know if anything is unclear.\"", "\"What are the action items?\" asked Lisa.", "Rachel read from her notebook: \"Mark will contact the freelancers by Wednesday. Lisa will prepare the revised timeline. Tom will call the client to explain the delay. And I'll update the budget spreadsheet.\"", "\"Perfect,\" everyone said.", "\"Any other business?\" Rachel asked.", "\"Yes,\" said Tom. \"Can we schedule a follow-up meeting for next Friday to check our progress?\"", "\"Good idea,\" Rachel said. \"I'll send the calendar invite. Alright, that's all for today. Thanks, everyone.\"", "After the meeting, Lisa stayed behind. \"Rachel, can I give you some feedback?\"", "\"Sure,\" Rachel said.", "\"I think our meetings could be more efficient,\" Lisa said. \"Sometimes we go off-topic, and people talk too long. Maybe we should set time limits for each agenda item?\"", "Rachel thought about it. \"You're right. Let's try that. I'll allocate specific time for each topic and use a timer. Also, I'll send the agenda earlier so people can prepare.\"", "\"That would help,\" Lisa said. \"And maybe we can have some meetings without laptops and phones? People get distracted.\"", "\"Good suggestion,\" Rachel agreed. \"Let's try 'device-free' meetings once a week and see if it improves focus.\"", "The next week, Rachel implemented these changes. She sent the agenda three days in advance, set time limits, and asked everyone to put away their devices.", "The meetings became much shorter and more productive. People came prepared, stayed focused, and left with clear action items.", "\"Rachel, the meetings are so much better now,\" Mark said one day. \"We get more done in 30 minutes than we used to in an hour.\"", "Rachel smiled. \"Thanks for the feedback, Lisa. It really made a difference.\"", "The team realized that good meetings are not just about talking. They're about having a clear agenda, staying focused, respecting time, and leaving with concrete action items."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did they postpone the budget review?", "What did Rachel do when Tom started talking too long?", "What feedback did Lisa give Rachel about the meetings?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Rachel started the meeting and asked about the... (agenda).", "hints": ["Mark suggested they... (postpone) the budget review because they didn't have final numbers.", "Lisa asked for quick... (updates) from each team member.", "When Tom talked too long, Rachel gently... (interrupted) and asked him to summarize.", "They discussed the project timeline and decided to hire... (freelancers).", "Rachel... (wrapped up) the meeting and listed the... (action items).", "After the meeting, Lisa gave Rachel... (feedback) about efficiency.", "She suggested setting... (time limits) for each agenda item.", "Rachel also decided to send the agenda... (earlier) and have device-free meetings.", "The meetings became shorter and more... (productive).", "The team realized that good meetings need a clear... (agenda), focus, and concrete action items."], "vocab": [{"w": "agenda", "tr": "[əˈdʒendə]", "ru": "повестка дня"}, {"w": "to schedule", "tr": "[ˈʃedjuːl]", "ru": "назначать, планировать"}, {"w": "minutes", "tr": "[ˈmɪnɪts]", "ru": "протокол (встречи)"}, {"w": "to postpone", "tr": "[pəˈspəʊn]", "ru": "откладывать, переносить"}, {"w": "to wrap up", "tr": "[ræp ʌp]", "ru": "завершать"}, {"w": "action items", "tr": "[ˈækʃən ˈaɪtəmz]", "ru": "задачи, действия"}]}, {"num": 27, "ru": "Телефонные разговоры", "en": "Phone Calls", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~430 слов.", "story": ["\"Hello? Is this Mr. Davis?\" Anna asked, holding her phone tightly. She had been trying to reach the client all morning.", "\"Yes, this is he. Who is calling?\" a tired voice answered.", "\"Hi, Mr. Davis. This is Anna from Bright Solutions. I’m calling to clarify the details of our upcoming project.\"", "\"Oh, right. The marketing project. Look, Anna, I’m in a meeting right now. Can I put you on hold for a minute?\"", "\"Of course, take your time,\" Anna said politely.", "Soft music started playing in her ear. She waited for two minutes, but then suddenly, the line went dead. She got cut off.", "\"Great,\" Anna muttered to herself. She decided to dial his number again immediately.", "This time, the phone rang five times and went straight to voicemail. \"Hi, you’ve reached John Davis. Please leave a message after the beep.\"", "\"Hi, Mr. Davis, this is Anna again. Our call got cut off. Please call me back when you have a moment, or let me know a better time to reach you. My number is 555-0198.\"", "Ten minutes later, her phone rang. It was Mr. Davis.", "\"Anna? Sorry about that. My battery died. Let’s talk now. What did you need to clarify?\"", "\"No problem at all,\" Anna smiled, relieved. \"I just wanted to confirm the deadline for the first draft. Is it still next Friday?\"", "\"Actually, can we move it to Wednesday? We have a board meeting on Thursday, and I need to review it beforehand.\"", "Anna checked her calendar. \"Wednesday is tight, but we can do it if you send us the final logo files by tomorrow morning.\"", "\"Done. I’ll have my assistant email them to you in an hour.\"", "\"Perfect. And one last thing: will you be available for a quick video call on Thursday to review the draft together?\"", "\"Yes, Thursday at 2 PM works for me. I’ll send you a calendar invite.\"", "\"Excellent. Thank you for your time, Mr. Davis. Have a great day.\"", "\"You too, Anna. Bye.\"", "Anna hung up and wrote down the new deadline in her planner. She realized that phone calls could be stressful, especially with bad connections, but being polite, patient, and clear always helped to solve the problem and keep the client happy."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Mr. Davis ask to put Anna on hold?", "What happened when Anna waited on the line?", "What did they agree on regarding the project deadline?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Anna called Mr. Davis to... (clarify) the project details.", "hints": ["He asked to put her on... (hold), but then she got... (cut off).", "Anna decided to... (dial) again, but it went to... (voicemail).", "When Mr. Davis called back, he explained his battery died and they could talk now.", "He asked to move the deadline to... (Wednesday) because of a board meeting.", "Anna agreed, on the condition that he sends the... (logo files) by tomorrow.", "They also scheduled a video call for... (Thursday at 2 PM).", "Anna realized that being polite and clear helps to... (solve the problem) on the phone."], "vocab": [{"w": "to pick up", "tr": "[pɪk ʌp]", "ru": "брать трубку"}, {"w": "to put on hold", "tr": "[pʊt ɒn həʊld]", "ru": "ставить на удержание"}, {"w": "to get cut off", "tr": "[ɡet kʌt ɒf]", "ru": "прерываться (о связи)"}, {"w": "voicemail", "tr": "[ˈvɔɪsmeɪl]", "ru": "голосовая почта"}, {"w": "to dial", "tr": "[daɪəl]", "ru": "набирать номер"}, {"w": "to clarify", "tr": "[ˈklærɪfaɪ]", "ru": "уточнять, прояснять"}]}, {"num": 28, "ru": "Деловое письмо", "en": "Business Writing / Emails", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~440 слов.", "story": ["\"Hey, Mark, do you have a minute?\" Sarah asked, rolling her chair over to Mark’s desk.", "\"Sure, what’s up?\" Mark replied, taking his eyes off the screen.", "\"I need you to read this email before I send it to the CEO. It’s about the Q3 budget, and I don’t want to make any mistakes.\"", "Mark leaned in and read the screen. \"Okay, let’s see. First, your subject line just says 'Budget'. That’s too vague. He gets hundreds of emails a day. Make it concise and specific, like 'Q3 Budget Report – Action Required'.\"", "\"Good point,\" Mark’s colleague nodded, typing the change. \"What about the body of the email?\"", "\"It’s a bit long,\" Mark said. \"CEOs don’t have time to read three paragraphs. Get straight to the point. Say: 'Please find attached the Q3 budget report. The main highlight is a 10% cost reduction. Let me know if you have any questions.'\"", "Sarah deleted the extra text. \"Much better. Wait, did I forget the attachment again?\" She checked the bottom of the email. \"Oh no, I almost did! Thanks for catching that.\"", "\"No problem. Also, watch out for typos. I saw one in the second paragraph. You wrote 'manger' instead of 'manager'.\"", "Sarah blushed. \"Oops. Fixed. Is the tone okay? I don’t want to sound too demanding.\"", "\"The tone is fine,\" Mark assured her. \"It’s professional and polite. But remember to follow up if he doesn’t reply in two days. You can just forward the original email and add a short note: 'Just bringing this to the top of your inbox'.\"", "\"That’s a great tip,\" Sarah said, hitting the 'Send' button with confidence. \"I always worry about sounding pushy when I follow up.\"", "\"It’s not pushy if it’s polite and necessary,\" Mark smiled. \"Business emails are all about clarity, respect for the reader’s time, and double-checking your work.\"", "Later that afternoon, Sarah’s phone buzzed. It was an email from the CEO.", "\"Mark! Look!\" she whispered excitedly.", "Mark read the short reply: 'Thank you, Sarah. The report looks great. Approved.'", "\"See? I told you,\" Mark said, giving her a high-five. \"Clear subject line, concise message, correct attachment, and no typos. Perfect business email.\"", "Sarah smiled. She realized that writing a good business email wasn’t about using fancy words. It was about being clear, professional, and making the recipient’s life easier."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Sarah ask Mark to read her email?", "What did Mark suggest changing in the subject line?", "What almost happened before Sarah sent the email?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Sarah asked Mark to check her email about the... (Q3 budget).", "hints": ["Mark said the subject line was too vague and should be more... (concise / specific).", "He also told her to make the body of the email shorter and get straight to the... (point).", "Sarah realized she almost forgot the... (attachment).", "Mark also pointed out a... (typo) in the second paragraph.", "He advised her to... (follow up) politely if the CEO didn’t reply in two days.", "Sarah sent the email and quickly got an... (approval) from the CEO.", "She realized that good business emails are about clarity and respecting the reader’s... (time)."], "vocab": [{"w": "subject line", "tr": "[ˈsʌbdʒɪkt laɪn]", "ru": "тема письма"}, {"w": "attachment", "tr": "[əˈtætʃmənt]", "ru": "вложение"}, {"w": "to forward", "tr": "[ˈfɔːwəd]", "ru": "пересылать"}, {"w": "to follow up", "tr": "[ˈfɒləʊ ʌp]", "ru": "напоминать, уточнять (после действия)"}, {"w": "concise", "tr": "[kənˈsaɪs]", "ru": "краткий, лаконичный"}, {"w": "typo", "tr": "[ˈtaɪpəʊ]", "ru": "опечатка"}]}, {"num": 29, "ru": "Работа в команде", "en": "Teamwork", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~450 слов.", "story": ["\"Guys, we have a huge problem,\" Ben said, rubbing his temples. \"The client moved the presentation deadline to tomorrow morning. I can’t finish the slides and the data analysis by myself.\"", "Alex and Chloe gathered around Ben’s desk. They were a small marketing team, and they had a shared goal: to win this new client.", "\"Don’t panic,\" Alex said calmly. \"We are a team. We will collaborate and figure this out. Let’s look at what needs to be done.\"", "Chloe pulled up a chair. \"Ben, you are the best at data analysis. If you focus only on the numbers, I can take over the slide design. I already have the templates ready.\"", "Ben looked relieved. \"Are you sure? I don’t want to dump my work on you.\"", "\"It’s not dumping, it’s delegating,\" Chloe smiled. \"We support each other. That’s what teamwork is about.\"", "\"Okay,\" Ben agreed. \"I’ll finish the data charts by 4 PM. Chloe, can you have the first draft of the slides ready by 6 PM?\"", "\"Yes, but I need the charts first,\" Chloe said.", "\"Deal,\" Ben said.", "Alex stepped in. \"I’ll handle the spoken part of the presentation. I’ll write the script and rehearse it tonight. Also, I’ll order dinner for all of us so we don’t waste time going to the cafeteria.\"", "\"You’re a lifesaver, Alex,\" Ben said.", "They worked hard for the next four hours. There was a moment of tension when Chloe didn’t like the color scheme Ben chose for the charts.", "\"Ben, the blue is too dark. It won’t show up on the projector,\" she pointed out.", "\"But the client’s brand color is dark blue,\" Ben argued.", "\"Let’s compromise,\" Alex suggested. \"Use dark blue for the titles, but make the data lines bright yellow or white so they are visible.\"", "\"Good idea,\" Ben and Chloe agreed.", "By 8 PM, the presentation was ready. They rehearsed it together twice. Alex’s script was smooth, Chloe’s slides looked professional, and Ben’s data was accurate and easy to understand.", "The next morning, the client was extremely impressed. \"This is exactly what we were looking for,\" the client’s director said. \"You clearly understand our needs.\"", "After the meeting, the team went to a nearby cafe to celebrate.", "\"We did it!\" Chloe cheered, clinking her coffee cup with Ben’s.", "\"I couldn’t have done it without you both,\" Ben admitted. \"I was ready to give up yesterday.\"", "\"That’s the power of a reliable team,\" Alex said. \"When one person struggles, the others step in. We have different skills, but we share the same goal.\"", "Ben smiled. He realized that teamwork wasn’t just about working in the same room. It was about trusting each other, communicating openly, and being ready to help when things got tough."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What was the problem Ben faced at the beginning of the story?", "How did the team divide the work?", "What compromise did they reach about the chart colors?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Ben was stressed because the client moved the... (deadline) to tomorrow.", "hints": ["Alex and Chloe decided to... (collaborate) to reach their shared goal.", "Chloe offered to take over the... (slide design) so Ben could focus on data.", "Alex volunteered to write the... (script) and ordered dinner for the team.", "When they disagreed on the chart colors, Alex suggested they... (compromise).", "They finished the presentation by 8 PM and... (rehearsed) it together.", "The next morning, the client was very... (impressed) with their work.", "Ben realized that a... (reliable) team supports each other and communicates openly."], "vocab": [{"w": "to collaborate", "tr": "[kəˈlæbəreɪt]", "ru": "сотрудничать"}, {"w": "to delegate", "tr": "[ˈdelɪɡeɪt]", "ru": "делегировать, поручать"}, {"w": "reliable", "tr": "[rɪˈlaɪəbl]", "ru": "надежный"}, {"w": "to compromise", "tr": "[ˈkɒmprəmaɪz]", "ru": "идти на компромисс"}, {"w": "shared goal", "tr": "[ʃeəd ɡəʊl]", "ru": "общая цель"}, {"w": "to support", "tr": "[səˈpɔːt]", "ru": "поддерживать"}]}, {"num": 30, "ru": "Переговоры и убеждение", "en": "Negotiation and Persuasion", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~460 слов.", "story": ["David sat across the table from Mrs. Lee, the purchasing manager of a large retail chain. He was trying to sell her company’s new software, but the negotiation was not going smoothly.", "\"David, I like your product,\" Mrs. Lee said, crossing her arms. \"But your price is 20% higher than your main competitor. I have an objection to this. Why should I pay more?\"", "David stayed calm. He knew that getting defensive would not help him convince her. \"I completely understand your concern, Mrs. Lee. Price is always an important factor. However, our software includes 24/7 technical support and free monthly updates, which the competitor does not offer.\"", "Mrs. Lee nodded slowly. \"That’s true. But my budget is strict. I can’t just approve a 20% increase.\"", "David thought for a moment. He needed to find a win-win situation. \"What if we meet halfway?\" he suggested. \"If you sign a two-year contract instead of a one-year contract, I can offer you a 15% discount on the total price. This brings the cost much closer to your budget, and you still get all our premium support features.\"", "Mrs. Lee raised an eyebrow. \"A 15% discount for a two-year commitment? Let me do the math.\" She typed some numbers into her tablet.", "\"Okay,\" she said after a minute. \"That does fit within my budget. But what about the implementation? Will your team train our staff for free?\"", "\"Usually, training costs extra,\" David admitted. \"But to show our commitment to this partnership, I will include three days of free on-site training for your team.\"", "Mrs. Lee smiled slightly. \"Now that is a good offer.\"", "\"Great,\" David said, sliding the revised contract across the table. \"Shall we sign it today?\"", "\"Yes, let’s do it,\" Mrs. Lee said, picking up her pen.", "Later that day, David called his manager. \"We got the deal,\" he said proudly.", "\"Excellent work, David!\" his manager replied. \"How did you overcome the price objection?\"", "\"I listened to her concerns, didn’t argue, and offered a creative solution,\" David explained. \"A longer contract for a discount, plus free training. It was a win-win situation. She got the price she needed, and we secured a long-term client.\"", "\"That’s the art of negotiation,\" his manager said. \"You didn’t just sell a product; you built a relationship.\"", "David hung up the phone, feeling a great sense of achievement. He realized that successful negotiation is not about defeating the other person. It is about listening carefully, understanding their needs, and finding a solution that makes both sides happy."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What was Mrs. Lee’s main objection to David’s product?", "What solution did David propose to meet halfway?", "What extra benefit did David offer to close the deal?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, David was trying to sell software to Mrs. Lee, but she had an... (objection) about the high price.", "hints": ["David stayed calm and explained that their product includes 24/7... (support).", "To find a... (win-win situation), David suggested they meet halfway.", "He offered a 15%... (discount) if she signed a two-year... (contract).", "Mrs. Lee checked the math and agreed it fit her... (budget).", "She also asked if staff training would be free, and David... (offered) three days of free on-site training.", "Mrs. Lee signed the... (contract) immediately.", "David’s manager praised him for building a... (relationship), not just selling a product.", "David realized that good negotiation is about listening and finding a solution that makes... (both sides) happy."], "vocab": [{"w": "to negotiate", "tr": "[nɪˈɡəʊʃieɪt]", "ru": "вести переговоры"}, {"w": "win-win situation", "tr": "[wɪn wɪn ˌsɪtʃuˈeɪʃn]", "ru": "ситуация, выгодная для обеих сторон"}, {"w": "to convince", "tr": "[kənˈvɪns]", "ru": "убеждать"}, {"w": "to offer a discount", "tr": "[ˈɒfə ə ˈdɪskaʊnt]", "ru": "предлагать скидку"}, {"w": "to meet halfway", "tr": "[miːt ˈhɑːfweɪ]", "ru": "идти на взаимные уступки"}, {"w": "objection", "tr": "[əbˈdʒekʃn]", "ru": "возражение"}]}, {"num": 31, "ru": "Электронная переписка и деловые письма", "en": "Email Correspondence and Business Letters", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~440 слов.", "story": ["\"Leo, do you have a minute?\" Sarah, the office manager, asked, standing by Leo’s desk with a slight smile.", "Leo looked up from his computer, feeling a sudden wave of panic. \"Yes, Sarah. Is everything okay?\"", "\"Well,\" Sarah began, \"I saw the email you sent to the entire department this morning. The one about the broken coffee machine.\"", "Leo’s face turned red. \"Oh no. Did I do something wrong?\"", "\"Not wrong, exactly,\" Sarah said kindly, pulling up a chair. \"But you used 'Reply All'. The original email was sent to all 50 employees. Your reply, which just said 'I know, it’s so annoying!', went to everyone’s inbox.\"", "Leo groaned and put his head in his hands. \"I’m so sorry. I didn’t think. I just wanted to agree with Mark.\"", "\"It’s a common mistake,\" Sarah reassured him. \"But it’s a great opportunity to talk about email etiquette. Let’s go over a few quick rules so you feel more confident.\"", "\"Please,\" Leo said. \"I don’t want to be 'that guy' who spams everyone’s inbox.\"", "Sarah nodded. \"Rule number one: always check the 'To' field before hitting send. If you only need to answer the sender, just click 'Reply', not 'Reply All'.\"", "\"Got it,\" Leo said, taking notes. \"What about CC and BCC? I never really understood the difference.\"", "\"Good question,\" Sarah explained. \"Use CC (Carbon Copy) when you want to keep someone in the loop, but they don’t need to take action. Use BCC (Blind Carbon Copy) when you’re sending an email to a large group of people who don’t know each other, to protect their privacy.\"", "\"That makes sense,\" Leo said. \"And what about long email threads? Sometimes I get lost in them.\"", "\"If a thread gets too long or complicated, it’s better to pick up the phone or walk over to the person’s desk to clarify things,\" Sarah advised. \"Email is great for attaching documents or keeping a record, but it’s terrible for long debates.\"", "\"Wow, I had no idea there was so much to it,\" Leo admitted. \"Thank you for explaining this to me, Sarah. I really appreciate it.\"", "\"No problem at all,\" Sarah smiled, standing up. \"We all make mistakes when we’re new. Just remember: before you send, pause and think, 'Does everyone really need to see this?'\"", "Later that day, Leo needed to ask a question about a project. He looked at the email, hesitated, and clicked 'Reply' instead of 'Reply All'. He attached the file, wrote a concise message, and hit send.", "He felt a small sense of pride. He was already becoming a more professional communicator, one email at a time."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What mistake did Leo make in his morning email?", "What is the difference between CC and BCC according to Sarah?", "What does Sarah suggest doing if an email thread gets too complicated?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Leo accidentally used... (Reply All) to answer an email about the coffee machine.", "hints": ["Sarah explained that this is a common mistake but taught him about email... (etiquette).", "She told him to always check the 'To' field and use... (Reply) instead of Reply All when possible.", "She explained that... (CC) is for keeping people in the loop, while BCC protects privacy.", "For long or complicated... (threads), Sarah suggested calling or talking in person to... (clarify).", "Leo thanked Sarah and later successfully sent an email, making sure to... (attach) the file and write a concise message.", "He learned to pause and think before hitting... (send)."], "vocab": [{"w": "reply all", "tr": "[rɪˈplaɪ ɔːl]", "ru": "ответить всем"}, {"w": "thread", "tr": "[θred]", "ru": "цепочка писем, ветка обсуждения"}, {"w": "etiquette", "tr": "[ˈetɪket]", "ru": "этикет"}, {"w": "to attach", "tr": "[əˈtætʃ]", "ru": "прилагать (файл)"}, {"w": "CC / BCC", "tr": "[ˌsiː ˈsiː / ˌbiː ˌsiː ˈsiː]", "ru": "копия / скрытая копия"}, {"w": "to clarify", "tr": "[ˈklærɪfaɪ]", "ru": "уточнять, прояснять"}]}, {"num": 32, "ru": "Волонтерство и благотворительность", "en": "Volunteering and Charity", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~450 слов.", "story": ["\"Look at this, Maya,\" Sam said, showing her a post on his phone. \"The local animal shelter is going to close next month if they don’t raise enough money.\"", "Maya looked at the screen and frowned. \"That’s terrible! They helped my cat last year. We have to do something.\"", "\"I know,\" Sam agreed. \"But what can we do? We’re just students. We don’t have a lot of money to donate.\"", "Maya thought for a moment, her eyes lighting up. \"We don’t need money to start. We can organize a fundraiser! A bake sale or a charity run in the park.\"", "Sam smiled. \"I like the idea of a bake sale. Everyone loves food. But how do we get people to come?\"", "\"We can use social media,\" Maya said enthusiastically. \"We’ll create an event page, design some cool posters, and ask our friends to share it. We can also ask the local bakery to donate some extra cookies.\"", "\"Okay, I’m in,\" Sam said. \"Let’s make a plan. I’ll handle the social media and posters. You talk to the bakery and the shelter.\"", "For the next two weeks, Maya and Sam worked hard. Maya visited the shelter and spoke with the manager, who was thrilled and promised to bring three adoptable dogs to the event. Sam designed bright, eye-catching posters and posted them all over the university campus.", "The day of the fundraiser arrived. It was a sunny Saturday in the central park. Maya and Sam set up a long table with cakes, cookies, and lemonade. A small sign read: \"All proceeds go to the City Animal Shelter.\"", "At first, only a few people stopped by. Maya felt a bit nervous. \"What if nobody buys anything?\" she whispered to Sam.", "\"Just give it time,\" Sam said confidently.", "Soon, a group of students from their university walked by. \"Hey, Sam! Is this for the shelter?\" one of them asked.", "\"Yes! Buy a cookie and save a puppy,\" Sam joked.", "The group laughed and bought several boxes of cookies. Word spread quickly. Within two hours, the table was almost empty. The shelter manager arrived with the dogs, and people gathered around to pet them and take photos.", "By the end of the day, Maya and Sam counted the money. They had raised over $500!", "\"We did it!\" Maya cheered, hugging Sam. \"We actually made a difference.\"", "The shelter manager came over, looking emotional. \"Thank you both so much. This money will buy food and medicine for the animals for the next two months. You saved us.\"", "Maya and Sam looked at each other, tired but incredibly happy. They realized that community service isn’t about how much money you have. It’s about having a good idea, working together, and caring enough to take action."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Maya and Sam decide to take action?", "What kind of fundraiser did they choose to organize?", "How much money did they raise by the end of the day?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Sam showed Maya a post about the local... (animal shelter) closing down.", "hints": ["They decided to... (organize) a bake sale to help.", "Sam handled social media and posters, while Maya talked to the... (bakery) and the shelter.", "On the day of the... (fundraiser), they set up a table in the park.", "At first, Maya was nervous, but soon many... (students) came to buy food.", "The shelter manager brought adoptable... (dogs), which attracted more people.", "By the end of the day, they raised over... ($500).", "They realized that... (community service) is about working together and caring enough to take action."], "vocab": [{"w": "to donate", "tr": "[dəʊˈneɪt]", "ru": "жертвовать, делать пожертвование"}, {"w": "charity", "tr": "[ˈtʃærəti]", "ru": "благотворительность"}, {"w": "fundraiser", "tr": "[ˈfʌndreɪzə]", "ru": "мероприятие по сбору средств"}, {"w": "to organize", "tr": "[ˈɔːɡənaɪz]", "ru": "организовывать"}, {"w": "community service", "tr": "[kəˈmjuːnəti ˈsɜːvɪs]", "ru": "общественная работа, волонтерство"}, {"w": "to make a difference", "tr": "[meɪk ə ˈdɪfrəns]", "ru": "иметь значение, менять ситуацию к лучшему"}]}, {"num": 33, "ru": "Поиск работы", "en": "Job Hunting", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~460 слов.", "story": ["Elena stared at her laptop screen and sighed heavily. \"That’s the tenth rejection email this month, David. I’m starting to think nobody wants to hire me.\"", "David, her older brother, walked into the room with two cups of tea. \"Let me see. What did you apply for this time?\"", "\"Three marketing assistant positions on a popular job board,\" Elena said, rubbing her eyes. \"I sent the exact same resume to all of them.\"", "David sat down and shook his head. \"Elena, that’s your first mistake. You can’t just send the same generic resume to every company. You need to tailor your resume for each specific job description.\"", "\"But that takes so much time!\" Elena complained.", "\"It does,\" David agreed. \"But it’s worth it. If the job description asks for 'social media experience', make sure those words are at the top of your resume. Show them you’re exactly what they’re looking for.\"", "Elena nodded slowly. \"Okay, I’ll try that. But what about the other ninety applications I sent? Silence. Nothing.\"", "\"That brings me to my second point: networking,\" David said. \"Applying online is like throwing a message in a bottle into the ocean. Most jobs are filled through connections. Who do you know in the marketing industry?\"", "Elena thought for a moment. \"Well, my former professor, Dr. Evans, works as a consultant for a few agencies. And my friend Clara just started working at a digital firm.\"", "\"Perfect!\" David said. \"Don’t just ask them for a job. Ask them for advice. Send a polite message saying, 'Hi Clara, I see you’re working at XYZ Company. I’m currently looking for marketing roles and would love to hear about your experience there. Could we grab a coffee next week?'\"", "Elena typed the message to Clara right away. \"What if she says no?\"", "\"Then you follow up politely in a week, or you move on to the next person,\" David said. \"Networking is a numbers game, just like applying. But the response rate is much higher.\"", "Two days later, Elena met Clara for coffee. Clara was friendly and gave her great advice about the company culture. More importantly, Clara said, \"Actually, we have an unadvertised opening on my team. Let me forward your tailored resume to the hiring manager.\"", "Elena’s heart skipped a beat. \"Really? Thank you so much, Clara!\"", "A week later, Elena got an email. It wasn’t a rejection. It was an invitation for an interview.", "She called David immediately, her voice shaking with excitement. \"It worked! The networking and the tailored resume actually worked!\"", "\"I never doubted it,\" David laughed. \"See? Job hunting isn’t just about clicking 'apply'. It’s about strategy, personalization, and building relationships.\"", "Elena smiled, feeling a new wave of confidence. She was no longer just sending resumes into the void. She was actively managing her career."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why was Elena getting so many rejection emails?", "What two main pieces of advice did David give Elena?", "How did Clara help Elena get an interview?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Elena was frustrated because she received her tenth... (rejection) email.", "hints": ["David told her not to send the same generic resume, but to... (tailor) it for each job.", "He also advised her to start... (networking) instead of just using a job board.", "Elena decided to contact her friend Clara to ask for... (advice), not a job directly.", "Clara agreed to meet for coffee and offered to forward Elena’s resume for an unadvertised... (opening).", "A week later, Elena received an invitation for an... (interview).", "She realized that job hunting requires... (strategy) and building relationships, not just clicking 'apply'."], "vocab": [{"w": "job board", "tr": "[dʒɒb bɔːd]", "ru": "сайт по поиску работы"}, {"w": "to tailor", "tr": "[ˈteɪlə]", "ru": "адаптировать, подстраивать (под требования)"}, {"w": "networking", "tr": "[ˈnetwɜːkɪŋ]", "ru": "нетворкинг, установление связей"}, {"w": "rejection", "tr": "[rɪˈdʒekʃn]", "ru": "отказ"}, {"w": "to apply", "tr": "[əˈplaɪ]", "ru": "подавать заявку, откликаться"}, {"w": "to follow up", "tr": "[ˈfɒləʊ ʌp]", "ru": "напоминать о себе, уточнять статус"}]}, {"num": 34, "ru": "Собеседование на работу", "en": "Job Interview - Behavioral Focus", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~470 слов.", "story": ["\"Okay, Alex, let’s practice,\" said Maria, his career coach. \"Imagine I’m the hiring manager. Tell me about a time you failed at work and how you handled it.\"", "Alex froze. \"Failed? I don’t want to tell them I failed! That will make me look bad.\"", "Maria shook her head. \"No, Alex. This is a classic behavioral question. They don’t expect you to be perfect. They want to see how you reflect on your mistakes and learn from them. You need to use the STAR method.\"", "\"The STAR method?\" Alex asked, taking out his notebook.", "\"Yes,\" Maria explained. \"S is for Situation: briefly describe the context. T is for Task: what was your goal? A is for Action: what specific steps did you take? And R is for Result: what was the outcome, and what did you learn?\"", "\"Okay, let me try,\" Alex said. He thought for a moment. \"Last year, I was managing a small project. The Situation was that we had a tight deadline. The Task was to deliver a report to the client by Friday.\"", "\"Good start,\" Maria encouraged. \"What was the Action?\"", "\"Well,\" Alex continued, \"I tried to do everything myself because I didn’t want to bother my team. But by Thursday, I realized I couldn’t finish it. So, my Action was to immediately call a meeting, explain the delay, and delegate parts of the report to my colleagues.\"", "\"Excellent,\" Maria smiled. \"And the Result?\"", "\"The Result was that we submitted the report on Saturday morning, one day late. The client was a bit annoyed, but they appreciated our honesty and the high quality of the work. I learned that delegation is a strength, not a weakness, and that asking for help early is better than hiding a problem.\"", "Maria clapped her hands. \"Perfect! That was honest, structured, and showed great self-awareness. You demonstrated that you can solve problems under pressure.\"", "Two days later, Alex sat in the interview room at TechGlobal. The hiring manager, Mr. Davis, looked at his notes.", "\"Alex, your technical skills are impressive. But I’d like to ask a behavioral question. Tell me about a time you had a conflict with a team member. How did you resolve it?\"", "Alex took a deep breath. He remembered Maria’s advice.", "\"Sure,\" Alex began calmly. \"In my previous role, the Situation was that my colleague and I disagreed on the design of a presentation. The Task was to create a unified final version for the CEO.\"", "Mr. Davis nodded, listening carefully.", "\"My Action was to invite him for a coffee. Instead of arguing, I asked him to explain his perspective. I realized his design was actually better for the data visualization. So, we combined my text structure with his charts.\"", "\"And the Result?\" Mr. Davis asked.", "\"The Result was a highly successful presentation. The CEO praised our teamwork. I learned that listening to different opinions leads to a better final product.\"", "Mr. Davis smiled and wrote something on his notepad. \"That’s a very mature answer, Alex. Thank you.\"", "Alex walked out of the building feeling confident. He realized that a job interview wasn’t an interrogation. It was a conversation where he could demonstrate his real experience, using clear structure and honest reflection."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Alex initially not want to talk about failure in the interview?", "What does the STAR method stand for?", "How did Alex resolve the conflict with his colleague in his final answer?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Alex was practicing for an interview with his coach, Maria.", "hints": ["She told him to use the... (STAR method) for behavioral questions.", "S stands for... (Situation), T for Task, A for... (Action), and R for Result.", "Alex practiced an answer about a time he tried to do everything himself and had to... (delegate).", "In the real interview, Mr. Davis asked about a... (conflict) with a team member.", "Alex explained the Situation and Task, then described his Action: inviting the colleague for... (coffee) and listening.", "The Result was a successful presentation and a lesson about... (teamwork / listening).", "Alex realized that an interview is a chance to... (demonstrate) real experience honestly."], "vocab": [{"w": "behavioral question", "tr": "[bɪˈheɪvjərəl ˈkwestʃən]", "ru": "поведенческий вопрос (о прошлом опыте)"}, {"w": "strength", "tr": "[streŋθ]", "ru": "сильная сторона"}, {"w": "weakness", "tr": "[ˈwiːknəs]", "ru": "слабая сторона"}, {"w": "STAR method", "tr": "[stɑː ˈmeθəd]", "ru": "метод STAR (Ситуация, Задача, Действие, Результат)"}, {"w": "to demonstrate", "tr": "[ˈdemənstreɪt]", "ru": "демонстрировать, показывать"}, {"w": "to reflect", "tr": "[rɪˈflekt]", "ru": "размышлять, делать выводы"}]}, {"num": 35, "ru": "Профессии и карьера", "en": "Professions and Career", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~430 слов.", "story": ["\"Julia, you’ve been staring at that spreadsheet for an hour,\" Mark said, rolling his chair over to her desk. \"Are you okay?\"", "Julia sighed and closed her laptop. \"Honestly, Mark? I’m not sure. I’ve been an accountant for five years. It’s a stable profession, but I feel completely empty.\"", "Mark looked surprised. \"Really? But you’re so good at it. You just got promoted!\"", "\"I know,\" Julia replied. \"But I’ve been thinking about my career path. I don’t want to be a senior accountant. I want to pursue something creative. I’m thinking about switching careers to graphic design.\"", "Mark raised his eyebrows. \"Graphic design? That’s a big change. Isn’t that field very demanding and competitive?\"", "\"It is,\" Julia admitted. \"But I’ve been taking online courses for the last six months. I love it. It feels so rewarding when I create something from scratch. Yesterday, I designed a logo for a friend’s small
