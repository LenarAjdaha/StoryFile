 business, and she absolutely loved it.\"", "\"Wow, I had no idea,\" Mark said. \"So, what’s your plan? Are you going to quit tomorrow?\"", "Julia laughed. \"No, I’m not crazy! I need to build a portfolio first. I plan to work part-time as a designer while keeping my accounting job for financial stability. It will be hard, but I have to try.\"", "Mark smiled warmly. \"I think that’s a brave and smart decision. If you ever need help reviewing your resume for design jobs, let me know. I know a few people in the marketing department who might give you some feedback.\"", "\"Thank you, Mark. That means a lot,\" Julia said, feeling a sudden wave of relief.", "For the first time in months, she didn’t feel trapped. She realized that a career isn’t a straight line. It’s okay to change direction if your current profession doesn’t make you happy. As she packed her bag to go home, she opened her design folder instead of her accounting files. She was ready to start her new journey."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Julia feel empty despite her promotion?", "What new profession does Julia want to pursue?", "What is Julia’s plan to switch careers safely?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Julia told Mark she felt empty in her current... (profession) as an accountant.", "hints": ["She decided she wanted to change her... (career path) and become a graphic designer.", "Mark warned her that the new field could be... (demanding) and competitive.", "However, Julia found her online courses very... (rewarding).", "She decided not to quit immediately, but to build a... (portfolio) first.", "She plans to work part-time in design while keeping her... (accounting job) for stability.", "Mark offered to help her by connecting her with people in... (marketing).", "Julia realized it is okay to... (switch careers) if you are not happy."], "vocab": [{"w": "profession", "tr": "[prəˈfeʃn]", "ru": "профессия"}, {"w": "career path", "tr": "[kəˈrɪə pɑːθ]", "ru": "карьерный путь"}, {"w": "to pursue", "tr": "[pəˈsjuː]", "ru": "стремиться к, заниматься (чем-либо)"}, {"w": "demanding", "tr": "[dɪˈmɑːndɪŋ]", "ru": "требовательный, сложный"}, {"w": "rewarding", "tr": "[rɪˈwɔːdɪŋ]", "ru": "приносящий удовлетворение, стоящий усилий"}, {"w": "to switch careers", "tr": "[swɪtʃ kəˈrɪəz]", "ru": "сменить профессию"}]}, {"num": 36, "ru": "Навыки и опыт", "en": "Skills and Experience", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~440 слов.", "story": ["\"David, I don’t think I’m ready for the new project,\" Emma said, looking stressed. She was a junior developer, and her manager had just assigned her to lead a small team.", "\"Why not?\" David asked, leaning against the doorframe. \"You have excellent hard skills. You master Python and SQL better than anyone on the team.\"", "Emma shook her head. \"But I don’t have hands-on experience in leadership. What if I can’t adapt to managing people? My track record is only in coding, not in managing.\"", "David smiled and pulled up a chair. \"Emma, let me tell you a secret. Hard skills get you the job, but soft skills get you promoted.\"", "\"Soft skills?\" Emma asked. \"You mean things like communication?\"", "\"Exactly,\" David said. \"Think about your last project. When the server crashed, who stayed calm, organized the team, and communicated clearly with the client? You did. That’s leadership. That’s a crucial soft skill.\"", "Emma thought about it. \"I guess I did handle that well. But I still feel nervous.\"", "\"That’s normal,\" David reassured her. \"Nobody is born a perfect manager. You will learn by doing. I will be your mentor for the first month. We will have weekly check-ins, and I will give you honest feedback.\"", "\"Really? You would do that?\" Emma’s eyes widened.", "\"Of course,\" David said. \"My goal is to help you grow. Focus on listening to your team, being clear about expectations, and admitting when you don’t know something. Those are the soft skills that matter most.\"", "Emma took a deep breath. \"Okay. I’ll try. But if I make a mistake, promise you won’t fire me.\"", "David laughed. \"I promise. Mistakes are how we gain experience. Just don’t make the same mistake twice.\"", "Over the next few weeks, Emma faced challenges. Sometimes meetings ran late, and sometimes team members disagreed. But she remembered David’s advice. She listened, adapted her approach, and communicated openly.", "At the end of the month, the project was a success. The client sent a thank-you email specifically praising Emma’s organization and clarity.", "David stopped by her desk. \"See? I told you. You have the experience; you just needed to believe in your soft skills.\"", "Emma smiled, feeling a new sense of confidence. She realized that technical knowledge is important, but the ability to work with people is what truly makes a professional."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why was Emma worried about leading the new project?", "What is the difference between hard skills and soft skills according to David?", "How did David offer to help Emma?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Emma felt she wasn’t ready to lead because she lacked... (hands-on experience) in management.", "hints": ["David reminded her that she already has excellent... (hard skills) in coding.", "He explained that while hard skills get you the job,... (soft skills) get you promoted.", "David gave an example of how Emma showed leadership by staying... (calm) during a server crash.", "He offered to be her... (mentor) and give weekly feedback.", "Emma agreed to try, focusing on listening and... (communication).", "The project was a success, and the client praised Emma’s... (organization).", "Emma realized that working well with... (people) is just as important as technical knowledge."], "vocab": [{"w": "hard skills", "tr": "[hɑːd skɪlz]", "ru": "профессиональные (жесткие) навыки"}, {"w": "soft skills", "tr": "[sɒft skɪlz]", "ru": "гибкие навыки (коммуникация, адаптивность)"}, {"w": "hands-on experience", "tr": "[hændz ɒn ɪkˈspɪəriəns]", "ru": "практический опыт"}, {"w": "to adapt", "tr": "[əˈdæpt]", "ru": "адаптироваться"}, {"w": "to master", "tr": "[ˈmɑːstə]", "ru": "осваивать в совершенстве"}, {"w": "track record", "tr": "[træk ˈrekɔːd]", "ru": "послужной список, репутация"}]}, {"num": 37, "ru": "Конфликты на работе", "en": "Workplace Conflicts", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~450 слов.", "story": ["The atmosphere in the office was tense. Alex and Ben had been arguing all morning about the new website design.", "\"I told you, the blue button is too small!\" Alex said, his voice rising. \"Users won’t see it!\"", "\"And I told you,\" Ben replied, crossing his arms, \"the client specifically asked for a minimalist design. A big button ruins the aesthetic.\"", "They stared at each other, neither willing to back down. The rest of the team worked in silence, feeling uncomfortable.", "Finally, Alex stood up. \"Look, this isn’t working. Let’s take a break. Coffee? My treat.\"", "Ben hesitated, then nodded. \"Fine. Let’s talk.\"", "They walked to the nearby cafe. The fresh air helped them calm down.", "\"Ben, I’m sorry I raised my voice,\" Alex started. \"I’m just stressed about the deadline. But I genuinely believe the user experience is suffering.\"", "Ben sighed. \"I apologize too, Alex. I was defensive. I spent three days on that design, and it felt like you were attacking my work, not the button.\"", "\"I wasn’t attacking you,\" Alex said gently. \"I was trying to give constructive criticism. We both want this project to succeed.\"", "\"I know,\" Ben admitted. \"So, how do we resolve this? The client wants minimalism, but you want usability.\"", "Alex thought for a moment. \"What if we find some common ground? We can keep the minimalist background, but make the button a bright, contrasting color, like orange. It will be small, but highly visible.\"", "Ben’s eyes lit up. \"That’s actually a great idea. It satisfies the client’s aesthetic and your usability concern. Let’s try it.\"", "They returned to the office and updated the design together. When they showed it to the rest of the team, everyone agreed it was the best version yet.", "Later that day, their manager, Sarah, stopped by. \"I heard you two were arguing earlier. Is everything okay now?\"", "\"Yes, Sarah,\" Alex said. \"We had a misunderstanding, but we talked it out. We found a solution that works for everyone.\"", "Sarah smiled. \"I’m glad to hear that. Conflicts are normal in creative work. The important thing is how you resolve them. You handled it like true professionals.\"", "Alex and Ben looked at each other and smiled. They realized that avoiding conflict only makes things worse. By confronting the issue calmly, listening to each other, and being willing to apologize, they turned a frustrating argument into a productive collaboration."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What were Alex and Ben arguing about?", "How did Alex start to resolve the conflict at the cafe?", "What compromise (common ground) did they find for the button design?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Alex and Ben had a tense argument about the... (website design).", "hints": ["Alex felt the button was too small, while Ben wanted to keep the... (minimalist) style.", "They decided to take a break and talk at a... (cafe).", "Alex was the first to... (apologize) for raising his voice.", "Ben admitted he was defensive because he felt his work was being attacked, not just the... (button).", "Alex explained he was trying to give... (constructive criticism).", "They found... (common ground) by making the small button a bright, contrasting color.", "Their manager praised them for handling the... (conflict) like professionals.", "They learned that confronting issues calmly helps to... (resolve) problems effectively."], "vocab": [{"w": "to resolve", "tr": "[rɪˈzɒlv]", "ru": "разрешать (конфликт)"}, {"w": "misunderstanding", "tr": "[ˌmɪsʌndəˈstændɪŋ]", "ru": "недоразумение"}, {"w": "to confront", "tr": "[kənˈfrʌnt]", "ru": "столкнуться, открыто обсудить проблему"}, {"w": "constructive criticism", "tr": "[kənˈstrʌktɪv ˈkrɪtɪsɪzm]", "ru": "конструктивная критика"}, {"w": "to apologize", "tr": "[əˈpɒlədʒaɪz]", "ru": "извиняться"}, {"w": "common ground", "tr": "[ˈkɒmən ɡraʊnd]", "ru": "общая почва, взаимопонимание"}]}, {"num": 38, "ru": "Повышение квалификации и обучение", "en": "Professional Development and Training", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~440 слов.", "story": ["\"Sarah, you’ve been with the company for two years,\" Tom, the department head, said during her annual review. \"Your work is solid. But if you want that Senior Analyst promotion next year, you need to upskill.\"", "Sarah nodded. \"I know. I’ve been thinking about that. But I’m not sure where to start. There are so many courses online.\"", "Tom smiled. \"I actually have a suggestion. Next month, there’s a three-day advanced data analytics workshop in the city. It’s intensive, but it ends with a professional certification. I think you should attend.\"", "\"A workshop?\" Sarah asked, feeling a bit nervous. \"Will the company pay for it?\"", "\"Yes, it’s part of our professional development budget,\" Tom confirmed. \"But there’s a condition. After the workshop, you’ll need to present what you learned to the rest of the team. And I’ll assign Mark as your mentor to help you apply the new skills to your current projects.\"", "Sarah’s eyes widened. \"Mark? The senior analyst? That’s amazing!\"", "\"He’s agreed to it,\" Tom said. \"He thinks you have great potential. So, are you in?\"", "\"Absolutely,\" Sarah said, feeling a surge of motivation. \"Thank you, Tom.\"", "The workshop was challenging. Sarah spent three long days learning complex software and statistical methods. She was tired, but she took detailed notes and asked many questions.", "When she returned to the office, she felt overwhelmed. \"Mark, I don’t know if I can present this to the team. It’s too complicated,\" she confessed.", "Mark laughed. \"Don’t worry. We’ll practice. Let’s break it down into simple steps. Your goal isn’t to teach them everything, but to show them how this new tool can save us time.\"", "Over the next two weeks, Mark and Sarah worked together. He gave her constructive feedback on her presentation slides and helped her run a test analysis on real company data.", "Finally, the presentation day arrived. Sarah stood in front of the team, took a deep breath, and began. She spoke clearly, showed practical examples, and answered questions confidently.", "When she finished, the room erupted in applause.", "\"Excellent job, Sarah,\" Tom said, smiling. \"That was exactly the kind of initiative we need. The promotion next year is yours if you keep this up.\"", "Sarah beamed. She looked at Mark, who gave her a thumbs-up. She realized that professional development isn’t just about getting a certificate. It’s about stepping out of your comfort zone, learning from a mentor, and sharing that knowledge to help the whole team grow."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What did Tom suggest Sarah do to get a promotion?", "What was the condition for the company paying for the workshop?", "How did Mark help Sarah prepare for her presentation?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Tom told Sarah she needed to... (upskill) to become a Senior Analyst.", "hints": ["He suggested she attend an advanced data analytics... (workshop) to get a... (certification).", "The company agreed to pay, but Sarah had to present her new knowledge to the... (team).", "Tom assigned Mark to be her... (mentor).", "The workshop was challenging, and Sarah felt... (overwhelmed) at first.", "Mark helped her by practicing and giving... (feedback) on her presentation.", "Sarah presented confidently, and the team gave her... (applause).", "Tom confirmed that her... (promotion) was possible if she kept up the good work.", "Sarah realized that learning is about stepping out of your comfort zone and... (sharing) knowledge."], "vocab": [{"w": "workshop", "tr": "[ˈwɜːkʃɒp]", "ru": "семинар, практическое занятие"}, {"w": "to upskill", "tr": "[ʌpˈskɪl]", "ru": "повышать квалификацию"}, {"w": "certification", "tr": "[ˌsɜːtɪfɪˈkeɪʃn]", "ru": "сертификат, подтверждение квалификации"}, {"w": "mentor", "tr": "[ˈmentɔː]", "ru": "наставник"}, {"w": "to attend", "tr": "[əˈtend]", "ru": "посещать"}, {"w": "feedback", "tr": "[ˈfiːdbæk]", "ru": "обратная связь"}]}, {"num": 39, "ru": "Бизнес-этикет", "en": "Business Etiquette", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~430 слов.", "story": ["It was Liam’s first day at a large international company. He was excited but a bit nervous. He wanted to make a good impression, but he wasn’t entirely sure about the rules of business etiquette.", "He arrived at the office at 9:15 AM. His manager, Sophia, was already at her desk.", "\"Good morning, Liam,\" she said with a warm smile. \"I’m glad you’re here. Just a quick tip for the future: we value being punctual. Meetings usually start exactly at 9:00 AM.\"", "Liam’s face turned red. \"I’m so sorry, Sophia. The traffic was terrible. It won’t happen again.\"", "\"It’s okay, it’s your first day,\" she reassured him. \"Now, let me introduce you to the team. Remember to make eye contact, smile, and shake hands firmly. And please, call everyone by their first name. We are quite informal here.\"", "They walked to the open-plan office. Sophia introduced Liam to his colleagues. When an older colleague, Mr. Davis, started explaining his role, Liam got too excited and interrupted him.", "\"Actually, I read about that software!\" Liam said loudly.", "Mr. Davis stopped talking and looked a bit annoyed. Sophia gently stepped in. \"Liam, it’s very important to listen actively and not interrupt when someone is speaking. It shows respect.\"", "\"I apologize, Mr. Davis,\" Liam said quickly. \"Please, continue.\"", "Later, they went to the break room for coffee. Sophia noticed Liam was wearing a t-shirt and ripped jeans.", "\"Liam, I should have mentioned this earlier,\" she said kindly. \"We have a business casual dress code. A t-shirt is fine for Fridays, but for the rest of the week, we expect a collared shirt or a blouse.\"", "\"Oh, I didn’t know,\" Liam said, feeling embarrassed. \"I’ll change tomorrow.\"", "\"Don’t worry,\" Sophia smiled. \"And one last thing: when you meet clients or senior managers, always start with a little small talk. Ask about their weekend or the weather before jumping straight into business. It builds trust.\"", "Liam took out his notebook and wrote everything down. \"Thank you, Sophia. I really appreciate your honesty. I want to be polite and professional.\"", "\"You’re doing great,\" she said. \"Etiquette is just about making others feel comfortable and respected. You’ll get the hang of it in no time.\"", "By the end of the week, Liam was arriving at 8:45 AM, dressed in smart casual clothes, and actively listening to his colleagues. He realized that business etiquette wasn’t about strict, old-fashioned rules. It was about common sense, respect, and professionalism."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Sophia remind Liam about being punctual?", "What mistake did Liam make when Mr. Davis was speaking?", "What did Sophia advise Liam to do before talking about business with clients?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Liam was late on his first day, and Sophia reminded him to be... (punctual).", "hints": ["She taught him to make eye contact and... (shake hands) firmly.", "Liam made a mistake when he decided to... (interrupt) Mr. Davis.", "Sophia explained that it is important to be... (polite) and listen actively.", "She also noticed his t-shirt and explained the company’s... (dress code).", "Finally, she advised him to start meetings with some... (small talk).", "Liam wrote everything down and realized that etiquette is about... (respect)."], "vocab": [{"w": "punctual", "tr": "[ˈpʌŋktʃuəl]", "ru": "пунктуальный"}, {"w": "dress code", "tr": "[dres kəʊd]", "ru": "дресс-код"}, {"w": "to shake hands", "tr": "[ʃeɪk hændz]", "ru": "пожимать руку"}, {"w": "small talk", "tr": "[smɔːl tɔːk]", "ru": "светская беседа, разговор ни о чем"}, {"w": "to interrupt", "tr": "[ˌɪntəˈrʌpt]", "ru": "перебивать"}, {"w": "polite", "tr": "[pəˈlaɪt]", "ru": "вежливый"}]}, {"num": 40, "ru": "Офисная лексика", "en": "Office Vocabulary", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~440 слов.", "story": ["\"Excuse me, are you the new marketing assistant?\" asked a friendly voice.", "Emma turned around from her desk. A tall man with a cup of coffee was smiling at her. \"Yes, I’m Emma. I just started today.\"", "\"Welcome to the team! I’m Jack, I work in sales. My cubicle is right across from yours,\" he said, pointing to the desk opposite hers. \"How are you settling in?\"", "\"It’s a bit overwhelming,\" Emma admitted. \"This open-plan office is so big! I’m still trying to figure out where everything is.\"", "Jack laughed. \"Don’t worry, everyone feels that way on the first day. Let me give you a quick tour. First, do you know how to clock in and out?\"", "\"I think so,\" Emma said. \"I use the ID card on the scanner by the main entrance, right?\"", "\"Exactly,\" Jack confirmed. \"Just remember to do it every morning and evening, or HR will send you an automated email.\"", "They walked down the hallway. \"This is the break room,\" Jack said, opening a door. \"We have a microwave, a coffee machine, and a fridge. Please label your food with your name and the date. We had an incident last month with someone’s missing sandwich.\"", "Emma laughed. \"Noted! What about supplies? I need some pens and sticky notes.\"", "\"Ah, stationery,\" Jack said. \"We have a supply closet on the third floor. You can take what you need, but there’s a sign-out sheet on the door. Just write your name and the item.\"", "\"That’s easy enough,\" Emma said, feeling more relaxed. \"One more question: how do I book a meeting room? My manager asked me to schedule a brainstorming session for tomorrow.\"", "\"You can do that through the company intranet,\" Jack explained. \"Just go to the 'Rooms' tab, check the availability, and click 'Book'. It will automatically send a calendar invite to everyone you add.\"", "\"Wow, that’s very efficient,\" Emma said. \"Thank you so much, Jack. You’ve saved me a lot of time.\"", "\"No problem at all,\" Jack smiled. \"Oh, and one pro tip: the coffee machine makes the best espresso, but it takes about two minutes to heat up. Be patient!\"", "\"Good to know,\" Emma replied.", "As Jack walked back to his desk, Emma sat down and organized her new pens and sticky notes. She realized that learning the office vocabulary and routines wasn’t just about memorizing words. It was about understanding how the workplace functions and feeling like a true part of the team."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Where is Jack’s cubicle located?", "How does Emma clock in and out of work?", "What is the rule for taking stationery from the supply closet?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Jack welcomed Emma to the... (open-plan office).", "hints": ["He explained that she needs to use her ID card to... (clock in/out).", "He showed her the... (break room) and warned her to label her food.", "When Emma asked for pens, Jack told her about the... (stationery) closet and the sign-out sheet.", "To book a room, Emma needs to use the company... (intranet) to schedule the meeting.", "Jack also gave her a pro tip about the... (coffee machine).", "Emma realized that learning office routines helps her feel like part of the... (team)."], "vocab": [{"w": "cubicle", "tr": "[ˈkjuːbɪkl]", "ru": "офисная перегородка, кабинка"}, {"w": "break room", "tr": "[breɪk ruːm]", "ru": "комната отдыха"}, {"w": "to clock in/out", "tr": "[klɒk ɪn/aʊt]", "ru": "отмечаться о приходе/уходе с работы"}, {"w": "stationery", "tr": "[ˈsteɪʃənri]", "ru": "канцелярские принадлежности"}, {"w": "open-plan office", "tr": "[ˈəʊpən plæn ˈɒfɪs]", "ru": "офис открытой планировки"}, {"w": "to schedule", "tr": "[ˈʃedjuːl]", "ru": "планировать, назначать"}]}, {"num": 41, "ru": "Корпоративная культура", "en": "Corporate Culture", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~450 слов.", "story": ["\"Welcome to InnovateTech, David,\" said Helen, the HR director, as she handed him a company handbook. \"Before you meet your team, I want to talk about our corporate culture.\"", "David nodded, curious. \"I’ve heard great things about this company. What makes it so special?\"", "Helen smiled. \"It starts with our core values. We believe in transparency, innovation, and a healthy work-life balance. We don’t like strict hierarchy here. In fact, our CEO’s door is always open. You can talk to anyone, at any level.\"", "\"Really?\" David asked, surprised. \"In my last job, I needed three approvals just to speak to a department head.\"", "\"Exactly,\" Helen said. \"We want to empower our employees. We trust you to make decisions and take ownership of your projects. We don’t micromanage.\"", "\"That sounds amazing,\" David said. \"But what about the work-life balance? I’ve heard tech companies can be very demanding.\"", "\"We work hard, but we also rest well,\" Helen explained. \"We offer flexible working hours. If you need to pick up your kids from school or go to a doctor’s appointment, just let your manager know. We care about results, not about how many hours you sit at your desk.\"", "David felt a wave of relief. \"That’s exactly what I was looking for.\"", "\"Also,\" Helen continued, \"we invest a lot in team-building. Every quarter, we have a company retreat or a fun activity, like a cooking class or a hiking trip. It helps everyone connect outside of work.\"", "\"Is it mandatory?\" David joked.", "Helen laughed. \"No, but it’s highly encouraged! Most people love it. Oh, and we have a 'Fail Forward' policy.\"", "\"Fail forward? What does that mean?\"", "\"It means we encourage risk-taking,\" Helen said seriously. \"If you try a new idea and it fails, we don’t punish you. We analyze what went wrong, learn from it, and move on. We believe that without failure, there is no true innovation.\"", "David smiled broadly. \"Helen, I think I’m going to love it here.\"", "\"I’m glad to hear that,\" she said, standing up. \"Your manager, Mark, will show you to your desk now. Feel free to ask him any questions. Remember, transparency goes both ways. If something isn’t working for you, speak up.\"", "As David followed Mark down the bright, plant-filled hallway, he felt a strong sense of belonging. He realized that corporate culture wasn’t just words on a website. It was a living, breathing environment that shaped how people worked, communicated, and grew together."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What are the three core values of InnovateTech?", "How does the company support work-life balance?", "What does the \"Fail Forward\" policy mean?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Helen explained that the company doesn’t have a strict... (hierarchy).", "hints": ["They believe in... (transparency) and keeping the CEO's door open.", "The company wants to... (empower) employees and trusts them to make decisions.", "They support... (work-life balance) by offering flexible working hours.", "They also invest in... (team-building) activities every quarter.", "The \"Fail Forward\" policy encourages risk-taking and learning from... (failure).", "David realized that corporate culture is a living environment that shapes how people... (work and grow)."], "vocab": [{"w": "values", "tr": "[ˈvæljuːz]", "ru": "ценности"}, {"w": "transparency", "tr": "[trænsˈpærənsi]", "ru": "прозрачность, открытость"}, {"w": "work-life balance", "tr": "[wɜːk laɪf ˈbæləns]", "ru": "баланс между работой и личной жизнью"}, {"w": "hierarchy", "tr": "[ˈhaɪərɑːki]", "ru": "иерархия"}, {"w": "to empower", "tr": "[ɪmˈpaʊə]", "ru": "давать полномочия, вдохновлять"}, {"w": "team-building", "tr": "[ˈtiːm ˌbɪldɪŋ]", "ru": "тимбилдинг, сплочение команды"}]}, {"num": 42, "ru": "Деловые встречи", "en": "Business Meetings - External Focus", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~460 слов.", "story": ["Anna took a deep breath and looked around the conference room. Today, she was going to host an important meeting with a potential client from Germany, Mr. Schmidt.", "\"Is everything ready?\" she asked her assistant, Tom.", "\"Yes, Anna,\" Tom replied. \"The venue is booked, the projector is working, and I’ve printed the agenda and the presentation handouts. The coffee and water are on the table.\"", "\"Perfect,\" Anna said. \"Remember, my goal is to facilitate the discussion, not to talk the whole time. I need to listen to his needs.\"", "At 10:00 AM, Mr. Schmidt arrived. Anna greeted him warmly and shook his hand. \"Welcome to our office, Mr. Schmidt. I hope you had a good trip.\"", "\"Thank you, Anna. The trip was fine,\" he replied politely.", "They sat down, and Anna started the meeting. \"As you can see from the agenda, we will first review your current challenges, then present our software solution, and finally discuss the budget and timeline.\"", "Mr. Schmidt nodded. \"That sounds good. But I must address one concern immediately. Your competitor offers a similar product for 15% less. Why should we choose you?\"", "Anna didn’t panic. She had prepared for this. \"That’s a very fair question, Mr. Schmidt. Our initial price might be slightly higher, but our software includes 24/7 dedicated support and free integration with your existing systems. Your competitor charges extra for those services. In the long run, our solution will save you money and time.\"", "Mr. Schmidt leaned back and thought for a moment. \"I see. That is a valid point. Can you guarantee the integration will be completed within two months?\"", "\"Yes, absolutely,\" Anna said confidently. \"We have a dedicated team for that.\"", "The rest of the meeting went smoothly. Mr. Schmidt asked detailed questions, and Anna answered them clearly, facilitating a productive dialogue.", "After an hour, Anna wrapped up the meeting. \"Thank you for your time, Mr. Schmidt. I will send you the meeting minutes and a detailed proposal by tomorrow morning.\"", "\"I look forward to it,\" he said, standing up. \"It was a very productive discussion.\"", "After he left, Tom walked into the room. \"That was impressive, Anna. You handled his question about the price perfectly.\"", "\"Thank you, Tom,\" Anna smiled, feeling relieved. \"Now, let’s draft the follow-up email. We need to send the proposal while the details are still fresh in his mind.\"", "Anna realized that hosting a successful business meeting wasn’t just about having a nice venue or a fancy presentation. It was about preparation, active listening, addressing concerns honestly, and ensuring a clear, professional follow-up."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What did Tom prepare for the meeting?", "What was Mr. Schmidt’s main concern about the price?", "What did Anna promise to send by the next morning?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Anna prepared to... (host) a meeting with a German client, Mr. Schmidt.", "hints": ["Her assistant Tom made sure the... (venue) and materials were ready.", "Anna’s goal was to... (facilitate) the discussion and listen to his needs.", "Mr. Schmidt asked why they should choose them over a cheaper... (competitor).", "Anna explained that their price includes 24/7 support and free... (integration).", "Mr. Schmidt agreed it was a valid point and asked about the... (timeline).", "After the meeting, Anna promised to send the... (minutes) and a proposal.", "She realized that a successful meeting requires preparation, listening, and a clear... (follow-up)."], "vocab": [{"w": "to host", "tr": "[həʊst]", "ru": "принимать (гостей), проводить (мероприятие)"}, {"w": "venue", "tr": "[ˈvenjuː]", "ru": "место проведения"}, {"w": "to facilitate", "tr": "[fəˈsɪlɪteɪt]", "ru": "облегчать, направлять (обсуждение)"}, {"w": "minutes", "tr": "[ˈmɪnɪts]", "ru": "протокол встречи"}, {"w": "follow-up", "tr": "[ˈfɒləʊ ʌp]", "ru": "последующие действия, обратная связь после встречи"}, {"w": "to address", "tr": "[əˈdres]", "ru": "обращаться к, решать (проблему/вопрос)"}]}, {"num": 43, "ru": "Работа с документами", "en": "Working with Documents", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~430 слов.", "story": ["\"Rachel, can you help me find the Johnson contract?\" asked Mr. Peterson, the senior partner at the law firm. \"I need to review it before the meeting at 3 PM.\"", "Rachel, a new paralegal, felt a wave of panic. \"Of course, Mr. Peterson. I’ll find it right away.\"", "She sat down at her desk and opened the filing system. The firm had recently switched to a digital archive, but some old documents were still in physical folders. She checked the digital system first. Nothing.", "\"Maybe it’s in the basement archive,\" she muttered to herself.", "She ran downstairs to the storage room. Rows of metal shelves filled the space, each labeled with years and client names. She found the section for 2019 and started scanning the folders.", "\"Come on, come on,\" she whispered, her fingers flying over the tabs. \"Johnson, Johnson...\"", "Finally, she found it: a thick blue folder labeled \"Johnson Corp – 2019.\" She opened it carefully. Inside were dozens of pages, all marked \"Confidential.\"", "She carried the folder back upstairs, but on her way, she bumped into Tom, a colleague from another department.", "\"Hey Rachel, what’s that?\" Tom asked, glancing at the folder.", "\"It’s the Johnson contract,\" she said, holding it close. \"Mr. Peterson needs it.\"", "Tom raised his eyebrows. \"That’s confidential, right? You shouldn’t be carrying it around like that. What if you drop it?\"", "Rachel looked at the folder again. He was right. She had been so focused on finding it that she forgot about security.", "\"Good point,\" she said. \"I’ll put it in a sealed envelope.\"", "She went back to her desk, placed the folder in a large envelope, and wrote \"Confidential – For Mr. Peterson Only\" on the outside. Then she walked to Mr. Peterson’s office and knocked.", "\"Come in,\" he said.", "Rachel handed him the envelope. \"Here’s the Johnson contract, Mr. Peterson. I found it in the basement archive.\"", "Mr. Peterson opened the envelope and checked the contents. \"Perfect. Thank you, Rachel. By the way, did you make a hard copy for yourself?\"", "\"No, I didn’t think I needed one,\" she admitted.", "\"Always make a hard copy when you handle important documents,\" he advised. \"That way, if something happens to the original, you have a backup. And remember, confidential documents should never leave your sight unless they’re sealed.\"", "Rachel nodded, taking out her notebook. \"Got it. Thank you, Mr. Peterson.\"", "As she walked back to her desk, she realized that working with documents wasn’t just about organizing files. It was about understanding security, being prepared, and taking responsibility for every piece of paper that passed through her hands."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Rachel need to find the Johnson contract?", "Where did she finally find the document?", "What advice did Mr. Peterson give her about handling confidential documents?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Mr. Peterson asked Rachel to find the... (Johnson contract).", "hints": ["She checked the digital system but found nothing, so she went to the... (basement archive).", "She finally found the folder in the 2019 section, marked... (confidential).", "On her way back, Tom warned her about carrying it... (unsealed).", "Rachel put the folder in an envelope and wrote... (\"Confidential\") on it.", "Mr. Peterson advised her to always make a... (hard copy) as a backup.", "Rachel realized that working with documents is about... (security / responsibility)."], "vocab": [{"w": "to file", "tr": "[faɪl]", "ru": "подшивать, хранить документы"}, {"w": "confidential", "tr": "[ˌkɒnfɪˈdenʃl]", "ru": "конфиденциальный"}, {"w": "to sign", "tr": "[saɪn]", "ru": "подписывать"}, {"w": "hard copy", "tr": "[hɑːd ˈkɒpi]", "ru": "бумажная копия"}, {"w": "to archive", "tr": "[ˈɑːkaɪv]", "ru": "отправлять в архив"}, {"w": "deadline", "tr": "[ˈdedlaɪn]", "ru": "крайний срок"}]}, {"num": 44, "ru": "Деловые письма", "en": "Formal Business Letters", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~440 слов.", "story": ["\"Mrs. Johnson, I need your help,\" said Emma, a small business owner, sitting across from her lawyer. \"I ordered 500 custom-made boxes for my bakery from a supplier, and they arrived damaged. All of them.\"", "Mrs. Johnson, a senior lawyer specializing in business disputes, nodded. \"I’m sorry to hear that. Did you contact the supplier?\"", "\"Yes, I called them immediately,\" Emma said, frustrated. \"They said it was the shipping company’s fault and refused to help. I’ve lost a lot of money, and I can’t pack my products.\"", "\"Let me see the contract,\" Mrs. Johnson said, extending her hand.", "Emma handed her a printed document. Mrs. Johnson read it carefully for a few minutes.", "\"I see the problem,\" she said finally. \"The contract says the supplier is responsible for the goods until they are delivered to your location. That means they are liable for the damage, not the shipping company.\"", "\"So what can I do?\" Emma asked.", "\"You need to write a formal letter of complaint,\" Mrs. Johnson explained. \"It should be professional, clear, and specific. Start with the facts: when you ordered, what was delivered, and how it was damaged. Then, state what you want: a full refund or replacement boxes within a specific deadline.\"", "Emma took out her laptop. \"Can you help me draft it?\"", "\"Of course,\" Mrs. Johnson said. \"Let’s start. Write: 'Dear Sir or Madam, I am writing to formally complain about the order number 4567, delivered on March 15th.'\"", "Emma typed quickly. \"Okay, now what?\"", "\"Next, describe the problem. Write: 'Upon inspection, we discovered that all 500 boxes were damaged and unusable. This has caused significant disruption to our business operations.'\"", "Emma continued typing. \"And now I need to demand a refund, right?\"", "\"Yes,\" Mrs. Johnson said. \"Write: 'We demand a full refund of $2,500 or replacement boxes within 10 business days. If this matter is not resolved by [date], we will consider further legal action.'\"", "Emma finished the letter and read it aloud. \"That sounds very strong.\"", "\"It needs to be,\" Mrs. Johnson said. \"But remain professional. Don’t use emotional language. Just stick to the facts and your demands.\"", "Emma sent the letter that afternoon. Three days later, she received a response. The supplier apologized and offered a full refund plus compensation for the delay.", "\"Thank you, Mrs. Johnson,\" Emma called her. \"It worked! They agreed to everything.\"", "\"I’m glad to hear that,\" Mrs. Johnson replied. \"A well-written formal letter can resolve many problems without going to court. Just remember: always keep a copy of everything you send.\"", "Emma smiled. She realized that formal business letters weren’t just about complaining. They were a powerful tool to protect your rights and resolve disputes professionally."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What problem did Emma have with the box supplier?", "What did Mrs. Johnson say about who was responsible for the damage?", "What did Emma demand in her formal letter?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Emma ordered 500 custom boxes, but they arrived... (damaged).", "hints": ["The supplier blamed the... (shipping company) and refused to help.", "Mrs. Johnson checked the contract and said the supplier was... (liable).", "She advised Emma to write a formal... (letter of complaint).", "The letter included the facts, the problem, and a... (demand).", "Emma demanded a full... (refund) or replacement within 10 days.", "The supplier responded in three days and offered a refund plus... (compensation).", "Emma learned that formal letters are a powerful tool to... (resolve disputes)."], "vocab": [{"w": "formal letter", "tr": "[ˈfɔːml ˈletə]", "ru": "официальное письмо"}, {"w": "to complain", "tr": "[kəmˈpleɪn]", "ru": "жаловаться"}, {"w": "refund", "tr": "[ˈriːfʌnd]", "ru": "возврат денег"}, {"w": "to demand", "tr": "[dɪˈmɑːnd]", "ru": "требовать"}, {"w": "compensation", "tr": "[ˌkɒmpenˈseɪʃn]", "ru": "компенсация"}, {"w": "to resolve", "tr": "[rɪˈzɒlv]", "ru": "решать, урегулировать"}]}, {"num": 45, "ru": "Тайм-менеджмент", "en": "Time Management - Advanced", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~450 слов.", "story": ["\"Kate, you look exhausted,\" said her colleague, James, as they met in the office kitchen. \"Are you sleeping at all?\"", "Kate sighed and poured herself a third cup of coffee. \"Barely. I have three projects due next week, and I haven’t even started on the most important one. I keep procrastinating.\"", "James leaned against the counter. \"I used to be the same way. But I learned a few time management techniques that really helped. Want to hear them?\"", "\"Please,\" Kate said. \"I’m desperate.\"", "\"First,\" James began, \"you need to identify your biggest distraction. For me, it was my phone. I was checking social media every five minutes. I started using an app that blocks distracting websites during work hours. It made a huge difference.\"", "Kate nodded. \"That makes sense. My distraction is email. I feel like I have to respond immediately.\"", "\"Try batching,\" James suggested. \"Check your email only three times a day: morning, lunch, and late afternoon. You’ll be surprised how much time you save.\"", "\"Okay, I’ll try that,\" Kate said. \"But what about the three projects? How do I decide which one to start with?\"", "\"Use the Eisenhower Matrix,\" James explained. \"Divide your tasks into four categories: urgent and important, important but not urgent, urgent but not important, and neither. Start with the urgent and important ones. If something is important but not urgent, schedule it. If it’s urgent but not important, delegate it if possible.\"", "Kate thought for a moment. \"The client presentation is urgent and important. The team report is important but not urgent. And answering random emails is urgent but not important.\"", "\"Exactly,\" James said. \"Focus on the presentation first. And for the report, block out two hours tomorrow morning when you’re most productive. Turn off your phone and close your email.\"", "\"What if I still feel overwhelmed?\" Kate asked.", "\"Take breaks,\" James advised. \"Use the Pomodoro technique: 25 minutes of focused work, then a 5-minute break. After four cycles, take a longer break. And most importantly, don’t forget to schedule downtime. If you don’t rest, you’ll burn out.\"", "Kate wrote everything down in her notebook. \"Thank you, James. I’m going to try this starting today.\"", "The next week, Kate implemented James’s advice. She blocked distracting websites, batched her email, and used the Eisenhower Matrix to prioritize. She also took regular breaks and scheduled time to relax in the evenings.", "By Friday, she had finished all three projects and even had time to review next week’s tasks. She felt energized instead of exhausted.", "\"James, you’re a genius,\" she told him on Monday morning. \"I actually slept eight hours last night.\"", "James smiled. \"See? Time management isn’t about working harder. It’s about working smarter and taking care of yourself.\"", "Kate realized that managing time wasn’t just about getting more done. It was about reducing stress, avoiding burnout, and creating space for both work and life."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why was Kate feeling exhausted?", "What did James suggest to deal with distractions?", "What technique did Kate use to prioritize her projects?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Kate was exhausted because she had three projects and kept... (procrastinating).", "hints": ["James suggested using an app to block... (distractions) like social media.", "He also advised her to... (batch) email checking to three times a day.", "To prioritize, Kate used the... (Eisenhower Matrix).", "She identified the client presentation as urgent and... (important).", "James recommended the... (Pomodoro technique) for focused work.", "He also emphasized the importance of scheduling... (downtime) to avoid burnout.", "By Friday, Kate finished all projects and felt... (energized).", "She realized that time management is about working... (smarter) and taking care of yourself."], "vocab": [{"w": "procrastination", "tr": "[prəˌkræstɪˈneɪʃn]", "ru": "прокрастинация, откладывание дел"}, {"w": "to prioritize", "tr": "[praɪˈɒrɪtaɪz]", "ru": "расставлять приоритеты"}, {"w": "distraction", "tr": "[dɪˈstrækʃn]", "ru": "отвлечение"}, {"w": "to delegate", "tr": "[ˈdelɪɡeɪt]", "ru": "делегировать"}, {"w": "burnout", "tr": "[ˈbɜːnaʊt]", "ru": "выгорание"}, {"w": "to schedule", "tr": "[ˈʃedjuːl]", "ru": "планировать"}]}, {"num": 46, "ru": "Офисное оборудование", "en": "Office Equipment - Remote Work Focus", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~440 слов.", "story": ["\"Hey, Lisa, can you hear me?\" asked Mark, his voice crackling through the laptop speakers. \"You’re freezing on my screen.\"", "Lisa adjusted her headset and sighed. \"I can hear you, but the connection is terrible. I think my home internet bandwidth isn’t enough for video calls.\"", "Mark, who was working remotely from another city, nodded. \"I had the same problem when I first started working from home. Let me give you some advice on setting up a proper home office.\"", "\"Please,\" Lisa said. \"I’m working from my kitchen table, and my back is killing me.\"", "\"First,\" Mark said, \"invest in an ergonomic chair and a separate monitor. Working from a laptop screen for eight hours a day will ruin your posture. And get a good headset with noise cancellation. It makes a huge difference during calls.\"", "Lisa took notes. \"Okay, chair and headset. What about the internet?\"", "\"Call your provider and upgrade your plan,\" Mark advised. \"You need at least 50 Mbps for smooth video calls. And always have a backup plan. I keep my phone’s hotspot ready in case my internet goes down.\"", "\"Good idea,\" Lisa said. \"What about the webcam? Mine is blurry.\"", "\"Buy an external webcam,\" Mark suggested. \"The built-in ones are usually low quality. Also, make sure you have good lighting. Face a window or get a ring light. It makes you look much more professional on camera.\"", "Lisa ordered the equipment online. A few days later, everything arrived. She set up her new workspace in the spare room: ergonomic chair, external monitor, HD webcam, and a ring light.", "The next day, she had a team meeting. \"How do I look now?\" she asked Mark.", "\"Much better!\" he said. \"Your image is clear, and the sound is perfect. No more freezing.\"", "\"Thanks for the advice,\" Lisa said. \"One more thing: how do you handle file sharing? I’m worried about losing important documents.\"", "\"Use cloud storage,\" Mark explained. \"Google Drive, Dropbox, or OneDrive. They automatically sync your files and create backups. And always keep a local backup on an external hard drive. Better safe than sorry.\"", "Lisa set up cloud storage that afternoon. She uploaded all her important files and configured automatic backups.", "A week later, her computer crashed unexpectedly. She panicked for a moment, then remembered Mark’s advice. She logged into her cloud account from her phone and accessed all her files.", "\"Mark, you saved my life,\" she texted him. \"My computer died, but I didn’t lose anything.\"", "\"That’s the beauty of backups,\" Mark replied. \"Always be prepared for the worst.\"", "Lisa realized that working remotely required more than just a laptop. It required the right equipment, a good setup, and smart habits to stay productive and protected."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why was Lisa’s video connection freezing?", "What equipment did Mark suggest for a better home office?", "How did Lisa avoid losing her files when her computer crashed?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Lisa’s video was freezing because her internet... (bandwidth) was too low.", "hints": ["Mark suggested investing in an... (ergonomic) chair and external monitor.", "He also recommended a good... (headset) with noise cancellation.", "For the internet, Mark advised upgrading to at least... (50 Mbps).", "He suggested having a... (backup) plan like a phone hotspot.", "Lisa bought an external... (webcam) and a ring light for better video quality.", "Mark explained the importance of cloud storage and local... (backups).", "When Lisa’s computer crashed, she accessed her files from the... (cloud).", "She realized that remote work requires the right... (equipment) and smart habits."], "vocab": [{"w": "headset", "tr": "[ˈhedset]", "ru": "гарнитура"}, {"w": "webcam", "tr": "[ˈwebkæm]", "ru": "веб-камера"}, {"w": "bandwidth", "tr": "[ˈbændwɪdθ]", "ru": "пропускная способность интернета"}, {"w": "ergonomic", "tr": "[ˌɜːɡəˈnɒmɪk]", "ru": "эргономичный"}, {"w": "to troubleshoot", "tr": "[ˈtrʌblʃuːt]", "ru": "устранять неполадки"}, {"w": "backup", "tr": "[ˈbækʌp]", "ru": "резервная копия"}]}, {"num": 47, "ru": "Биржевые термины", "en": "Stock Market Terms", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~450 слов.", "story": ["\"Dad, I want to start investing,\" said 22-year-old Alex over dinner. \"I’ve been reading about the stock market, and I think it’s time to put my savings to work.\"", "His father, Robert, a financial advisor, smiled. \"That’s a great decision, Alex. But before you buy your first stock, you need to understand the basics. What do you know so far?\"", "\"Well,\" Alex began, \"a stock is a share of ownership in a company. When you buy a stock, you become a partial owner. And if the company does well, the stock price goes up, and you can sell it for a profit.\"", "\"Correct,\" Robert said. \"But there’s more to it. Some companies also pay dividends. That’s a portion of the company’s profits distributed to shareholders. It’s like getting regular income from your investment.\"", "Alex nodded. \"I’ve heard about that. So, should I just buy stocks in big companies like Apple or Tesla?\"", "Robert shook his head. \"Not so fast. The stock market can be very volatile. Prices go up and down every day. If you put all your money in one stock and it crashes, you could lose everything. That’s why you need to diversify your portfolio.\"", "\"Diversify?\" Alex asked.", "\"It means spreading your investments across different stocks, sectors, and even countries,\" Robert explained. \"That way, if one company fails, the others can balance it out. Don’t put all your eggs in one basket.\"", "Alex thought about this. \"So I should buy stocks in technology, healthcare, energy, and maybe some international companies?\"", "\"Exactly,\" Robert said. \"And don’t forget about bonds. They’re less risky than stocks and can provide steady income. A good portfolio has a mix of both.\"", "\"What about timing the market?\" Alex asked. \"Should I wait for the prices to drop before buying?\"", "Robert laughed. \"That’s what everyone tries to do, but it’s nearly impossible to predict. The best strategy is to invest regularly, no matter what the market is doing. It’s called dollar-cost averaging. You buy a fixed amount every month, regardless of the price.\"", "Alex wrote everything down in his notebook. \"This is a lot to take in. Where do I start?\"", "\"Start small,\" Robert advised. \"Open a brokerage account, deposit a small amount, and buy a few diversified stocks or an index fund. An index fund tracks the whole market, so it’s automatically diversified. And most importantly, be patient. Investing is a long-term game.\"", "Alex smiled. \"Thanks, Dad. I feel much more confident now.\"", "\"Remember,\" Robert said, \"investing isn’t about getting rich quick. It’s about building wealth slowly and steadily over time.\"", "Alex realized that the stock market wasn’t just about buying and selling stocks. It was about understanding risk, diversifying wisely, and having the patience to let your investments grow."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What is a stock according to Alex?", "What did Robert say about dividends?", "Why is it important to diversify a portfolio?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Alex told his dad he wanted to start... (investing) in the stock market.", "hints": ["Robert explained that a stock is a share of... (ownership) in a company.", "Some companies pay... (dividends), which is a portion of profits.", "Robert warned that the market can be... (volatile) and prices change daily.", "He advised Alex to... (diversify) his portfolio across different sectors.", "Robert also mentioned bonds as a less... (risky) investment.", "Instead of timing the market, Robert suggested... (dollar-cost averaging).", "He told Alex to start small with an index fund for automatic... (diversification).", "Alex realized that investing is about building wealth... (slowly and steadily)."], "vocab": [{"w": "stock", "tr": "[stɒk]", "ru": "акция"}, {"w": "to invest", "tr": "[ɪnˈvest]", "ru": "инвестировать"}, {"w": "dividend", "tr": "[ˈdɪvɪdend]", "ru": "дивиденд"}, {"w": "portfolio", "tr": "[pɔːtˈfəʊliəʊ]", "ru": "портфель (инвестиций)"}, {"w": "to diversify", "tr": "[daɪˈvɜːsɪfaɪ]", "ru": "диверсифицировать"}, {"w": "volatile", "tr": "[ˈvɒlətaɪl]", "ru": "волатильный, нестабильный"}]}, {"num": 48, "ru": "Виды активов", "en": "Types of Assets", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~460 слов.", "story": ["\"Grandpa, what’s the difference between being rich and being wealthy?\" asked 16-year-old Sophie during their weekend visit.", "Her grandfather, a retired businessman, smiled. \"That’s a very smart question, Sophie. Let me explain. Being rich means you have a lot of money right now. Being wealthy means you have assets that generate income and grow over time.\"", "\"Assets?\" Sophie asked. \"Like what?\"", "\"An asset is anything that has value and can put money in your pocket,\" Grandpa explained. \"There are different types. The most common are cash, real estate, stocks, and businesses.\"", "Sophie thought for a moment. \"So if I have $1,000 in my savings account, that’s an asset?\"", "\"Yes, but it’s a liquid asset,\" Grandpa said. \"That means you can access it immediately. But cash doesn’t grow much. Inflation will eat away its value over time.\"", "\"What about real estate?\" Sophie asked. \"Mom and Dad own our house. Is that an asset?\"", "\"It can be,\" Grandpa said. \"Real estate usually appreciates over time, meaning it increases in value. And if you rent it out, it generates income. But a house is not a liquid asset. You can’t sell it quickly if you need cash.\"", "Sophie nodded. \"What about my car? Is that an asset?\"", "Grandpa chuckled. \"Actually, a car is a liability, not an asset. It depreciates, which means it loses value over time. And it costs you money for gas, insurance, and maintenance. True assets put money in your pocket; liabilities take money out.\"", "\"So I should buy things that grow in value or generate income,\" Sophie summarized.", "\"Exactly,\" Grandpa said. \"For example, if you buy stocks in a good company, they can appreciate and pay dividends. If you start a small business, it can generate profits. The key is to acquire assets that work for you, even when you’re sleeping.\"", "Sophie looked thoughtful. \"But how do I start? I don’t have much money.\"", "\"Start small,\" Grandpa advised. \"Save a portion of your allowance and invest it. Buy a few shares of a company you believe in. Or save up and start a small side business, like selling handmade crafts online. The important thing is to begin early.\"", "\"What about education?\" Sophie asked. \"Is that an asset?\"", "Grandpa’s eyes lit up. \"That’s the best asset of all! Your skills and knowledge can generate income for your entire life. No one can take that away from you.\"", "Sophie smiled. \"I think I understand now. Being wealthy isn’t about how much you spend. It’s about what you own and what it does for you.\"", "\"Exactly,\" Grandpa said. \"Rich is about income. Wealthy is about assets. And the sooner you start building assets, the sooner you’ll achieve financial freedom.\"", "Sophie realized that understanding the difference between assets and liabilities was the foundation of financial literacy. She decided to start saving and learning about investing right away."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What is the difference between being rich and being wealthy according to Grandpa?", "Why is cash considered a liquid asset but not the best long-term investment?", "Why did Grandpa say a car is a liability, not an asset?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Sophie asked her grandpa about the difference between being rich and... (wealthy).", "hints": ["Grandpa explained that an... (asset) is anything that has value and generates income.", "Cash is a... (liquid) asset, but it doesn’t grow much due to inflation.", "Real estate usually... (appreciates) over time and can generate rental income.", "A car is a liability because it... (depreciates) and costs money to maintain.", "Grandpa advised Sophie to buy things that grow in value or... (generate income).", "He said the best asset is... (education) and skills.", "Sophie realized that wealth is about what you... (own) and what it does for you.", "She decided to start saving and learning about... (investing) early."], "vocab": [{"w": "asset", "tr": "[ˈæset]", "ru": "актив"}, {"w": "liquid", "tr": "[ˈlɪkwɪd]", "ru": "ликвидный (легко convertible в деньги)"}, {"w": "real estate", "tr": "[ˈriːl ɪˈsteɪt]", "ru": "недвижимость"}, {"w": "to appreciate", "tr": "[əˈpriːʃieɪt]", "ru": "расти в цене"}, {"w": "depreciation", "tr": "[dɪˌpriːʃɪˈeɪʃn]", "ru": "обесценивание, износ"}, {"w": "to generate income", "tr": "[ˈdʒenəreɪt ˈɪnkʌm]", "ru": "генерировать доход"}]}, {"num": 49, "ru": "Офисные разговоры и small talk", "en": "Office Chitchat and Small Talk", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~420 слов.", "story": ["It was 10:00 AM on a Tuesday, and the office coffee machine was humming. Sarah, a new marketing assistant, stood there nervously, waiting for her coffee. She didn’t know anyone well yet, and the silence felt awkward.", "Suddenly, David, a senior designer, walked in. \"Morning, Sarah! How’s your first week going?\" he asked with a friendly smile.", "Sarah relaxed a bit. \"Hi, David. It’s going well, thanks! A bit overwhelming, but I’m learning a lot.\"", "\"I remember my first week,\" David laughed. \"I spilled coffee on my keyboard on day two. So, you’re doing great. Do you have any plans for the weekend?\"", "Sarah was surprised but pleased. \"Actually, yes! I’m going to a local art exhibition on Saturday. I love modern art.\"", "David’s eyes lit up. \"No way! Are you going to the new gallery on Main Street? I was just thinking about checking it out.\"", "\"Yes, that’s the one!\" Sarah smiled. \"Have you been there before?\"", "\"Not yet, but I’ve heard great things. Maybe I’ll see you there,\" David said. \"By the way, can you believe this rain? I thought spring was supposed to be sunny.\"", "\"I know, right?\" Sarah agreed. \"I had to take an umbrella today, and I almost forgot it on the bus.\"", "They laughed, and the awkward silence was completely gone. David had successfully broken the ice.", "\"Well, I better get back to my desk,\" David said, taking his mug. \"It was great catching up with you, Sarah. If you need any help with the design software, just let me know.\"", "\"Thank you, David! I really appreciate it,\" Sarah replied.", "As David walked away, Sarah felt much more comfortable. She realized that small talk wasn’t just empty chatter. It was a crucial tool for building relationships, finding common ground, and making the workplace feel friendly and welcoming. From that day on, she made an effort to say hello and ask about her colleagues' weekends."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Sarah feel awkward at the coffee machine?", "How did David break the ice with Sarah?", "What common interest did Sarah and David discover?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Sarah was a new employee and felt... (awkward) at the coffee machine.", "hints": ["David came in and asked her about her... (first week / weekend).", "Sarah mentioned she was going to an... (art exhibition).", "David was also interested in the new gallery on... (Main Street).", "They also briefly discussed the rainy... (weather).", "David successfully... (broke the ice) and offered help with design software.", "Sarah realized that... (small talk) is a crucial tool for building relationships and finding... (common ground)."], "vocab": [{"w": "small talk", "tr": "[smɔːl tɔːk]", "ru": "светская беседа, разговор ни о чем"}, {"w": "to break the ice", "tr": "[breɪk ði aɪs]", "ru": "разрядить обстановку, растопить лед"}, {"w": "to catch up", "tr": "[kætʃ ʌp]", "ru": "обменяться новостями"}, {"w": "awkward", "tr": "[ˈɔːkwəd]", "ru": "неловкий"}, {"w": "weather", "tr": "[ˈweðə]", "ru": "погода"}, {"w": "common ground", "tr": "[ˈkɒmən ɡraʊnd]", "ru": "общая тема, взаимопонимание"}]}, {"num": 50, "ru": "Рабочие встречи и обсуждение задач", "en": "Work Meetings and Task Discussion", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~440 слов.", "story": ["\"Alright team, let’s do a quick stand-up meeting,\" said Elena, the project manager, clapping her hands lightly. \"It’s 9:30 AM. Let’s keep it to 15 minutes. Mark, you start.\"", "Mark stood up from his desk. \"Yesterday, I finished the first draft of the website copy. Today, I’ll review it with the design team. No roadblocks so far.\"", "\"Great,\" Elena noted. \"Lisa, how is the mobile app development going?\"", "Lisa sighed slightly. \"Well, I have a progress report. The coding is 80% done, but we hit a roadblock with the payment gateway integration. The API documentation from the vendor is unclear.\"", "Elena frowned. \"That’s a critical issue. We need to resolve it before Friday’s deadline. Let’s brainstorm solutions right now. Tom, you worked with this vendor before, right?\"", "Tom nodded. \"Yes, I did. Their documentation is always messy. But I have a workaround. I can share my old code snippets with Lisa. It should save her at least two days of work.\"", "Lisa looked relieved. \"That would be amazing, Tom! Thank you.\"", "\"Perfect,\" Elena said, typing quickly on her laptop. \"So, here are the action items. Tom, you will send the code snippets to Lisa by noon. Lisa, you will implement the workaround and test it by Thursday. Mark, you’ll proceed with the design review as planned. Any questions?\"", "\"No, that’s clear,\" Lisa said.", "\"Sounds good to me,\" Mark added.", "\"Excellent. Let’s get to work,\" Elena smiled. \"And remember, if you hit another roadblock, don’t wait until the next meeting. Message me immediately.\"", "The team dispersed, feeling focused and aligned. Mark started his design review, Tom immediately opened his old project files to help Lisa, and Lisa began testing the new code.", "Later that afternoon, Lisa sent a message to the team chat: \"Payment gateway is working perfectly! Thanks, Tom, your code saved the day.\"", "Elena replied with a thumbs-up emoji. She realized that short, focused meetings weren’t a waste of time. When done right, they helped the team identify problems early, brainstorm solutions together, and leave with clear action items."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What is the purpose of a stand-up meeting?", "What roadblock did Lisa report during the meeting?", "How did the team resolve the payment gateway issue?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Elena started a quick... (stand-up meeting) at 9:30 AM.", "hints": ["Mark reported that he finished the website... (copy) with no roadblocks.", "Lisa gave a... (progress report) but mentioned a problem with the payment gateway.", "The team decided to... (brainstorm) a solution immediately.", "Tom offered to share his old... (code snippets) to help Lisa.", "Elena listed the... (action items) for everyone.", "By the afternoon, Lisa confirmed the gateway was... (working).", "Elena realized that short meetings help identify problems and create clear... (action items)."], "vocab": [{"w": "stand-up meeting", "tr": "[stænd ʌp ˈmiːtɪŋ]", "ru": "короткая летучка (стоя)"}, {"w": "to assign a task", "tr": "[əˈsaɪn ə tɑːsk]", "ru": "назначать задачу"}, {"w": "progress report", "tr": "[ˈprəʊɡres rɪˈpɔːt]", "ru": "отчет о прогрессе"}, {"w": "to brainstorm", "tr": "[ˈbreɪnstɔːm]", "ru": "проводить мозговой штурм"}, {"w": "roadblock", "tr": "[ˈrəʊdblɒk]", "ru": "препятствие, проблема"}, {"w": "action item", "tr": "[ˈækʃən ˈaɪtəm]", "ru": "конкретное действие, задача"}]}, {"num": 51, "ru": "Электронная переписка и деловые письма", "en": "новая) (Email Correspondence - Advanced Scenarios", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~430 слов.", "story": ["\"Hey, Alex, before you leave for your vacation, did you set up your out of office reply?\" asked Maria, the office administrator.", "Alex paused, his hand on his bag. \"Oh no, I completely forgot! Thanks for reminding me.\" He quickly opened his laptop and typed: \"Thank you for your email. I am currently out of the office with no access to email. I will return on Monday, June 12th. For urgent matters, please contact Maria at maria@company.com.\"", "\"Perfect,\" Maria said. \"Now, about the client meeting next Tuesday. I sent you the calendar invite. Did you RSVP?\"", "Alex checked his inbox. \"Yes, I saw it. But I have to decline the invitation. I’ll still be traveling on Tuesday morning. Can we reschedule it for Wednesday afternoon?\"", "\"Let me check with the client,\" Maria said. She opened the email thread and hit 'Reply All'. She wrote: \"Dear Mr. Smith, Alex is traveling on Tuesday. Would Wednesday at 2 PM work for you? Please let us know.\"", "Within ten minutes, a reply popped up. \"Wednesday at 2 PM is perfect. See you then.\"", "\"Great, I’ll update the calendar invite,\" Maria said. \"Oh, and one more thing. Did you forward the Q2 financial report to the accounting department?\"", "Alex’s eyes widened. \"I meant to do it yesterday! Let me do it right now.\" He found the file, attached it to a new email, and wrote a concise message: \"Please find attached the Q2 financial report. Let me know if you have any questions.\" He double-checked the attachment and hit send.", "\"Done,\" Alex said, closing his laptop. \"Is there anything else?\"", "\"No, that’s everything,\" Maria smiled. \"Have a great vacation!\"", "\"Thanks, Maria. I’ll make sure my out of office reply is active before I walk out that door.\"", "As Alex left the building, he felt a sense of relief. He realized that professional email management wasn’t just about writing well. It was about setting clear boundaries (like the out of office reply), communicating schedule changes politely (declining and rescheduling), and double-checking important actions (like forwarding attachments) before logging off."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What did Alex forget to do before his vacation?", "Why did Alex have to decline the meeting invitation?", "What did Alex do to ensure the accounting department got the report?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Maria reminded Alex to set up his... (out of office reply).", "hints": ["Alex typed a message stating he had no access to email and gave Maria as a contact for... (urgent) matters.", "Maria asked if he had... (RSVPed) to the client meeting.", "Alex had to... (decline the invitation) because he would be traveling.", "Maria emailed the client to... (reschedule) for Wednesday, and the client agreed.", "Alex realized he forgot to... (forward) the Q2 financial report.", "He quickly attached the file and sent a... (concise) message.", "Alex learned that email management requires setting boundaries and double-checking... (attachments)."], "vocab": [{"w": "out of office reply", "tr": "[aʊt əv ˈɒfɪs rɪˈplaɪ]", "ru": "автоответчик об отсутствии"}, {"w": "to forward", "tr": "[ˈfɔːwəd]", "ru": "пересылать (письмо)"}, {"w": "urgent", "tr": "[ˈɜːdʒənt]", "ru": "срочный"}, {"w": "to decline an invitation", "tr": "[dɪˈklaɪn ən ˌɪnvɪˈteɪʃn]", "ru": "вежливо отклонить приглашение"}, {"w": "to RSVP", "tr": "[ˌɑːr es viː ˈpiː]", "ru": "подтвердить или отклонить приглашение"}, {"w": "thread", "tr": "[θred]", "ru": "цепочка писем"}]}, {"num": 52, "ru": "Управление временем и продуктивность", "en": "Time Management and Productivity", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~450 слов.", "story": ["\"I can’t do this anymore,\" James groaned, putting his head on his desk. \"I have three reports due tomorrow, and I’ve spent the last two hours scrolling through social media. I’m a master at procrastination.\"", "His colleague, Anna, rolled her chair over. \"James, you’re not a master at procrastination, you’re just overwhelmed. Let’s fix this together.\"", "\"How? I have zero focus,\" James replied.", "\"First, identify your biggest distraction,\" Anna said. \"For you, it’s your phone. Put it in your drawer on silent mode.\"", "James sighed but did it. \"Okay, it’s in the drawer. Now what?\"", "\"Now, we use time blocking,\" Anna explained. \"Don’t look at the whole mountain of work. Break it down. Let’s block the next 45 minutes exclusively for Report A. No emails, no chatting, just Report A. Can you do 45 minutes?\"", "\"Forty-five minutes I can handle,\" James said.", "\"Great. Set a timer. Go.\"", "James opened the document and started typing. Without his phone buzzing, he found it surprisingly easy to focus. When the timer rang 45 minutes later, he had finished half of Report A.", "\"Wow, that actually worked,\" James said, stretching his arms.", "\"Told you,\" Anna smiled. \"Now, take a 10-minute break. Get some water. Then we’ll do another block for Report B.\"", "\"What about Report C?\" James asked. \"I won’t have time for all three.\"", "\"That’s where delegation comes in,\" Anna said. \"Can you ask Tom to handle the data collection for Report C? He’s faster at it anyway. You just review his work tomorrow morning.\"", "James nodded. \"You’re right. I’ll message him right after my break.\"", "James followed Anna’s advice. He worked in focused 45-minute blocks, took short breaks, and delegated the data collection to Tom. By 6:00 PM, Reports A and B were completely finished, and Tom had already sent the data for Report C.", "\"Anna, you are a lifesaver,\" James said, packing his bag. \"I feel so much more efficient today. I didn’t even feel stressed.\"", "\"Productivity isn’t about working 12 hours a day,\" Anna replied. \"It’s about managing your energy, eliminating distractions, and working smart. You just proved that to yourself.\"", "James walked out of the office feeling proud. He realized that beating procrastination wasn’t about sheer willpower. It was about using the right strategies, like time blocking and delegation, to make the work manageable."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why was James feeling overwhelmed at the beginning of the story?", "What was James’s biggest distraction, and how did Anna suggest handling it?", "How did James manage to finish his work by 6:00 PM?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, James was stressed because he had to... (procrastinate) and scroll social media instead of working.", "hints": ["Anna told him to remove his biggest... (distraction) by putting his phone in a drawer.", "She introduced him to... (time blocking), suggesting he work for 45 minutes on one report.", "James found it easy to... (focus) without interruptions.", "For the third report, Anna suggested he... (delegate) the data collection to Tom.", "James took short breaks and worked in focused... (blocks).", "By 6:00 PM, he finished his work and felt much more... (efficient).", "He learned that productivity is about managing energy and working... (smart)."], "vocab": [{"w": "to procrastinate", "tr": "[prəˈkræstɪneɪt]", "ru": "откладывать дела на потом"}, {"w": "distraction", "tr": "[dɪˈstrækʃn]", "ru": "отвлечение"}, {"w": "time blocking", "tr": "[taɪm ˈblɒkɪŋ]", "ru": "блочное планирование времени"}, {"w": "to delegate", "tr": "[ˈdelɪɡeɪt]", "ru": "делегировать, поручать"}, {"w": "efficient", "tr": "[ɪˈfɪʃnt]", "ru": "эффективный"}, {"w": "to focus", "tr": "[ˈfəʊkəs]", "ru": "сосредотачиваться"}]}, {"num": 53, "ru": "Обратная связь и оценка работы", "en": "Feedback and Performance Review", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~440 слов.", "story": ["\"Come in, Chloe, have a seat,\" said Mr. Davis, the department manager. \"It’s time for your annual performance review.\"", "Chloe sat down, feeling a bit nervous. \"Thank you, Mr. Davis. I’m ready.\"", "\"First of all, I want to acknowledge your hard work this year,\" Mr. Davis began with a warm smile. \"Your strengths are very clear. You are incredibly organized, and your presentation skills are outstanding. The client loved your pitch last month.\"", "Chloe relaxed and smiled. \"Thank you. I really enjoyed working on that project.\"", "\"However,\" Mr. Davis continued gently, \"every performance review includes areas for improvement. I’ve noticed that you sometimes struggle with time management when you have multiple deadlines. You tend to take on too much and then rush at the end.\"", "Chloe nodded thoughtfully. \"You’re right. I find it hard to say no to new tasks, and then I get overwhelmed.\"", "\"Exactly,\" Mr. Davis said. \"This is where constructive criticism comes in. I’m not saying you’re doing a bad job. I’m suggesting a way to make your excellent work even better. Have you considered using a task management tool or delegating smaller tasks to the junior team?\"", "\"I’ve thought about it,\" Chloe admitted. \"I think I need to prioritize better and communicate my workload to you earlier.\"", "\"That’s a fantastic goal,\" Mr. Davis said, writing it down. \"Let’s make that one of your objectives for the next quarter. I will support you in this. If you feel overwhelmed, come to me, and we will adjust your tasks.\"", "\"Thank you, Mr. Davis. I appreciate the honest feedback. It’s very helpful,\" Chloe said sincerely.", "\"My door is always open,\" he replied. \"You have a bright future here, Chloe. Keep up the great work on your strengths, and let’s tackle those areas for improvement together.\"", "Chloe left the office feeling motivated, not defeated. She realized that a good performance review wasn’t about listing mistakes. It was a balanced conversation that acknowledged strengths, provided constructive criticis
