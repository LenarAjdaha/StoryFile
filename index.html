ice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Alex feel guilty after agreeing to the Johnson project?", "What advice did Sarah give Alex about saying no?", "How did David react when Alex explained his workload?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, David asked Alex to take on a new project, and Alex agreed despite being... (busy).", "hints": ["Alex felt... (guilt) and exhaustion because he couldn't set a... (boundary).", "His mentor Sarah told him that saying yes to everything leads to... (burnout).", "She taught him to be... (assertive) and explain his current commitments.", "Alex learned to... (prioritize) his tasks and negotiate instead of just refusing.", "He spoke to David professionally, and David agreed to give the project to... (Mark).", "Alex realized that setting boundaries is essential for... (well-being) and earns... (respect) from others."], "vocab": [{"w": "boundary", "tr": "[ˈbaʊndri]", "ru": "граница"}, {"w": "to say no", "tr": "[seɪ nəʊ]", "ru": "говорить «нет», отказывать"}, {"w": "guilt", "tr": "[ɡɪlt]", "ru": "чувство вины"}, {"w": "to prioritize", "tr": "[praɪˈɒrɪtaɪz]", "ru": "расставлять приоритеты"}, {"w": "assertive", "tr": "[əˈsɜːtɪv]", "ru": "уверенный в себе, настойчивый (в хорошем смысле)"}, {"w": "respect", "tr": "[rɪˈspekt]", "ru": "уважение"}]}, {"num": 73, "ru": "Совещания и эффективное проведение встреч", "en": "Meetings and Effective Meeting Facilitation", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~430 слов.", "story": ["The weekly marketing meeting was turning into a disaster. It had been going on for an hour, and they were still discussing the color of the new logo.", "\"I just think blue is more trustworthy,\" Mark argued for the fifth time.", "\"But our competitor uses blue!\" Lisa countered.", "The team leader, David, rubbed his temples. The meeting was completely derailed. He realized he needed to step up as a proper facilitator.", "\"Okay, everyone, let’s pause,\" David said, raising his hand. \"We are going off-topic. The agenda says we have ten minutes left, and we still need to approve the Q3 budget. Let’s make a decision on the logo right now to reach a consensus, or we table it for next week.\"", "\"Let’s table it,\" Mark sighed. \"We can’t agree today.\"", "\"Agreed,\" David said. \"Now, Lisa, you are our timekeeper today. Please give us a two-minute warning before the hour is up.\"", "\"Got it,\" Lisa said, setting a timer on her phone.", "David quickly guided the team through the budget slides. Because he kept the discussion focused and prevented side conversations, they reviewed all the numbers in fifteen minutes.", "\"Great job, team,\" David said, looking at the clock. \"We have two minutes left. Let’s wrap up. What are our action items?\"", "Lisa read from her notes: \"Mark will research three alternative logo colors by Friday. I will finalize the Q3 budget spreadsheet by tomorrow noon. And David will send the meeting minutes to the director.\"", "\"Perfect,\" David smiled. \"Meeting adjourned. That was much more efficient than last week.\"", "As the team packed up their laptops, Mark turned to David. \"Thanks for stepping in, David. I felt like we were going to talk about logos until midnight.\"", "\"That’s why we need a strong facilitator,\" David replied. \"A good meeting isn’t about talking the most; it’s about respecting everyone’s time, sticking to the agenda, and leaving with clear action items. We’ll try this format every week from now on.\"", "Mark nodded. \"I’m definitely on board with that.\""], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why was the marketing meeting turning into a disaster?", "What two roles did David and Lisa take on to fix the meeting?", "What were the action items at the end of the meeting?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, the team was wasting time arguing about the logo and started to... (go off-topic).", "hints": ["David stepped in as a... (facilitator) to bring the meeting back to the agenda.", "He asked the team to reach a... (consensus) or table the discussion.", "Lisa acted as a... (timekeeper) to ensure they finished on time.", "They quickly reviewed the budget and David asked for the... (action items).", "The team left with clear tasks and a deadline for each... (action item).", "David realized that effective meetings require sticking to the agenda and... (wrapping up) on time."], "vocab": [{"w": "facilitator", "tr": "[fəˈsɪlɪteɪtə]", "ru": "ведущий, модератор встречи"}, {"w": "timekeeper", "tr": "[ˈtaɪmkiːpə]", "ru": "хранитель времени"}, {"w": "to go off-topic", "tr": "[ɡəʊ ɒf ˈtɒpɪk]", "ru": "отклоняться от темы"}, {"w": "action items", "tr": "[ˈækʃən ˈaɪtəmz]", "ru": "конкретные задачи, действия по итогам встречи"}, {"w": "to wrap up", "tr": "[ræp ʌp]", "ru": "завершать, подводить итоги"}, {"w": "consensus", "tr": "[kənˈsensəs]", "ru": "консенсус, общее согласие"}]}, {"num": 74, "ru": "Делегирование задач и управление командой", "en": "Task Delegation and Team Management", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~440 слов.", "story": ["\"Alex, the client presentation is due tomorrow, and the slides are still full of errors,\" said Sarah, the department director, looking at Alex’s desk.", "Alex looked exhausted. Dark circles were under his eyes. \"I know, Sarah. I’m trying to fix them, but I also had to rewrite the report and answer client emails. I just don’t have the capacity to do everything myself.\"", "Sarah pulled up a chair. \"Alex, you were promoted to team lead because you are an excellent specialist. But you are not acting like a manager. You are trying to do everyone’s job.\"", "\"But if I don’t check their work, they make mistakes!\" Alex protested.", "\"That’s because you micromanage them,\" Sarah explained gently. \"You don’t give them clear instructions, and then you rewrite everything at the last minute. They never learn, and you burn out. You need to learn how to delegate.\"", "\"How? Last time I delegated, the result was a mess,\" Alex sighed.", "\"Delegation is not just dumping work on someone,\" Sarah said. \"It’s about matching the task to the person’s capacity, giving clear expectations, and then trusting them to do it. You must empower your team to take accountability for their own work.\"", "Alex thought about this. \"So, I should have told Mark exactly what the slides needed, given him a deadline, and let him do it?\"", "\"Exactly,\" Sarah nodded. \"And if he makes a mistake, you review it together and give constructive feedback. That’s how people grow. If you do everything yourself, you are not a leader; you are a bottleneck.\"", "The next day, Alex tried a new approach. He called his team for a quick meeting. \"Okay, for the new project, Mark, you are in charge of the data analysis. Lisa, you handle the slide design. I will review the final draft on Thursday. Do you have any questions?\"", "Mark looked surprised. \"Really? I can lead the data part?\"", "\"Yes, I trust you,\" Alex said firmly. \"Let me know if you need help, but the ownership is yours.\"", "On Thursday, Mark’s analysis was excellent, and Lisa’s slides were beautiful. Alex only made a few minor suggestions.", "\"Great job, everyone,\" Alex said, feeling a huge weight lift off his shoulders. \"This is exactly how we should work.\"", "He realized that true management wasn’t about being the hardest worker in the room. It was about empowering others, trusting the team, and letting go of the need to control every single detail."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why was Alex exhausted and making mistakes?", "What is the difference between delegating and \"dumping work\" according to Sarah?", "How did the team react when Alex gave them ownership of their tasks?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Alex was exhausted because he tried to do everything himself and lacked... (capacity).", "hints": ["Sarah told him he was starting to... (micromanage) instead of leading.", "She explained that good management requires learning how to... (delegate) effectively.", "Delegation means giving clear expectations and then learning to... (trust) the team.", "Alex must... (empower) his employees to take... (accountability) for their work.", "The next day, Alex assigned specific tasks to Mark and Lisa and let them take... (ownership).", "The result was excellent, and Alex realized that a leader should not be a... (bottleneck)."], "vocab": [{"w": "to delegate", "tr": "[ˈdelɪɡeɪt]", "ru": "делегировать, поручать задачи"}, {"w": "to micromanage", "tr": "[ˈmaɪkrəʊmænɪdʒ]", "ru": "мелочно контролировать, управлять каждым шагом"}, {"w": "to empower", "tr": "[ɪmˈpaʊə]", "ru": "давать полномочия, вдохновлять"}, {"w": "capacity", "tr": "[kəˈpæsəti]", "ru": "способность, загрузка, возможности"}, {"w": "accountability", "tr": "[əˌkaʊntəˈbɪləti]", "ru": "ответственность, подотчетность"}, {"w": "to trust", "tr": "[trʌst]", "ru": "доверять"}]}, {"num": 75, "ru": "Обратная связь 360 градусов и развитие сотрудников", "en": "360-Degree Feedback and Employee Development", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~450 слов.", "story": ["\"Tom, it’s time for your annual review,\" said Elena, the HR manager. \"This year, we are implementing a new 360-degree feedback system. You will receive anonymous feedback not just from me, but from your peers and the junior staff you mentor.\"", "Tom smiled confidently. \"No problem. I work hard, and I always meet my deadlines. I’m sure it will be great.\"", "A week later, Tom sat in Elena’s office to review the results. His manager’s feedback was positive, but the peer reviews contained a surprising comment.", "\"Let’s look at this,\" Elena said, pointing to the screen. \"Three of your colleagues mentioned that while your technical work is excellent, you often interrupt others in meetings and dismiss their ideas without discussion.\"", "Tom frowned, feeling defensive. \"That’s not true. I’m just efficient. I don’t have time for long, pointless discussions.\"", "\"Tom, this is what we call a blind spot,\" Elena said gently. \"You don’t see it, but your behavior makes the team feel undervalued. This peer review is not an attack; it’s constructive feedback to help you grow. High self-awareness is a key trait of a senior leader.\"", "Tom was quiet for a moment. He thought about the last few meetings. He remembered cutting off Sarah mid-sentence and rolling his eyes when Mark suggested a new tool. A wave of realization hit him.", "\"I... I didn’t realize I was doing that,\" Tom admitted, his voice softer. \"I thought I was just keeping things moving.\"", "\"Intentions matter, but impact matters more,\" Elena replied. \"The good news is, this is completely fixable. What can you implement to improve this?\"", "Tom took a deep breath. \"I can start by actively listening. I will make a rule for myself: I won’t speak until the other person has completely finished their thought. And I will ask for their opinion before giving mine.\"", "\"That’s a fantastic action plan,\" Elena smiled. \"Let’s check in on this in three months. I believe in your potential, Tom.\"", "Over the next few weeks, Tom consciously practiced active listening. It was hard at first, but he noticed a change. His colleagues started sharing more ideas, and the team’s atmosphere became much more collaborative.", "At the next team lunch, Sarah turned to him. \"Tom, I just wanted to say, I really appreciate how you listened to my proposal yesterday. It felt great.\"", "Tom smiled genuinely. \"Thank you, Sarah. I’m still learning, but I value your input.\"", "He realized that 360-degree feedback wasn’t about finding faults. It was a powerful tool for uncovering blind spots and fostering genuine professional development."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What was the new feedback system introduced by HR?", "What was the main criticism Tom received from his peers?", "What action plan did Tom create to improve his behavior?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, HR introduced a... (360-degree feedback) system, including peer reviews.", "hints": ["Tom was confident, but the feedback revealed a... (blind spot): he often interrupted others.", "Elena explained that this was... (constructive) feedback to help him grow.", "Tom realized he lacked... (self-awareness) about how his behavior impacted the team.", "He decided to... (implement) a rule to actively listen and wait for others to finish speaking.", "Over time, the team atmosphere became more... (collaborative).", "Tom learned that feedback is a powerful tool for uncovering blind spots and... (development)."], "vocab": [{"w": "360-degree feedback", "tr": "[ˌθriː hʌndrəd ənd ˈsɪksti dɪˈɡriː ˈfiːdbæk]", "ru": "всесторонняя оценка (от коллег, подчиненных и руководителей)"}, {"w": "blind spot", "tr": "[blaɪnd spɒt]", "ru": "слепая зона (неосознаваемая проблема)"}, {"w": "peer review", "tr": "[pɪə rɪˈvjuː]", "ru": "оценка коллег"}, {"w": "constructive", "tr": "[kənˈstrʌktɪv]", "ru": "конструктивный"}, {"w": "self-awareness", "tr": "[ˌself əˈweənəs]", "ru": "самосознание, самоанализ"}, {"w": "to implement", "tr": "[ˈɪmplɪmənt]", "ru": "внедрять, применять"}]}, {"num": 76, "ru": "Онбординг новых сотрудников", "en": "Onboarding New Employees", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~420 слов.", "story": ["It was Julia’s first day at her new marketing job. She walked into the office feeling a mix of excitement and nervousness.", "\"Good morning, Julia! Welcome to the team,\" said David, the HR manager, greeting her with a warm smile. \"I’m so glad you’re here.\"", "\"Thank you, David. I’m ready to start,\" Julia replied.", "\"Great. First, let’s go to the conference room for a quick orientation,\" David said. \"I’ll walk you through the company culture, the employee handbook, and show you where the coffee machine is—arguably the most important part of the day!\"", "Julia laughed, feeling her nerves ease a bit. After the orientation, David didn’t just leave her alone at a desk with a pile of paperwork.", "\"Julia, I’d like you to meet Mark,\" David said, leading her to a desk. \"Mark is a senior designer, and he will be your mentor for the first month. He’s here to answer any questions, no matter how small.\"", "\"Hi, Julia!\" Mark said, standing up and shaking her hand. \"Don’t worry about learning everything on day one. My job is to help you integrate into the team smoothly. Let’s start with a quick tour of the office, and then we can grab lunch together so you can meet the rest of the crew.\"", "\"That sounds amazing, thank you,\" Julia said, genuinely relieved.", "Over the next few weeks, Mark checked in with her daily. He explained the team’s workflow, introduced her to key software, and made sure she felt included in team chats and meetings. When Julia made a small mistake with a client email, Mark didn’t scold her. Instead, he sat with her, explained the company’s tone of voice, and helped her rewrite it.", "By the end of her first month, Julia didn’t feel like the \"new girl\" anymore. She knew everyone’s names, understood the company’s goals, and had already contributed to two successful campaigns.", "During her one-month check-in, David asked, \"How are you settling in, Julia?\"", "\"Perfectly,\" Julia smiled. \"The onboarding process was incredible. Having a mentor like Mark made all the difference. I feel like I truly belong here.\"", "David nodded. \"That’s exactly what we aim for. A good onboarding process isn’t just about filling out forms. It’s about making people feel welcome, supported, and ready to do their best work from day one.\"", "Julia realized that a company’s culture is defined not just by its mission statement, but by how it treats people when they first walk through the door."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["How did Julia feel on her first day at work?", "What role did Mark play in Julia’s first month?", "Why was Julia’s onboarding experience successful?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Julia felt nervous but excited on her... (first day).", "hints": ["David from HR gave her a quick... (orientation) and showed her the... (employee handbook).", "Then, he introduced her to Mark, who became her... (mentor).", "Mark’s goal was to help Julia... (integrate) into the team smoothly.", "He gave her a tour, took her to... (lunch), and helped her with mistakes.", "By the end of the month, Julia felt she had managed to... (settle in) perfectly.", "She realized that good... (onboarding) is about making new employees feel welcome and supported."], "vocab": [{"w": "onboarding", "tr": "[ˈɒnbɔːdɪŋ]", "ru": "процесс адаптации нового сотрудника"}, {"w": "orientation", "tr": "[ˌɔːriənˈteɪʃn]", "ru": "вводный инструктаж, ориентация"}, {"w": "mentor", "tr": "[ˈmentɔː]", "ru": "наставник, куратор"}, {"w": "to integrate", "tr": "[ˈɪntɪɡreɪt]", "ru": "интегрировать, вливаться в коллектив"}, {"w": "employee handbook", "tr": "[ɪmˈplɔɪiː ˈhændbʊk]", "ru": "справочник сотрудника"}, {"w": "to settle in", "tr": "[ˈsetl ɪn]", "ru": "обжиться, освоиться"}]}, {"num": 77, "ru": "Работа с трудными коллегами и токсичным поведением", "en": "Dealing with Difficult Colleagues and Toxic Behavior", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~440 слов.", "story": ["Emma loved her job as a content writer, but there was one major problem: her colleague, Greg.", "During team meetings, Greg would often make passive-aggressive comments about her work. \"Oh, Emma wrote this? Well, it’s certainly... creative,\" he would say with a smirk, making the whole room uncomfortable. He also had a habit of taking credit for her ideas in emails to the manager.", "At first, Emma tried to ignore it, hoping he would stop. But his toxic behavior only escalated. She felt stressed and dreaded going to work.", "One afternoon, she vented to her friend and senior colleague, Lisa. \"I don’t know what to do, Lisa. Greg is making my life miserable, but I don’t want to cause drama.\"", "Lisa listened carefully. \"Emma, ignoring toxic behavior doesn’t make it go away; it enables it. You need to address it directly and set boundaries.\"", "\"But what if he gets angry or denies it?\" Emma asked nervously.", "\"Stay calm and stick to the facts,\" Lisa advised. \"Don’t attack his character. Just describe the specific behavior and how it affects your work. And most importantly, start to document everything. Save the emails where he takes credit, and write down the dates and times of his comments.\"", "Emma took Lisa’s advice. She started keeping a private log of Greg’s behavior. A week later, during a project meeting, Greg did it again. \"Emma’s draft is okay, but I had to completely rewrite the strategy to make it usable,\" he announced.", "Emma took a deep breath. She didn’t yell. She looked at him calmly and said, \"Greg, I’m surprised to hear that, because the strategy document has my name on it, and I didn’t receive any requests for a rewrite from you. If you have specific feedback, I’m happy to discuss it directly after the meeting.\"", "The room went silent. Greg looked taken aback. \"Uh, well, maybe I misunderstood,\" he mumbled.", "After the meeting, Emma didn’t stop there. She compiled her documented evidence and requested a private meeting with the HR manager. She presented the facts objectively, without emotional accusations.", "\"Thank you for bringing this to our attention, Emma,\" the HR manager said seriously. \"We take toxic behavior very seriously. We will speak with Greg and monitor the situation.\"", "Within a few weeks, Greg’s behavior changed dramatically. He became much more professional and stopped making snide remarks.", "Emma felt a huge sense of relief. She realized that dealing with difficult colleagues isn’t about starting a fight. It’s about protecting your peace, setting clear boundaries, and using professional channels to address the problem."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What kind of toxic behavior did Greg exhibit towards Emma?", "What two pieces of advice did Lisa give Emma?", "How did Emma respond to Greg’s comment during the meeting?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Emma’s colleague Greg made... (passive-aggressive) comments and took credit for her work.", "hints": ["Emma felt stressed, so she asked her friend Lisa for... (advice).", "Lisa told her to stop ignoring it and start to... (document) everything.", "During a meeting, Emma calmly... (addressed) the issue by stating the facts.", "Greg was taken aback and... (mumbled) an excuse.", "Emma then took her documented evidence to... (Human Resources / HR).", "HR took the... (toxic behavior) seriously and spoke with Greg.", "Emma learned that dealing with difficult people requires setting... (boundaries) and staying professional."], "vocab": [{"w": "toxic behavior", "tr": "[ˈtɒksɪk bɪˈheɪvjə]", "ru": "токсичное поведение"}, {"w": "passive-aggressive", "tr": "[ˌpæsɪv əˈɡresɪv]", "ru": "пассивно-агрессивный"}, {"w": "to address", "tr": "[əˈdres]", "ru": "решать проблему, открыто говорить о ней"}, {"w": "to set boundaries", "tr": "[set ˈbaʊndəriz]", "ru": "устанавливать границы"}, {"w": "to document", "tr": "[ˈdɒkjument]", "ru": "документировать, фиксировать"}, {"w": "Human Resources (HR)", "tr": "[ˌhjuːmən rɪˈzɔːsɪz]", "ru": "отдел кадров"}]}, {"num": 78, "ru": "Тайм-менеджмент в условиях многозадачности", "en": "Time Management in Multitasking Conditions", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~450 слов.", "story": ["\"James, you sent the wrong file to the client,\" said his manager, Anna, looking at her screen with a frown.", "James panicked. \"What? No, I attached the correct one! Let me check.\" He opened his email and his heart sank. He had attached an internal draft instead of the final version. \"I’m so sorry, Anna. I don’t know how that happened.\"", "Anna sighed. \"James, I’ve noticed this happening a lot lately. You’re trying to answer emails, write reports, and take phone calls all at the same time. Multitasking is destroying your focus.\"", "\"But I have so much to do!\" James argued. \"If I don’t switch tasks constantly, I’ll fall behind.\"", "\"Actually, science says the opposite,\" Anna explained. \"Every time you switch tasks, your brain experiences a high cognitive load. It takes time to refocus, which leads to mistakes, like sending the wrong file. You aren’t saving time; you’re losing it.\"", "James looked defeated. \"So, what should I do? I can’t just ignore my emails all day.\"", "\"You don’t have to ignore them. You need to batch them,\" Anna said. \"Instead of checking your inbox every five minutes, schedule two or three specific times a day to process emails. For example, 9:00 AM, 1:00 PM, and 4:30 PM.\"", "\"That makes sense,\" James said, taking notes. \"But what about my projects?\"", "\"Use a priority matrix,\" Anna suggested. \"Divide your tasks into four boxes: urgent and important, important but not urgent, urgent but not important, and neither. Focus only on the top box first. Close all other tabs and notifications while you work on it.\"", "James decided to try this new system the very next day. He turned off his email notifications. He put his phone in his drawer. He looked at his priority matrix and chose one major report to work on for the next 90 minutes.", "It was surprisingly difficult at first. His brain kept urging him to check his phone. But he resisted. When the 90 minutes were up, he had finished a section of the report that usually took him half a day.", "At 1:00 PM, he opened his email and cleared his inbox in 20 minutes because he wasn’t distracted by anything else.", "At the end of the week, Anna stopped by his desk. \"I haven’t seen any mistakes from you this week, James. And you look much less stressed.\"", "James smiled. \"I feel great. I stopped multitasking, started to batch my work, and my focus has improved dramatically. I’m actually getting things done.\"", "He realized that true productivity isn’t about doing a hundred things at once. It’s about giving one thing your full attention at a time."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What mistake did James make because of multitasking?", "Why does Anna say that switching tasks is bad for the brain?", "What two techniques did Anna suggest to help James manage his time?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, James sent the wrong file to a client because he was... (multitasking).", "hints": ["Anna explained that constantly trying to... (switch tasks) increases... (cognitive load) and causes mistakes.", "She advised him to... (batch) his emails instead of checking them constantly.", "She also suggested using a... (priority matrix) to decide what to do first.", "The next day, James turned off notifications to improve his... (focus).", "He worked on one major report for 90 minutes without interruptions.", "By the end of the week, James made no mistakes and felt much less... (stressed).", "He learned that productivity is about giving one thing your full... (attention)."], "vocab": [{"w": "multitasking", "tr": "[ˈmʌltitɑːskɪŋ]", "ru": "многозадачность"}, {"w": "cognitive load", "tr": "[ˈkɒɡnətɪv ləʊd]", "ru": "когнитивная нагрузка"}, {"w": "to switch tasks", "tr": "[swɪtʃ tɑːsks]", "ru": "переключаться между задачами"}, {"w": "to batch", "tr": "[bætʃ]", "ru": "группировать, объединять в пакеты"}, {"w": "priority matrix", "tr": "[praɪˈɒrəti ˈmeɪtrɪks]", "ru": "матрица приоритетов"}, {"w": "to focus", "tr": "[ˈfəʊkəs]", "ru": "сосредотачиваться"}]}, {"num": 79, "ru": "Приоритизация задач", "en": "матрица Эйзенхауэра и другие методы) (Task Prioritization", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~430 слов.", "story": ["Sarah stared at her computer screen, feeling completely overwhelmed. Her to-do list had twenty items, and she didn't know where to start. She was answering emails, writing a report, and trying to plan a team event all at the same time.", "\"Sarah, you look like you're about to crash,\" said Mark, her manager, stopping by her desk. \"What's going on?\"", "\"I have too much to do, and everything feels like an emergency,\" Sarah admitted, rubbing her temples. \"I don't know how to prioritize.\"", "Mark pulled up a chair. \"Let me show you a simple tool. It’s called the Eisenhower Matrix. It helps you divide tasks into four categories based on two questions: Is it urgent? Is it important?\"", "Sarah opened a blank document. \"Okay, explain the four categories.\"", "\"Quadrant one: Urgent and Important,\" Mark said. \"These are crises or deadlines. Do them immediately. For example, the client report due today.\"", "\"Got it,\" Sarah said, typing it down. \"What about answering every single email?\"", "\"That’s Quadrant three: Urgent but Not Important,\" Mark explained. \"These are interruptions. They feel urgent, but they don't contribute to your long-term goals. You should delegate them or batch them for later.\"", "\"And what about planning the team event?\" Sarah asked.", "\"Quadrant two: Important but Not Urgent,\" Mark smiled. \"This is where real progress happens. Strategic planning, learning new skills. You must schedule time for these, or they will become urgent later.\"", "\"Finally, Quadrant four: Not Urgent and Not Important,\" Mark added. \"Like scrolling social media or organizing your desktop icons. Eliminate or postpone these.\"", "Sarah looked at her list. \"Wow. I’ve been spending 80% of my time in Quadrant three and four.\"", "\"Exactly,\" Mark said. \"So, what’s your first action?\"", "\"I will finish the client report now,\" Sarah said confidently. \"Then, I will ask Tom to handle the event catering, and I will schedule two hours tomorrow for strategic planning.\"", "\"Perfect,\" Mark nodded. \"Prioritization isn't about doing more things. It’s about doing the right things.\"", "By the end of the week, Sarah felt a massive difference. She was no longer putting out fires all day. She realized that using a simple framework like the Eisenhower Matrix gave her control over her time and reduced her stress significantly."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Sarah feel overwhelmed at the beginning of the story?", "What are the two questions used in the Eisenhower Matrix?", "What did Sarah decide to do with the team event planning?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Sarah had a long to-do list and felt completely... (overwhelmed).", "hints": ["Mark introduced her to the... (Eisenhower Matrix) to help her prioritize.", "Tasks that are urgent and important must be done... (immediately).", "Answering every email is urgent but not important, so she should... (delegate) or batch it.", "Strategic planning is important but not urgent, so she must... (schedule) time for it.", "Sarah realized she was wasting time on tasks that were neither... (urgent) nor important.", "She decided to finish the client report first and ask Tom to help with the... (event).", "She learned that prioritization is about doing the... (right) things, not more things."], "vocab": [{"w": "urgent", "tr": "[ˈɜːdʒənt]", "ru": "срочный"}, {"w": "important", "tr": "[ɪmˈpɔːtənt]", "ru": "важный"}, {"w": "to delegate", "tr": "[ˈdelɪɡeɪt]", "ru": "делегировать, поручать"}, {"w": "to postpone", "tr": "[pəˈspəʊn]", "ru": "откладывать"}, {"w": "Eisenhower Matrix", "tr": "[aɪzənˈhaʊə ˈmeɪtrɪks]", "ru": "матрица Эйзенхауэра"}, {"w": "overwhelmed", "tr": "[ˌəʊvəˈwelmd]", "ru": "перегруженный, ошеломленный"}]}, {"num": 80, "ru": "Отчётность и презентация результатов работы", "en": "Reporting and Presenting Work Results", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~440 слов.", "story": ["\"Alex, the quarterly review is tomorrow,\" said Elena, the marketing director. \"Do you have the performance report ready?\"", "\"Yes, Elena,\" Alex replied, handing her a thick stack of papers. \"I included every single metric, every email open rate, and all the website traffic data from the last three months.\"", "Elena flipped through the pages and sighed. \"Alex, this is 40 pages long. The executive team doesn't have time to read a novel. They need a concise summary.\"", "\"But I worked so hard on gathering all this data!\" Alex protested. \"I thought more details meant a better report.\"", "\"Data is useless if you don't tell a story with it,\" Elena explained gently. \"Your job is not to dump information. Your job is to deliver insights. Let’s look at this together. What is the key takeaway from all these numbers?\"", "Alex thought for a moment. \"Well, our social media campaign increased brand awareness by 30%, but it didn't lead to many actual sales.\"", "\"Exactly!\" Elena said, her eyes lighting up. \"That is your key takeaway. Now, highlight that on the first page. Use data visualization, like a simple bar chart, to show the 30% growth. Then, in the next section, explain why the sales didn't follow and propose a solution.\"", "\"So, I should cut out the minor details?\" Alex asked.", "\"Yes,\" Elena nodded. \"Keep the detailed data in an appendix for those who want to dig deeper. But your main presentation should be short, visual, and focused on results and future actions.\"", "Alex went back to his desk and completely reworked the report. He removed the walls of text. He created three clear charts. He wrote a one-page executive summary that highlighted the main successes and the one major problem they needed to solve.", "The next day, during the meeting, Alex presented his new report. The executives were engaged. They asked thoughtful questions about his proposed solution, and the CEO nodded in approval.", "\"Great job, Alex,\" the CEO said at the end. \"Clear, concise, and actionable.\"", "After the meeting, Elena smiled at him. \"See? You didn't just give them numbers. You gave them a clear picture of where we stand and where we need to go.\"", "Alex realized that good reporting isn't about proving how much work you did. It’s about respecting your audience's time and delivering the insights that actually matter for the business."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why was Elena not satisfied with Alex’s first draft of the report?", "What was the key takeaway Alex discovered in the data?", "How did the executives react to Alex’s final presentation?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Alex gave Elena a 40-page report with every single... (metric).", "hints": ["Elena said it was too long and asked for a... (concise) summary.", "She explained that he needed to tell a story and deliver... (insights), not just data.", "Alex realized the... (key takeaway) was that brand awareness grew, but sales did not.", "He decided to... (highlight) this point and use... (data visualization) like charts.", "He moved the minor details to an appendix and kept the main presentation short.", "The executives loved the report because it was clear and... (actionable).", "Alex learned that good reporting is about respecting the audience's... (time)."], "vocab": [{"w": "metrics", "tr": "[ˈmetrɪks]", "ru": "метрики, показатели"}, {"w": "to highlight", "tr": "[ˈhaɪlaɪt]", "ru": "выделять, подчеркивать"}, {"w": "key takeaway", "tr": "[kiː ˈteɪkweɪ]", "ru": "главный вывод"}, {"w": "data visualization", "tr": "[ˈdeɪtə ˌvɪʒuəlaɪˈzeɪʃn]", "ru": "визуализация данных"}, {"w": "concise", "tr": "[kənˈsaɪs]", "ru": "краткий, лаконичный"}, {"w": "to deliver", "tr": "[dɪˈlɪvə]", "ru": "представлять, доносить (информацию)"}]}, {"num": 81, "ru": "Кросс-функциональное взаимодействие", "en": "Cross-Functional Collaboration", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~450 слов.", "story": ["The new mobile app launch was delayed again. In the conference room, the atmosphere was tense.", "\"The design is too complex,\" argued Tom, the lead engineer. \"My team can’t code this in two weeks. You developers always think design is magic!\"", "Lisa, the head of design, crossed her arms. \"And you engineers never care about the user experience! If we simplify it, the app will look cheap. We are working in silos, and it’s ruining the project.\"", "David, the project manager, stepped in. \"Okay, everyone, stop. This blame game is not helping. We are a cross-functional team, which means we need to work together, not against each other.\"", "\"But their demands are unrealistic,\" Tom muttered.", "\"Let’s find some alignment,\" David said calmly. \"What is our common goal here?\"", "\"To launch a high-quality app on time,\" Lisa and Tom said in unison, though they still looked annoyed.", "\"Great,\" David said. \"So, fighting doesn't achieve that. We need to bridge the gap between design and engineering. Tom, what specific part of the design is causing the delay?\"", "\"The animated transitions on the home screen,\" Tom replied. \"They require custom code that we don't have time to build and test.\"", "David turned to Lisa. \"Lisa, is that animation essential for the user experience, or is it just a nice-to-have?\"", "Lisa thought for a moment. \"It’s nice-to-have. The core functionality is more important.\"", "\"Perfect,\" David smiled. \"Here is the compromise. Lisa, your team will simplify the animations for the launch version. Tom, your team will commit to implementing the simplified version perfectly within the two-week deadline. After the launch, we can schedule an update for the advanced animations. Does that work?\"", "Tom nodded. \"Yes, I can agree to that.\"", "\"Me too,\" Lisa said, her tone softening. \"Thank you for facilitating this, David.\"", "Over the next two weeks, the teams communicated daily. Designers sat with developers to answer questions instantly. There were no more silos.", "On launch day, the app went live without a single critical bug. The user reviews praised both the beautiful interface and the smooth performance.", "During the celebration, Tom raised his glass to Lisa. \"Sorry for calling your designs magic. They are actually pretty good.\"", "Lisa laughed. \"And sorry for thinking you don't care about users. You guys saved the launch.\"", "David watched them, satisfied. He knew that cross-functional collaboration wasn't about everyone agreeing on everything. It was about respecting different expertise, communicating openly, and compromising to achieve a common goal."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why were Tom and Lisa arguing in the conference room?", "What did David identify as their common goal?", "What compromise did the teams reach regarding the app design?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, the app launch was delayed because the design and engineering teams were working in... (silos).", "hints": ["Tom complained about complex design, and Lisa complained about poor... (user experience).", "David stepped in to stop the blame game and find... (alignment).", "He reminded them of their... (common goal): launching a high-quality app on time.", "They identified the animated transitions as the main... (problem).", "Lisa agreed to simplify the animations, and Tom agreed to code the... (simplified) version quickly.", "The teams communicated daily to... (bridge the gap) between their departments.", "The launch was successful, and they learned that collaboration requires respect and... (compromise)."], "vocab": [{"w": "cross-functional", "tr": "[ˌkrɒs ˈfʌŋkʃənl]", "ru": "кросс-функциональный, межведомственный"}, {"w": "silo", "tr": "[ˈsaɪləʊ]", "ru": "изолированная группа (работать в «вакууме»)"}, {"w": "alignment", "tr": "[əˈlaɪnmənt]", "ru": "согласованность, единство целей"}, {"w": "to bridge the gap", "tr": "[brɪdʒ ðə ɡæp]", "ru": "преодолеть разрыв, наладить связь"}, {"w": "common goal", "tr": "[ˈkɒmən ɡəʊl]", "ru": "общая цель"}, {"w": "to compromise", "tr": "[ˈkɒmprəmaɪz]", "ru": "идти на компромисс"}]}, {"num": 82, "ru": "Работа в условиях неопределённости и быстрых изменений", "en": "Working in Uncertainty and Rapid Change", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~440 слов.", "story": ["Anna, the founder of a small tech startup, called an emergency meeting on a Tuesday morning. Her face was pale.", "\"Team, I have bad news,\" she began. \"A major competitor just launched a free version of our main product. They have more resources and a bigger marketing budget. Our projected sales for this quarter are now in serious uncertainty.\"", "The room went silent. Mark, the lead developer, looked worried. \"Are we going to shut down?\"", "\"No,\" Anna said firmly. \"But we cannot stick to our original plan. We need to be agile. We have to pivot our strategy immediately.\"", "\"How?\" asked Sarah, the marketing manager. \"We can't compete with 'free'.\"", "\"We don't compete on price; we compete on value,\" Anna explained. \"Our free competitor has a generic product. Our strength is personalized customer service and advanced customization. We need to pivot our messaging to target premium clients who need those specific features.\"", "\"That’s a big change,\" Mark noted. \"Can we adapt our software that quickly?\"", "\"We have to be flexible,\" Anna replied. \"We already have a contingency plan for rapid updates. Mark, can your team release a new 'Premium Customization' module in two weeks?\"", "Mark thought for a moment, doing mental calculations. \"If we drop the minor bug fixes and focus only on the new module... yes, we can do it.\"", "\"Excellent,\" Anna said. \"Sarah, I need you to rewrite the website copy and launch a new email campaign targeting our existing high-value clients by Friday. We will offer them an exclusive early access to this new module.\"", "\"It’s risky, but I like it,\" Sarah said, already opening her laptop. \"Let’s do it.\"", "For the next two weeks, the team worked with intense focus. There was no time for long meetings or perfectionism. They tested ideas quickly, gathered feedback, and adapted on the fly.", "On Friday, Sarah launched the campaign. By Monday morning, they had received fifty replies from existing clients upgrading to the premium tier.", "\"We did it,\" Anna said, reading the numbers with a huge smile. \"We didn't just survive the change; we used it to improve our product.\"", "Mark high-fived Sarah. \"I can't believe we pulled that off in two weeks.\"", "Anna looked at her team with pride. She realized that uncertainty is inevitable in business. The companies that survive are not the ones with the perfect initial plan, but the ones that are agile enough to pivot, flexible enough to adapt, and brave enough to execute a new vision."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What bad news did Anna share with her team?", "How did the team decide to compete with the free competitor?", "What did Mark and Sarah have to do in two weeks?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, a competitor launched a free product, creating... (uncertainty) for the startup.", "hints": ["Anna said they couldn't stick to the old plan and needed to be... (agile).", "They decided to... (pivot) their strategy to focus on premium clients and customization.", "Mark agreed to build a new module quickly because they had a... (contingency plan).", "Sarah rewrote the marketing copy to target... (high-value) clients.", "The team had to be... (flexible) and work without perfectionism.", "The campaign was successful, and many clients... (upgraded) to the premium tier.", "Anna learned that surviving change requires the ability to... (adapt) and execute a new vision."], "vocab": [{"w": "uncertainty", "tr": "[ʌnˈsɜːtnti]", "ru": "неопределенность"}, {"w": "agile", "tr": "[ˈædʒaɪl]", "ru": "гибкий, проворный (методология)"}, {"w": "to pivot", "tr": "[ˈpɪvət]", "ru": "резко менять направление, перестраиваться"}, {"w": "flexible", "tr": "[ˈfleksəbl]", "ru": "гибкий, адаптивный"}, {"w": "to adapt", "tr": "[əˈdæpt]", "ru": "адаптироваться, приспосабливаться"}, {"w": "contingency plan", "tr": "[kənˈtɪndʒənsi plæn]", "ru": "план действий на непредвиденный случай"}]}, {"num": 83, "ru": "Финансовая грамотность и инвестирование для начинающих", "en": "Financial Literacy and Investing for Beginners", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~450 слов.", "story": ["Leo sat in the office of Mr. Davis, a certified financial planner. Leo was 25, had a stable job, and had finally saved $5,000.", "\"I want to make this money grow,\" Leo said. \"But the stock market seems like a casino. I’m afraid of losing everything.\"", "Mr. Davis smiled warmly. \"That’s a very common fear, Leo. But investing is not gambling if you do it correctly. The most powerful force in investing is compound interest.\"", "\"Compound interest?\" Leo asked.", "\"Yes,\" Mr. Davis explained. \"It means you earn interest not only on your initial money but also on the interest that money has already earned. Over a long-term period, it grows exponentially. But you must start early.\"", "\"Okay, but what should I buy? Individual stocks like Apple or Tesla?\"", "\"For a beginner, I highly recommend an index fund,\" Mr. Davis advised. \"Instead of trying to pick one winning company, an index fund buys small pieces of hundreds of companies at once. It allows you to diversify your portfolio instantly. If one company fails, the others balance it out.\"", "\"That sounds much safer,\" Leo noted. \"But what about my risk tolerance? I don't like seeing my account balance drop.\"", "\"Index funds are generally less volatile than individual stocks,\" Mr. Davis said. \"However, all investments have some risk. The key is to hold them for years, not days. The market goes up and down, but historically, it always goes up over the long term.\"", "\"How do I make sure I don’t spend the money instead?\" Leo asked.", "\"You automate it,\" Mr. Davis said, leaning forward. \"Set up an automatic transfer from your checking account to your investment account every month. Even if it’s just $100. You won't miss the money, and you build a habit.\"", "Leo took out his notebook and wrote down the steps: 1. Open a brokerage account. 2. Choose a broad market index fund. 3. Set up automatic monthly contributions.", "\"This makes it sound so simple,\" Leo said, feeling a wave of relief.", "\"It is simple, but it requires discipline,\" Mr. Davis replied. \"Don't check the app every day. Let compound interest do the heavy lifting.\"", "Six months later, Leo checked his account. The market had dipped slightly, but he didn't panic. He remembered Mr. Davis’s advice about the long term. He kept his automated transfers running.", "Leo realized that financial literacy wasn't about knowing complex Wall Street jargon. It was about understanding basic principles like diversification, compound interest, and automation, and having the patience to let time work in your favor."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why was Leo afraid of investing his $5,000?", "What is compound interest according to Mr. Davis?", "Why did Mr. Davis recommend an index fund for a beginner?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Leo wanted to invest but was afraid of losing his... (money).", "hints": ["Mr. Davis explained the power of... (compound interest) over time.", "Instead of picking individual stocks, he advised Leo to buy an... (index fund).", "This allows a beginner to... (diversify) their portfolio and reduce risk.", "Mr. Davis asked about Leo's... (risk tolerance) and advised him to think long-term.", "To build a habit, Mr. Davis suggested Leo... (automate) his monthly contributions.", "Leo wrote down the steps and felt much more... (relieved / confident).", "He learned that financial literacy is about basic principles and... (patience)."], "vocab": [{"w": "compound interest", "tr": "[ˈkɒmpaʊnd ˈɪntrəst]", "ru": "сложный процент"}, {"w": "to diversify", "tr": "[daɪˈvɜːsɪfaɪ]", "ru": "диверсифицировать (распределять риски)"}, {"w": "index fund", "tr": "[ˈɪndeks fʌnd]", "ru": "индексный фонд"}, {"w": "risk tolerance", "tr": "[rɪsk ˈtɒlərəns]", "ru": "толерантность к риску"}, {"w": "to automate", "tr": "[ˈɔːtəmeɪt]", "ru": "автоматизировать"}, {"w": "long-term", "tr": "[ˌlɒŋ ˈtɜːm]", "ru": "долгосрочный"}]}, {"num": 84, "ru": "Здоровый сон и восстановление", "en": "Healthy Sleep and Recovery", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~440 слов.", "story": ["Emma dragged herself into the doctor’s office, yawning for the third time in five minutes. Dark circles were visible under her eyes.", "\"Rough week?\" asked Dr. Smith, looking at her chart.", "\"Rough month,\" Emma corrected. \"I’m constantly tired. I drink four cups of coffee a day, but I still feel like I’m heading for burnout. I sleep about five hours a night, but I wake up exhausted.\"", "Dr. Smith nodded sympathetically. \"Emma, you can’t cheat biology. Your body and brain need time to recharge. Let’s talk about your sleep hygiene.\"", "\"My what?\" Emma asked.", "\"Sleep hygiene,\" Dr. Smith repeated. \"These are the habits and environment that promote good sleep. First question: what do you do in the hour before bed?\"", "Emma hesitated. \"I usually scroll through social media on my phone. Or I check my work emails one last time.\"", "\"There’s your problem,\" Dr. Smith said gently. \"The blue light from your screen time suppresses melatonin, the hormone that makes you sleepy. It also tricks your circadian rhythm into thinking it’s still daytime.\"", "\"So, no phone in bed?\" Emma asked.", "\"Exactly,\" Dr. Smith said. \"I want you to create a wind-down routine. One hour before bed, turn off all screens. Read a physical book, take a warm shower, or do some light stretching. You need to signal to your brain that it’s time to unwind.\"", "\"What about my alarm?\" Emma asked. \"I use my phone for that.\"", "\"Buy a cheap, traditional alarm clock,\" Dr. Smith advised. \"Keep your phone in another room. This prevents the temptation to check notifications if you wake up in the middle of the night.\"", "Emma sighed. \"It sounds hard. My phone is my lifeline.\"", "\"It will be difficult for the first three days,\" Dr. Smith admitted. \"But I promise, your sleep quality will improve dramatically. And you must aim for seven to eight hours. Five is simply not enough to recover from a demanding job.\"", "That night, Emma bought a basic alarm clock. She left her phone in the kitchen. At 10 PM, she turned off the TV and read a novel.", "The first night, she tossed and turned, missing her phone. But by the third night, she fell asleep within twenty minutes.", "A week later, Emma returned to the clinic for a follow-up. She looked brighter and more energetic.", "\"Doctor, it worked,\" she smiled. \"I’m sleeping seven hours, and I don't need coffee after 2 PM anymore. I finally feel like I can recharge.\"", "Dr. Smith smiled back. \"Sleep isn't a luxury, Emma. It’s the foundation of your health and productivity. Protect it.\""], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Emma feel like she was heading for burnout?", "What bad habit was ruining Emma’s sleep hygiene?", "What solution did Dr. Smith suggest for the phone problem?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Emma visited the doctor because she was constantly tired and only slept... (five) hours.", "hints": ["Dr. Smith explained that she needed to improve her... (sleep hygiene).", "He pointed out that high... (screen time) before bed disrupts the... (circadian rhythm).", "He advised Emma to create a routine to... (unwind) without electronic devices.", "Emma bought a traditional alarm clock and left her phone in another... (room).", "At first, it was hard, but soon she started falling... (asleep) quickly.", "A week later, she felt energetic and no longer needed as much... (coffee).", "She realized that sleep is the foundation of health and is necessary to... (recharge)."], "vocab": [{"w": "sleep hygiene", "tr": "[sliːp ˈhaɪdʒiːn]", "ru": "гигиена сна"}, {"w": "screen time", "tr": "[skriːn taɪm]", "ru": "время, проведенное у экрана"}, {"w": "to unwind", "tr": "[ʌnˈwaɪnd]", "ru": "расслабляться, отдыхать"}, {"w": "circadian rhythm", "tr": "[sɜːˈkeɪdiən rɪðəm]", "ru": "циркадный ритм"}, {"w": "to recharge", "tr": "[ˌriːˈtʃɑːdʒ]", "ru": "перезаряжаться, восстанавливать силы"}, {"w": "burnout", "tr": "[ˈbɜːnaʊt]", "ru": "эмоциональное выгорание"}]}, {"num": 85, "ru": "Питание и энергичность в течение дня", "en": "Nutrition and Daily Energy", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~430 слов.", "story": ["It was 3:00 PM, and Mark was staring blankly at his computer screen. He yawned for the fifth time in an hour and reached for his third cup of coffee.", "\"You look like a zombie, Mark,\" said Sarah, walking past his desk with a large bottle of water and a green apple. \"Rough afternoon?\"", "\"I'm crashing hard,\" Mark admitted, rubbing his eyes. \"I had a huge pasta lunch at noon, and now I can barely keep my eyes open. How do you always have so much energy?\"", "Sarah pulled up a chair. \"It’s not magic, it’s biology. You fueled your body with heavy, processed carbohydrates. They give you a quick spike in blood sugar, followed by a massive crash. That’s why you’re tired.\"", "\"So, what’s the secret?\" Mark asked, pushing his coffee mug away.", "\"A balanced diet and proper hydration,\" Sarah explained. \"I eat a lunch with lean protein, healthy fats, and vegetables. It gives me steady energy all day. And I drink at least two liters of water. Dehydration is a major cause of afternoon fatigue.\"", "Mark looked at his empty coffee cup. \"I probably drink more coffee than water.\"", "\"That’s making it worse,\" Sarah smiled. \"Caffeine is a temporary fix. Try this: tomorrow, swap your heavy lunch for a chicken salad, keep a water bottle on your desk, and eat a handful of nuts instead of a candy bar at 3 PM.\"", "\"Will that really make a difference?\" Mark was skeptical.", "\"Just try it for three days,\" Sarah challenged him. \"Your brain needs the right fuel to focus. You can't drive a car on empty, and you can't work on junk food.\"", "The next day, Mark decided to follow Sarah’s advice. He brought a turkey wrap and a large bottle of water to the office. At 3:00 PM, instead of reaching for coffee, he ate an apple and some almonds.", "To his surprise, he didn't feel the usual heavy slump. He was able to finish his report without yawning once.", "On Friday, Mark walked into the kitchen and poured himself a glass of water. Sarah walked in and raised an eyebrow. \"Look at you! No coffee?\"", "\"Nope,\" Mark grinned. \"You were right. My energy levels are so much more stable. I feel like I actually have control over my day now.\"", "Sarah smiled. \"See? Small changes in what you eat and drink can completely transform how you work and feel.\""], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why was Mark feeling so tired at 3:00 PM?", "What did Sarah suggest Mark eat and drink to improve his energy?", "How did Mark feel after trying Sarah’s advice for a few days?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Mark was struggling with low... (energy levels) and wanted to... (crash) after a heavy lunch.", "hints": ["Sarah explained that processed food causes a sugar spike and a... (crash).", "She advised him to follow a... (balanced diet) and maintain proper... (hydration).", "Mark decided to... (fuel) his body with a turkey wrap, water, and nuts.", "After three days, he noticed his energy was much more... (stable).", "He realized that small changes in nutrition can transform how you... (work / feel)."], "vocab": [{"w": "energy levels", "tr": "[ˈenədʒi ˈlevlz]", "ru": "уровень энергии"}, {"w": "to crash", "tr": "[kræʃ]", "ru": "резко терять силы, \"выключаться\""}, {"w": "balanced diet", "tr": "[ˈbælənst ˈdaɪət]", "ru": "сбалансированная диета"}, {"w": "hydration", "tr": "[haɪˈdreɪʃn]", "ru": "гидратация, водный баланс"}, {"w": "processed food", "tr": "[ˈprəʊsest fuːd]", "ru": "обработанная пища"}, {"w": "to fuel", "tr": "[fjuːəl]", "ru": "подпитывать, давать энергию"}]}, {"num": 86, "ru": "Цифровая гигиена и управление вниманием", "en": "Digital Hygiene and Attention Management", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~440 слов.", "story": ["\"Alex, I’ve been trying to talk to you for five minutes,\" Elena said, standing by his desk.", "Alex jumped, quickly minimizing a browser tab. \"Oh, sorry, Elena! I was just checking a quick message.\"", "Elena sighed gently. \"Alex, your phone buzzes every three minutes. You check your email, then Slack, then Instagram. Your attention span is completely fragmented. You’re not working; you’re just reacting.\"", "Alex looked defensive. \"But I have to stay connected! What if a client needs me urgently?\"", "\"Urgent things are rare,\" Elena replied. \"Most of those notifications are just noise. They are destroying elling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why was David so nervous before the regional conference?", "What technique did Maria use to help David calm down?", "How did David start his speech to improve audience engagement?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, David was suffering from severe... (stage fright) before his big presentation.", "hints": ["Maria told him to do a... (rehearsal) focusing on his mindset.", "She guided him through a... (visualization) exercise to imagine success.", "She advised him to ask a question at the start to boost... (audience engagement).", "David practiced his opening, focusing on steady... (pacing) and not being afraid to... (stumble).", "On the real stage, he used the visualization, took a deep breath, and spoke confidently.", "The audience loved the talk, and David learned that preparation can help... (manage) fear."], "vocab": [{"w": "stage fright", "tr": "[steɪdʒ fraɪt]", "ru": "страх сцены"}, {"w": "rehearsal", "tr": "[rɪˈhɜːsl]", "ru": "репетиция"}, {"w": "visualization", "tr": "[ˌvɪʒuəlaɪˈzeɪʃn]", "ru": "визуализация"}, {"w": "to stumble", "tr": "[ˈstʌmbl]", "ru": "запинаться, оговариваться"}, {"w": "pacing", "tr": "[ˈpeɪsɪŋ]", "ru": "темп речи"}, {"w": "audience engagement", "tr": "[ˈɔːdiəns ɪnˈɡeɪdʒmənt]", "ru": "вовлечение аудитории"}]}, {"num": 88, "ru": "Нетворкинг и построение профессиональных связей", "en": "Networking and Building Professional Connections", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~440 слов.", "story": ["Julia stood in the corner of the busy conference hall, holding a glass of water. She felt completely out of place. Everyone seemed to know each other, laughing and exchanging business cards.", "\"Networking is a nightmare,\" she muttered to herself. \"I don't know what to say.\"", "\"First time at a big industry event?\" asked a friendly voice.", "Julia turned to see Tom, a senior manager from her company. \"Yes. I feel like I’m bothering people if I just walk up to them.\"", "Tom smiled. \"That’s a common fear. But networking isn’t about selling yourself; it’s about building relationships. Do you have your elevator pitch ready?\"", "\"My what?\" Julia asked.", "\"Your elevator pitch,\" Tom explained. \"A 30-second summary of who you are, what you do, and what you’re looking for. For example: 'Hi, I’m Julia, a UX designer. I specialize in making apps user-friendly, and I’m currently exploring new trends in AI design.'\"", "\"That sounds professional,\" Julia said, repeating it quietly. \"But how do I start a conversation?\"", "\"Ask open-ended questions and show genuine interest,\" Tom advised. \"Instead of talking about yourself, ask them: 'What brought you to this conference?' or 'What’s the most interesting project you’re working on?' People love talking about their work.\"", "\"Okay, I’ll try,\" Julia said, taking a deep breath.", "She spotted a small group near the coffee station. She walked over and smiled. \"Hi, I’m Julia. I’m a UX designer. What brought you to this conference?\"", "A woman named Rachel turned and smiled back. \"Hi Julia! I’m Rachel, a product manager. I’m here to learn more about user retention strategies. How about you?\"", "Julia delivered her elevator pitch smoothly. Rachel’s eyes lit up. \"Actually, we’re looking for a UX designer for a new project. We should connect on LinkedIn.\"", "They talked for ten minutes, and Julia felt completely relaxed. She wasn't selling; she was just having a normal conversation.", "The next day, Julia sent Rachel a message: \"Hi Rachel, it was great meeting you yesterday. I’d love to follow up on our conversation about user retention. Let me know if you have 15 minutes for a virtual coffee next week.\"", "Rachel replied within an hour: \"I’d love that! Let’s schedule it.\"", "Julia showed the message to Tom. \"It worked! I expanded my network, and I didn’t even feel awkward.\"", "\"See?\" Tom said. \"Networking is just making friends with a professional purpose. You did great.\""], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Julia feel uncomfortable at the conference?", "What is an \"elevator pitch\" according to Tom?", "How did Julia successfully start a conversation with Rachel?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Julia was afraid of... (networking) and didn't know how to... (mingle).", "hints": ["Tom advised her to prepare a 30-second... (elevator pitch).", "He also told her to show... (genuine interest) by asking open-ended questions.", "Julia approached a group and asked Rachel what brought her to the... (conference).", "They had a great conversation, and Rachel suggested they connect on... (LinkedIn).", "The next day, Julia decided to... (follow up) with a message.", "Rachel agreed to meet, and Julia successfully managed to... (expand) her professional network."], "vocab": [{"w": "networking", "tr": "[ˈnetwɜːkɪŋ]", "ru": "нетворкинг, установление связей"}, {"w": "elevator pitch", "tr": "[ˈelɪveɪtə pɪtʃ]", "ru": "краткая самопрезентация (лифтовая речь)"}, {"w": "to mingle", "tr": "[ˈmɪŋɡl]", "ru": "общаться, смешиваться (на мероприятии)"}, {"w": "genuine interest", "tr": "[ˈdʒenjuɪn ˈɪntrəst]", "ru": "искренний интерес"}, {"w": "to follow up", "tr": "[ˈfɒləʊ ʌp]", "ru": "поддерживать связь, напоминать о себе"}, {"w": "to expand", "tr": "[ɪkˈspænd]", "ru": "расширять"}]}, {"num": 89, "ru": "Личный бренд и самопрезентация", "en": "Personal Brand and Self-Presentation", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~430 слов.", "story": ["\"Leo, your quarterly results are fantastic,\" said Anna, the department director. \"But I have to be honest. When the executive team discusses promotions, your name rarely comes up. You’re a bit invisible.\"", "Leo looked surprised and a bit hurt. \"But I work harder than anyone! I stay late, I finish all my projects on time. Why isn't that enough?\"", "\"Hard work is essential, Leo,\" Anna explained gently. \"But in today’s world, you also need a strong personal brand. If people don't know what you do and the value you bring, your reputation remains limited to our immediate team.\"", "\"How do I build a personal brand? I’m not an influencer,\" Leo said, frowning.", "\"It’s not about being famous,\" Anna smiled. \"It’s about consistency and authenticity. It’s about making sure the right people see your expertise. For example, do you have an updated LinkedIn profile?\"", "\"I have one, but I haven’t touched it in two years,\" Leo admitted.", "\"That’s your first step,\" Anna said. \"Update it. Showcase your recent projects. Write a short post about a problem you solved last month. Share your knowledge.\"", "\"Will people actually read that?\" Leo asked skeptically.", "\"Yes, especially if you are authentic,\" Anna replied. \"Don’t try to sound like a corporate robot. Write like you speak. Share your genuine thoughts on industry trends. And inside the company, speak up in meetings. Share your ideas confidently.\"", "Leo decided to take her advice. That weekend, he completely revamped his LinkedIn profile. He added a professional photo, detailed his achievements, and wrote a short article about a new software tool he had mastered.", "The following week, during a team meeting, Leo didn’t sit silently in the back. When a problem arose, he raised his hand. \"I actually have some experience with this,\" he said clearly. \"Here is a solution that worked for me on a previous project.\"", "The director nodded, impressed. \"That’s a great idea, Leo. Let’s explore that.\"", "A month later, Leo received a message on LinkedIn from a recruiter at another company, and his own manager recommended him for a cross-departmental leadership role.", "\"See?\" Anna said, smiling at him. \"Your online presence and your confidence in meetings are working. You are no longer invisible.\"", "Leo realized that a personal brand wasn’t about bragging. It was about consistently and authentically showcasing your value so that opportunities could find you."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Anna say Leo was \"invisible\" despite his hard work?", "What two qualities did Anna say are important for a personal brand?", "What specific actions did Leo take to improve his personal brand?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Anna told Leo that hard work is not enough; he needs a strong... (personal brand).", "hints": ["She explained that it is about... (consistency) and... (authenticity).", "Leo’s first step was to update his... (online presence) on LinkedIn.", "He decided to... (showcase) his recent projects and share his knowledge.", "In meetings, he started to speak up and share his... (ideas) confidently.", "Soon, he got attention from a recruiter and a recommendation for a new... (role).", "Leo learned that a personal brand is about... (showcasing) your value so opportunities find you."], "vocab": [{"w": "personal brand", "tr": "[ˈpɜːsənl brænd]", "ru": "личный бренд"}, {"w": "consistency", "tr": "[kənˈsɪstənsi]", "ru": "последовательность"}, {"w": "online presence", "tr": "[ˌɒnlaɪn ˈprezns]", "ru": "присутствие в интернете"}, {"w": "to showcase", "tr": "[ˈʃəʊkeɪs]", "ru": "демонстрировать, показывать"}, {"w": "authenticity", "tr": "[ˌɔːθenˈtɪsəti]", "ru": "подлинность, искренность"}, {"w": "reputation", "tr": "[ˌrepjuˈteɪʃn]", "ru": "репутация"}]}, {"num": 90, "ru": "Эмоциональный интеллект в общении", "en": "Emotional Intelligence in Communication", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~440 слов.", "story": ["The phone rang, and Sarah knew immediately it was going to be a difficult call. It was Mr. Brown, a long-term client, and his voice was loud and angry.", "\"Sarah, this is unacceptable! The delivery is three days late, and my entire production line is waiting. I want to speak to your manager right now!\"", "Sarah felt a surge of panic and defensiveness. Her first instinct was to argue: \"It’s not my fault, the courier delayed it!\" But she took a deep breath. She remembered her training in emotional intelligence.", "First, self-regulation. She calmed her own racing heart. She knew that reacting with anger would only make the situation worse. She needed to respond, not react.", "\"Mr. Brown, I hear how frustrated you are,\" Sarah said, keeping her voice calm and steady. \"A three-day delay is incredibly stressful, especially when your production line is waiting. I completely understand why you are upset.\"", "There was a pause on the other end. Mr. Brown had expected a fight, but Sarah had just used empathy to validate his feelings.", "\"Well, yes, it is stressful,\" he said, his voice slightly softer. \"What are you going to do about it?\"", "\"Let me check the tracking system right now,\" Sarah said, practicing active listening and focusing entirely on his problem. She noticed his tone shifting from anger to anxious expectation. She also paid attention to her own non-verbal cues, making sure she was sitting up straight and speaking clearly, even though he couldn't see her.", "\"Okay, Mr. Brown,\" Sarah said a moment later. \"I see the issue. The truck broke down, but I have already arranged for an express replacement shipment. It will arrive at your facility tomorrow morning at 8 AM, at no extra cost to you.\"", "\"Tomorrow morning?\" Mr. Brown asked. \"Are you sure?\"", "\"Absolutely,\" Sarah confirmed. \"I will personally monitor the tracking and call you at 7 AM to confirm it’s on the way.\"", "\"Alright,\" Mr. Brown sighed, sounding relieved. \"Thank you, Sarah. I appreciate you handling this so quickly. I’m sorry I raised my voice.\"", "\"No need to apologize,\" Sarah smiled. \"We value your business, and I’m glad we could resolve this.\"", "After hanging up, Sarah’s colleague, Mark, looked at her in amazement. \"How did you calm him down so fast? I would have yelled back.\"", "\"Emotional intelligence,\" Sarah said. \"I regulated my own emotions, validated his frustration, and focused on solving the problem. It’s always more effective than arguing.\""], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why was Mr. Brown angry when he called Sarah?", "What was Sarah’s first instinct, and what did she do instead?", "How did Sarah use empathy to change the tone of the conversation?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Mr. Brown called, angry about a three-day... (delivery) delay.", "hints": ["Sarah felt defensive but used... (self-regulation) to calm down.", "She decided to... (respond) thoughtfully instead of reacting with anger.", "She used... (empathy) to... (validate) his frustration, which surprised him.", "Practicing... (active listening), she checked the system and found a solution.", "She arranged an express shipment and promised to monitor it... (personally).", "Mr. Brown calmed down and apologized, and Sarah proved that... (emotional intelligence) is more effective than arguing."], "vocab": [{"w": "empathy", "tr": "[ˈempəθi]", "ru": "эмпатия, сопереживание"}, {"w": "active listening", "tr": "[ˈæktɪv ˈlɪsnɪŋ]", "ru": "активное слушание"}, {"w": "self-regulation", "tr": "[ˌself ˌreɡjuˈleɪʃn]", "ru": "саморегуляция, контроль эмоций"}, {"w": "to validate", "tr": "[ˈvælɪdeɪt]", "ru": "признавать (чувства), подтверждать"}, {"w": "non-verbal cues", "tr": "[nɒn ˈvɜːbl kjuːz]", "ru": "невербальные сигналы"}, {"w": "to respond", "tr": "[rɪˈspɒnd]", "ru": "реагировать (осознанно), отвечать"}]}, {"num": 91, "ru": "Конфликтные ситуации в личной жизни", "en": "Conflict Situations in Personal Life", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~420 слов.", "story": ["It was Friday evening, and the atmosphere in the kitchen was tense. Anna and Mark had been arguing for twenty minutes about their weekend plans.", "\"I thought we agreed to visit my parents this Saturday!\" Anna said, her voice rising. \"You promised!\"", "Mark sighed, running a hand through his hair. \"I didn't promise anything. I said we might go if I finish my project. But I’m exhausted, Anna. I just want to stay home and rest.\"", "\"Well, I already told them we’re coming,\" Anna replied, crossing her arms. \"Now I look like a liar because of you.\"", "\"This is a classic misunderstanding,\" Mark said, trying to stay calm. \"You heard what you wanted to hear. I clearly said 'maybe'.\"", "Anna felt tears welling up in her eyes. She turned away, feeling hurt and angry. The argument was going in circles, and neither of them was listening.", "Suddenly, Mark took a deep breath. He realized that winning the argument was less important than their relationship. He walked over and gently touched her shoulder.", "\"Anna, I’m sorry,\" he said softly. \"I shouldn't have raised my voice. Let’s stop arguing and talk properly. I will listen actively this time.\"", "Anna turned around, surprised by his tone. She took a deep breath too. \"Okay. I’m sorry I snapped at you. I know you’ve had a hard week. I just felt disappointed because I was looking forward to seeing them.\"", "\"I understand,\" Mark said. \"And I appreciate that. But I am completely burned out. If I go, I’ll be in a terrible mood, and that won’t be fair to your parents or to you.\"", "Anna thought for a moment. \"What if we go for just two hours on Sunday morning? You can rest all day Saturday, and we’ll bring lunch so your mom doesn’t have to cook.\"", "Mark smiled, feeling a huge wave of relief. \"That sounds like a perfect compromise. Thank you for understanding.\"", "\"Thank you for apologizing,\" Anna smiled back. \"Let's make up and order some pizza.\"", "\"Deal,\" Mark said, pulling out his phone.", "They sat on the couch, eating pizza and watching a movie. The tension was completely gone. They realized that conflicts are a normal part of any relationship. The key is not to avoid them, but to handle them with respect, active listening, and a willingness to apologize and forgive."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why were Anna and Mark arguing on Friday evening?", "How did Mark stop the argument from going in circles?", "What compromise did they reach about the weekend plans?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Anna and Mark were arguing about their... (weekend plans).", "hints": ["Anna thought Mark promised to visit her parents, but it was a... (misunderstanding).", "Mark realized they needed to stop arguing and started to... (listen actively).", "He decided to... (apologize) for raising his voice, and Anna apologized too.", "They found a compromise: resting on Saturday and visiting for two hours on... (Sunday).", "They decided to... (make up) and order pizza.", "They learned that handling conflicts requires respect and a willingness to... (forgive)."], "vocab": [{"w": "to argue", "tr": "[ˈɑːɡjuː]", "ru": "спорить, ссориться"}, {"w": "misunderstanding", "tr": "[ˌmɪsʌndəˈstændɪŋ]", "ru": "недоразумение"}, {"w": "to apologize", "tr": "[əˈpɒlədʒaɪz]", "ru": "извиняться"}, {"w": "to forgive", "tr": "[fəˈɡɪv]", "ru": "прощать"}, {"w": "to make up", "tr": "[meɪk ʌp]", "ru": "мириться"}, {"w": "to listen actively", "tr": "[ˈlɪsn ˈæktɪvli]", "ru": "слушать внимательно, активно слушать"}]}, {"num": 92, "ru": "Построение здоровых отношений", "en": "Building Healthy Relationships", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~430 слов.", "story": ["\"David, we need to talk about us,\" Emma said, sitting down on the sofa. She looked serious but calm.", "David put his phone away immediately. \"Is everything okay? You sound worried.\"", "\"We are good,\" Emma smiled gently. \"But I’ve been reading about healthy relationships, and I want to make sure we are building a strong foundation. Do you feel like we have enough trust and honest communication?\"", "David thought for a moment. \"I think we do. We tell each other everything. But sometimes I feel like I don’t give you enough quality time. I’ve been working late a lot.\"", "\"I appreciate your hard work,\" Emma said, taking his hand. \"But I also need to set some boundaries. When you work at the dinner table, I feel ignored. Can we agree that from 7 PM to 9 PM, we have no screens? Just us, talking or watching a movie.\"", "\"That is a fantastic idea,\"
