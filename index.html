rt you in this. If you feel overwhelmed, come to me, and we will adjust your tasks.\"", "\"Thank you, Mr. Davis. I appreciate the honest feedback. It’s very helpful,\" Chloe said sincerely.", "\"My door is always open,\" he replied. \"You have a bright future here, Chloe. Keep up the great work on your strengths, and let’s tackle those areas for improvement together.\"", "Chloe left the office feeling motivated, not defeated. She realized that a good performance review wasn’t about listing mistakes. It was a balanced conversation that acknowledged strengths, provided constructive criticism, and created a clear plan for professional growth. She immediately opened her laptop and downloaded a task management app."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What strengths did Mr. Davis acknowledge in Chloe’s work?", "What area for improvement did he point out?", "How did Chloe react to the constructive criticism?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Mr. Davis started the... (performance review) by acknowledging Chloe’s hard work.", "hints": ["He highlighted her... (strengths), like being organized and having great presentation skills.", "Then, he gently mentioned an area for... (improvement): time management.", "He explained that she takes on too much and... (rushes) at the end.", "He offered... (constructive criticism) and suggested using a task management tool or delegating.", "Chloe agreed and said she needs to... (prioritize) better and communicate her workload.", "They made it a goal for the next... (quarter).", "Chloe left feeling motivated, realizing that feedback is about balanced... (growth).", "_____________"], "vocab": [{"w": "feedback", "tr": "[ˈfiːdbæk]", "ru": "обратная связь"}, {"w": "constructive criticism", "tr": "[kənˈstrʌktɪv ˈkrɪtɪsɪzm]", "ru": "конструктивная критика"}, {"w": "strengths", "tr": "[streŋθs]", "ru": "сильные стороны"}, {"w": "areas for improvement", "tr": "[ˈeəriəz fər ɪmˈpruːvmənt]", "ru": "зоны для роста, улучшения"}, {"w": "performance review", "tr": "[pəˈfɔːməns rɪˈvjuː]", "ru": "оценка эффективности работы"}, {"w": "to acknowledge", "tr": "[əkˈnɒlɪdʒ]", "ru": "признавать, отмечать"}]}, {"num": 54, "ru": "Удалённая работа и онлайн-коммуникация", "en": "Remote Work and Online Communication", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~450 слов.", "story": ["\"Can everyone hear me?\" asked Julia, adjusting her webcam. \"I think my Wi-Fi connection is a bit unstable today.\"", "\"Loud and clear, Julia!\" replied Mark from his home office. \"But I think Sarah is on mute.\"", "\"Oh, sorry!\" Sarah’s voice suddenly came through, accompanied by loud barking. \"My dog is going crazy because the delivery guy is at the door. Let me mute myself for a second.\"", "The team laughed. Remote work had its funny moments.", "\"Alright, let’s start the video call,\" Julia said. \"Today we need to review the new website layout. I’ll use screen sharing so you can see the design.\"", "Julia clicked the 'Share Screen' button, but nothing happened. \"Hmm, it’s not working. Let me try again.\"", "\"Maybe you need to grant the application permission in your settings,\" Mark suggested. \"That happened to me last week.\"", "\"Good catch, Mark,\" Julia said. She quickly checked her settings, fixed the permission, and tried again. This time, the website layout appeared on everyone’s screens. \"There we go! Can you see it?\"", "\"Yes, perfect,\" Sarah said, her dog finally quiet. \"I love the new color scheme. But the 'Contact Us' button is a bit too small on mobile.\"", "\"Good point,\" Julia noted. \"I’ll make it larger. What about the loading speed? Mark, you mentioned last time it was a bit slow.\"", "\"I tested it this morning,\" Mark replied. \"It’s much faster now. The developer optimized the images. Great job, team.\"", "\"Excellent,\" Julia smiled. \"I’ll make the button adjustment today and send the updated link by 4 PM. Any other issues?\"", "\"No, I think we’re good,\" Sarah said. \"This remote setup is actually working really well. We get so much done without commuting.\"", "\"Agreed,\" Mark added. \"Just remember to mute your mic when you’re not speaking, Sarah!\"", "Sarah laughed. \"Noted! No more background noise from the dog.\"", "\"Alright, thanks everyone. Have a productive day,\" Julia said, ending the call.", "Julia leaned back in her chair. She realized that remote work required a bit more technical awareness and patience. Things like Wi-Fi connections, screen sharing, and muting microphones were small details, but mastering them made online communication smooth, professional, and surprisingly human."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What was the problem with Sarah’s microphone at the beginning of the call?", "Why did Julia’s screen sharing fail at first?", "What feedback did Sarah give about the website layout?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Julia started a... (video call) to review the website layout.", "hints": ["Sarah forgot to... (mute) her microphone, and there was... (background noise) from her dog.", "Julia tried to use... (screen sharing), but it didn’t work.", "Mark suggested checking the application... (settings / permissions), which fixed the problem.", "Sarah liked the colors but said the mobile button was too... (small).", "Mark confirmed that the... (loading speed) was much faster now.", "Julia promised to fix the button and send the link by... (4 PM).", "The team agreed that... (remote work) is effective if you manage technical details well."], "vocab": [{"w": "remote work", "tr": "[rɪˈməʊt wɜːk]", "ru": "удаленная работа"}, {"w": "video call", "tr": "[ˈvɪdiəʊ kɔːl]", "ru": "видеозвонок"}, {"w": "to mute", "tr": "[mjuːt]", "ru": "отключать звук (микрофон)"}, {"w": "background noise", "tr": "[ˈbækɡraʊnd nɔɪz]", "ru": "фоновый шум"}, {"w": "screen sharing", "tr": "[skriːn ˈʃeərɪŋ]", "ru": "демонстрация экрана"}, {"w": "Wi-Fi connection", "tr": "[ˈwaɪ faɪ kəˈnekʃn]", "ru": "соединение Wi-Fi"}]}, {"num": 55, "ru": "Конфликты на работе и способы их решения", "en": "Workplace Conflicts and Resolution", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~380 слов.", "story": ["\"Why did you change the color scheme without asking me?\" Mark asked, his voice rising. He was the lead developer, and he was clearly frustrated.", "Chloe, the graphic designer, crossed her arms. \"Because the client hated the blue! I had to fix it before the deadline. Why are you getting so defensive?\"", "\"I’m not defensive,\" Mark shot back. \"But changing the colors means I have to rewrite the CSS code for the entire website. You can't just make unilateral decisions!\"", "The atmosphere in the open-plan office became very tense. Their manager, David, noticed the argument and walked over. \"Okay, let’s take a breath,\" David said calmly. \"We need to address this before it escalates. Let’s go to the meeting room.\"", "Inside, David decided to mediate. \"Mark, I understand you’re stressed about the code. Chloe, I understand you wanted to please the client. But if we don't communicate, we create bottlenecks. How can we find common ground here?\"", "Chloe sighed, her tone softening. \"I’m sorry, Mark. I didn’t realize it would take you so long to update the code. I just panicked when the client complained.\"", "Mark rubbed his temples. \"I’m sorry too. I shouldn't have yelled. But next time, just ping me on Slack before changing the design. If I know in advance, I can prepare the code.\"", "\"What if we set up a quick 10-minute sync every morning?\" David suggested. \"That way, design and development are always aligned.\"", "\"I can agree to that,\" Mark said. \"And I can compromise on the colors if you give me the hex codes by noon tomorrow.\"", "\"Deal,\" Chloe smiled, extending her hand.", "David nodded approvingly. \"Great job, guys. Conflicts are normal, but how we resolve them defines our team.\"", "Mark and Chloe left the room feeling relieved. They realized that avoiding conflicts only makes things worse. By talking openly, listening without getting defensive, and finding a practical compromise, they turned a stressful argument into a better workflow."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why was Mark angry at Chloe?", "How did David help them resolve the conflict?", "What compromise did they reach at the end?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Mark was angry because Chloe changed the design without asking, which made him rewrite the... (code).", "hints": ["Chloe got... (defensive) and said she did it for the client.", "David stepped in to... (mediate) before the argument could... (escalate).", "He asked them to find... (common ground) and communicate better.", "Chloe apologized and promised to message Mark before making... (changes).", "They agreed to a daily sync and to... (compromise) on the workflow.", "They learned that resolving conflicts requires open communication and finding a... (compromise).", "_____________"], "vocab": [{"w": "to escalate", "tr": "[ˈeskəleɪt]", "ru": "обострять, передавать руководству"}, {"w": "to mediate", "tr": "[ˈmiːdieɪt]", "ru": "выступать посредником"}, {"w": "defensive", "tr": "[dɪˈfensɪv]", "ru": "занимающий оборонительную позицию"}, {"w": "to address", "tr": "[əˈdres]", "ru": "решать (проблему), обращаться к"}, {"w": "to compromise", "tr": "[ˈkɒmprəmaɪz]", "ru": "идти на компромисс"}, {"w": "common ground", "tr": "[ˈkɒmən ɡraʊnd]", "ru": "общая почва, взаимопонимание"}]}, {"num": 56, "ru": "Презентации и публичные выступления", "en": "Presentations and Public Speaking", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~390 слов.", "story": ["Emma stared at her laptop screen, her hands shaking slightly. \"I can't do this, Sam,\" she told her mentor. \"I have to deliver the quarterly report to the board of directors tomorrow, and I have terrible stage fright. What if I forget my lines? What if they ask a question I don't know the answer to?\"", "Sam smiled gently and pulled up a chair. \"First of all, Emma, you know this data better than anyone. You built the financial model. The board doesn't expect a perfect actor; they expect an expert. Let’s work on your slide deck and your delivery.\"", "They opened the presentation. \"Rule number one,\" Sam said. \"Don't read from the slides. The slides are just visual aids. Use bullet points and tell a story. How can you engage the audience right from the start?\"", "\"Maybe I could start with a surprising fact?\" Emma suggested. \"Like, 'Did you know we saved 20% on logistics this quarter?'\"", "\"Perfect!\" Sam praised. \"That hooks them immediately. Now, what about your body language? You tend to look at the floor when you're nervous.\"", "\"I know,\" Emma admitted. \"I'm afraid to look them in the eyes.\"", "\"Try the 'lighthouse' technique,\" Sam advised. \"Make brief eye contact with one person, then move to another. It makes everyone feel like you're speaking directly to them. And remember to breathe. If you lose your train of thought, just pause. A three-second silence feels like an eternity to you, but to the audience, it just looks like you're making a thoughtful point.\"", "Emma practiced in the empty conference room for two hours. Sam gave her feedback on her posture and tone. By the end, she felt much more confident.", "The next morning, Emma stood in front of the boardroom. She took a deep breath, made eye contact with the CEO, and started her presentation. She didn't read the slides. She told the story of the company's success, using the data to back it up. When the CFO asked a tough question, she didn't panic. She paused, thought for a second, and answered clearly.", "After the meeting, the CEO walked up to her. \"Excellent presentation, Emma. Very engaging and clear.\"", "Emma texted Sam immediately: \"I survived! The lighthouse technique actually worked!\" She realized that public speaking isn't about being fearless; it's about preparing well and connecting with your audience."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why was Emma so nervous before the presentation?", "What did Sam advise her to do with her slide deck?", "What is the \"lighthouse\" technique?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Emma had terrible... (stage fright) about presenting to the board.", "hints": ["Her mentor Sam told her not to read from the... (slide deck).", "Sam advised her to tell a story to... (engage) the audience.", "To fix her body language, Sam taught her the... (lighthouse) technique for making eye contact.", "He also told her that a short pause is better than... (panicking).", "The next day, Emma delivered a great presentation and answered a tough question from the... (CFO).", "The CEO praised her, and Emma realized that public speaking is about... (preparation / connecting).", "_____________"], "vocab": [{"w": "stage fright", "tr": "[steɪdʒ fraɪt]", "ru": "страх сцены, волнение"}, {"w": "audience", "tr": "[ˈɔːdiəns]", "ru": "аудитория, слушатели"}, {"w": "to engage", "tr": "[ɪnˈɡeɪdʒ]", "ru": "вовлекать, заинтересовывать"}, {"w": "slide deck", "tr": "[slaɪd dek]", "ru": "презентация (набор слайдов)"}, {"w": "eye contact", "tr": "[aɪ ˈkɒntækt]", "ru": "зрительный контакт"}, {"w": "to deliver", "tr": "[dɪˈlɪvə]", "ru": "выступать, произносить (речь)"}]}, {"num": 57, "ru": "Переговоры и искусство убеждения", "en": "Negotiations and the Art of Persuasion", "level": "B1-B2 (Pre-Intermediate / Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~410 слов.", "story": ["Alex sat across the table from Mr. Vance, the supplier. Alex needed to buy 5,000 custom microchips for his tech startup, but the price was too high.", "\"Mr. Vance, $10 per unit is above our budget,\" Alex said calmly. \"We were hoping for something closer to $7.\"", "Mr. Vance shook his head. \"I understand, Alex, but the cost of raw materials has gone up. $10 is our bottom line for this quality. I can't go lower.\"", "Alex knew he needed leverage to persuade him. \"I appreciate the quality, Mr. Vance. But we are also talking to a supplier in Vietnam who quoted us $6.50. We prefer to work with you because of your fast shipping, but we need a competitive price to make it work.\"", "Mr. Vance leaned back, thinking. He didn't want to lose a large order. \"What if we meet halfway? I can offer a concession and drop it to $8.50, but only if you sign a two-year contract instead of a one-year.\"", "Alex considered the counter-offer. $8.50 was better, but he wanted to protect his cash flow. \"A two-year contract is a big commitment for a startup,\" Alex replied. \"How about this: We sign a two-year contract at $8.00 per unit. In return, we will make you our exclusive supplier for this specific chip. That guarantees you steady business and gives us the price we need.\"", "Mr. Vance smiled slightly. He liked the idea of an exclusive partnership. \"You drive a hard bargain, Alex. But I think this is a mutually beneficial agreement. $8.00 it is.\"", "They shook hands and signed the paperwork.", "Walking back to his office, Alex felt a rush of adrenaline. He realized that successful negotiation wasn't about arguing or forcing the other side to lose. It was about understanding their needs, using your leverage politely, and finding a creative solution. By offering exclusivity, he gave Mr. Vance something valuable in exchange for the discount. It was the art of persuasion in action: making the other person feel like they won, too."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why couldn't Mr. Vance accept Alex's initial offer of $7?", "What leverage did Alex use during the negotiation?", "What was the final mutually beneficial agreement?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Alex tried to negotiate the price of microchips, but $10 was above his... (budget).", "hints": ["Mr. Vance said $10 was his... (bottom line) because of raw material costs.", "Alex used... (leverage) by mentioning a cheaper supplier in Vietnam.", "Mr. Vance made a... (concession) and offered $8.50 for a two-year contract.", "Alex made a... (counter-offer): $8.00 in exchange for an exclusive partnership.", "Mr. Vance agreed because it was a... (mutually beneficial) deal.", "Alex realized that negotiation is about understanding needs and the art of... (persuasion).", "_____________"], "vocab": [{"w": "leverage", "tr": "[ˈliːvərɪdʒ]", "ru": "рычаг давления, преимущество"}, {"w": "concession", "tr": "[kənˈseʃn]", "ru": "уступка"}, {"w": "bottom line", "tr": "[ˈbɒtəm laɪn]", "ru": "итог, конечная цель / минимальная цена"}, {"w": "to counter-offer", "tr": "[ˈkaʊntər ˈɒfə]", "ru": "делать встречное предложение"}, {"w": "mutually beneficial", "tr": "[ˌmjuːtʃuəli ˌbenɪˈfɪʃl]", "ru": "взаимовыгодный"}, {"w": "to persuade", "tr": "[pəˈsweɪd]", "ru": "убеждать"}]}, {"num": 58, "ru": "Корпоративный этикет и деловой стиль общения", "en": "Corporate Etiquette and Business Communication", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~390 слов.", "story": ["\"Hey, Sarah, can you check this email before I send it to the new client?\" asked Leo, a junior account manager.", "Sarah, the senior manager, read the draft on Leo’s screen. It said: *'Hey John, I need the signed contract by tomorrow or we can't start the project. Send it ASAP. Thanks.'*", "Sarah raised her eyebrows. \"Leo, this is way too casual. And a bit aggressive. You need to adjust your formal tone. We are talking to a corporate client, not a buddy from college.\"", "Leo looked confused. \"But we had a great, friendly meeting yesterday! I thought we built a good relationship.\"", "\"You did,\" Sarah explained. \"But in written business communication, especially regarding contracts and deadlines, you must maintain professional boundaries. Let’s rephrase this. Instead of saying 'I need' or 'Send it ASAP', try asking politely. How would you say it?\"", "Leo thought for a moment. \"Could you please send the signed contract by tomorrow?\"", "\"Much better,\" Sarah smiled. \"Now, let's add the 'why'. Explain that it's for their benefit. For example: 'To ensure we can launch the project on schedule, could you please return the signed contract by tomorrow at 5 PM?'\"", "\"That sounds much more professional,\" Leo admitted. \"What if he doesn't reply?\"", "\"Then you follow up the next morning with a gentle reminder,\" Sarah said. \"And one more thing: always cc your manager on the first few emails with a new client, just to keep everyone in the loop.\"", "Leo rewrote the email, checked it for typos, and added Sarah to the cc line. *'Dear John, Thank you again for the productive meeting yesterday. To ensure we can launch the project on schedule, could you please return the signed contract by tomorrow at 5 PM? Let me know if you have any questions. Best regards, Leo.'*", "He hit send. Two hours later, John replied: *'Hi Leo, attached is the signed contract. Looking forward to starting!'*", "Leo showed the reply to Sarah. \"It worked! And he didn't even seem annoyed by the deadline.\"", "\"Because you didn't demand it, you requested it politely,\" Sarah said. \"Good business etiquette is about making the other person feel respected while still achieving your goals.\""], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Sarah stop Leo from sending his first email draft?", "How did Sarah suggest Leo rephrase the demand for the contract?", "Why did Sarah tell Leo to cc her on the email?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Leo wrote an email that was too casual and aggressive, so Sarah told him to adjust his... (formal tone).", "hints": ["She explained that he needs to maintain professional... (boundaries) in written communication.", "Instead of... (demanding) the contract ASAP, Sarah told him to... (phrase) it as a polite request.", "She also advised him to explain the 'why' and to... (cc) her on the email.", "Leo rewrote the email politely and sent it.", "The client replied quickly with the signed... (contract).", "Leo learned that good etiquette is about making people feel... (respected) while achieving your goals.", "_____________"], "vocab": [{"w": "formal tone", "tr": "[ˈfɔːml təʊn]", "ru": "формальный тон"}, {"w": "to phrase", "tr": "[freɪz]", "ru": "формулировать, выражать"}, {"w": "boundary", "tr": "[ˈbaʊndri]", "ru": "граница"}, {"w": "to cc (carbon copy)", "tr": "[ˌsiː ˈsiː]", "ru": "ставить в копию"}, {"w": "to demand", "tr": "[dɪˈmɑːnd]", "ru": "требовать"}, {"w": "to follow up", "tr": "[ˈfɒləʊ ʌp]", "ru": "напоминать, следить за выполнением"}]}, {"num": 59, "ru": "Командная работа и взаимодействие в коллективе", "en": "Teamwork and Collaboration", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~400 слов.", "story": ["\"We have a major bottleneck,\" said Maya, the project lead, looking at the timeline on the whiteboard. \"The app launch is in three days, but the payment integration isn't working. Dev team, what’s the hold-up?\"", "Tom, the lead developer, sighed. \"We are waiting for the final API keys from the design and product team. We can't finish the code without them.\"", "Lisa, the product manager, frowned. \"I sent the keys to your email three days ago, Tom! Didn't you check?\"", "\"I check my email, but I get 200 messages a day!\" Tom argued. \"You should have pinged me on Slack or handed them to me in the stand-up meeting.\"", "The room grew quiet. The team was misaligned, and the deadline was approaching. Maya knew she had to step in before the blame game ruined the project.", "\"Okay, team, let's stop pointing fingers,\" Maya said calmly. \"This is a shared responsibility. If the integration fails, we all fail. Let's brainstorm a solution right now. How do we fix this in the next 24 hours?\"", "Tom rubbed his neck. \"If Lisa can sit with me for the next two hours and help me test the API directly, we can bypass the email delay and fix the bugs immediately.\"", "\"I can do that,\" Lisa agreed, closing her laptop. \"I'll clear my afternoon schedule. I should have followed up with you to make sure you received the keys. That's my mistake.\"", "\"Thanks, Lisa,\" Tom said, his tone softening. \"And I should have raised a red flag yesterday when I couldn't find the email. I assumed you were still working on it.\"", "\"Great,\" Maya smiled. \"This is what true collaboration looks like. We don't just do our own tasks in isolation; we communicate to ensure the whole system works.\"", "Tom and Lisa moved to a desk together and worked side-by-side for the rest of the day. By 6 PM, the payment integration was fully functional and tested.", "During the successful app launch three days later, Maya raised a glass of champagne. \"To a team that knows how to collaborate, communicate, and overcome bottlenecks together!\"", "Everyone cheered. They learned that a successful team isn't one that never makes mistakes, but one that aligns quickly and takes shared responsibility to fix them."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письненно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письненно):", "qs": ["What was the bottleneck delaying the app launch?", "Why were Tom and Lisa arguing?", "How did Maya help the team resolve the issue?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Maya announced a... (bottleneck) because the payment integration wasn't working.", "hints": ["Tom blamed Lisa for not sending the API keys, but she said she emailed them... (three days ago).", "Maya stepped in and reminded them it was a... (shared responsibility).", "They decided to... (collaborate) directly, with Lisa sitting next to Tom to test the API.", "Lisa admitted she should have... (followed up), and Tom admitted he should have spoken up earlier.", "By working together, they fixed the bugs and... (launched) the app on time.", "They learned that teamwork requires communication and taking... (shared responsibility).", "_____________"], "vocab": [{"w": "bottleneck", "tr": "[ˈbɒtlnek]", "ru": "узкое место, препятствие"}, {"w": "to align", "tr": "[əˈlaɪn]", "ru": "согласовывать, приводить к единому мнению"}, {"w": "to step in", "tr": "[step ɪn]", "ru": "вмешиваться, помогать"}, {"w": "shared responsibility", "tr": "[ʃeəd rɪˌspɒnsəˈbɪləti]", "ru": "общая ответственность"}, {"w": "to collaborate", "tr": "[kəˈlæbəreɪt]", "ru": "сотрудничать"}, {"w": "to brainstorm", "tr": "[ˈbreɪnstɔːm]", "ru": "генерировать идеи, штурмить"}]}, {"num": 60, "ru": "Клиентский сервис и общение с клиентами", "en": "Customer Service and Client Communication", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~410 слов.", "story": ["The phone rang, and Mia put on her headset. \"Thank you for calling TechSupport, my name is Mia. How can I help you today?\"", "\"Help me?\" a man’s voice shouted. \"I ordered a premium laptop for my business trip, and it never arrived! My flight is tomorrow morning, and I have no computer! This is unacceptable!\"", "Mia took a deep breath. She knew how to handle a complaint. The first rule was to be empathetic, not defensive.", "\"I am so sorry to hear that, sir,\" Mia said in a calm, soothing voice. \"I completely understand how stressful it is to not have your laptop before a business trip. Let me check your order right away. May I have your order number?\"", "The man, Mr. Davis, gave her the number, still sounding annoyed. Mia checked the system. \"Mr. Davis, I see the issue. The courier marked the package as 'delivered' yesterday, but it seems it was left at the wrong address on your street.\"", "\"So it's gone? I need a refund immediately!\" he demanded.", "Mia knew that simply giving a refund would lose the customer forever. Customer retention was about going the extra mile. \"Mr. Davis, I don't want you to travel without a computer. I am going to escalate this to our priority shipping team. We will overnight a brand-new laptop to your hotel in New York. It will be there by 8 AM tomorrow, completely free of charge. And I will issue a 20% refund to your card for the terrible inconvenience.\"", "There was a long silence on the line. \"Wait, really? You can get it to my hotel by tomorrow morning?\"", "\"Yes, sir,\" Mia smiled. \"I am processing the overnight shipping right now. You will get a tracking number in five minutes.\"", "\"Mia, you are a lifesaver,\" Mr. Davis said, his voice completely changed. \"I was so angry, but you completely resolved this. Thank you. I will definitely buy from your company again.\"", "\"Have a wonderful and successful business trip, Mr. Davis,\" Mia replied, ending the call.", "Her manager, who had been listening, gave her a thumbs-up. \"Excellent job, Mia. You turned an angry client into a loyal one.\" Mia realized that great customer service isn't just about following rules; it's about listening with empathy and finding creative solutions to resolve the client's real problem."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why was Mr. Davis angry when he called customer service?", "What was the actual problem with the delivery?", "How did Mia resolve the situation to keep the customer happy?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Mr. Davis called to... (handle a complaint / complain) because his laptop didn't arrive before his trip.", "hints": ["Mia was very... (empathetic) and calmly checked his order.", "She found out the courier delivered it to the... (wrong address).", "Mr. Davis demanded a... (refund), but Mia wanted to focus on customer retention.", "She decided to... (escalate) the issue and overnight a new laptop to his hotel for free.", "She also offered a 20%... (refund) for the inconvenience.", "Mr. Davis was amazed and promised to buy from them again.", "Mia learned that great service is about listening and finding creative ways to... (resolve) problems."], "vocab": [{"w": "to handle a complaint", "tr": "[ˈhændl ə kəmˈpleɪnt]", "ru": "работать с жалобой"}, {"w": "empathetic", "tr": "[ˌempəˈθetɪk]", "ru": "сочувствующий, эмпатичный"}, {"w": "to resolve", "tr": "[rɪˈzɒlv]", "ru": "решать, улаживать"}, {"w": "refund", "tr": "[ˈriːfʌnd]", "ru": "возврат средств"}, {"w": "to escalate", "tr": "[ˈeskəleɪt]", "ru": "передавать на уровень выше"}, {"w": "customer retention", "tr": "[ˈkʌstəmər rɪˈtenʃn]", "ru": "удержание клиентов"}]}, {"num": 61, "ru": "Рабочие процессы и постановка задач", "en": "Workflows and Task Setting", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~420 слов.", "story": ["\"Okay, team, let’s look at our workflow for the new website launch,\" said Alex, the project manager, sharing his screen during the morning meeting.", "Sarah, a new junior developer, raised her hand. \"Alex, I’m a bit confused. How do we know which tasks are the most urgent?\"", "\"Great question, Sarah,\" Alex smiled. \"We use our project management tool to assign tasks clearly. Every task has an owner, a priority level, and a strict deadline. For example, I just assigned the homepage design to you, Sarah. The deadline is this Friday.\"", "\"Got it,\" Sarah said, taking notes. \"But what if I get stuck? I don’t want to become a bottleneck for the whole team.\"", "\"That’s exactly why we have milestones,\" Alex explained. \"A milestone is a checkpoint. For the homepage, your first milestone is the wireframe, due on Wednesday. If you track your progress and see you’re falling behind, you ping me immediately. We don’t wait until Friday to discover a problem.\"", "Mark, the senior designer, chimed in. \"Sarah, if you’re stuck on the wireframe, just slide into my DMs. I can review it in ten minutes. That’s how we keep the workflow smooth.\"", "\"Thanks, Mark! That makes me feel much better,\" Sarah replied.", "\"Another important rule,\" Alex added, \"is to break big tasks into smaller, manageable pieces. Don’t just write 'Build website' on your to-do list. Break it down: 'Create header', 'Write hero text', 'Add contact form'. It makes tracking progress much easier and less overwhelming.\"", "Sarah nodded, opening the project board on her laptop. \"I see it now. The tasks are color-coded, and I can see exactly what Mark is working on, too.\"", "\"Exactly,\" Alex said. \"Transparency is key. If everyone knows what everyone else is doing, we avoid duplicate work and missed deadlines. So, Sarah, your first action item is to create the wireframe draft by Wednesday. Can you commit to that?\"", "\"Yes, absolutely,\" Sarah said confidently. \"I’ll set a reminder for Tuesday afternoon to review it with Mark.\"", "\"Perfect,\" Alex concluded. \"Let’s keep the communication open, track our milestones, and support each other. Any other questions about the workflow?\"", "The team shook their heads, ready to start. Sarah realized that a good workflow wasn’t about micromanagement. It was about clear communication, realistic deadlines, and knowing exactly when and how to ask for help."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why was Sarah confused at the beginning of the meeting?", "What is a \"milestone\" according to Alex?", "How did Mark offer to help Sarah?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Alex explained the team's... (workflow) for the website launch.", "hints": ["He showed Sarah how they... (assign) tasks with a clear priority and... (deadline).", "Sarah was worried about becoming a... (bottleneck) if she got stuck.", "Alex explained that they use... (milestones) as checkpoints to... (track) progress.", "Mark offered to review Sarah's wireframe quickly to keep the workflow... (smooth).", "Alex advised breaking big tasks into smaller pieces to avoid feeling... (overwhelmed).", "Sarah realized that a good workflow is about clear communication and knowing when to ask for... (help).", "_____________"], "vocab": [{"w": "workflow", "tr": "[ˈwɜːkfləʊ]", "ru": "рабочий процесс"}, {"w": "to assign", "tr": "[əˈsaɪn]", "ru": "назначать (задачу)"}, {"w": "deadline", "tr": "[ˈdedlaɪn]", "ru": "крайний срок"}, {"w": "milestone", "tr": "[ˈmaɪlstəʊn]", "ru": "важный этап, веха"}, {"w": "to track", "tr": "[træk]", "ru": "отслеживать"}, {"w": "bottleneck", "tr": "[ˈbɒtlnek]", "ru": "узкое место, препятствие"}]}, {"num": 62, "ru": "Стресс на работе и work-life balance", "en": "Workplace Stress and Work-Life Balance", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~430 слов.", "story": ["It was 7:30 PM on a Thursday, and the office was almost empty. Emma was still at her desk, staring at her screen with tired eyes. Her phone buzzed with another email notification.", "\"Emma, are you still here?\" asked Mark, the team lead, as he walked by with his coat on.", "\"Yeah, just finishing up the quarterly report,\" Emma sighed, rubbing her temples. \"I have to send it to the director by tomorrow morning.\"", "Mark pulled up a chair. \"Emma, you’ve been working overtime every day this week. You look exhausted. Are you okay?\"", "\"I’m fine, just a bit stressed,\" Emma replied, though her voice sounded shaky. \"If I don’t finish this, the whole project will be delayed.\"", "\"The project will be fine,\" Mark said gently. \"But your mental health won’t be if you keep pushing yourself like this. Burnout is real, and I don’t want to see you get there.\"", "Emma looked down. \"I just feel like if I don’t do everything perfectly, I’ll let the team down.\"", "\"Listen to me,\" Mark said firmly but kindly. \"You are a valuable member of this team, but you are not a machine. You need to set boundaries. Do you check your work email after 8 PM?\"", "\"Usually, yes,\" Emma admitted. \"I feel like I have to be available.\"", "\"That’s a bad habit,\" Mark said. \"You need time to unwind. When you go home, close your laptop, put your phone on silent, and do something you enjoy. Read a book, take a walk, cook dinner. Anything but work.\"", "\"But what about the report?\" Emma asked.", "\"Let’s prioritize,\" Mark suggested. \"What is absolutely essential for tomorrow? Just the executive summary and the main data charts. The rest can wait until Monday. I will talk to the director and explain that we are delivering the core data first.\"", "Emma felt a huge wave of relief. \"Really? You would do that?\"", "\"Of course. We support each other here,\" Mark smiled. \"Now, pack your things. Go home, get a good night’s sleep, and come back fresh tomorrow.\"", "\"Thank you, Mark. I really needed to hear that,\" Emma said, shutting down her computer.", "That evening, Emma didn’t check her email once. She cooked a nice dinner, watched a movie, and went to bed early. The next day, she arrived at the office feeling refreshed and focused. She realized that work-life balance wasn’t a luxury; it was a necessity for long-term success and happiness."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why was Emma still at the office at 7:30 PM?", "What bad habit did Emma admit to having?", "How did Mark help Emma prioritize her work?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Emma was working late and felt... (stressed) about finishing the report.", "hints": ["Mark noticed she was working... (overtime) every day and warned her about... (burnout).", "He told her it was important to set... (boundaries) and protect her... (mental health).", "Emma admitted she always checked her email after hours instead of taking time to... (unwind).", "Mark helped her... (prioritize) the report, saying only the core data was needed for tomorrow.", "He told her to go home, rest, and come back... (fresh).", "Emma realized that work-life balance is a... (necessity) for long-term success.", "_____________"], "vocab": [{"w": "burnout", "tr": "[ˈbɜːnaʊt]", "ru": "эмоциональное выгорание"}, {"w": "to unwind", "tr": "[ʌnˈwaɪnd]", "ru": "расслабляться, отдыхать"}, {"w": "boundaries", "tr": "[ˈbaʊndəriz]", "ru": "личные границы"}, {"w": "overtime", "tr": "[ˈəʊvətaɪm]", "ru": "сверхурочная работа"}, {"w": "to prioritize", "tr": "[praɪˈɒrɪtaɪz]", "ru": "расставлять приоритеты"}, {"w": "mental health", "tr": "[ˈmentl helθ]", "ru": "психическое здоровье"}]}, {"num": 63, "ru": "Карьерный рост и профессиональное развитие", "en": "Career Growth and Professional Development", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~440 слов.", "story": ["\"David, you’ve been a solid marketing specialist for two years,\" said Lisa, the marketing director, during their one-on-one meeting. \"But I know you want to advance to a senior role. Have you thought about your professional development plan?\"", "David nodded eagerly. \"Yes, Lisa. I really want to grow, but I’m not sure what steps to take next. I feel like I’ve hit a plateau.\"", "\"That’s completely normal,\" Lisa reassured him. \"Let’s build a roadmap together. First, we need to define your long-term goal. Where do you see yourself in three years?\"", "\"I’d love to lead a marketing team,\" David replied. \"But I lack experience in managing people and advanced data analytics.\"", "\"Perfect. That gives us a clear direction,\" Lisa said. \"To upskill in data analytics, I recommend taking the advanced Google Analytics certification course. The company will pay for it. As for leadership, I can offer you mentorship. I’ll let you lead the upcoming product launch campaign.\"", "David’s eyes widened. \"Really? Lead the whole campaign?\"", "\"Yes, but with my guidance,\" Lisa smiled. \"You’ll make the decisions, but we will have weekly check-ins. I will give you constructive feedback on your management style, your communication, and your strategic thinking.\"", "\"That sounds amazing,\" David said. \"What about networking? I feel like I only talk to people in our immediate department.\"", "\"Great point,\" Lisa said. \"Professional development isn’t just about hard skills. I want you to attend the industry conference next month. Talk to other marketing leaders, exchange contacts, and learn about new trends. Bring back three key insights to share with our team.\"", "\"I will definitely do that,\" David said, writing everything down. \"This makes the path to a senior role feel much more achievable.\"", "\"Remember, David, career growth doesn’t happen overnight,\" Lisa added. \"It requires continuous learning, stepping out of your comfort zone, and actively seeking feedback. I believe in your potential.\"", "Six months later, David successfully led the product launch. The campaign exceeded all targets, and his team praised his clear communication and supportive leadership.", "During his next performance review, Lisa smiled. \"You’ve proven you’re ready, David. Congratulations on your promotion to Senior Marketing Manager.\"", "David realized that professional development wasn’t a mystery. It was a deliberate process of setting goals, upskilling, finding a good mentor, and embracing new challenges."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What was David’s long-term goal?", "How did Lisa offer to help David improve his leadership skills?", "What did Lisa ask David to do at the industry conference?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Lisa and David discussed his desire to... (advance) to a senior role.", "hints": ["They defined his... (long-term goal) of leading a marketing team.", "To upskill, Lisa suggested he get a Google Analytics... (certification).", "She also offered... (mentorship) by letting him lead the next campaign.", "Lisa promised to give him... (constructive feedback) during weekly check-ins.", "She also encouraged him to do some... (networking) at an industry conference.", "Six months later, David succeeded and got his... (promotion).", "He learned that career growth requires continuous learning and seeking... (feedback).", "_____________"], "vocab": [{"w": "mentorship", "tr": "[ˈmentɔːʃɪp]", "ru": "наставничество"}, {"w": "to upskill", "tr": "[ʌpˈskɪl]", "ru": "повышать квалификацию"}, {"w": "long-term goal", "tr": "[lɒŋ tɜːm ɡəʊl]", "ru": "долгосрочная цель"}, {"w": "constructive feedback", "tr": "[kənˈstrʌktɪv ˈfiːdbæk]", "ru": "конструктивная обратная связь"}, {"w": "networking", "tr": "[ˈnetwɜːkɪŋ]", "ru": "нетворкинг, установление связей"}, {"w": "to advance", "tr": "[ədˈvɑːns]", "ru": "продвигаться (по карьерной лестнице)"}]}, {"num": 64, "ru": "Личные финансы и планирование бюджета", "en": "Personal Finance and Budget Planning", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~430 слов.", "story": ["\"Tom, we need to talk about our money,\" Anna said, sitting at the kitchen table with a stack of bank statements. \"We keep saying we want to buy a house, but our savings account hasn’t grown in months.\"", "Tom sighed, running a hand through his hair. \"I know, Anna. I feel like we earn a decent salary, but the money just disappears. I don’t even know where it goes.\"", "\"That’s exactly the problem,\" Anna said gently. \"We don’t have a budget. We need to sit down and track our spending for the last three months.\"", "They opened their banking app and started categorizing their expenses. Rent, utilities, and groceries were normal. But then they looked at the \"Entertainment\" and \"Dining Out\" categories.", "\"Wow,\" Tom said, his eyes wide. \"We spent $600 on restaurants and coffee shops last month alone? And $200 on subscription services we barely use?\"", "\"Exactly,\" Anna nodded. \"If we want to reach our financial goal of saving for a house down payment, we have to make changes. We need to cut unnecessary expenses.\"", "\"Okay, you’re right,\" Tom admitted. \"What’s the plan?\"", "\"First,\" Anna said, \"we create a strict monthly budget. We allocate a specific amount for groceries, a small amount for fun, and we automate a transfer to our savings account on payday.\"", "\"What about an emergency fund?\" Tom asked. \"My car is getting old, and I’m worried about unexpected repairs.\"", "\"Great point,\" Anna smiled. \"We will build an emergency fund first. Our goal is to save three months' worth of living expenses. Once we have that safety net, we can focus entirely on the house down payment.\"", "\"This sounds like a lot of discipline,\" Tom said. \"No more Friday night pizza?\"", "\"We can still have Friday night pizza,\" Anna laughed. \"But we’ll buy the ingredients and make it at home. It’s cheaper and more fun. We just need to be mindful of our choices.\"", "Tom agreed. They set up a budgeting app on their phones to track spending in real-time. For the first two weeks, it was challenging. Tom really wanted to buy a new video game, and Anna missed her daily fancy coffee. But they stuck to the plan.", "By the end of the third month, they checked their savings account. They had saved $1,500 more than usual.", "\"Look at this!\" Tom cheered. \"We actually did it.\"", "Anna hugged him. \"We did. And it feels great to be in control of our money.\" They realized that personal finance wasn’t about restricting themselves; it was about making intentional choices to build a secure future."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why were Tom and Anna worried about their finances?", "What surprising expense did they discover when tracking their spending?", "What was their first financial priority before saving for a house?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Anna and Tom realized they weren't reaching their... (financial goal) of buying a house.", "hints": ["They decided to sit down and... (track spending) for the last three months.", "They were shocked by their high... (expenses) on restaurants and subscriptions.", "Anna suggested creating a strict monthly... (budget) and automating savings.", "Tom wisely pointed out the need for an... (emergency fund) for unexpected costs.", "They agreed to cut unnecessary costs, like making pizza at home to... (save up).", "After three months, they successfully saved $1,500 more than usual.", "They learned that managing money is about making intentional... (choices).", "_____________"], "vocab": [{"w": "budget", "tr": "[ˈbʌdʒɪt]", "ru": "бюджет"}, {"w": "expenses", "tr": "[ɪkˈspensɪz]", "ru": "расходы"}, {"w": "to save up", "tr": "[seɪv ʌp]", "ru": "копить (на что-либо)"}, {"w": "emergency fund", "tr": "[ɪˈmɜːdʒənsi fʌnd]", "ru": "резервный фонд, подушка безопасности"}, {"w": "to track spending", "tr": "[træk ˈspendɪŋ]", "ru": "отслеживать траты"}, {"w": "financial goal", "tr": "[faɪˈnænʃl ɡəʊl]", "ru": "финансовая цель"}]}, {"num": 65, "ru": "Технологии и гаджеты в повседневной жизни", "en": "Technology and Gadgets in Everyday Life", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~420 слов.", "story": ["\"Dad, stop tapping the screen so hard, it’s not going to make it faster,\" Lily laughed, watching her father struggle with his new smartwatch.", "John frowned. \"I just don’t understand why it’s not showing my messages. I thought this was supposed to be a user-friendly device.\"", "\"It is, Dad, you just haven’t set it up correctly,\" Lily said, taking the watch from him. \"First, we need to sync it with your phone via Bluetooth. Have you downloaded the companion app?\"", "\"I think so,\" John said, pulling out his smartphone. \"But my phone is already buzzing like crazy. I’m getting notifications for everything: emails, news, the weather, my friend’s cat photos. It’s overwhelming.\"", "Lily nodded. \"That’s a common problem with wearable devices. You need to customize your notification settings. You don’t need to know the weather every ten minutes. Let’s turn off everything except calls and text messages from family.\"", "She tapped on the screen for a minute. \"There. Much better. Now, let’s talk about battery life. You need to charge this every night, just like your phone. If you forget, it will die by noon tomorrow.\"", "\"Every night? That’s annoying,\" John grumbled.", "\"It’s a small price to pay for the benefits,\" Lily argued. \"Think about it: it tracks your steps, monitors your heart rate, and lets you answer calls without digging your phone out of your pocket. Plus, we can connect it to your smart home system.\"", "\"Smart home? You mean the lights and the thermostat?\" John asked, intrigued.", "\"Exactly,\" Lily smiled. \"Once it’s all connected, you can say, 'Turn off the living room lights,' or your watch can automatically lower the thermostat when you leave for work. It makes daily life so much more convenient.\"", "John’s eyes lit up. \"Okay, that actually sounds useful. Show me how to do that.\"", "For the next hour, Lily patiently guided him through the setup process. They connected the watch, adjusted the notifications, and linked the smart home hub.", "\"Try it now,\" Lily said. \"Say, 'Turn on the kitchen lights'.\"", "John cleared his throat. \"Turn on the kitchen lights.\" Instantly, the lights in the next room flickered on.", "\"Wow,\" John said, genuinely impressed. \"That’s like magic.\"", "\"It’s just technology, Dad,\" Lily grinned. \"But yes, it’s pretty cool. Just remember to charge it tonight!\"", "John looked at his wrist, feeling like he had stepped into the future. He realized that while technology could be confusing at first, taking the time to learn it could make everyday life significantly easier and more enjoyable."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why was John frustrated with his new smartwatch at the beginning?", "How did Lily solve the problem of too many notifications?", "What smart home feature excited John the most?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, John was struggling with his new... (wearable device) because it wasn't showing messages.", "hints": ["Lily explained that he needed to... (sync) it with his phone.", "John complained about too many... (notifications), so Lily helped him customize the settings.", "Lily also reminded him to charge it every night to maintain good... (battery life).", "She explained that the watch could connect to his... (smart home) system.", "John tested it by asking the watch to turn on the kitchen... (lights).", "He realized that taking the time to learn technology makes life more... (user-friendly / convenient).", "_____________"], "vocab": [{"w": "smart home", "tr": "[smɑːt həʊm]", "ru": "умный дом"}, {"w": "wearable device", "tr": "[ˈweərəbl dɪˈvaɪs]", "ru": "носимое устройство (например, смарт-часы)"}, {"w": "to sync", "tr": "[sɪŋk]", "ru": "синхронизировать"}, {"w": "battery life", "tr": "[ˈbætəri laɪf]", "ru": "время работы батареи"}, {"w": "notification", "tr": "[ˌnəʊtɪfɪˈkeɪʃn]", "ru": "уведомление"}, {"w": "user-friendly", "tr": "[ˈjuːzə ˈfrendli]", "ru": "удобный в использовании"}]}, {"num": 66, "ru": "Путешествия и командировки", "en": "Travel and Business Trips", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~430 слов.", "story": ["\"Maria, you look like you’re about to conquer the world,\" David said, noticing her organized desk and color-coded planner.", "\"I’m trying to,\" Maria replied, taking a deep breath. \"I have my first international business trip to London next week, and I’m making sure I don’t forget anything.\"", "David, who traveled for work frequently, smiled. \"London is great. But it can be overwhelming if you’re not prepared. Have you booked your accommodation yet?\"", "\"Yes, the company booked a hotel near the client’s office,\" Maria said. \"But I’m struggling with the itinerary. I have three meetings on Monday, a dinner on Tuesday, and a flight back on Wednesday evening. I’m worried about jet lag.\"", "\"Ah, jet lag,\" David nodded. \"My best advice: as soon as you get on the plane, set your watch to London time. Try to sleep on the flight if it’s nighttime there. When you arrive, force yourself to stay awake until at least 9 PM local time. Get some sunlight and walk around. It resets your internal clock.\"", "\"That’s a great tip, I’ll write that down,\" Maria said, grabbing her pen. \"What about meals? Should I book restaurants in advance?\"", "\"For the client dinner, yes, absolutely,\" David advised. \"But for your own meals, keep it flexible. Also, keep all your receipts. Coffee, taxi rides, meals. You will need them for your expense report when you get back.\"", "Maria groaned. \"I hate doing expense reports. It takes forever.\"", "\"I know, it’s tedious,\" David agreed. \"But if you take a photo of every receipt immediately and upload it to the company app, it takes five minutes at the end of the trip. Don’t leave it until the last day, or you’ll lose them.\"", "\"Smart,\" Maria said. \"Is there anything else I should know?\"", "\"Just one thing,\" David said seriously. \"Leave some buffer time in your itinerary. London traffic can be unpredictable, and the Tube can get delayed. If you have a meeting at 10 AM, plan to leave the hotel by 8:30 AM. It’s better to be early and have a coffee than to be late and stressed.\"", "\"Buffer time. Got it,\" Maria smiled, feeling much more confident. \"Thank you, David. I feel like I actually know what I’m doing now.\"", "\"Have a fantastic trip, Maria,\" David said. \"And bring me back some proper British tea.\"", "\"I will!\" she laughed. Maria realized that a successful business trip wasn’t just about the meetings. It was about careful planning, managing your energy, and handling the small details like receipts and travel time."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why was Maria feeling a bit overwhelmed about her trip to London?", "What was David’s advice for dealing with jet lag?", "Why is it important to keep all receipts during a business trip?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Maria was preparing for her first international... (business trip) to London.", "hints": ["She had already... (booked) her accommodation near the client's office.", "David gave her advice on how to beat... (jet lag) by adjusting to the local time immediately.", "He also advised her to keep her... (itinerary) flexible but with buffer time for traffic.", "David reminded her to save all receipts for the... (expense report).", "He suggested taking photos of receipts immediately to save... (time).", "Maria realized that a successful trip requires careful... (planning) and attention to small details."], "vocab": [{"w": "business trip", "tr": "[ˈbɪznəs trɪp]", "ru": "командировка"}, {"w": "itinerary", "tr": "[aɪˈtɪnərəri]", "ru": "маршрут, план поездки"}, {"w": "expense report", "tr": "[ɪkˈspens rɪˈpɔːt]", "ru": "отчет о расходах"}, {"w": "jet lag", "tr": "[dʒet læɡ]", "ru": "смена часовых поясов, джетлаг"}, {"w": "to book", "tr": "[bʊk]", "ru": "бронировать"}, {"w": "accommodation", "tr": "[əˌkɒməˈdeɪʃn]", "ru": "размещение, жилье"}]}, {"num": 67, "ru": "Эмоции и управление ими", "en": "Emotions and Managing Them", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~420 слов.", "story": ["Sarah stared at her computer screen, feeling her heart race. She had just received a very rude email from a client. The tone was aggressive, and it felt like a personal attack. She felt an overwhelming wave of anger and wanted to reply immediately with an equally angry message.", "\"Whoa, Sarah, you look like you're about to explode,\" said her colleague, Ben, noticing her tense posture.", "\"I am,\" Sarah said, her voice shaking slightly. \"This client is completely unreasonable. I want to tell him exactly what I think.\"", "Ben pulled up a chair. \"I get it. But replying while you're angry is never a good idea. It's a classic trigger. Why don't you take a deep breath and step away from the keyboard for five minutes?\"", "Sarah hesitated, but she knew Ben was right. She stood up, walked to the break room, and poured herself a glass of water. She took three deep breaths, focusing only on the air filling her lungs. Slowly, she began to calm down.", "When she returned to her desk, the anger had faded, replaced by a clearer perspective. \"Okay, I'm ready,\" she said. \"But how do I cope with this without sounding weak?\"", "\"You don't have to be weak, just professional,\" Ben advised. \"Express your concerns factually. Acknowledge his frustration, but set a clear boundary. For example: 'I understand you are frustrated with the delay. However, I cannot accept this tone. Let's focus on solving the problem.'\"", "Sarah nodded and started typing. She kept her sentences short and polite. She didn't apologize for things that weren't her fault, but she offered a concrete solution to fix the issue. She read it twice, deleted one emotional adjective, and hit send.", "An hour later, the client replied. \"Thank you for the quick response. I apologize for my earlier tone. I was stressed about the deadline. Your solution works for me.\"", "Sarah let out a long sigh of relief. \"I can't believe it worked.\"", "\"Emotions are normal, Sarah,\" Ben smiled. \"But managing them is a skill. You didn't let your anger control you. You controlled the situation.\"", "Sarah realized that emotional intelligence wasn't about never feeling angry or stressed. It was about recognizing the trigger, pausing to calm down, and choosing a constructive way to express her feelings."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Sarah feel an overwhelming wave of anger?", "What advice did Ben give Sarah when she wanted to reply angrily?", "How did the client react to Sarah’s professional response?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Sarah received a rude email that acted as an emotional... (trigger).", "hints": ["She wanted to reply angrily, but Ben told her to step away and... (take a deep breath).", "After a few minutes, she began to... (calm down) and see the situation clearly.", "Ben advised her to... (express) her concerns factually and professionally.", "Sarah wrote a polite email, offered a solution, and avoided... (emotional) language.", "The client apologized for his tone and accepted her... (solution).", "Sarah learned that managing emotions is about pausing and choosing a... (constructive) response.", "_____________"], "vocab": [{"w": "overwhelming", "tr": "[ˌəʊvəˈwelmɪŋ]", "ru": "подавляющий, невыносимый"}, {"w": "to cope with", "tr": "[kəʊp wɪð]", "ru": "справляться с"}, {"w": "trigger", "tr": "[ˈtrɪɡə]", "ru": "триггер, причина эмоциональной реакции"}, {"w": "to take a deep breath", "tr": "[teɪk ə diːp breθ]", "ru": "сделать глубокий вдох"}, {"w": "to express", "tr": "[ɪkˈspres]", "ru": "выражать"}, {"w": "to calm down", "tr": "[kɑːm daʊn]", "ru": "успокаиваться"}]}, {"num": 68, "ru": "Привычки и самодисциплина", "en": "Habits and Self-Discipline", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~430 слов.", "story": ["\"I give up,\" Mark groaned, throwing his running shoes into the corner of his room. \"I’ve tried to wake up at 6 AM to exercise for a week, and I failed every single day. I just don’t have enough willpower.\"", "His sister, Lisa, laughed gently. \"Mark, willpower is overrated. You can’t build a new habit just by forcing yourself. You need a better system.\"", "\"What do you mean?\" Mark asked, sitting on the bed.", "\"Right now, your goal is too big,\" Lisa explained. \"Waking up at 6 AM and running for an hour is a huge change. Your brain resists it. Instead, try the 'two-minute rule'. Make the habit so small that it’s impossible to say no.\"", "\"Like what?\"", "\"Just put on your running shoes and step outside. That’s it. You don’t even have to run. Just do it for two minutes. Once you’re outside, you might decide to run, but the goal is just to step out.\"", "Mark was skeptical but decided to try. The next morning, his alarm went off at 6 AM. He felt the familiar urge to hit snooze. But he remembered the rule. He sat up, put on his shoes, and walked to the front door.", "\"Okay, I did it,\" he muttered. But since he was already outside in the cool morning air, he decided to jog for just five minutes.", "He did this for a week. Sometimes he ran for five minutes, sometimes for twenty. The key was that he was consistent. He didn't focus on the distance; he focused on sticking to the routine.", "A month later, Lisa found him tying his shoes at 5:50 AM. \"Look at you! You didn't even need the alarm.\"", "\"It’s weird,\" Mark smiled. \"It doesn’t feel like a chore anymore. It’s just what I do in the morning. I think I finally broke my habit of hitting the snooze button.\"", "\"That’s the magic of consistency,\" Lisa said. \"You didn’t rely on willpower. You built a system that made the right choice the easy choice.\"", "Mark realized that self-discipline wasn’t about punishing yourself or having superhuman strength. It was about starting small, being consistent, and letting the routine do the heavy lifting."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Mark want to give up on his morning exercise?", "What is the \"two-minute rule\" that Lisa suggested?", "How did Mark’s morning routine change after a month?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Mark tried to wake up at 6 AM to run but failed due to a lack of... (willpower).", "hints": ["Lisa told him that willpower is overrated and he needed a better... (system).", "She suggested the... (two-minute rule): just put on shoes and step outside.", "Mark tried it and found that once he was outside, he wanted to... (jog / run).", "He focused on being... (consistent) rather than running long distances.", "After a month, he was waking up before his... (alarm) went off.", "He realized that self-discipline is about starting small and building a... (routine).", "_____________"], "vocab": [{"w": "habit", "tr": "[ˈhæbɪt]", "ru": "привычка"}, {"w": "willpower", "tr": "[ˈwɪlpaʊə]", "ru": "сила воли"}, {"w": "consistent", "tr": "[kənˈsɪstənt]", "ru": "последовательный, постоянный"}, {"w": "to stick to", "tr": "[stɪk tuː]", "ru": "придерживаться"}, {"w": "routine", "tr": "[ruːˈtiːn]", "ru": "распорядок, рутина"}, {"w": "to break a habit", "tr": "[breɪk ə ˈhæbɪt]", "ru": "избавиться от привычки"}]}, {"num": 69, "ru": "Креативность и генерация идей", "en": "Creativity and Idea Generation", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~440 слов.", "story": ["The marketing team sat around the conference table in complete silence. They had a creative block. The deadline for the new eco-friendly product campaign was in two days, and they had zero good ideas.", "\"Okay, let’s try brainstorming again,\" said Chloe, the team leader. \"No bad ideas. Just shout out whatever comes to mind.\"", "\"Green trees?\" suggested Tom.", "\"Recycling bins?\" added Sarah.", "Chloe sighed. \"Guys, these are clichés. We need something out of the box. Something that will make people stop and think.\"", "The room went silent again. The pressure was suffocating.", "\"You know what?\" Chloe said, standing up. \"Staring at this whiteboard isn’t working. Let’s change our perspective. Everyone, grab a notebook and a pen. We are going for a 15-minute walk in the park. No talking about work. Just observe.\"", "The team looked at each other, confused, but they followed her outside. The fresh air felt amazing. They walked past a playground, a busy cafe, and a street musician.", "When they returned to the office, Chloe asked, \"What did you notice?\"", "\"I noticed how kids share toys without being asked,\" Tom said.", "\"I saw a barista remember a regular customer’s name and make them smile,\" Sarah added.", "\"And I saw the street musician using recycled bottles as drums,\" Mark chimed in.", "Chloe’s eyes lit up. \"Yes! That’s it! 'Sharing', 'Community', 'Upcycling'. Let’s jot down these concepts. Our campaign shouldn’t just be about the product. It should be about the small, everyday actions that build a sustainable community.\"", "The energy in the room shifted instantly. Ideas started flowing. They decided to create a video campaign showing real people doing small, creative eco-friendly acts, set to the rhythm of recycled instruments.", "\"See?\" Chloe smiled, looking at the filled whiteboard. \"Creativity doesn’t come from forcing it. It comes from stepping away, changing your environment, and looking at the world from a new perspective.\"", "Two days later, the client loved the campaign. It was fresh, authentic, and completely different from anything they had seen before. The team learned that a creative block isn’t a dead end; it’s just a sign that you need to change your approach."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why was the marketing team frustrated at the beginning of the story?", "What did Chloe suggest the team do to overcome the creative block?", "What was the final idea for the eco-friendly campaign?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, the team had a... (creative block) and couldn't think of good ideas for the campaign.", "hints": ["Chloe stopped the boring... (brainstorming) and took the team for a walk in the park.", "She wanted them to change their... (perspective) and observe the world.", "They noticed small acts of kindness and... (recycling / upcycling).", "They decided to... (jot down) these concepts and focus on community actions.", "The new idea was completely... (out of the box) and authentic.", "The client loved the campaign, and the team learned that creativity needs a change of... (environment / approach).", "_____________"], "vocab": [{"w": "brainstorming", "tr": "[ˈbreɪnstɔːmɪŋ]", "ru": "мозговой штурм"}, {"w": "out of the box", "tr": "[aʊt əv ðə bɒks]", "ru": "нестандартно, творчески"}, {"w": "inspiration", "tr": "[ˌɪnspəˈreɪʃn]", "ru": "вдохновение"}, {"w": "to jot down", "tr": "[dʒɒt daʊn]", "ru": "быстро записывать"}, {"w": "creative block", "tr": "[kriˈeɪtɪv blɒk]", "ru": "творческий кризис, ступор"}, {"w": "perspective", "tr": "[pəˈspektɪv]", "ru": "точка зрения, перспектива"}]}, {"num": 70, "ru": "Изменения и адаптация к новому", "en": "Changes and Adapting to the New", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~430 слов.", "story": ["\"Have you seen the new software update?\" Mark asked, shaking his head in disbelief. \"They changed the entire interface. It’s going to take weeks to learn this.\"", "His colleague, Anna, nodded. \"I know. Everyone in the office is complaining. There is so much resistance to this transition.\"", "\"Why do they always change things that already work?\" Mark grumbled. \"I liked the old version. This new one is confusing.\"", "Anna smiled gently. \"Change is always uncomfortable at first. It brings uncertainty. But we have two choices: we can complain and fall behind, or we can be flexible and adapt.\"", "\"Easy for you to say,\" Mark replied. \"You learn new things quickly.\"", "\"It’s not about being fast,\" Anna explained. \"It’s about your mindset. Instead of seeing this as a problem, try to embrace it. Think about the benefits. The new software automates the reports we used to do manually. That will save us hours every week.\"", "Mark thought about this. \"I guess you’re right. The manual reports were a nightmare.\"", "\"Exactly,\" Anna said. \"Let’s tackle this together. I watched a 10-minute tutorial video this morning. I can show you the three most important shortcuts. It will make the transition much smoother.\"", "\"Okay, I’m in,\" Mark said, feeling a bit more optimistic.", "Anna pulled her chair next to his desk. For the next twenty minutes, she showed him how to navigate the new dashboard, where to find the automated reports, and how to customize his view.", "\"Wow, that’s actually much faster,\" Mark admitted, clicking through the menus. \"I didn’t realize it could do that.\"", "\"See?\" Anna smiled. \"Once you get past the initial shock, it’s a huge upgrade. And if you help others learn it, you’ll become the go-to person in the department.\"", "Over the next week, Mark stopped complaining. He practiced the new shortcuts, asked questions, and even helped two other colleagues who were struggling. By the end of the month, he was using the software more efficiently than ever before.", "He realized that resistance to change is a natural reaction, but fighting it only causes stress. By choosing to be flexible and embracing the transition, he turned a frustrating situation into an opportunity for growth."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why was Mark frustrated with the new software update?", "What two choices did Anna say they had regarding the change?", "How did Mark’s attitude change by the end of the month?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Mark complained about the new software, noting the high... (resistance) in the office.", "hints": ["Anna explained that change brings... (uncertainty), but we can choose to be... (flexible).", "She suggested he try to... (embrace) the change and focus on the benefits, like automated reports.", "Anna showed Mark a short tutorial to make the... (transition) smoother.", "Mark realized the new system was actually... (faster / more efficient).", "He started practicing and even helped his... (colleagues) learn the new software.", "He learned that adapting to change is an... (opportunity) for growth, not just a problem.", "_____________"], "vocab": [{"w": "to adapt", "tr": "[əˈdæpt]", "ru": "адаптироваться, приспосабливаться"}, {"w": "uncertainty", "tr": "[ʌnˈsɜːtnti]", "ru": "неопределенность"}, {"w": "resistance", "tr": "[rɪˈzɪstəns]", "ru": "сопротивление"}, {"w": "flexible", "tr": "[ˈfleksəbl]", "ru": "гибкий"}, {"w": "to embrace", "tr": "[ɪmˈbreɪs]", "ru": "принимать, охотно соглашаться"}, {"w": "transition", "tr": "[trænˈzɪʃn]", "ru": "переход, трансформация"}]}, {"num": 71, "ru": "Социальные сети и цифровая коммуникация", "en": "Social Media and Digital Communication", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~420 слов.", "story": ["Emma lay on her bed, her face illuminated by the blue light of her phone. She had been scrolling through Instagram for an hour. She saw pictures of her friends on exotic vacations, colleagues getting promotions, and influencers with perfect lives.", "A heavy feeling settled in her chest. \"Why is everyone else’s life so much better than mine?\" she whispered to herself. The constant comparison was making her feel anxious and inadequate.", "Her roommate, Chloe, walked into the room and saw Emma’s sad expression. \"Still scrolling? You’ve been on that app for hours.\"", "\"I know,\" Emma sighed, putting the phone down. \"But I can’t stop. And it makes me feel terrible. I feel like I’m falling behind.\"", "Chloe sat on the edge of the bed. \"That’s the trap of social media, Em. People only post their highlight reels, not their real, messy lives. You are comparing your behind-the-scenes to everyone else’s stage.\"", "\"But it’s so addictive,\" Emma admitted. \"My screen time report said I spend four hours a day on my phone. It’s crazy.\"", "\"Let’s try an experiment,\" Chloe suggested. \"This weekend, let’s do a digital detox. We will disconnect from social media for 48 hours. No scrolling, no checking notifications. Just real life.\"", "\"Two days? That sounds terrifying,\" Emma laughed nervously.", "\"Just try it,\" Chloe smiled. \"We can go hiking, cook a big dinner, or just read books. I promise, the world won’t end.\"", "Emma agreed. On Saturday morning, she turned off her phone notifications and put the device in a drawer. At first, she felt a strong urge to check it. Her hand twitched toward the drawer several times. But then, she picked up a novel she had been meaning to read for months.", "By Sunday afternoon, Emma felt a strange sense of calm. She and Chloe went for a long walk in the park, had deep conversations, and baked cookies. There was no pressure to take the perfect photo or get likes. It felt authentic and refreshing.", "On Monday morning, Emma checked her phone. She had missed a few memes and a couple of group chat messages, but nothing important.", "\"You look different,\" Chloe noted. \"More relaxed.\"", "\"I feel different,\" Emma smiled. \"I realized that my digital footprint doesn’t define my worth. Real connection happens offline.\"", "Emma decided to keep her screen time limited to one hour a day. She learned that disconnecting from the digital world was the best way to reconnect with herself and the people around her."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Emma feel anxious after using Instagram?", "What experiment did Chloe suggest to Emma?", "How did Emma feel after the weekend without social media?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Emma spent hours... (scrolling) through social media and felt bad due to constant... (comparison).", "hints": ["Chloe explained that people only show their highlight reels, not... (real) life.", "Emma’s... (screen time) was four hours a day, which she wanted to reduce.", "Chloe suggested a 48-hour... (digital detox) to disconnect from the internet.", "At first, Emma wanted to check her phone, but she started... (reading) and going for walks instead.", "The weekend felt... (authentic) and refreshing without the pressure of social media.", "Emma realized that her... (digital footprint) doesn’t define her worth, and real connection happens... (offline).", "_____________"], "vocab": [{"w": "digital footprint", "tr": "[ˈdɪdʒɪtl ˈfʊtprɪnt]", "ru": "цифровой след"}, {"w": "to scroll", "tr": "[skrəʊl]", "ru": "пролистывать (ленту)"}, {"w": "comparison", "tr": "[kəmˈpærɪsn]", "ru": "сравнение"}, {"w": "authentic", "tr": "[ɔːˈθentɪk]", "ru": "подлинный, настоящий"}, {"w": "to disconnect", "tr": "[ˌdɪskəˈnekt]", "ru": "отключаться (от интернета)"}, {"w": "screen time", "tr": "[skriːn taɪm]", "ru": "время, проведенное у экрана"}]}, {"num": 72, "ru": "Личные границы и умение говорить «нет»", "en": "Personal Boundaries and the Ability to Say \"No\"", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами. Объем: ~430 слов.", "story": ["\"Hey, Alex, can you take on the Johnson project? I know you’re busy, but you’re the only one who can handle it,\" said David, the department manager, dropping a thick folder on Alex’s desk.", "Alex’s stomach tightened. He was already working late every day to finish his current tasks. But the word \"no\" stuck in his throat. He always feared disappointing people.", "\"Uh, sure, David. I’ll figure it out,\" Alex said, forcing a smile.", "David nodded and walked away. Alex immediately felt a wave of guilt and exhaustion. He knew that taking on another project would lead to burnout, but he didn’t know how to set a boundary.", "Later that day, Alex talked to his mentor, Sarah. \"I just agreed to do the Johnson project, but I’m drowning in work. I can’t say no to my boss.\"", "Sarah listened carefully. \"Alex, saying yes to everything is not a sign of dedication. It’s a sign of poor boundaries. If you burn out, you can’t help anyone. You need to learn to be assertive.\"", "\"But how do I say no without sounding rude or lazy?\" Alex asked.", "\"It’s not about saying a flat 'no',\" Sarah explained. \"It’s about prioritizing. You can say: 'David, I would love to help with the Johnson project. However, I am currently fully committed to the Smith project, which is due on Friday. If I take on Johnson, the quality of both will suffer. Can we discuss which one should be my top priority?'\"", "Alex’s eyes widened. \"That sounds so professional. It’s not a refusal; it’s a negotiation.\"", "\"Exactly,\" Sarah smiled. \"You are showing respect for your own time and the quality
