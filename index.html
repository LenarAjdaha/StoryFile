<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Английский через чтение</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
<style>
:root{
  --bg:#efe6d2;--card:#f8f2e4;--text:#0b0907;--muted:#5c554a;--accent:#ae3013;--btn:#e85230;--btntext:#0b0907;
  --line:rgba(92,85,74,.22);--ok:#3f7a2e;--shadow:rgba(11,9,7,.15);color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0907;--card:#16120e;--text:#efe6d2;--muted:#a39b8b;--accent:#e85230;--btn:#e85230;--btntext:#0b0907;
  --line:rgba(239,230,210,.22);--ok:#8cb878;--shadow:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0907;--card:#16120e;--text:#efe6d2;--muted:#a39b8b;--accent:#e85230;--btn:#e85230;--btntext:#0b0907;
  --line:rgba(239,230,210,.22);--ok:#8cb878;--shadow:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);font-size:calc(16px*var(--k,1))}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:1.0625rem/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:720px;margin:0 auto;padding:12px 16px 40px}
.topline{display:flex;justify-content:space-between;align-items:center;margin:4px 0 10px;color:var(--muted);font-size:14px}
.nav{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:8px}
.nav button,.tools button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:13px 8px;background:var(--btn);color:var(--btntext);cursor:pointer;min-height:48px}
.nav button:disabled{opacity:.35;cursor:default}
button:focus-visible,.item:focus-visible,.ans:focus-visible{outline:3px solid var(--text);outline-offset:2px}
.tbar{display:flex;gap:8px}
.tb,.spk{font:inherit;font-weight:700;font-size:16px;min-width:46px;height:46px;padding:0 10px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);cursor:pointer}
.spk{min-width:40px;height:40px;border-radius:10px;font-size:18px;padding:0}
.spk.on{background:var(--btn);color:var(--btntext)}
.vocab .spk{margin-left:auto}.vocab .spk+.spk{margin-left:0}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.shead h2{margin:0}
.pop{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);max-width:640px;margin:0 auto;z-index:30;background:var(--card);color:var(--text);border:1px solid var(--btn);border-radius:14px;padding:14px 16px;box-shadow:0 10px 40px var(--shadow)}
.pop .src{color:var(--muted);font:italic 1rem/1.4 Georgia,serif;margin:0 0 6px;padding-right:142px}
.pop .ru2{font-size:1.2rem;font-weight:600;color:var(--text);margin:0;line-height:1.4}
.pop .acts{position:absolute;top:10px;right:10px;display:flex;gap:6px}
.pop .more{margin-top:10px;font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 14px;background:var(--btn);color:var(--btntext);cursor:pointer}
.selbtn{position:fixed;left:0;top:0;z-index:25;font:inherit;font-weight:700;border:0;border-radius:999px;padding:13px 22px;background:var(--btn);color:var(--btntext);box-shadow:0 6px 24px var(--shadow);cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 18px;margin:16px 0}
.kicker{color:var(--muted);font-size:14px;margin:0}
h1{font:700 1.75rem/1.2 Georgia,"Iowan Old Style",serif;color:var(--accent);margin:4px 0 4px}
.en{font:italic 1.1875rem/1.3 Georgia,serif;color:var(--text);margin:0 0 10px}
.lvl{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:14px;color:var(--muted)}
h2{font:700 1.25rem/1.3 Georgia,serif;color:var(--accent);margin:0 0 4px}
.note{color:var(--muted);font-size:15px;margin:0 0 14px}
.vocab{list-style:none;margin:0;padding:0}
.vocab li{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}
.vocab li:first-child{border-top:0}
.w{font-weight:700;color:var(--accent);font-size:1.125rem}
.tr{color:var(--muted);font-size:15px}
.ru{flex-basis:100%}
.story p{-webkit-touch-callout:none;font:1.1875rem/1.7 Georgia,"Iowan Old Style",serif;margin:0 0 1em}
.story p:last-child{margin-bottom:0}
.step{font-weight:700;margin:16px 0 6px}
.qs{margin:0;padding-left:22px}.qs li{margin:6px 0}
.hints{list-style:none;margin:0;padding:0}
.hints li{border-left:3px solid var(--btn);padding:4px 0 4px 12px;margin:8px 0}
.ans{color:var(--accent);font-weight:600;cursor:pointer;filter:blur(5px);transition:filter .15s;border-radius:4px}
.ans.on{filter:none}
.ex{background:none;border:0;padding:0;font:inherit}
.done{display:flex;justify-content:center;margin:18px 0 0}
.done button{font:inherit;font-weight:600;border:1px solid var(--ok);color:var(--ok);background:none;border-radius:10px;padding:12px 18px;cursor:pointer;min-height:48px}
.done button.on{background:var(--ok);color:var(--bg)}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:none;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.sheet.open{display:block}
.panel{position:absolute;inset:12px;max-width:640px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;box-shadow:0 10px 40px var(--shadow);overflow:hidden}
.panel header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel h3{margin:0;font:700 17px/1.3 Georgia,serif;color:var(--accent)}
.panel header span{color:var(--muted);font-size:14px;display:block;font-family:system-ui,sans-serif;font-weight:400}
.close{font:inherit;background:var(--btn);color:var(--btntext);border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
.list{overflow-y:auto;overscroll-behavior:contain;flex:1}
.item{display:flex;gap:10px;width:100%;text-align:left;font:inherit;font-size:16px;color:var(--text);background:none;border:0;border-bottom:1px solid var(--line);padding:12px 16px;cursor:pointer}
.item .n{color:var(--muted);min-width:2.2em;font-variant-numeric:tabular-nums}
.item .t{flex:1}
.item.cur{background:var(--bg)}
.item.cur .t{color:var(--accent);font-weight:700}
.item .ck{color:var(--ok);font-weight:700}
@media (prefers-reduced-motion:reduce){.ans{transition:none}}
:root{--hl:rgba(20,120,112,.2);--hlb:#14786f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hl:rgba(79,190,178,.26);--hlb:#4fbeb2}}
:root[data-theme="dark"]{--hl:rgba(79,190,178,.26);--hlb:#4fbeb2}
.hl{background:var(--hl);border-bottom:2px solid var(--hlb);border-radius:3px;padding:0 1px}
.fi{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.fi .b{flex:1;min-width:0}.fi .fw{font-weight:700;color:var(--accent);font-size:1.05rem}.fi .fr{margin-top:2px}
.fi .fc{color:var(--muted);font-size:.9rem;font-style:italic;margin-top:4px}
.empty{padding:24px 16px;color:var(--muted);margin:0}
</style>
</head>
<body>
<div class="wrap">
  <div class="topline"><span id="prog"></span><div class="tbar"><button class="tb" id="fm" type="button" aria-label="Уменьшить шрифт">A−</button><button class="tb" id="fp" type="button" aria-label="Увеличить шрифт">A+</button><button class="tb" id="fav" type="button" aria-label="Мои слова">★</button><button class="tb" id="theme" type="button"></button></div></div>
  <nav class="nav" id="navTop" aria-label="Навигация сверху"></nav>
  <main id="main"></main>
  <nav class="nav" id="navBot" aria-label="Навигация снизу"></nav>
</div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Выбор темы">
  <div class="panel">
    <header><h3>📚 Список пройденных тем (№ 1–96)<span id="doneCount"></span></h3><button class="close" id="closeBtn" type="button">Закрыть</button></header>
    <div class="list" id="list"></div>
  </div>
</div>
<div class="sheet" id="favSheet" role="dialog" aria-modal="true" aria-label="Мои слова"><div class="panel"><header><h3>★ Мои слова<span id="favCount"></span></h3><button class="close" id="favClose" type="button">Закрыть</button></header><div class="list" id="favList"></div></div></div>

<button class="selbtn" id="selBtn" type="button" hidden>Перевести выделенное</button>
<script type="text/plain" id="data">[{"num": 1, "ru": "Человек и общество", "en": "People and Society", "level": "A2 (Elementary)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст написан простыми предложениями, в основном в Past Simple. Объем: ~400 слов.", "story": ["Anna lived in a small, quiet town. She liked her town, but she noticed one problem. Many elderly people lived alone. They didn't have family nearby, and they felt lonely. Anna believed that a good society is a society where people care for each other. She decided to do something.", "First, she talked to her friends. \"We must support our community,\" she said. Her friends agreed. Together, they created a small volunteer group. They called it \"Helping Hands\".", "Every Saturday morning, the group met in the town square. Their first task was to help Mr. Henderson, an 80-year-old man who lived on their street. He had difficulty walking, so he couldn't go to the supermarket. Anna and her friends went to the shop, bought food, and cooked a hot lunch for him. Mr. Henderson was very happy. He told them stories about his youth, and they listened carefully.", "Next, the group decided to clean the local park. The park was dirty, and nobody used it. The volunteers brought bags and gloves. They picked up trash, cut the grass, and painted the old benches. It was hard work, but they depended on each other and finished the job in one day.", "When the park was clean, the children started to play there again. Parents came to sit on the new benches and talk. The town became more alive and friendly.", "Soon, other people in the town wanted to join \"Helping Hands\". A local cafe owner gave them free coffee and sandwiches for their work. A teacher brought her students to help plant flowers. Anna saw that one small action could change everything.", "One evening, the town mayor came to thank the volunteers. \"You show us what a real community is,\" he said. \"A society is not just people living in the same place. A society is people who depend on each other and support each other.\"", "Anna smiled. She was tired, but she felt very proud and happy. She realized that everyone could make a difference in the world. You don't need a lot of money or power to help. You just need a kind heart and a little free time. From that day on, \"Helping Hands\" grew bigger and bigger. And Anna knew that her small town was now the best place to live."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Поскольку вы делаете это для себя, не пытайтесь пересказать всё сразу. Используйте этот \"скелет\", чтобы восстановить историю в памяти.", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What problem did Anna notice in her town?", "What did the volunteers do in the local park?", "What did the town mayor say about a society?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "Попробуй рассказать историю, используя эти фразы-подсказки:", "hints": ["First, Anna noticed that many elderly people... (lived alone / felt lonely).", "She decided to create a... (volunteer group / Helping Hands).", "They helped an old man named... (Mr. Henderson) and cooked... (a hot lunch).", "Then, they cleaned the local park, picked up... (trash) and painted... (benches).", "Soon, other people wanted to... (join the group).", "The mayor thanked them and said that a society is people who... (depend on each other / support each other).", "In the end, Anna realized that you don't need money to help, just a... (kind heart)."], "vocab": [{"w": "society", "tr": "[səˈsaɪəti]", "ru": "общество"}, {"w": "to depend on", "tr": "[dɪˈpend ɒn]", "ru": "зависеть от"}, {"w": "to support", "tr": "[səˈpɔːt]", "ru": "поддерживать"}, {"w": "volunteer", "tr": "[ˌvɒlənˈtɪə]", "ru": "волонтер"}, {"w": "community", "tr": "[kəˈmjuːnəti]", "ru": "сообщество, община"}, {"w": "to care for", "tr": "[keə fɔː]", "ru": "заботиться о"}]}, {"num": 2, "ru": "Право, преступления и наказания", "en": "Law, Crime, and Punishment", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст написан простыми предложениями, в основном в Past Simple. Объем: ~380 слов.", "story": ["Last summer, something strange happened on Green Street. Mr. Brown was a retired teacher who lived in a small, quiet house. He had a beautiful red bicycle. He loved riding it in the park every morning. He always locked it carefully in his garage. But one Tuesday morning, the garage door was open, and the bicycle was gone. Someone stole it.", "Mr. Brown was very upset and angry. He did not wait. He decided to report the crime to the police immediately. He called the local police station and explained the situation.", "Soon, Detective Smith arrived at the house. He was a calm and experienced officer. He asked Mr. Brown some important questions. \"When did you last see the bicycle?\" he asked. \"Yesterday evening at 6:00 PM,\" Mr. Brown answered nervously.", "Detective Smith walked around the garage and the garden. He looked for clues. Suddenly, he found something interesting: a small blue button on the ground near the door. Then, he talked to the neighbors. Mrs. Green, who lived next door, was a very helpful witness. She told the detective, \"I saw a young man near your garage at 10:00 PM last night. He wore a dark blue jacket and carried a heavy bag. He looked very nervous.\"", "The police started to look for the suspect. They checked local second-hand shops and parks. Two days later, a police officer was patrolling near the train station. He saw a young man riding a red bicycle. The bicycle looked exactly like Mr. Brown's.", "The officer stopped the man and asked to see his documents. Then, he checked the serial number on the bicycle frame. It was a perfect match! The police decided to arrest the young man and took him to the station. After some questions, the man confessed to the crime. He said he had no job and needed money, so he took the bicycle to sell it.", "A few weeks later, they went to court. The judge listened to all the facts carefully. He decided on a fair punishment. The young man had to return the bicycle to Mr. Brown and pay a fine. He also had to do community service for three months to learn how to be a responsible citizen.", "Mr. Brown got his beloved bicycle back. He was very happy and thanked Detective Smith and Mrs. Green for their help. He also learned a valuable lesson. The next day, he bought a much stronger lock and installed a security camera in his garage. Now, he feels completely safe again."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Поскольку вы делаете это для себя, не пытайтесь пересказать всё сразу. Используйте этот \"скелет\", чтобы восстановить историю в памяти.", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What did Mr. Brown report to the police?", "What clue did Detective Smith find near the garage?", "What was the young man's punishment?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "Попробуй рассказать историю, используя эти фразы-подсказки:", "hints": ["First, someone stole Mr. Brown's... (red bicycle).", "Mr. Brown decided to... (report the crime) to the police immediately.", "Detective Smith found a clue and talked to a helpful... (witness / Mrs. Green).", "The police looked for the... (suspect) and found him near the train station.", "The officer checked the serial number and decided to... (arrest the young man).", "The judge gave him a fair... (punishment / fine and community service).", "In the end, Mr. Brown bought a stronger lock and a... (security camera)."], "vocab": [{"w": "to steal (stole, stolen)", "tr": "[stiːl]", "ru": "красть"}, {"w": "witness", "tr": "[ˈwɪtnəs]", "ru": "свидетель"}, {"w": "to report", "tr": "[rɪˈpɔːt]", "ru": "сообщать (в полицию)"}, {"w": "suspect", "tr": "[ˈsʌspekt]", "ru": "подозреваемый"}, {"w": "to arrest", "tr": "[əˈrest]", "ru": "арестовывать"}, {"w": "punishment", "tr": "[ˈpʌnɪʃmənt]", "ru": "наказание"}]}, {"num": 3, "ru": "Политика и государство", "en": "Politics and State", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст написан простыми предложениями, в основном в Past Simple. Объем: ~380 слов.", "story": ["The city of Oakville had a big problem. The streets were dirty, the parks were closed, and the public transport was always late. The old government didn't care about these problems. The citizens were very unhappy. They decided it was time for a change.", "In November, the city held an election. The citizens wanted to elect a new mayor who would listen to them. They chose Sarah Jenkins. Sarah was a young, active, and honest woman. She loved her city and wanted to make it a better place to live. During the election campaign, Sarah visited every neighborhood. She promised to fix the broken streetlights and build a new community center.", "On her first day in office, Mayor Jenkins created a new policy. Her main goal was to improve the daily life of every citizen. First, she didn't just sit in her office. She walked around the city and talked to the people. She asked them what they needed most. The people asked for clean streets, safe parks, and better schools.", "Then, Sarah worked with the local government to change the city budget. They decided to spend more money on public services and less on unnecessary things. It was a difficult process, but Sarah was determined.", "In the first year, the changes were amazing. The city workers cleaned the streets and planted new trees. They opened three new parks with playgrounds for children. The public transport became faster and cleaner. Sarah also opened a free public library where people could read books and use the internet. She also organized weekly meetings where citizens could share their ideas directly with the government.", "Because of her hard work, the city became safer and more beautiful. Small businesses opened new shops, and tourists started to visit Oakville. The citizens of Oakville were very happy. They saw that their votes made a real difference. Mayor Jenkins proved that good politics is not about power or money. Good politics is about listening to people and solving their problems. At the next election, almost everyone voted for Sarah again."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Поскольку вы делаете это для себя, не пытайтесь пересказать всё сразу. Используйте этот \"скелет\", чтобы восстановить историю в памяти.", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why were the citizens of Oakville unhappy at the beginning of the story?", "What did Mayor Jenkins do on her first days in office?", "What did Sarah prove about good politics?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "Попробуй рассказать историю, используя эти фразы-подсказки:", "hints": ["First, the city of Oakville had many problems, so the citizens decided to... (elect a new mayor).", "They chose Sarah Jenkins because she was young, active, and... (honest / loved the city).", "Sarah created a new... (policy) to improve the daily life of every... (citizen).", "She walked around the city and... (talked to the people) to hear their ideas.", "The local government changed the... (budget) to spend more money on public services.", "They cleaned the streets, opened new... (parks) and a free... (library).", "In the end, Sarah proved that good politics is about... (listening to people / solving problems)."], "vocab": [{"w": "mayor", "tr": "[meə]", "ru": "мэр"}, {"w": "to elect", "tr": "[ɪˈlekt]", "ru": "выбирать, избирать"}, {"w": "government", "tr": "[ˈɡʌvənmənt]", "ru": "правительство, органы власти"}, {"w": "policy", "tr": "[ˈpɒləsi]", "ru": "политика, курс"}, {"w": "citizen", "tr": "[ˈsɪtɪzn]", "ru": "гражданин, житель"}, {"w": "to improve", "tr": "[ɪmˈpruːv]", "ru": "улучшать"}]}, {"num": 4, "ru": "Экономика и бизнес", "en": "Economy and Business", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст написан простыми предложениями, в основном в Past Simple. Объем: ~360 слов.", "story": ["Leo lived in a busy city. He loved baking bread and cakes. For a long time, he worked in a large office, but he was not happy. He wanted to start his own business. He knew that the local economy was growing, and people liked small, cozy places.", "Leo saved money for two years. It was a big risk, but he decided to invest his savings into a small bakery. Before opening, he read books about business and took a short course. He found a nice corner shop in the center of the city. He bought good ovens, fresh ingredients, and painted the walls in warm colors. He named his shop \"Leo's Daily Bread\".", "The first month was very difficult. Not many people knew about the new bakery. Leo was worried. He thought about closing the shop and going back to his office job. However, he did not give up. He decided to change his strategy. He started to give free small samples of his cakes to people walking by. He also talked to every customer and asked for their honest opinion.", "People loved the fresh bread and the friendly service. Soon, regular customers started to bring their friends and family. Word about the delicious chocolate cake and warm croissants spread quickly through the neighborhood. Leo worked long hours, waking up at 4:00 AM every day to bake fresh goods. He never compromised on quality.", "After six months, the bakery became very popular. The line of customers was often outside the door. Leo hired two assistants to help him with baking and serving. His business began to grow fast. At the end of the first year, Leo checked his finances carefully. He was very happy to see that he finally made a good profit.", "Leo learned an important lesson about business. Success does not come from luck. It comes from hard work, good quality, and caring about your customers. Today, \"Leo's Daily Bread\" is the most famous bakery in the city, and Leo is planning to open a second shop next year."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Поскольку вы делаете это для себя, не пытайтесь пересказать всё сразу. Используйте этот \"скелет\", чтобы восстановить историю в памяти.", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Leo decide to leave his office job?", "What did Leo do to attract people in the first difficult month?", "What was the result of his business at the end of the first year?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "Попробуй рассказать историю, используя эти фразы-подсказки:", "hints": ["First, Leo wanted to start his own business because he knew the local... (economy was growing).", "He saved money and decided to... (invest) in a small bakery, even though it was a... (risk).", "The first month was difficult, so he gave free... (samples) and talked to every... (customer).", "People loved the quality, and the business began to... (grow fast).", "Leo hired two... (assistants) to help him.", "At the end of the year, he was happy to make a good... (profit).", "He learned that success comes from hard work and caring about... (customers)."], "vocab": [{"w": "profit", "tr": "[ˈprɒfɪt]", "ru": "прибыль"}, {"w": "to invest", "tr": "[ɪnˈvest]", "ru": "инвестировать, вкладывать"}, {"w": "economy", "tr": "[ɪˈkɒnəmi]", "ru": "экономика"}, {"w": "customer", "tr": "[ˈkʌstəmə]", "ru": "покупатель, клиент"}, {"w": "to grow (grew, grown)", "tr": "[ɡrəʊ]", "ru": "расти, развиваться"}, {"w": "risk", "tr": "[rɪsk]", "ru": "риск"}]}, {"num": 5, "ru": "Работа и карьера", "en": "Work and Career", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст написан простыми предложениями, в основном в Past Simple. Объем: ~380 слов.", "story": ["Maria worked in a small bookstore for three years. She liked books and her colleagues, but she wanted a new career. She was very interested in marketing and wanted to work in a big company. One day, she saw an advertisement online. A large tech company was looking for a junior marketing assistant. Maria decided to apply for the job.", "She spent the whole weekend preparing her resume. She highlighted her communication skills and her love for learning new things. She sent her application on Monday morning. Two days later, she received an email. The company invited her to an interview.", "Maria was very nervous. She bought a new blue suit and practiced her answers in front of the mirror. On the day of the interview, she arrived at the office fifteen minutes early. The HR manager, Mr. Davis, was very friendly. He asked her about her previous work and her goals. Maria answered honestly and confidently. She explained that although she didn't have direct marketing experience, she was a fast learner and very motivated. Mr. Davis smiled and said they would call her soon.", "A week later, Maria got a phone call. \"Congratulations, Maria,\" Mr. Davis said. \"We decided to hire you. Your starting salary will be $3,000 a month.\" Maria was incredibly happy. She thanked him and accepted the offer immediately.", "Her first months at the new company were challenging. There was a lot of new information to learn, and the work was fast-paced. However, Maria worked hard. She stayed late to finish projects, asked questions, and helped her team members. She quickly learned how to manage social media accounts and organize online events.", "After one year, the company had its annual performance review. Maria's manager called her into his office. \"Maria, you did an excellent job this year,\" he said. \"We are very happy with your work. We want to give you a promotion. You are now a Marketing Specialist, and your salary will increase by twenty percent.\"", "Maria left the office with a big smile. She realized that her hard work and dedication had paid off. She was no longer just a bookstore employee; she was a successful professional with a bright career ahead of her."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Поскольку вы делаете это для себя, не пытайтесь пересказать всё сразу. Используйте этот \"скелет\", чтобы восстановить историю в памяти.", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Maria decide to apply for a new job?", "How did Maria prepare for her interview?", "What happened to Maria after one year at the new company?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "Попробуй рассказать историю, используя эти фразы-подсказки:", "hints": ["First, Maria worked in a bookstore but wanted a career in... (marketing).", "She saw an ad and decided to... (apply for the job).", "She prepared her resume and went to an... (interview).", "Although she didn't have much experience, the company decided to... (hire her).", "She worked hard, learned new skills, and helped her... (team).", "After one year, her manager gave her a... (promotion) and a higher... (salary).", "Maria realized that her hard work and... (dedication) had paid off."], "vocab": [{"w": "to apply for", "tr": "[əˈplaɪ fɔː]", "ru": "подавать заявление на (работу)"}, {"w": "interview", "tr": "[ˈɪntəvjuː]", "ru": "собеседование"}, {"w": "experience", "tr": "[ɪkˈspɪəriəns]", "ru": "опыт"}, {"w": "to hire", "tr": "[ˈhaɪə]", "ru": "нанимать"}, {"w": "salary", "tr": "[ˈsæləri]", "ru": "зарплата"}, {"w": "promotion", "tr": "[prəˈməʊʃn]", "ru": "повышение по службе"}]}, {"num": 6, "ru": "Деньги и финансы", "en": "Money and Finance", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст написан простыми предложениями, в основном в Past Simple. Объем: ~400 слов.", "story": ["David got his first serious job after university. He was very happy because his income was quite high. For the first time in his life, he had a lot of money. However, David didn't know how to manage his finances. He didn't have a budget.", "In the first month, David bought a lot of unnecessary things. He bought a new expensive smartphone, designer clothes, and went to fancy restaurants every weekend. He also bought a new car on credit. He thought, \"I earn a lot, so I can spend a lot.\" He didn't think about his future expenses.", "By the end of the third month, David looked at his bank account and felt shocked. His balance was almost zero. He had spent all his salary. Worse, he had to pay for the car and the credit card. He was in serious debt. He couldn't even afford to buy basic groceries.", "David felt very stressed and worried. He went to his older brother, Tom, for advice. Tom was a financial manager and knew a lot about money. Tom listened to David's problems and explained his mistakes. \"Your income is good,\" Tom said, \"but your expenses are too high. You need to create a budget.\"", "Tom helped David write down all his monthly expenses. They separated them into needs (rent, food, transport) and wants (restaurants, new clothes). Then, they made a strict budget. David had to sell his expensive car and buy a cheap used one. He stopped going to expensive restaurants and started cooking at home. His friends were surprised by his new habits, but David didn't care. He knew he was making the right choice.", "It was difficult for the first few months, but David followed his new financial plan. Slowly, he paid off his debt. After six months, he was completely free from loans. He also started to read books about personal finance. He understood that financial freedom takes time and patience. Then, he started to save money. He opened a special bank account and put ten percent of his income there every month.", "A year later, David had a good savings account. He learned a very important lesson. Money is not just for spending. Smart people manage their income, control their expenses, and always save for the future. Now, David feels calm and confident about his financial life."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Поскольку вы делаете это для себя, не пытайтесь пересказать всё сразу. Используйте этот \"скелет\", чтобы восстановить историю в памяти.", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did David feel shocked at the end of the third month?", "Who helped David to solve his financial problems?", "What did David do after he paid off his debt?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "Попробуй рассказать историю, используя эти фразы-подсказки:", "hints": ["First, David got a good job with a high... (income).", "He didn't have a... (budget) and bought many expensive... (things / clothes / car).", "Soon, he spent all his money and got into... (debt).", "He couldn't even... (afford) basic groceries.", "His brother Tom helped him to make a strict... (budget).", "David sold his expensive car and started to... (save money).", "In the end, he paid off his debt and learned to manage his... (expenses)."], "vocab": [{"w": "income", "tr": "[ˈɪnkʌm]", "ru": "доход, заработок"}, {"w": "expenses", "tr": "[ɪkˈspensɪz]", "ru": "расходы"}, {"w": "to save", "tr": "[seɪv]", "ru": "копить, откладывать"}, {"w": "budget", "tr": "[ˈbʌdʒɪt]", "ru": "бюджет"}, {"w": "to afford", "tr": "[əˈfɔːd]", "ru": "иметь достаточно денег, чтобы позволить себе"}, {"w": "debt", "tr": "[det]", "ru": "долг"}]}, {"num": 7, "ru": "Наука, технологии и исследования", "en": "Science, Technology and Research", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст написан простыми предложениями, в основном в Past Simple. Объем: ~400 слов.", "story": ["Dr. Emily Carter was a young scientist who worked in a small university laboratory. She was very interested in clean energy. She believed that new technology could help solve the problem of pollution in big cities. For three years, Emily did serious research on solar panels. She wanted to invent a new type of panel that could work even on cloudy days.", "Every morning, Emily came to the lab at 7:00 AM. She wore her white coat, put on her safety glasses, and started her experiments. She tested different materials and recorded all the results in her notebook. Most of her experiments failed. The panels did not produce enough energy. Her colleagues told her, \"Emily, this is impossible. You should change your research topic.\"", "But Emily did not give up. She read scientific articles, watched online lectures, and talked to other scientists. One evening, she had an idea. She decided to mix two new materials in a special way. She prepared the experiment very carefully. She turned on the machines, connected the wires, and waited.", "The next morning, Emily came to the lab and looked at the results. She could not believe her eyes. The new solar panel produced 40% more energy than the old ones, even when the sky was grey! She ran the experiment three more times to check the data. The results were always the same. Her invention worked perfectly.", "Emily wrote a scientific report and sent it to a big technology journal. A few months later, the journal published her research. Soon, a large energy company contacted her. They wanted to buy her technology and produce the new solar panels for cities all over the world.", "Dr. Carter became famous in the scientific community. She received a big award for her invention. But she was most happy when she saw the first city that used her technology. The air became cleaner, and people felt much better. Emily proved that one scientist with patience and a good idea could change the world. She continued her research and started to train young scientists in her laboratory."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Поскольку вы делаете это для себя, не пытайтесь пересказать всё сразу. Используйте этот \"скелет\", чтобы восстановить историю в памяти.", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What did Dr. Emily Carter want to invent?", "Why did her colleagues tell her to change her research topic?", "What did the energy company want to do after they read her report?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "Попробуй рассказать историю, используя эти фразы-подсказки:", "hints": ["First, Dr. Emily Carter was a... (scientist) who worked in a university lab.", "She did serious... (research) on solar panels to help solve... (pollution).", "Most of her... (experiments) failed, but she did not give up.", "She mixed two new materials and the new panel produced... (40% more energy).", "She wrote a scientific... (report) and a journal published her... (research).", "A large energy company wanted to... (produce her panels) for cities.", "In the end, Emily proved that one scientist could... (change the world).", "_____________"], "vocab": [{"w": "scientist", "tr": "[ˈsaɪəntɪst]", "ru": "учёный"}, {"w": "research", "tr": "[rɪˈsɜːtʃ]", "ru": "исследование"}, {"w": "to invent", "tr": "[ɪnˈvent]", "ru": "изобретать"}, {"w": "experiment", "tr": "[ɪkˈsperɪmənt]", "ru": "эксперимент"}, {"w": "to solve", "tr": "[sɒlv]", "ru": "решать (проблему)"}, {"w": "technology", "tr": "[tekˈnɒlədʒi]", "ru": "технология"}]}, {"num": 8, "ru": "Медицина и здоровье", "en": "Medicine and Health", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст написан простыми предложениями, в основном в Past Simple. Объем: ~400 слов.", "story": ["Dr. Robert Hayes was a kind and experienced doctor who worked in a small city hospital. He loved his job because he could help people every day. One cold morning, a new patient came to his office. His name was Michael, and he looked very tired and pale.", "\"Good morning, doctor,\" Michael said weakly. \"I feel very bad. I have a terrible headache, I feel cold all the time, and I can't sleep at night.\"", "Dr. Hayes listened carefully to all the symptoms. Then, he decided to examine the patient. He checked Michael's temperature, listened to his heart and lungs, and looked at his eyes. After the examination, the doctor asked Michael some questions about his lifestyle. \"Do you eat well? Do you exercise? How many hours do you work every day?\"", "Michael answered honestly. \"I work in IT. I sit at my computer for 12 hours a day. I eat fast food, drink a lot of coffee, and I almost never go outside or do sports.\"", "Dr. Hayes understood the problem immediately. \"Michael, your body is very tired,\" he explained. \"You don't have a serious disease, but your lifestyle is dangerous. Your symptoms are a signal from your body. You need a new treatment, but not medicine. You need to change your daily habits.\"", "The doctor wrote a special plan for his patient. Michael had to sleep at least 8 hours every night. He had to eat more vegetables and fruit, drink water instead of coffee, and walk in the fresh air for 30 minutes every day. Dr. Hayes also told him to take a short vacation and rest.", "Michael was surprised, but he trusted his doctor. He followed the treatment plan carefully. The first week was difficult because he wanted to drink coffee and work late. But he continued. He started to cook healthy food at home and went to the park every evening.", "After one month, Michael came back to the hospital for a check-up. He looked completely different. His face was fresh, his eyes were bright, and he smiled a lot. \"Doctor, I feel great!\" he said. \"My headache is gone, and I have a lot of energy.\"", "Dr. Hayes was very happy. He recovered many patients with medicine, but this case was special. He reminded Michael, \"Health is the most important thing in life. Take care of your body, and it will thank you.\" Michael nodded and promised to keep his new healthy habits forever."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Поскольку вы делаете это для себя, не пытайтесь пересказать всё сразу. Используйте этот \"скелет\", чтобы восстановить историю в памяти.", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What symptoms did Michael have when he came to the doctor?", "What was the main cause of Michael's health problems?", "What did Dr. Hayes tell Michael to do instead of taking medicine?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "Попробуй рассказать историю, используя эти фразы-подсказки:", "hints": ["First, a new... (patient) named Michael came to Dr. Hayes.", "He had bad... (symptoms): headache, felt cold, and couldn't sleep.", "The doctor decided to... (examine) him and asked about his lifestyle.", "Michael worked 12 hours a day, ate... (fast food) and didn't exercise.", "Dr. Hayes said he needed a new... (treatment) — to change his habits.", "Michael had to sleep 8 hours, eat... (vegetables and fruit) and walk every day.", "After one month, Michael... (recovered) completely and felt great."], "vocab": [{"w": "doctor", "tr": "[ˈdɒktə]", "ru": "врач"}, {"w": "patient", "tr": "[ˈpeɪʃnt]", "ru": "пациент"}, {"w": "symptom", "tr": "[ˈsɪmptəm]", "ru": "симптом"}, {"w": "to examine", "tr": "[ɪɡˈzæmɪn]", "ru": "осматривать"}, {"w": "treatment", "tr": "[ˈtriːtmənt]", "ru": "лечение"}, {"w": "to recover", "tr": "[rɪˈkʌvə]", "ru": "выздоравливать"}]}, {"num": 9, "ru": "Образование и знания", "en": "Education and Knowledge", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст написан простыми предложениями, в основном в Past Simple. Объем: ~400 слов.", "story": ["John worked as a builder for fifteen years. He was good at his job, but he always dreamed of something more. When he was a teenager, his family didn't have enough money for university. John had to start working early to help his parents. However, he never stopped reading books and learning new things. He believed that knowledge could change his life.", "When John was thirty-five, he made an important decision. He wanted to study architecture at the local university. His friends laughed at him. \"You are too old,\" they said. \"You have a family and a job. It is impossible.\" But John's wife, Lisa, supported him. \"Follow your dream,\" she told him.", "John applied to the university and passed the exams. He started his studies in September. It was very difficult. He was much older than the other students. He worked during the day and studied at night. He often fell asleep over his books. Some professors thought he could not finish the program.", "But John was determined. He asked questions, read extra books, and practiced drawing plans every evening. His favorite professor, Mr. Thompson, noticed his hard work. \"John, you have a real talent,\" the professor told him. \"Keep going.\"", "For four years, John balanced his job, his family, and his studies. He missed parties and weekends with friends. Sometimes he felt tired and wanted to give up. But he remembered why he started. He wanted to achieve his dream and become an architect.", "Finally, the graduation day came. John wore a black gown and a cap with a golden tassel. When the dean announced his name, the whole hall clapped. His wife and children were in the front row. They cried with happiness. John walked across the stage and received his degree.", "After graduation, a big architecture firm offered John a job. They were impressed by his portfolio and his life experience. John started his new career as a junior architect. He designed small houses, then bigger buildings. His projects were beautiful and practical.", "Today, John is a successful architect. He often gives lectures at the university where he studied. He tells young students, \"It is never too late to learn. Knowledge is the key to any door. If you work hard and believe in yourself, you can achieve anything.\""], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Поскольку вы делаете это для себя, не пытайтесь пересказать всё сразу. Используйте этот \"скелет\", чтобы восстановить историю в памяти.", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why didn't John go to university when he was a teenager?", "What did John's friends say when he decided to study at 35?", "What did John do after he graduated?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "Попробуй рассказать историю, используя эти фразы-подсказки:", "hints": ["First, John worked as a... (builder) for 15 years but dreamed of more.", "His family didn't have money, so he couldn't get... (knowledge / a degree) when he was young.", "At 35, he decided to... (study architecture) at the university.", "His friends laughed, but his wife... (supported him).", "It was difficult — he worked during the day and... (studied at night).", "His favorite... (professor) told him he had talent.", "After four years, John... (graduated) and received his... (degree).", "A big firm offered him a job as an... (architect).", "He learned that knowledge is the... (key to any door).", "_____________"], "vocab": [{"w": "knowledge", "tr": "[ˈnɒlɪdʒ]", "ru": "знания"}, {"w": "to study", "tr": "[ˈstʌdi]", "ru": "учиться, изучать"}, {"w": "degree", "tr": "[dɪˈɡriː]", "ru": "степень (университетская)"}, {"w": "professor", "tr": "[prəˈfesə]", "ru": "профессор"}, {"w": "to graduate", "tr": "[ˈɡrædʒueɪt]", "ru": "заканчивать (университет)"}, {"w": "to achieve", "tr": "[əˈtʃiːv]", "ru": "достигать"}]}, {"num": 10, "ru": "СМИ, коммуникации и культура", "en": "Media, Communications and Culture", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст написан простыми предложениями, в основном в Past Simple. Объем: ~400 слов.", "story": ["Emma was a young journalist who worked for a small local newspaper. She loved her job because she could tell important stories to the people in her city. Every day, she went to different places, met interesting people, and wrote articles about their lives.", "One Tuesday morning, Emma's editor called her into his office. \"We need a big story for next week's paper,\" he said. \"Something that will interest our readers. Find something special.\"", "Emma thought for a moment. Then she remembered a story she heard at a cafe. An old painter named Mr. Wilson lived alone in a small house at the edge of the city. Nobody knew about his art. He painted beautiful pictures of the city, but he never showed them to anyone.", "Emma decided to visit Mr. Wilson. She knocked on his door, and a thin, quiet old man opened it. \"Hello, Mr. Wilson. I am a journalist. May I talk to you?\" she asked politely. The old man was shy, but he invited her inside.", "The house was full of paintings. They were everywhere — on the walls, on the floor, even on the ceiling. The colors were bright and alive. Emma was amazed. \"These are wonderful!\" she said. \"Why don't people see them?\"", "Mr. Wilson smiled sadly. \"I am just an old man. Nobody wants to look at my pictures.\"", "Emma knew she found her story. She spent three hours talking to Mr. Wilson. She asked him about his life, his inspiration, and his dreams. She took many photos of his paintings. Then she went back to the office and wrote a long, emotional article. She titled it \"The Hidden Treasure of Our City\".", "The newspaper published the article on Friday. The audience loved it. Hundreds of people called the office. They wanted to see Mr. Wilson's paintings. On Saturday, a small crowd gathered outside his house. Mr. Wilson was very surprised. He opened his door and invited everyone inside.", "People bought his paintings. A local gallery offered to organize an exhibition. A TV channel made a report about the old artist. Mr. Wilson became famous in the city. He was no longer lonely.", "Emma was very happy. She understood the power of media. A good journalist doesn't just write news. A journalist connects people, shares culture, and can change someone's life with one article. From that day, Emma worked with even more passion. She knew that every story mattered."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Поскольку вы делаете это для себя, не пытайтесь пересказать всё сразу. Используйте этот \"скелет\", чтобы восстановить историю в памяти.", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What did Emma's editor ask her to find?", "Why did Mr. Wilson hide his paintings?", "What happened after the newspaper published the article?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "Попробуй рассказать историю, используя эти фразы-подсказки:", "hints": ["First, Emma was a young... (journalist) who worked for a local newspaper.", "Her editor asked her to find a big... (story) for next week's paper.", "She heard about an old painter named... (Mr. Wilson).", "She visited him and saw many beautiful... (paintings).", "Mr. Wilson was shy and thought nobody wanted to see his... (art).", "Emma wrote an emotional... (article) titled \"The Hidden Treasure\".", "The newspaper decided to... (publish) it, and the... (audience) loved it.", "People came to see the paintings, and a gallery organized an... (exhibition).", "Emma understood that a journalist can... (change someone's life) with one story."], "vocab": [{"w": "journalist", "tr": "[ˈdʒɜːnəlɪst]", "ru": "журналист"}, {"w": "to report", "tr": "[rɪˈpɔːt]", "ru": "сообщать, делать репортаж"}, {"w": "interview", "tr": "[ˈɪntəvjuː]", "ru": "интервью"}, {"w": "article", "tr": "[ˈɑːtɪkl]", "ru": "статья"}, {"w": "to publish", "tr": "[ˈpʌblɪʃ]", "ru": "публиковать"}, {"w": "audience", "tr": "[ˈɔːdiəns]", "ru": "аудитория, читатели"}]}, {"num": 11, "ru": "Искусство, литература и творчество", "en": "Art, Literature and Creativity", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст написан простыми предложениями, в основном в Past Simple. Объем: ~400 слов.", "story": ["Sophie was a young artist who lived in a small apartment in the center of Paris. She loved to create paintings. Every day, she sat by her window and looked at the city. She imagined the stories of the people walking on the streets. Then, she painted these stories on her canvas.", "However, Sophie had a problem. She could not sell her paintings. Her small room was full of colorful pictures, but nobody wanted to buy them. Her friends told her, \"Sophie, your paintings are beautiful, but they are too strange. People like simple and traditional art.\"", "Sophie was sad, but she did not want to change her style. She believed in her creativity. \"Art is about imagination,\" she said. \"I paint what I feel, not what people want to see.\"", "One rainy afternoon, Sophie walked in the park. She saw an old man sitting on a bench. He was feeding the pigeons and singing a quiet song. Sophie felt a strong inspiration. She ran home, took her brushes, and started to paint. She painted for three days without stopping. She mixed bright colors — blue, yellow, red — and created a very unusual picture. She called it \"The Song of the Rain\".", "A week later, a small gallery in the city announced a new exhibition for young artists. Sophie decided to take her new painting there. The gallery owner, Mr. Laurent, looked at her picture for a long time. He was silent. Sophie was nervous.", "Finally, Mr. Laurent smiled. \"This is a masterpiece,\" he said. \"I have never seen anything like it. The colors, the emotions — it is wonderful. I want to put this painting in the center of the exhibition.\"", "On the opening night, many people came to the gallery. They stood in front of Sophie's painting and talked about it. Some people loved it, some people did not understand it, but nobody was indifferent. A rich collector bought \"The Song of the Rain\" for a big sum of money.", "Sophie was very happy. She understood that true creativity is not about pleasing everyone. It is about being honest with yourself and your imagination. She continued to paint her unusual pictures, and slowly, more and more people started to appreciate her unique style. Today, Sophie's paintings hang in galleries all over Europe."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Поскольку вы делаете это для себя, не пытайтесь пересказать всё сразу. Используйте этот \"скелет\", чтобы восстановить историю в памяти.", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why could not Sophie sell her paintings at first?", "What did Sophie see in the park that gave her inspiration?", "What did Mr. Laurent say when he saw her new painting?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "Попробуй рассказать историю, используя эти фразы-подсказки:", "hints": ["First, Sophie was a young... (artist) who lived in Paris.", "She loved to... (create) paintings, but nobody wanted to buy them.", "Her friends told her to change her style, but she believed in her... (creativity).", "One rainy day, she saw an old man and felt strong... (inspiration).", "She painted a very unusual picture called... (\"The Song of the Rain\").", "She took it to a small... (exhibition) at a local gallery.", "Mr. Laurent called it a... (masterpiece) and put it in the center.", "A rich collector bought the painting, and Sophie understood that true art is about being... (honest with yourself).", "_____________"], "vocab": [{"w": "artist", "tr": "[ˈɑːtɪst]", "ru": "художник, артист"}, {"w": "to create", "tr": "[kriˈeɪt]", "ru": "создавать, творить"}, {"w": "masterpiece", "tr": "[ˈmɑːstəpiːs]", "ru": "шедевр"}, {"w": "inspiration", "tr": "[ˌɪnspəˈreɪʃn]", "ru": "вдохновение"}, {"w": "to imagine", "tr": "[ɪˈmædʒɪn]", "ru": "воображать, представлять"}, {"w": "exhibition", "tr": "[ˌeksɪˈbɪʃn]", "ru": "выставка"}]}, {"num": 12, "ru": "Повседневная жизнь и быт", "en": "Everyday Life and Home", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст написан простыми предложениями, в основном в Past Simple. Объем: ~400 слов.", "story": ["Anna lived alone in a small but comfortable apartment on the fifth floor. She worked as a teacher, so her daily routine was very organized. Every morning, she woke up at 6:30 AM, made coffee, and watered her plants. She liked her quiet life, but sometimes she felt lonely.", "One Saturday morning, Anna decided to tidy up her apartment. She cleaned the kitchen, washed the windows, and organized her books. Then, she went to the balcony to water her flowers. Suddenly, she heard a strange noise from the next balcony. She looked and saw her neighbor, Mr. Peterson, trying to fix a broken shelf. He was an old man who lived alone, and he looked very tired.", "\"Good morning, Mr. Peterson!\" Anna called. \"Do you need any help?\"", "The old man smiled. \"Hello, Anna. Yes, I need a hammer and some nails. But I don't have them.\"", "Anna thought for a moment. \"I think my brother left his tools in my apartment last month. I can borrow them to you.\"", "She went inside, found the toolbox, and gave it to Mr. Peterson. He was very grateful. \"Thank you, dear. You are very kind.\"", "After that day, Anna and Mr. Peterson became good friends. They often helped each other. When Anna had a lot of heavy grocery bags, Mr. Peterson carried them up to the fifth floor. When Mr. Peterson needed to cook something special, Anna brought him fresh vegetables from the market.", "One evening, Anna came home from work and felt very tired. She opened her door and saw a small box on her table. There was a note: \"For my dear neighbor. Homemade apple pie. Thank you for your help. — Mr. Peterson.\"", "Anna tasted the pie. It was delicious and warm. She felt very happy. She realized that everyday life is not just about work and chores. It is also about the people who live near you. A small act of kindness can make your home much more comfortable and warm.", "From that day, Anna's routine changed a little. She started to smile more at people in the elevator. She said hello to the doorman. She understood that a good life is built from small, simple moments and friendly neighbors."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Поскольку вы делаете это для себя, не пытайтесь пересказать всё сразу. Используйте этот \"скелет\", чтобы восстановить историю в памяти.", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What was Anna's daily routine like?", "What did Mr. Peterson need when Anna saw him on the balcony?", "What did Anna find on her table when she came home one evening?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "Попробуй рассказать историю, используя эти фразы-подсказки:", "hints": ["First, Anna lived alone and had a very organized... (routine).", "One Saturday, she decided to... (tidy up) her apartment.", "She saw her... (neighbor), Mr. Peterson, trying to fix a shelf.", "He needed tools, so Anna decided to... (borrow) some from her brother's toolbox.", "After that, they started to help each other with different... (chores).", "One evening, Anna found a box with homemade... (apple pie) on her table.", "She realized that everyday life is not just about work, but also about... (people / neighbors).", "Her home became much more... (comfortable) and warm.", "_____________"], "vocab": [{"w": "routine", "tr": "[ruːˈtiːn]", "ru": "распорядок, рутина"}, {"w": "to tidy up", "tr": "[ˈtaɪdi ʌp]", "ru": "наводить порядок"}, {"w": "chore", "tr": "[tʃɔː]", "ru": "домашняя обязанность, работа по дому"}, {"w": "neighbor", "tr": "[ˈneɪbə]", "ru": "сосед"}, {"w": "to borrow", "tr": "[ˈbɒrəʊ]", "ru": "одалживать, брать взаймы"}, {"w": "comfortable", "tr": "[ˈkʌmftəbl]", "ru": "удобный, комфортный"}]}, {"num": 13, "ru": "Еда, напитки и кулинария", "en": "Food, Drinks and Cooking", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст написан простыми предложениями, в основном в Past Simple. Объем: ~400 слов.", "story": ["Maria came from Italy, but she lived in London for five years. She missed her home very much, especially her grandmother's cooking. Her grandmother, Nonna Rosa, was the best cook in the whole village. She made traditional Italian dishes that were absolutely delicious.", "One Sunday, Maria felt very sad and hungry. She decided to cook her grandmother's famous pasta recipe. She went to the supermarket and bought all the ingredients: fresh tomatoes, basil, garlic, olive oil, and good quality pasta.", "When she came home, she started to cook. First, she boiled water and added salt. Then, she chopped the garlic and tomatoes. She fried the garlic in olive oil and added the tomatoes. The kitchen was full of a wonderful smell. Maria remembered how she and her cousins helped Nonna Rosa in the kitchen when they were children.", "After thirty minutes, the pasta was ready. Maria put it on a plate and tasted it. It was good, but not exactly like Nonna Rosa's. \"Something is missing,\" she thought.", "She called her grandmother in Italy. \"Nonna, I cooked your pasta, but it is not the same,\" Maria said.", "Nonna Rosa laughed. \"My dear, the secret is not in the ingredients. The secret is in the love. And also, you must add a little sugar to the tomato sauce to remove the acidity. And never rush. Cook slowly and think about the people you will share the food with.\"", "Maria smiled. She understood the secret. The next Sunday, she cooked the pasta again. This time, she added a little sugar, cooked slowly, and thought about her family. She also invited her new English friends for dinner.", "When her friends tasted the pasta, they were amazed. \"Maria, this is delicious!\" they said. \"Can you share the recipe with us?\"", "Maria was very happy. She shared the recipe and told them the story of her grandmother. She realized that food is not just fuel for the body. Food is culture, memory, and love. When you cook with love and share it with friends, even a simple dish becomes special. From that day, Maria's Sunday dinners became a tradition for all her friends in London."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Поскольку вы делаете это для себя, не пытайтесь пересказать всё сразу. Используйте этот \"скелет\", чтобы восстановить историю в памяти.", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Maria decide to cook her grandmother's pasta?", "What was the secret of Nonna Rosa's pasta?", "What did Maria realize about food at the end of the story?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "Попробуй рассказать историю, используя эти фразы-подсказки:", "hints": ["First, Maria lived in London but missed her home in... (Italy).", "She decided to cook her grandmother's famous... (recipe).", "She bought all the... (ingredients) and started to cook.", "The pasta was good, but not exactly like her... (grandmother's).", "She called Nonna Rosa, who told her the secret was in... (love / slow cooking / a little sugar).", "The next Sunday, she cooked again and invited her English... (friends).", "They said the pasta was... (delicious) and asked her to share the... (recipe).", "Maria realized that food is... (culture, memory and love).", "_____________"], "vocab": [{"w": "recipe", "tr": "[ˈresəpi]", "ru": "рецепт"}, {"w": "ingredient", "tr": "[ɪnˈɡriːdiənt]", "ru": "ингредиент"}, {"w": "to cook", "tr": "[kʊk]", "ru": "готовить"}, {"w": "delicious", "tr": "[dɪˈlɪʃəs]", "ru": "вкусный, восхитительный"}, {"w": "traditional", "tr": "[trəˈdɪʃənl]", "ru": "традиционный"}, {"w": "to share", "tr": "[ʃeə]", "ru": "делиться"}]}, {"num": 14, "ru": "Транспорт и путешествия", "en": "Transport and Travel", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст написан простыми предложениями, в основном в Past Simple. Объем: ~400 слов.", "story": ["Peter loved to travel. He visited many countries and saw different cities. But his dream was to visit Japan. He wanted to see the cherry blossoms in Tokyo and eat real sushi. He saved money for a year and finally booked his tickets.", "On the day of his journey, Peter woke up very early. He took a taxi to the airport. He was excited and a little nervous. When he arrived, he checked in his luggage and went through security. Then, he sat at the gate and waited for his flight.", "Suddenly, an announcement came: \"Flight 305 to Tokyo is delayed for two hours.\" Peter was disappointed. He looked at the other passengers. They were also unhappy. Some people were angry, some were sleeping, and some were reading books.", "Peter decided not to waste his time. He went to a small cafe in the airport and ordered a cup of coffee. He took out his notebook and started to write a list of places he wanted to visit in Japan. He also practiced some Japanese phrases he had learned from a book.", "Two hours later, the passengers finally boarded the plane. The flight was long — twelve hours. Peter watched three movies, ate the airplane food, and tried to sleep. When the plane landed in Tokyo, it was early morning. Peter was tired but very happy. He had arrived at his destination.", "He took the train to the city center. The Japanese trains were very fast and clean. Peter looked out the window and saw the bright lights of Tokyo. He found his small hotel, dropped his bags, and went outside.", "The city was amazing. There were many people, tall buildings, and beautiful temples. Peter walked for hours. He visited a small park where the cherry trees were blooming. The pink flowers were everywhere. He took many photos.", "In the evening, Peter sat in a small restaurant and ordered real sushi. It was the most delicious food he had ever tasted. He thought about his long journey and the delay at the airport. He realized that travel is not only about the destination. The journey itself, with all its delays and surprises, is also part of the adventure. Peter smiled and decided to travel again next year."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Поскольку вы делаете это для себя, не пытайтесь пересказать всё сразу. Используйте этот \"скелет\", чтобы восстановить историю в памяти.", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What was Peter's dream destination?", "What happened at the airport before his flight?", "What did Peter realize about travel at the end of the story?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "Попробуй рассказать историю, используя эти фразы-подсказки:", "hints": ["First, Peter loved to... (travel) and dreamed of visiting... (Japan).", "He saved money and booked his... (tickets).", "At the airport, his flight was... (delayed) for two hours.", "Other... (passengers) were unhappy, but Peter decided not to waste time.", "He wrote a list of places and practiced... (Japanese phrases).", "After the long flight, he arrived at his... (destination).", "He took a fast... (train) to the city center and saw the cherry... (blossoms).", "Peter realized that travel is not only about the... (destination), but also the journey itself."], "vocab": [{"w": "to travel", "tr": "[ˈtrævl]", "ru": "путешествовать"}, {"w": "journey", "tr": "[ˈdʒɜːni]", "ru": "путешествие, поездка"}, {"w": "passenger", "tr": "[ˈpæsɪndʒə]", "ru": "пассажир"}, {"w": "to miss", "tr": "[mɪs]", "ru": "опоздать на (транспорт)"}, {"w": "destination", "tr": "[ˌdestɪˈneɪʃn]", "ru": "пункт назначения"}, {"w": "delay", "tr": "[dɪˈleɪ]", "ru": "задержка"}]}, {"num": 15, "ru": "Спорт, игры и досуг", "en": "Sports, Games and Leisure", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами и эмоциями. Объем: ~420 слов.", "story": ["\"Hey, Mark! You look tired. Everything okay?\" asked Tom, seeing his friend at the coffee shop.", "Mark sighed. \"Yeah, but I'm bored. I work too much, and I don't do anything fun on weekends. I just sit at home and watch TV. What about you?\"", "Tom smiled. \"I joined a football team last month. We play every Saturday morning. It's great! You should come with me.\"", "Mark laughed. \"Football? Are you kidding? I haven't played since school. I'm out of shape.\"", "\"Come on! It's not about winning. It's about having fun and working out. Our team is for beginners. We just want to move and have a good time.\"", "Mark thought for a moment. \"Okay, why not? What do I need?\"", "\"Just comfortable clothes and shoes. I'll tell the captain about you.\"", "The next Saturday, Mark arrived at the park at 10 AM. He saw Tom and about ten other people. Some were his age, some were older. They were all laughing and joking.", "\"Hi, Mark! Welcome to the team!\" said the captain, a friendly guy named Alex. \"Don't worry about mistakes. We're here to enjoy ourselves.\"", "The game started. Mark ran, passed the ball, and tried to score. He wasn't very good, but nobody cared. When he missed a shot, everyone laughed and said, \"Nice try, Mark!\"", "After the game, they went to a nearby cafe for breakfast. \"So, how was it?\" Tom asked.", "\"It was amazing!\" Mark said excitedly. \"I feel alive! I forgot when I last felt this good.\"", "\"See? I told you. Do you want to play in the local competition next month?\"", "Mark's eyes widened. \"A competition? Are you serious?\"", "\"Yes! It's a small tournament for amateur teams. We need to practice more, but it will be fun.\"", "Mark smiled. \"Count me in. I want to improve and help the team win.\"", "From that day, Mark never missed a Saturday practice. He made new friends, got healthier, and found a new hobby. He realized that sports are not just about muscles. They are about friendship, teamwork, and joy. And every time someone scored a goal, the whole team cheered for them."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why was Mark bored at the beginning of the story?", "What did Tom suggest Mark do?", "How did Mark feel after his first game with the team?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Mark felt bored because he just... (sat at home / watched TV).", "hints": ["Tom told him he... (joined a football team) and invited Mark.", "Mark was scared because he was... (out of shape), but he decided to try.", "At the park, the captain said not to worry about... (mistakes).", "After the game, they went to a cafe and Mark felt... (alive / great).", "Tom asked if Mark wanted to play in a... (competition).", "Mark agreed and started to... (improve) and practice every week.", "He realized that sports are about... (friendship / teamwork / joy).", "_____________"], "vocab": [{"w": "to work out", "tr": "[wɜːk aʊt]", "ru": "тренироваться"}, {"w": "to join", "tr": "[dʒɔɪn]", "ru": "присоединяться, вступать"}, {"w": "team", "tr": "[tiːm]", "ru": "команда"}, {"w": "to improve", "tr": "[ɪmˈpruːv]", "ru": "улучшать, становиться лучше"}, {"w": "competition", "tr": "[ˌkɒmpəˈtɪʃn]", "ru": "соревнование"}, {"w": "to cheer for", "tr": "[tʃɪə fɔː]", "ru": "болеть за, поддерживать"}]}, {"num": 16, "ru": "Отношения и эмоции", "en": "Relationships and Emotions", "level": "A2-B1 (Elementary / Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами и эмоциями. Объем: ~430 слов.", "story": ["Sarah and Lisa had been best friends since childhood. They did everything together — studied, traveled, shared secrets. But one evening, something terrible happened.", "They were at a cafe, talking about their weekend plans. \"I thought we would go to the cinema on Saturday,\" Sarah said.", "Lisa looked confused. \"What? No, I told you I'm busy. My cousin is visiting me.\"", "\"But you didn't tell me!\" Sarah's voice got louder. \"I already bought tickets! Why didn't you say anything?\"", "\"I did say it last week! Don't you remember?\" Lisa answered, also upset.", "They argued for ten minutes. Other people in the cafe looked at them. Finally, Sarah stood up. \"Fine! If you don't care about our plans, I'll go alone!\" She left the cafe angrily.", "For three days, they didn't talk. Sarah felt guilty. She knew Lisa wasn't a bad friend. Maybe she really did say something, and Sarah just forgot. But Sarah was too proud to call first.", "On the fourth day, Sarah couldn't stand it anymore. She took her phone and dialed Lisa's number.", "\"Hello?\" Lisa's voice was quiet.", "\"Hi, Lisa. It's me,\" Sarah said nervously. \"I... I want to apologize. I was wrong to shout at you. I checked my messages, and you really did tell me about your cousin. I just forgot. I'm sorry.\"", "There was a long silence. Then Lisa sighed. \"I'm sorry too, Sarah. I shouldn't have ignored your calls. I was hurt, but I miss you. Can we make up?\"", "\"Of course!\" Sarah felt a huge weight lift from her shoulders. \"Let's meet tomorrow. My treat — coffee and cake!\"", "They met the next day and talked for hours. They laughed about the misunderstanding and promised to be more careful with each other's feelings.", "\"You know,\" Lisa said, \"friends argue sometimes. It's normal. What matters is that we forgive each other and move on.\"", "Sarah nodded. \"You're right. I'm glad we're still friends.\"", "From that day, Sarah and Lisa were even closer. They learned that relationships need patience, honesty, and the ability to say \"I'm sorry.\" And they never bought cinema tickets without checking the dates first!"], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["Why did Sarah and Lisa argue at the cafe?", "How did Sarah feel during the three days they didn't talk?", "What did they learn from this situation?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Sarah and Lisa were... (best friends) since childhood.", "hints": ["They had a... (misunderstanding) about weekend plans at a cafe.", "They... (argued) loudly, and Sarah left angrily.", "For three days, they didn't talk, and Sarah felt... (guilty).", "Finally, Sarah decided to... (apologize) and called Lisa.", "She admitted she was wrong and asked for... (forgiveness).", "Lisa also apologized, and they decided to... (make up).", "They met for coffee and promised to be more... (careful / honest).", "They learned that friends need patience and the ability to say... (\"I'm sorry\").", "_____________"], "vocab": [{"w": "to argue", "tr": "[ˈɑːɡjuː]", "ru": "спорить, ссориться"}, {"w": "to apologize", "tr": "[əˈpɒlədʒaɪz]", "ru": "извиняться"}, {"w": "to forgive", "tr": "[fəˈɡɪv]", "ru": "прощать"}, {"w": "misunderstanding", "tr": "[ˌmɪsʌndəˈstændɪŋ]", "ru": "недоразумение"}, {"w": "to feel guilty", "tr": "[fiːl ˈɡɪlti]", "ru": "чувствовать вину"}, {"w": "to make up", "tr": "[meɪk ʌp]", "ru": "мириться"}]}, {"num": 17, "ru": "Абстрактные, служебные и общие слова", "en": "Abstract, Functional and General Words", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами и размышлениями. Объем: ~410 слов.", "story": ["\"Grandpa, what does 'happiness' mean?\" asked little Emma, sitting on the old man's lap.", "Grandpa smiled. \"That's a big question, sweetheart. Why do you ask?\"", "\"Because my teacher said happiness is the most important thing in life. But what is it? Is it when you get a new toy?\"", "Grandpa thought for a moment. \"Well, sometimes it is. But happiness is not just about things. It depends on how you see the world.\"", "\"I don't understand,\" Emma said, frowning.", "\"Let me tell you a story,\" Grandpa began. \"When I was your age, I expected to get a bicycle for my birthday. I believed it would make me the happiest boy in the world. But on my birthday, something unexpected happened. My father lost his job, and we didn't have money for the bike.\"", "Emma's eyes widened. \"Were you sad?\"", "\"I was very disappointed at first. But then, something wonderful happened. My father said, 'Son, we can't buy you a bike, but we can build one together.' And we did! We found old parts, fixed them, and painted the bike red. It wasn't perfect, but I loved it more than any expensive bike.\"", "Emma smiled. \"So happiness is when you build something with your dad?\"", "\"Exactly! Happiness happens when you spend time with people you love. It happens when you help someone. It happens when you learn something new.\"", "Emma thought about this. \"So if I don't get the doll I want, I can still be happy?\"", "\"You can,\" Grandpa said gently. \"But you need to realize that happiness is inside you. It's not in stores. It's in moments — like when we drink tea together, or when you play with your friends.\"", "Emma hugged her grandpa. \"I understand now. I'm happy right now because I'm with you.\"", "Grandpa's eyes shone. \"And I'm happy too, my dear. Remember: don't wait for happiness to happen. Create it yourself, every day.\"", "From that day, Emma tried to find happy moments everywhere — in small things, in kind words, in shared laughter. She realized that life is not about what you expect to get, but about what you choose to appreciate."], "rh": "Retelling Practice (Практика пересказа)", "rnote": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "s1": "Шаг 1. Ответь на простые вопросы (устно или письменно):", "qs": ["What question did Emma ask her grandpa?", "What happened on Grandpa's birthday when he was a boy?", "What did Grandpa say about where happiness is?"], "s2": "Шаг 2. Пересказ по плану (Fill in the blanks / Соедини идеи):", "s2note": "First, Emma asked her grandpa what... (happiness) means.", "hints": ["Grandpa told her a story about his childhood. He... (expected) to get a bike.", "But his father lost his job, so something... (unexpected) happened.", "They built a bike together from old... (parts), and Grandpa loved it.", "He explained that happiness... (depends on) how you see the world.", "Happiness... (happens) when you spend time with people you love.", "Emma... (realized) that happiness is inside you, not in stores.", "She learned not to wait for happiness, but to... (create it) herself.", "_____________"], "vocab": [{"w": "to mean", "tr": "[miːn]", "ru": "означать, значить"}, {"w": "to depend on", "tr": "[dɪˈpend ɒn]", "ru": "зависеть от"}, {"w": "to happen", "tr": "[ˈhæpən]", "ru": "случаться, происходить"}, {"w": "to believe", "tr": "[bɪˈliːv]", "ru": "верить, считать"}, {"w": "to expect", "tr": "[ɪkˈspekt]", "ru": "ожидать"}, {"w": "to realize", "tr": "[ˈrɪəlaɪz]", "ru": "осознавать, понимать"}]}, {"num": 18, "ru": "Бизнес Английский", "en": "Business English", "level": "B1 (Pre-Intermediate)", "vh": "Vocabulary (Словарь перед чтением)", "vnote": "Здесь всего 6 выражений. Они помогут понять текст, но не перегрузят память.", "sh": "The Story (История)", "snote": "Текст с живыми диалогами и деловой лексикой. Объем: ~440 слов.", "story": ["\"Good morning, everyone. Let's start the meeting,\" said David, the project manager. \"We have a big presentation for our new client today. Sarah, are you ready to present the proposal?\"", "Sarah nodded nervously. \"Yes, I'm ready. But I'm worried about the deadline. The client wants the project finished in two weeks. Is that possible?\"", "\"That's a tight deadline,\" said Mike, the lead developer. \"We need to negotiate with them. Maybe we can deliver the first part in two weeks and the rest later.\"", "\"Good idea,\" David agreed. \"Let's call the client after this meeting.
